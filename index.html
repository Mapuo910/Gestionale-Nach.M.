r(--ink);\">${LIVELLI_PROBABILITA_IMPATTO.find(l=>l.value===r.impattoTemporale)?.label||'\u2014'}<\/strong><\/span>\n      <span>Impatto immagine: <strong style=\"color:var(--ink);\">${LIVELLI_PROBABILITA_IMPATTO.find(l=>l.value===r.impattoImmagine)?.label||'\u2014'}<\/strong><\/span>\n    <\/div>\n    ${r.pianoPrevenzione ? `<div style=\"margin-top:8px;font-size:12px;\"><strong>Prevenzione:<\/strong> ${esc(r.pianoPrevenzione)}<\/div>` : ''}\n    ${r.pianoRisposta ? `<div style=\"margin-top:4px;font-size:12px;\"><strong>Risposta se accade:<\/strong> ${esc(r.pianoRisposta)}<\/div>` : ''}\n    ${r.dataPrevista ? `<div style=\"margin-top:4px;font-size:11px;color:var(--muted);\">Data prevista: ${fmtDate(r.dataPrevista)}<\/div>` : ''}\n    ${r.dataAccaduto ? `<div style=\"margin-top:4px;font-size:11px;color:var(--red);\">Accaduto il: ${fmtDate(r.dataAccaduto)}<\/div>` : ''}\n    ${r.note ? `<div style=\"margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;\">${esc(r.note)}<\/div>` : ''}\n    <div class=\"row-actions\" style=\"margin-top:10px;\">\n      <button class=\"icon-btn\" id=\"foto-rischio-${r.id}\">\ud83d\udcf7 Foto<\/button>\n      ${r.numeroFoto>0 ? `<button class=\"icon-btn\" id=\"vedi-foto-rischio-${r.id}\">\ud83d\uddbc Vedi foto (${r.numeroFoto})<\/button>` : ''}\n      <button class=\"icon-btn\" id=\"edit-rischio-${r.id}\">Modifica<\/button>\n      <button class=\"icon-btn\" id=\"del-rischio-${r.id}\">Elimina<\/button>\n    <\/div>\n  <\/div>`;\n}\nfunction openRischioModal(existing){\n  openModal({\n    title: existing ? 'Modifica rischio' : 'Nuovo rischio',\n    values: existing || {probabilita:'media', impattoEconomico:'media', impattoTemporale:'media', impattoImmagine:'media', stato:'previsto'},\n    fields: [\n      {name:'titolo', label:'Titolo / descrizione del rischio', type:'text', required:true},\n      {name:'categoria', label:'Categoria', type:'select', options: CATEGORIE_RISCHIO},\n      {name:'probabilita', label:'Probabilit\u00e0', type:'select', options: LIVELLI_PROBABILITA_IMPATTO},\n      {name:'impattoEconomico', label:'Impatto economico', type:'select', options: LIVELLI_PROBABILITA_IMPATTO},\n      {name:'impattoTemporale', label:'Impatto temporale', type:'select', options: LIVELLI_PROBABILITA_IMPATTO},\n      {name:'impattoImmagine', label:'Impatto immagine/reputazione', type:'select', options: LIVELLI_PROBABILITA_IMPATTO},\n      {name:'stato', label:'Stato', type:'select', options: STATI_RISCHIO},\n      {name:'dataPrevista', label:'Data prevista (opzionale)', type:'date'},\n      {name:'dataAccaduto', label:'Data accaduto (se gi\u00e0 successo)', type:'date'},\n      {name:'pianoPrevenzione', label:'Piano di prevenzione (cosa fare prima)', type:'textarea'},\n      {name:'pianoRisposta', label:'Piano di risposta (cosa fare se accade)', type:'textarea'},\n      {name:'note', label:'Note / lezione imparata', type:'textarea'},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.rischi.push({id:uid(), ...data}); }\n      persist();\n      renderRischi();\n    }\n  });\n}\nasync function scattaFotoRischio(r){\n  const file = await apriFotocamera();\n  if(!file) return;\n  caricamentiFotoInCorso++;\n  aggiornaIndicatoreCaricamentoFoto();\n  try{\n    const base64 = await ridimensionaImmagine(file);\n    const risposta = await chiamaAzionePost('uploadFotoRischio', {\n      cantiere: state.nomeCantiereAttivo || 'Cantiere',\n      rischio: r.titolo,\n      imageBase64: base64,\n      mimeType: 'image/jpeg',\n    });\n    r.numeroFoto = (r.numeroFoto || 0) + 1;\n    r.cartellaFotoUrl = risposta.cartellaUrl;\n    persist();\n    if(state.section === 'rischi') renderRischi();\n    mostraToast('\ud83d\udcf7 Foto caricata \u2713');\n  }catch(e){\n    alert('Errore nel caricamento della foto: ' + e.message);\n  }finally{\n    caricamentiFotoInCorso--;\n    aggiornaIndicatoreCaricamentoFoto();\n  }\n}\n\n/* ============ SAL FORNITORI ============ */\nfunction ultimoSal(contratto){\n  if(!contratto.sal || contratto.sal.length===0) return null;\n  return [...contratto.sal].sort((a,b) => (a.data||'').localeCompare(b.data||'')).slice(-1)[0];\n}\nfunction lavorazioniDiContratto(contrattoId){\n  return state.lavorazioni.filter(l => l.contrattoSalId === contrattoId);\n}\nfunction sommaPrezziPattuitiLavorazioni(contratto){\n  return lavorazioniDiContratto(contratto.id).reduce((s,l) => s + Number(l.prezzoSalPattuito||0), 0);\n}\nfunction importoAutorizzatoCalcolato(contratto){\n  return lavorazioniDiContratto(contratto.id).reduce((s,l) => s + (Number(l.prezzoSalPattuito||0) * Number(l.statoAvanzamento||0) / 100), 0);\n}\nfunction prezzoPattuitoEffettivo(contratto){\n  const totaleDaLavorazioni = sommaPrezziPattuitiLavorazioni(contratto);\n  return totaleDaLavorazioni > 0 ? totaleDaLavorazioni : Number(contratto.importoTotale||0);\n}\nfunction calcolaAvanzamentoContratto(contratto){\n  const totalePattuito = sommaPrezziPattuitiLavorazioni(contratto);\n  if(totalePattuito <= 0) return null;\n  return Math.round(importoAutorizzatoCalcolato(contratto) / totalePattuito * 100);\n}\nfunction oreRealiContratto(contratto){\n  return lavorazioniDiContratto(contratto.id).reduce((s,l) => s + Number(l.costoOre||0), 0);\n}\nfunction costoRealeContratto(contratto){\n  return lavorazioniDiContratto(contratto.id).reduce((s,l) => s + Number(l.costoEuro||0), 0);\n}\nfunction autorizzatoAttualeContratto(contratto){\n  const avanzamentoCalcolato = calcolaAvanzamentoContratto(contratto);\n  if(avanzamentoCalcolato !== null) return importoAutorizzatoCalcolato(contratto);\n  const u = ultimoSal(contratto);\n  return u ? Number(u.importoAutorizzato||0) : 0;\n}\nfunction renderSal(){\n  const contratti = [...state.contrattiSal].sort((a,b) => (a.fornitore||'').localeCompare(b.fornitore||''));\n  const totaleContratti = contratti.reduce((s,c) => s + prezzoPattuitoEffettivo(c), 0);\n  const totaleAutorizzato = contratti.reduce((s,c) => s + autorizzatoAttualeContratto(c), 0);\n  const totaleResiduo = totaleContratti - totaleAutorizzato;\n\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">SAL Fornitori<\/h2><p class=\"section-sub\">Stato avanzamento lavori e pagamenti autorizzati per ogni subappaltatore/fornitore.<\/p><\/div>\n      <button class=\"btn\" id=\"add-contratto-sal\">+ Nuovo fornitore/contratto<\/button>\n    <\/div>\n    ${contratti.length===0 ? emptyState('Nessun contratto registrato', 'Aggiungi un fornitore/subappaltatore per iniziare a registrare i SAL mensili.') : `\n    <table style=\"margin-bottom:20px;\"><thead><tr><th>Totale contratti<\/th><th>Totale autorizzato<\/th><th>Residuo<\/th><\/tr><\/thead>\n      <tbody><tr>\n        <td class=\"mono\">${fmtEuro(totaleContratti)}<\/td>\n        <td class=\"mono\">${fmtEuro(totaleAutorizzato)}<\/td>\n        <td class=\"mono\">${fmtEuro(totaleResiduo)}<\/td>\n      <\/tr><\/tbody>\n    <\/table>\n    ${contratti.map(c => renderContrattoSalCard(c)).join('')}`}\n  `;\n  document.getElementById('add-contratto-sal').onclick = () => openContrattoSalModal();\n  contratti.forEach(c => {\n    const editBtn = document.getElementById('edit-contratto-'+c.id);\n    const delBtn = document.getElementById('del-contratto-'+c.id);\n    const addSalBtn = document.getElementById('add-sal-'+c.id);\n    if(editBtn) editBtn.onclick = () => openContrattoSalModal(c);\n    if(delBtn) delBtn.onclick = () => { if(confirm(`Eliminare il contratto con \"${c.fornitore}\" e tutto lo storico SAL? L'operazione non \u00e8 reversibile.`)){ state.contrattiSal = state.contrattiSal.filter(x=>x.id!==c.id); persist(); renderSal(); } };\n    if(addSalBtn) addSalBtn.onclick = () => openSalModal(c);\n    const dett = document.getElementById('dettaglio-sal-'+c.id);\n    if(dett) dett.addEventListener('toggle', function(){ uiDettagliAperti['sal-'+c.id] = this.open; });\n    (c.sal||[]).forEach(s => {\n      const delSalBtn = document.getElementById('del-sal-'+c.id+'-'+s.id);\n      if(delSalBtn) delSalBtn.onclick = () => { c.sal = c.sal.filter(x=>x.id!==s.id); persist(); renderSal(); };\n    });\n    lavorazioniDiContratto(c.id).forEach(l => {\n      const prezzoBtn = document.getElementById('prezzo-sal-lav-'+l.id);\n      if(prezzoBtn) prezzoBtn.onclick = () => apriModificaCampo(l, 'prezzoSalPattuito', `Prezzo pattuito \u2014 ${l.nome}`, 'number', {step:'0.01'}, renderSal);\n    });\n  });\n}\nfunction renderContrattoSalCard(c){\n  const u = ultimoSal(c);\n  const collegate = lavorazioniDiContratto(c.id);\n  const prezzoPattuitoTot = prezzoPattuitoEffettivo(c);\n  const avanzamentoCalcolato = calcolaAvanzamentoContratto(c);\n  const autorizzatoCalcolato = importoAutorizzatoCalcolato(c);\n  // Se ci sono lavorazioni collegate con prezzo pattuito, il dato \"live\" guida la vista;\n  // altrimenti si mostra l'ultimo SAL registrato manualmente come prima.\n  const percentualeMostrata = avanzamentoCalcolato !== null ? avanzamentoCalcolato : (u ? Number(u.avanzamentoPercentuale||0) : 0);\n  const autorizzatoMostrato = autorizzatoAttualeContratto(c);\n  const residuo = prezzoPattuitoTot - autorizzatoMostrato;\n  const salOrdinati = [...(c.sal||[])].sort((a,b) => (b.data||'').localeCompare(a.data||''));\n  return `<div class=\"card\" style=\"cursor:default;margin-bottom:14px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;\">\n      <div>\n        <div style=\"font-family:'Oswald',sans-serif;font-size:17px;\">${esc(c.fornitore)}<\/div>\n        ${c.oggetto ? `<div style=\"font-size:12px;color:var(--muted);\">${esc(c.oggetto)}<\/div>` : ''}\n      <\/div>\n      <div style=\"text-align:right;\">\n        <div class=\"mono\" style=\"font-size:18px;\">${fmtEuro(prezzoPattuitoTot)}<\/div>\n        <div style=\"font-size:11px;color:var(--muted);\">prezzo pattuito ${sommaPrezziPattuitiLavorazioni(c)>0?'(somma lavorazioni)':'(contratto)'}<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"bar-track\" style=\"margin-top:12px;\"><div class=\"bar-fill\" style=\"width:${clamp(percentualeMostrata,0,100)}%;\"><\/div><\/div>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;\">\n      <span>Avanzamento attuale: <strong>${percentualeMostrata}%<\/strong>${avanzamentoCalcolato!==null?' <span class=\"badge badge-blue\">live dalle lavorazioni<\/span>':''}<\/span>\n      <span>Totale autorizzato: <strong>${fmtEuro(autorizzatoMostrato)}<\/strong><\/span>\n      <span>Residuo: <strong style=\"color:${residuo>0?'var(--red)':'var(--green)'};\">${fmtEuro(residuo)}<\/strong><\/span>\n    <\/div>\n    <div style=\"margin-top:8px;padding:8px 10px;background:var(--orange-dim);border:1px solid var(--orange);font-size:13px;\">\n      Fatturabile da autorizzare ora: <strong style=\"color:var(--orange);font-size:15px;\">${fmtEuro(autorizzatoMostrato - (u ? Number(u.importoAutorizzato||0) : 0))}<\/strong>\n      <span style=\"color:var(--muted);font-size:11px;\"> (differenza rispetto all'ultimo SAL registrato)<\/span>\n    <\/div>\n    <div style=\"margin-top:6px;font-size:11px;color:var(--muted);\">\n      ${u ? `Ultimo SAL registrato: ${u.avanzamentoPercentuale||0}% \u2014 ${fmtEuro(u.importoAutorizzato)} (del ${fmtDate(u.data)})` : 'Nessun SAL ancora registrato ufficialmente \u2014 quando lo crei, questi dati verranno proposti come base di partenza.'}\n    <\/div>\n    ${collegate.length>0 ? `\n    <div style=\"margin-top:10px;\">\n      <div class=\"table-scroll\"><table><thead><tr><th>Lavorazione<\/th><th>Prezzo pattuito<\/th><th>Avanzamento<\/th><th>Autorizza<\/th><\/tr><\/thead>\n        <tbody>${collegate.map(l => `<tr>\n          <td>${esc(l.nome)}<\/td>\n          <td class=\"mono valore-cliccabile\" id=\"prezzo-sal-lav-${l.id}\">${l.prezzoSalPattuito ? fmtEuro(l.prezzoSalPattuito) : '+ imposta prezzo'}<\/td>\n          <td class=\"mono\">${l.statoAvanzamento||0}%<\/td>\n          <td class=\"mono\">${fmtEuro(Number(l.prezzoSalPattuito||0) * Number(l.statoAvanzamento||0) / 100)}<\/td>\n        <\/tr>`).join('')}<\/tbody>\n      <\/table><\/div>\n      <div style=\"font-size:11px;color:var(--muted);margin-top:4px;\">Il totale sopra si aggiorna in automatico ogni volta che cambi l'avanzamento % di una di queste lavorazioni.<\/div>\n      <div style=\"font-size:11px;color:var(--muted);margin-top:2px;\">ore reali: <strong style=\"color:var(--ink);\">${oreRealiContratto(c)} h<\/strong> \u00b7 costo reale lavorazioni: <strong style=\"color:var(--ink);\">${fmtEuro(costoRealeContratto(c))}<\/strong><\/div>\n    <\/div>` : `<div style=\"margin-top:8px;font-size:11px;color:var(--muted);\">Nessuna lavorazione collegata a questo contratto (collegale dalla scheda \"Modifica\" di ogni lavorazione).<\/div>`}\n    <div class=\"row-actions\" style=\"margin-top:10px;\">\n      <button class=\"icon-btn\" id=\"add-sal-${c.id}\">+ Nuovo SAL<\/button>\n      <button class=\"icon-btn\" id=\"edit-contratto-${c.id}\">Modifica contratto<\/button>\n      <button class=\"icon-btn\" id=\"del-contratto-${c.id}\">Elimina<\/button>\n    <\/div>\n    ${salOrdinati.length>0 ? `<details id=\"dettaglio-sal-${c.id}\" style=\"margin-top:10px;\" ${uiDettagliAperti['sal-'+c.id]?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:8px 0;color:var(--muted);font-size:12px;\">Storico SAL (${salOrdinati.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div class=\"table-scroll\" style=\"margin-top:8px;\"><table><thead><tr><th>Data<\/th><th>Ore<\/th><th>Avanzamento<\/th><th>Totale autorizzato<\/th><th>Fatturabile nel mese<\/th><th>Note<\/th><th><\/th><\/tr><\/thead>\n      <tbody>${salOrdinati.map((s,i) => {\n        const salCronologici = [...(c.sal||[])].sort((a,b) => (a.data||'').localeCompare(b.data||''));\n        const posizione = salCronologici.findIndex(x => x.id === s.id);\n        const precedente = posizione > 0 ? salCronologici[posizione-1] : null;\n        const fatturabile = Number(s.importoAutorizzato||0) - (precedente ? Number(precedente.importoAutorizzato||0) : 0);\n        return `<tr>\n        <td class=\"mono\">${fmtDate(s.data)}<\/td>\n        <td class=\"mono\">${s.ore||'\u2014'}<\/td>\n        <td class=\"mono\">${s.avanzamentoPercentuale||0}%<\/td>\n        <td class=\"mono\">${fmtEuro(s.importoAutorizzato)}<\/td>\n        <td class=\"mono\"><strong>${fmtEuro(fatturabile)}<\/strong><\/td>\n        <td style=\"color:var(--muted);font-size:12px;\">${esc(s.note||'\u2014')}<\/td>\n        <td><button class=\"icon-btn\" id=\"del-sal-${c.id}-${s.id}\">Elimina<\/button><\/td>\n      <\/tr>`;\n      }).join('')}<\/tbody><\/table><\/div>\n    <\/details>` : ''}\n  <\/div>`;\n}\nfunction openContrattoSalModal(existing){\n  openModal({\n    title: existing ? 'Modifica contratto' : 'Nuovo fornitore/contratto',\n    values: existing || {},\n    fields: [\n      {name:'fornitore', label:'Fornitore / subappaltatore', type:'text', required:true},\n      {name:'oggetto', label:'Oggetto del contratto (opzionale)', type:'text'},\n      {name:'importoTotale', label:'Importo totale contratto (\u20ac)', type:'number', step:'0.01', required:true},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.contrattiSal.push({id:uid(), sal:[], ...data}); }\n      persist();\n      renderSal();\n    }\n  });\n}\nfunction openSalModal(contratto){\n  const ultimo = ultimoSal(contratto);\n  const avanzamentoSuggerito = calcolaAvanzamentoContratto(contratto);\n  const percentualeSuggerita = avanzamentoSuggerito !== null ? avanzamentoSuggerito : (ultimo ? Number(ultimo.avanzamentoPercentuale||0) : 0);\n  const importoSuggerito = avanzamentoSuggerito !== null ? Math.round(importoAutorizzatoCalcolato(contratto)) : (ultimo ? Number(ultimo.importoAutorizzato||0) : 0);\n  const oreSuggerite = oreRealiContratto(contratto);\n  const fatturabileStimato = importoSuggerito - (ultimo ? Number(ultimo.importoAutorizzato||0) : 0);\n  openModal({\n    title: `Nuovo SAL \u2014 ${contratto.fornitore} \u00b7 fatturabile stimato ${fmtEuro(fatturabileStimato)}`,\n    values: {data: todayISO(), ore: oreSuggerite || (ultimo ? ultimo.ore : ''), avanzamentoPercentuale: percentualeSuggerita, importoAutorizzato: importoSuggerito},\n    fields: [\n      {name:'data', label:'Data SAL (mese di riferimento)', type:'date', required:true},\n      {name:'ore', label:'Ore lavorate nel periodo (suggerite dalle lavorazioni collegate, modificabili)', type:'number', step:'0.5'},\n      {name:'avanzamentoPercentuale', label:'Avanzamento complessivo (%) \u2014 suggerito dalle lavorazioni collegate', type:'number', step:'1', required:true},\n      {name:'importoAutorizzato', label:'Totale autorizzato ad oggi (\u20ac) \u2014 la differenza dal SAL precedente \u00e8 il fatturabile del mese', type:'number', step:'0.01', required:true},\n      {name:'note', label:'Note', type:'textarea'},\n    ],\n    onSubmit: (data) => {\n      contratto.sal = contratto.sal || [];\n      contratto.sal.push({id:uid(), ...data});\n      persist();\n      renderSal();\n    }\n  });\n}\n\n/* ============ CALENDARIO ============ */\nfunction getEntriesForDate(iso){\n  const entries = [];\n  state.ordini.forEach(o => {\n    if(o.dataOrdine === iso) entries.push({tipo:'ordine', label:`Ordine emesso: ${o.nome}`, ref:{kind:'ordine', id:o.id}});\n    if(o.dataPrevista === iso && !o.dataEffettiva) entries.push({tipo:'ordine', label:`Consegna prevista: ${o.nome}`, ref:{kind:'ordine', id:o.id}});\n    if(o.dataEffettiva === iso) entries.push({tipo:'ordine', label:`Consegna ricevuta${o.statoParziale==='parziale'?' (parziale)':''}: ${o.nome}`, ref:{kind:'ordine', id:o.id}});\n  });\n  state.lavorazioni.forEach(l => {\n    if(l.dataInizio === iso) entries.push({tipo:'lavorazione', label:`Inizio lavorazione: ${l.nome}`, ref:{kind:'lavorazione', id:l.id}});\n    if(l.scadenzaPrevista === iso) entries.push({tipo:'lavorazione', label:`Scadenza lavorazione: ${l.nome}`, ref:{kind:'lavorazione', id:l.id}});\n  });\n  state.eventi.forEach(e => {\n    if(e.data === iso) entries.push({tipo:e.tipo, label:`Evento (${e.tipo}): ${e.titolo}`, ref:{kind:'evento', id:e.id}});\n  });\n  state.calendario.forEach(c => {\n    if(c.data === iso){\n      entries.push({tipo:c.tipo, label:`${c.orario?c.orario+' \u2014 ':''}${c.titolo}`, id:c.id, editable:true});\n    } else if(c.ricorrenteSettimanale && c.data < iso){\n      const start = new Date(c.data), cur = new Date(iso);\n      if(start.getDay() === cur.getDay()) entries.push({tipo:c.tipo, label:`${c.orario?c.orario+' \u2014 ':''}${c.titolo} (ricorrente)`, id:c.id, editable:true});\n    }\n  });\n  return entries;\n}\nfunction renderCalendario(){\n  const monthNames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];\n  const y = state.calMonth.getFullYear(), m = state.calMonth.getMonth();\n  const firstDay = new Date(y,m,1);\n  const startOffset = (firstDay.getDay()+6)%7; // luned\u00ec=0\n  const daysInMonth = new Date(y,m+1,0).getDate();\n  const gridStart = new Date(y,m,1-startOffset);\n  const todayStr = todayISO();\n\n  let cells = '';\n  for(let i=0;i<42;i++){\n    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);\n    const iso = toLocalISODate(d);\n    const inMonth = d.getMonth() === m;\n    const entries = getEntriesForDate(iso);\n    const shown = entries.slice(0,3);\n    const restCount = entries.length - shown.length;\n    cells += `<div class=\"cal-day ${inMonth?'':'other-month'} ${iso===todayStr?'today':''} ${state.selectedDay===iso?'selected':''}\" data-day=\"${iso}\">\n      <div class=\"cal-daynum\">${d.getDate()}<\/div>\n      <div class=\"cal-entries\">${shown.map(e => `<div class=\"cal-entry-line\" style=\"border-left-color:${tipoColor(e.tipo)}\">${esc(truncate(e.label,26))}<\/div>`).join('')}<\/div>\n      <div class=\"cal-dots-mini\">${shown.map(e => `<div class=\"dot\" style=\"background:${tipoColor(e.tipo)}\"><\/div>`).join('')}<\/div>\n      ${restCount>0 ? `<div class=\"cal-more\">+${restCount} altri<\/div>` : ''}\n    <\/div>`;\n    if(i>=daysInMonth+startOffset-1 && d.getMonth()!==m && i%7===6) break;\n  }\n\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Calendario<\/h2><p class=\"section-sub\">Ordini, scadenze lavorazioni, eventi, note e appuntamenti in un'unica vista.<\/p><\/div>\n      <button class=\"btn\" id=\"add-cal-entry\">+ Nota / Appuntamento<\/button>\n    <\/div>\n    <div class=\"cal-header\">\n      <button class=\"btn ghost small\" id=\"cal-prev\">\u2190 Precedente<\/button>\n      <div class=\"cal-month\">${monthNames[m]} ${y}<\/div>\n      <button class=\"btn ghost small\" id=\"cal-next\">Successivo \u2192<\/button>\n    <\/div>\n    <div class=\"cal-grid-scroll\">\n      <div class=\"cal-grid\">\n        ${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d=>`<div class=\"cal-dow\">${d}<\/div>`).join('')}\n        ${cells}\n      <\/div>\n    <\/div>\n    <div id=\"day-detail\"><\/div>\n  `;\n  document.getElementById('cal-prev').onclick = () => { state.calMonth = new Date(y,m-1,1); renderCalendario(); };\n  document.getElementById('cal-next').onclick = () => { state.calMonth = new Date(y,m+1,1); renderCalendario(); };\n  document.getElementById('add-cal-entry').onclick = () => openCalEntryModal();\n  document.querySelectorAll('.cal-day').forEach(el => {\n    el.onclick = () => { state.selectedDay = el.dataset.day; renderCalendario(); renderDayDetail(); };\n  });\n  if(state.selectedDay) renderDayDetail();\n}\nfunction renderDayDetail(){\n  const iso = state.selectedDay;\n  const entries = getEntriesForDate(iso);\n  const container = document.getElementById('day-detail');\n  if(!container) return;\n  container.innerHTML = `<div class=\"day-detail\">\n    <h4>${fmtDate(iso)}<\/h4>\n    ${entries.length===0 ? `<div style=\"color:var(--muted);font-size:13px;\">Nessun evento in questa data.<\/div>` :\n      entries.map(e => `<div class=\"day-entry\">\n        <span><span class=\"dot\" style=\"background:${tipoColor(e.tipo)};display:inline-block;margin-right:8px;vertical-align:middle;\"><\/span>${esc(e.label)}<\/span>\n        <div class=\"row-actions\">\n          ${e.ref && e.ref.kind==='lavorazione' ? `<button class=\"icon-btn\" data-open-lav=\"${e.ref.id}\">\u2192 Apri lavorazione<\/button>` : ''}\n          ${e.ref && e.ref.kind==='ordine' ? `<button class=\"icon-btn\" data-open-ord=\"${e.ref.id}\">\u2192 Apri ordine<\/button>` : ''}\n          ${e.ref && e.ref.kind==='evento' ? `<button class=\"icon-btn\" data-open-evt=\"${e.ref.id}\">\u2192 Apri evento<\/button>` : ''}\n          ${e.editable?`<button class=\"icon-btn\" data-cal-edit=\"${e.id}\">Modifica<\/button><button class=\"icon-btn\" data-cal-del=\"${e.id}\">Elimina<\/button>`:''}\n        <\/div>\n      <\/div>`).join('')}\n    <div style=\"margin-top:10px;\"><button class=\"btn small\" id=\"quick-add-cal\">+ Aggiungi per questo giorno<\/button><\/div>\n  <\/div>`;\n  const quickAdd = document.getElementById('quick-add-cal');\n  if(quickAdd) quickAdd.onclick = () => openCalEntryModal(null, iso);\n  container.querySelectorAll('[data-cal-del]').forEach(btn => {\n    btn.onclick = () => {\n      state.calendario = state.calendario.filter(c => c.id !== btn.dataset.calDel);\n      persist(); renderCalendario();\n    };\n  });\n  container.querySelectorAll('[data-cal-edit]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.calendario.find(c => c.id === btn.dataset.calEdit);\n      if(item) openCalEntryModal(item);\n    };\n  });\n  container.querySelectorAll('[data-open-lav]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.lavorazioni.find(x => x.id === btn.dataset.openLav);\n      state.section = 'lavorazioni'; renderAll();\n      if(item) openLavorazioneModal(item);\n    };\n  });\n  container.querySelectorAll('[data-open-ord]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.ordini.find(x => x.id === btn.dataset.openOrd);\n      state.section = 'ordini'; renderAll();\n      if(item) openOrdineModal(item);\n    };\n  });\n  container.querySelectorAll('[data-open-evt]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.eventi.find(x => x.id === btn.dataset.openEvt);\n      state.section = 'eventi'; renderAll();\n      if(item) openEventoModal(item);\n    };\n  });\n}\nfunction openCalEntryModal(existing, presetDate){\n  openModal({\n    title: existing ? 'Modifica voce calendario' : 'Nuova nota / appuntamento',\n    values: existing || {data: presetDate || todayISO(), tipo:'nota'},\n    fields: [\n      {name:'tipo', label:'Tipo', type:'select', options:[{value:'nota',label:'Nota'},{value:'appuntamento',label:'Appuntamento'}]},\n      {name:'titolo', label:'Titolo', type:'text', required:true},\n      {name:'descrizione', label:'Descrizione', type:'textarea'},\n      {name:'data', label:'Data', type:'date', required:true},\n      {name:'orario', label:'Orario (opzionale)', type:'time'},\n      {name:'ricorrenteSettimanale', label:'Ripeti ogni settimana', type:'checkbox'},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.calendario.push({id:uid(), ...data}); }\n      persist(); renderCalendario();\n    }\n  });\n}\n\n/* ============ SHARED ============ */\nfunction emptyState(title, sub){\n  return `<div class=\"empty-state\"><div class=\"display\">${esc(title)}<\/div><div>${esc(sub)}<\/div><\/div>`;\n}\n\n/* ============ RENDER DISPATCH ============ */\nfunction renderAll(){\n  renderNav();\n  if(state.section==='dashboard') renderDashboard();\n  else if(state.section==='lavorazioni') renderLavorazioni();\n  else if(state.section==='ordini') renderOrdini();\n  else if(state.section==='persone') renderPersone();\n  else if(state.section==='eventi') renderEventi();\n  else if(state.section==='calendario') renderCalendario();\n  else if(state.section==='diario') renderDiario();\n  else if(state.section==='rischi') renderRischi();\n  else if(state.section==='sal') renderSal();\n}\n\n/* ============ CONFIGURAZIONE CONNESSIONE GOOGLE SHEETS ============ */\nfunction apriImpostazioniConnessione(){\n  openModal({\n    title: 'Connessione Google Sheets',\n    values: {url: getUrlAppsScript()},\n    fields: [\n      {name:'url', label:'URL Web App Apps Script (finisce con /exec)', type:'text', required:true},\n    ],\n    submitLabel: 'Salva e verifica',\n    onSubmit: async (data) => {\n      const url = data.url.trim();\n      mostraCaricamento(true);\n      try{\n        await testaConnessioneAppsScript(url);\n        setUrlAppsScript(url);\n        alert('Connessione riuscita. L\\'app user\u00e0 questo Google Sheet.');\n        location.reload();\n      }catch(e){\n        alert('Connessione non riuscita: ' + e.message + '\\n\\nVerifica di aver copiato l\\'URL /exec corretto e che la distribuzione sia impostata su \"Chiunque\".');\n      }\n      mostraCaricamento(false);\n    }\n  });\n}\n\nfunction mostraSchermataConfigurazione(){\n  document.getElementById('nav').style.display = 'none';\n  const localeLista = lsGet(LS_KEY_LISTA, []);\n  document.getElementById('content').innerHTML = `\n    <div style=\"max-width:520px;margin:20px auto;\">\n      <h2 class=\"section-title\">Collega Google Sheets<\/h2>\n      <p class=\"section-sub\">Per sincronizzare i dati tra i tuoi dispositivi, incolla qui l'URL della Web App di Apps Script (vedi le istruzioni ricevute in chat). Va fatto una sola volta per ogni dispositivo.<\/p>\n      <div class=\"field\">\n        <label>URL Web App (finisce con /exec)<\/label>\n        <input type=\"text\" id=\"setup-url\" placeholder=\"https://script.google.com/macros/s/\u2026/exec\">\n      <\/div>\n      ${localeLista.length > 0 ? `<p style=\"font-size:12px;color:var(--muted);\">Ho trovato ${localeLista.length} cantiere/i gi\u00e0 salvati su questo dispositivo: dopo la connessione ti chieder\u00f2 se vuoi caricarli su Google Sheets.<\/p>` : ''}\n      <button class=\"btn\" id=\"setup-salva\" style=\"width:100%;margin-top:10px;\">Verifica e continua<\/button>\n      <div id=\"setup-errore\" style=\"color:var(--red);font-size:13px;margin-top:10px;\"><\/div>\n    <\/div>\n  `;\n  document.getElementById('setup-salva').onclick = async () => {\n    const url = document.getElementById('setup-url').value.trim();\n    const errEl = document.getElementById('setup-errore');\n    errEl.textContent = '';\n    if(!url){ errEl.textContent = 'Inserisci un URL.'; return; }\n    mostraCaricamento(true);\n    try{\n      await testaConnessioneAppsScript(url);\n      setUrlAppsScript(url);\n      if(localeLista.length > 0){\n        const vuoiMigrare = confirm(`Vuoi caricare ora su Google Sheets i ${localeLista.length} cantiere/i gi\u00e0 presenti su questo dispositivo?`);\n        if(vuoiMigrare){\n          await salvaListaCantieri(localeLista);\n          for(const c of localeLista){\n            const d = lsGet(dataKeyCantiere(c.id), datiVuoti());\n            await kvSet(dataKeyCantiere(c.id), d);\n          }\n        }\n      }\n      document.getElementById('nav').style.display = '';\n      await avviaApp();\n    }catch(e){\n      errEl.textContent = 'Connessione non riuscita: ' + e.message;\n    }\n    mostraCaricamento(false);\n  };\n}\n\nasync function avviaApp(){\n  const listaCache = caricaCacheListaLocale();\n  const attivoIdCache = lsGet(LS_KEY_ATTIVO, null);\n  let dipintoDaCache = false;\n\n  if(listaCache && listaCache.length > 0){\n    const idDaUsare = (attivoIdCache && listaCache.find(c => c.id === attivoIdCache)) ? attivoIdCache : listaCache[0].id;\n    const datiCache = caricaCacheDatiLocale(idDaUsare);\n    if(datiCache){\n      state.cantiereAttivoId = idDaUsare;\n      applicaDatiAStato(datiCache);\n      const meta = listaCache.find(c => c.id === idDaUsare);\n      state.nomeCantiereAttivo = meta ? meta.nome : 'Cantiere';\n      document.getElementById('stamp-nome-cantiere').textContent = state.nomeCantiereAttivo;\n      renderAll();\n      impostaStatoSync('salvataggio', 'Aggiornamento in corso\u2026');\n      dipintoDaCache = true;\n    }\n  }\n\n  if(!dipintoDaCache) mostraCaricamento(true);\n\n  try{\n    let lista = await caricaListaCantieri();\n    if(lista.length === 0){\n      const id = await creaCantiere('Cantiere Principale');\n      lista = await caricaListaCantieri();\n      lsSet(LS_KEY_ATTIVO, id);\n    }\n    salvaCacheListaLocale(lista);\n    let attivoId = lsGet(LS_KEY_ATTIVO, null);\n    if(!attivoId || !lista.find(c => c.id === attivoId)){\n      attivoId = lista[0].id;\n      lsSet(LS_KEY_ATTIVO, attivoId);\n    }\n\n    state.cantiereAttivoId = attivoId;\n    const dati = await caricaDatiCantiere(attivoId);\n    applicaDatiAStato(dati);\n    salvaCacheDatiLocale(attivoId, dati);\n\n    await renderStamp();\n    renderAll();\n    impostaStatoSync('ok');\n  }catch(e){\n    if(dipintoDaCache){\n      // Gi\u00e0 mostrati i dati dall'ultima sessione: segnalo solo che l'aggiornamento \u00e8 fallito, senza bloccare l'uso dell'app.\n      impostaStatoSync('errore', 'Impossibile aggiornare da Google Sheets: ' + e.message + '. Stai vedendo gli ultimi dati salvati su questo dispositivo.');\n    } else {\n      document.getElementById('content').innerHTML = `<div class=\"empty-state\">\n        <div class=\"display\">Impossibile contattare Google Sheets<\/div>\n        <div>${esc(e.message)}<\/div>\n        <button class=\"btn ghost\" id=\"riprova-connessione\" style=\"margin-top:14px;\">Riprova<\/button>\n        <button class=\"btn\" id=\"cambia-connessione\" style=\"margin-top:14px;margin-left:8px;\">Cambia URL<\/button>\n      <\/div>`;\n      document.getElementById('riprova-connessione').onclick = avviaApp;\n      document.getElementById('cambia-connessione').onclick = () => { setUrlAppsScript(''); mostraSchermataConfigurazione(); };\n    }\n  }\n  mostraCaricamento(false);\n}\n\n/* ============ INIT ============ */\nfunction init(){\n  document.getElementById('stamp-date').textContent = fmtDate(todayISO());\n  document.getElementById('btn-cambia-cantiere').onclick = apriGestioneCantieri;\n  document.getElementById('btn-rinomina-cantiere').onclick = apriRinominaCantiere;\n\n  const url = getUrlAppsScript();\n  if(!url){\n    mostraSchermataConfigurazione();\n    return;\n  }\n  avviaApp();\n}\ninit();\n<\/script>\n\n\n<\/body><\/html>"
  </script>
