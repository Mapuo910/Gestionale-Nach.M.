ed evadile in un unico ordine.<\/p>\n      <div class=\"field\">\n        <label>Fornitore<\/label>\n        <select id=\"manda-ordine-fornitore\">\n          <option value=\"\">Tutti / senza fornitore<\/option>\n          ${fornitori.map(f => `<option value=\"${esc(f)}\" ${fornitoreScelto===f?'selected':''}>${esc(f)}<\/option>`).join('')}\n        <\/select>\n      <\/div>\n      ${candidati.length===0 ? `<div style=\"color:var(--muted);font-size:13px;padding:14px 0;\">Nessun materiale disponibile per questo fornitore.<\/div>` : `\n      <div style=\"max-height:260px;overflow-y:auto;border:1px solid var(--line);margin:10px 0;\">\n        ${candidati.map(m => {\n          const testo = [m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 ');\n          return `<label style=\"display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;\">\n            <input type=\"checkbox\" class=\"manda-ordine-check\" value=\"${m.id}\" checked style=\"width:18px;height:18px;flex-shrink:0;\">\n            <span style=\"font-size:13px;\">${esc(testo)}<\/span>\n          <\/label>`;\n        }).join('')}\n      <\/div>\n      <div class=\"field\">\n        <label>Nome ordine<\/label>\n        <input type=\"text\" id=\"manda-ordine-nome\" value=\"Materiali${fornitoreScelto ? ' \u2014 ' + fornitoreScelto : ''}\">\n      <\/div>\n      `}\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn ghost\" id=\"manda-ordine-annulla\">Annulla<\/button>\n        ${candidati.length>0 ? `<button type=\"button\" class=\"btn\" id=\"manda-ordine-evadi\">Evadi selezionati \u2192 crea ordine<\/button>` : ''}\n      <\/div>\n    `;\n    document.getElementById('manda-ordine-annulla').onclick = closeModal;\n    document.getElementById('manda-ordine-fornitore').onchange = (e) => { fornitoreScelto = e.target.value; disegna(); };\n    const evadiBtn = document.getElementById('manda-ordine-evadi');\n    if(evadiBtn){\n      evadiBtn.onclick = () => {\n        const selezionati = Array.from(modal.querySelectorAll('.manda-ordine-check:checked')).map(cb => cb.value);\n        if(selezionati.length === 0){ alert('Seleziona almeno un materiale.'); return; }\n        const nomeOrdine = document.getElementById('manda-ordine-nome').value.trim() || 'Materiali';\n        const materialiOrdine = state.materialiDaOrdinare\n          .filter(m => selezionati.includes(m.id))\n          .map(m => ({numero:m.numero||'', descrizione:m.descrizione||'', misura:m.misura||''}));\n        state.ordini.push({\n          id: uid(),\n          nome: nomeOrdine,\n          fornitore: fornitoreScelto || '',\n          dataOrdine: todayISO(),\n          statoParziale: 'in_attesa',\n          materiali: materialiOrdine,\n        });\n        state.materialiDaOrdinare = state.materialiDaOrdinare.filter(m => !selezionati.includes(m.id));\n        persist();\n        closeModal();\n        renderOrdini();\n        mostraToast('Ordine creato \u2713');\n      };\n    }\n  }\n  disegna();\n  overlay.classList.add('open');\n}\nfunction renderOrdineRow(r){\n  const today = todayISO();\n  const inRitardo = r.dataPrevista && r.dataPrevista < today && r.statoParziale !== 'completo';\n  const statoLabel = STATO_ORDINE.find(s=>s.value===r.statoParziale)?.label || '\u2014';\n  const statoBadgeClass = r.statoParziale==='completo' ? 'badge-green' : r.statoParziale==='parziale' ? 'badge-orange' : 'badge-gray';\n  const completo = r.statoParziale === 'completo';\n  return `<tr ${completo?'style=\"opacity:0.6;\"':''} class=\"riga-cliccabile\" id=\"row-ord-${r.id}\">\n    <td><strong>${esc(r.nome)}<\/strong>${r.fornitore?`<div style=\"font-size:11px;color:var(--muted);\">${esc(r.fornitore)}<\/div>`:''}${r.materiali && r.materiali.length ? `<div style=\"margin-top:4px;font-size:11px;color:var(--muted);white-space:pre-line;\">${esc(testoMaterialiOrdine(r))}<\/div>` : ''}<\/td>\n    <td class=\"mono\">${fmtDate(r.dataOrdine)}<\/td>\n    <td class=\"mono\">${fmtDate(r.dataPrevista)}<\/td>\n    <td class=\"mono\">${fmtDate(r.dataEffettiva)}<\/td>\n    <td><span class=\"badge ${statoBadgeClass}\">${statoLabel}${r.statoParziale==='parziale' && r.percentualeRicevuta ? ` (${r.percentualeRicevuta}%)` : ''}<\/span>${inRitardo?`<br><span class=\"badge badge-red\" style=\"margin-top:4px;\">in ritardo<\/span>`:''}<\/td>\n    <td style=\"max-width:180px;font-size:12px;color:var(--muted);\">${esc(r.commenti||'\u2014')}<\/td>\n    <td><div class=\"row-actions\">\n      ${completo ? `<button class=\"icon-btn\" id=\"riapri-ord-${r.id}\">Riapri<\/button>` : `<button class=\"icon-btn\" id=\"completo-ord-${r.id}\">\u2713 Completo<\/button>`}\n      <button class=\"icon-btn\" ${r.fotoUrl ? `id=\"vedi-foto-ord-${r.id}\"` : `id=\"foto-ord-${r.id}\"`}>${r.fotoUrl ? '\ud83d\uddbc Vedi foto' : '\ud83d\udcf7 Foto'}<\/button>\n      <button class=\"icon-btn\" id=\"mat-ord-${r.id}\">\ud83d\udce6 Materiali${r.materiali && r.materiali.length ? ' ('+r.materiali.length+')' : ''}<\/button>\n      ${r.materiali && r.materiali.length ? `<button class=\"icon-btn\" id=\"copia-mat-ord-${r.id}\">\ud83d\udccb Copia materiali<\/button>` : ''}\n      <button class=\"icon-btn\" id=\"edit-ord-${r.id}\">Modifica<\/button><button class=\"icon-btn\" id=\"del-ord-${r.id}\">Elimina<\/button>\n    <\/div><\/td>\n  <\/tr>`;\n}\nasync function scattaFotoBolla(r){\n  const file = await apriFotocamera();\n  if(!file) return;\n  caricamentiFotoInCorso++;\n  aggiornaIndicatoreCaricamentoFoto();\n  try{\n    const base64 = await ridimensionaImmagine(file);\n    const risposta = await chiamaAzionePost('uploadFotoBolla', {\n      cantiere: state.nomeCantiereAttivo || 'Cantiere',\n      ordine: r.nome,\n      imageBase64: base64,\n      mimeType: 'image/jpeg',\n      vecchioFileId: r.fotoFileId || null,\n    });\n    r.fotoUrl = risposta.fileUrl;\n    r.fotoFileId = risposta.fileId;\n    persist();\n    if(state.section === 'ordini') renderOrdini();\n    mostraToast('\ud83d\udcf7 Foto caricata \u2713');\n  }catch(e){\n    alert('Errore nel caricamento della foto: ' + e.message);\n  }finally{\n    caricamentiFotoInCorso--;\n    aggiornaIndicatoreCaricamentoFoto();\n  }\n}\nfunction openOrdineModal(existing, prefill){\n  openModal({\n    title: existing ? 'Modifica ordine' : 'Nuovo ordine',\n    values: existing || prefill || {dataOrdine: todayISO(), statoParziale:'in_attesa'},\n    fields: [\n      {name:'nome', label:'Descrizione ordine', type:'text', required:true},\n      {name:'fornitore', label:'Fornitore', type:'text'},\n      {name:'dataOrdine', label:'Data ordine', type:'date', required:true},\n      {name:'dataPrevista', label:'Data prevista consegna', type:'date'},\n      {name:'dataEffettiva', label:'Data effettiva consegna', type:'date'},\n      {name:'statoParziale', label:'Stato consegna', type:'select', options: STATO_ORDINE},\n      {name:'percentualeRicevuta', label:'% ricevuta (se parziale)', type:'number', step:'1'},\n      {name:'commenti', label:'Commenti', type:'textarea'},\n    ],\n    pulsanteExtra: existing ? {\n      label: `\ud83d\udce6 Materiali${existing.materiali && existing.materiali.length ? ' ('+existing.materiali.length+')' : ''}`,\n      onClick: () => { apriGestioneMaterialiOrdine(existing); }\n    } : null,\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.ordini.push({id:uid(), ...data}); }\n      persist(); renderAll();\n    }\n  });\n}\n\n/* ============ PERSONE ============ */\nfunction startOfWeek(d){\n  const dt = new Date(d);\n  const day = (dt.getDay()+6)%7; // luned\u00ec = 0\n  dt.setDate(dt.getDate()-day);\n  dt.setHours(0,0,0,0);\n  return dt;\n}\nfunction meseKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }\nfunction logDelMese(p, d){\n  const key = meseKey(d);\n  return (p.log||[]).filter(l => (l.data||'').slice(0,7) === key);\n}\nfunction oreTotaliPersonaMese(p, d){\n  return logDelMese(p, d).reduce((s,l) => s + Number(l.ore||0), 0);\n}\nfunction motivazioneMediaPersonaMese(p, d){\n  const voci = logDelMese(p, d).filter(l => l.motivazione);\n  if(voci.length === 0) return null;\n  const media = voci.reduce((s,l) => s + Number(l.motivazione), 0) / voci.length;\n  return media;\n}\nfunction pallinoMotivazione(valore, dimensione){\n  dimensione = dimensione || 12;\n  if(!valore) return '';\n  const arrotondato = Math.round(valore);\n  const colore = COLORI_MOTIVAZIONE[Math.min(5, Math.max(1, arrotondato))];\n  return `<span title=\"Motivazione media: ${valore.toFixed(1)}/5\" style=\"display:inline-block;width:${dimensione}px;height:${dimensione}px;border-radius:50%;background:${colore};vertical-align:middle;\"><\/span>`;\n}\nfunction renderPersone(){\n  const rows = state.persone;\n  const meseCorrente = state.personeMese;\n  const totaleTutti = rows.reduce((s,p) => s + oreTotaliPersonaMese(p, meseCorrente), 0);\n\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Persone<\/h2><p class=\"section-sub\">Anagrafica squadra cantiere e registro ore lavorative.<\/p><\/div>\n      <button class=\"btn\" id=\"add-persona\">+ Nuova persona<\/button>\n    <\/div>\n\n    <div class=\"cal-header\" style=\"margin-top:0;\">\n      <button class=\"btn ghost small\" id=\"mese-prev\">\u2190 Mese precedente<\/button>\n      <div class=\"cal-month\">${MESI[meseCorrente.getMonth()]} ${meseCorrente.getFullYear()}<\/div>\n      <button class=\"btn ghost small\" id=\"mese-next\">Mese successivo \u2192<\/button>\n    <\/div>\n\n    <div class=\"subsection-title\">Totali ore del mese<\/div>\n    ${rows.length===0 ? emptyState('Nessuna persona registrata', 'Aggiungi una persona per iniziare a tracciarne le ore.') : `\n    <div class=\"table-scroll\"><table style=\"margin-bottom:22px;\"><thead><tr><th>Persona<\/th><th>Ore nel mese<\/th><th>Motivazione media<\/th><th><\/th><\/tr><\/thead>\n      <tbody>\n        ${rows.map(p => `<tr>\n          <td><strong>${esc(p.nome)}<\/strong>${p.ruolo?`<div style=\"font-size:11px;color:var(--muted);\">${esc(p.ruolo)}<\/div>`:''}<\/td>\n          <td class=\"mono\">${oreTotaliPersonaMese(p, meseCorrente).toFixed(1)} h<\/td>\n          <td>${pallinoMotivazione(motivazioneMediaPersonaMese(p, meseCorrente), 16)}<\/td>\n          <td><button class=\"icon-btn\" id=\"report-mese-${p.id}\">Report mensile<\/button><\/td>\n        <\/tr>`).join('')}\n        <tr><td><strong>Totale squadra<\/strong><\/td><td class=\"mono\"><strong>${totaleTutti.toFixed(1)} h<\/strong><\/td><td><\/td><td><\/td><\/tr>\n      <\/tbody><\/table><\/div>`}\n\n    <div class=\"subsection-title\">Anagrafica e storico completo<\/div>\n    ${rows.map(p => renderPersonaCard(p)).join('')}\n  `;\n  document.getElementById('add-persona').onclick = () => openPersonaModal();\n  document.getElementById('mese-prev').onclick = () => { state.personeMese = new Date(meseCorrente.getFullYear(), meseCorrente.getMonth()-1, 1); renderPersone(); };\n  document.getElementById('mese-next').onclick = () => { state.personeMese = new Date(meseCorrente.getFullYear(), meseCorrente.getMonth()+1, 1); renderPersone(); };\n  rows.forEach(p => {\n    const editBtn = document.getElementById('edit-pers-'+p.id);\n    const delBtn = document.getElementById('del-pers-'+p.id);\n    const addOreBtn = document.getElementById('add-ore-'+p.id);\n    const reportBtn = document.getElementById('report-mese-'+p.id);\n    if(editBtn) editBtn.onclick = () => openPersonaModal(p);\n    if(delBtn) delBtn.onclick = () => { state.persone = state.persone.filter(x=>x.id!==p.id); persist(); renderAll(); };\n    if(addOreBtn) addOreBtn.onclick = () => openOreModal(p);\n    if(reportBtn) reportBtn.onclick = () => apriReportMensile(p);\n    const dettStoricoOre = document.getElementById('dettaglio-storico-ore-'+p.id);\n    if(dettStoricoOre) dettStoricoOre.addEventListener('toggle', function(){ uiDettagliAperti['storico-ore-'+p.id] = this.open; });\n    (p.log||[]).forEach(l => {\n      const dl = document.getElementById(`del-log-${p.id}-${l.id}`);\n      if(dl) dl.onclick = () => {\n        if(l.lavorazioneId){\n          const lav = state.lavorazioni.find(x => x.id === l.lavorazioneId);\n          if(lav) lav.costoOre = Math.max(0, (Number(lav.costoOre)||0) - Number(l.ore||0));\n        }\n        p.log = p.log.filter(x=>x.id!==l.id);\n        persist(); renderAll();\n      };\n    });\n  });\n}\nfunction pallinoMotivazioneSingola(valore, dimensione){\n  dimensione = dimensione || 12;\n  if(!valore) return '';\n  const colore = COLORI_MOTIVAZIONE[valore];\n  return `<span title=\"Motivazione: ${valore}/5\" style=\"display:inline-block;width:${dimensione}px;height:${dimensione}px;border-radius:50%;background:${colore};vertical-align:middle;\"><\/span>`;\n}\nfunction renderPersonaCard(p){\n  const totale = (p.log||[]).reduce((s,l)=>s+Number(l.ore||0),0);\n  const logRows = [...(p.log||[])].sort((a,b)=>b.data.localeCompare(a.data));\n  return `<div class=\"card\" style=\"cursor:default;margin-bottom:14px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;\">\n      <div>\n        <div style=\"font-family:'Oswald',sans-serif;font-size:17px;\">${esc(p.nome)}<\/div>\n        <div style=\"font-size:12px;color:var(--muted);\">${esc(p.ruolo||'\u2014')}<\/div>\n      <\/div>\n      <div style=\"text-align:right;\">\n        <div class=\"mono\" style=\"font-size:20px;\">${totale.toFixed(1)} h<\/div>\n        <div style=\"font-size:11px;color:var(--muted);\">totale registrato (tutti i mesi)<\/div>\n      <\/div>\n      <div class=\"row-actions\">\n        <button class=\"icon-btn\" id=\"add-ore-${p.id}\">+ Ore<\/button>\n        <button class=\"icon-btn\" id=\"edit-pers-${p.id}\">Modifica<\/button>\n        <button class=\"icon-btn\" id=\"del-pers-${p.id}\">Elimina<\/button>\n      <\/div>\n    <\/div>\n    ${logRows.length ? `<details id=\"dettaglio-storico-ore-${p.id}\" style=\"margin-top:12px;\" ${uiDettagliAperti['storico-ore-'+p.id]?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:8px 0;color:var(--muted);font-size:12px;\">Storico ore giorno per giorno (${logRows.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div class=\"table-scroll\" style=\"margin-top:8px;\"><table><thead><tr><th>Data<\/th><th>Ore<\/th><th>Lavorazione<\/th><th>Motiv.<\/th><th>Note<\/th><th><\/th><\/tr><\/thead>\n      <tbody>${logRows.map(l => {\n        const lav = l.lavorazioneId ? state.lavorazioni.find(x => x.id === l.lavorazioneId) : null;\n        return `<tr><td class=\"mono\">${fmtDate(l.data)}<\/td><td class=\"mono\">${l.ore}<\/td><td style=\"font-size:12px;\">${lav ? esc(lav.nome) : '\u2014'}<\/td><td>${pallinoMotivazioneSingola(l.motivazione)}<\/td><td style=\"color:var(--muted);font-size:12px;\">${esc(l.note||'\u2014')}<\/td><td><button class=\"icon-btn\" id=\"del-log-${p.id}-${l.id}\">Elimina<\/button><\/td><\/tr>`;\n      }).join('')}<\/tbody><\/table><\/div>\n    <\/details>` : ''}\n  <\/div>`;\n}\nfunction apriReportMensile(persona, meseOverride){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '620px';\n  let mese = meseOverride || state.personeMese;\n\n  function disegna(){\n    const giorni = logDelMese(persona, mese).sort((a,b)=>a.data.localeCompare(b.data));\n    const totale = giorni.reduce((s,l)=>s+Number(l.ore||0),0);\n    modal.innerHTML = `\n      <div class=\"cal-header\" style=\"margin-bottom:6px;\">\n        <button type=\"button\" class=\"btn ghost small\" id=\"report-mese-prev\">\u2190<\/button>\n        <div style=\"text-align:center;\">\n          <div style=\"font-family:'Oswald',sans-serif;font-size:20px;\">${esc(persona.nome)}<\/div>\n          <div style=\"font-size:12px;color:var(--muted);\">${esc(persona.ruolo||'')}<\/div>\n        <\/div>\n        <button type=\"button\" class=\"btn ghost small\" id=\"report-mese-next\">\u2192<\/button>\n      <\/div>\n      <div style=\"text-align:center;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:0.04em;margin-bottom:14px;text-transform:uppercase;\">${MESI[mese.getMonth()]} ${mese.getFullYear()}<\/div>\n      ${giorni.length===0 ? `<div style=\"text-align:center;color:var(--muted);padding:20px 0;\">Nessuna ora registrata in questo mese.<\/div>` : `\n      <table>\n        <thead><tr><th>Giorno<\/th><th>Ore<\/th><th>Note<\/th><\/tr><\/thead>\n        <tbody>${giorni.map(l => `<tr><td class=\"mono\">${fmtDate(l.data)}<\/td><td class=\"mono\">${l.ore}<\/td><td style=\"color:var(--muted);font-size:12px;\">${esc(l.note||'\u2014')}<\/td><\/tr>`).join('')}<\/tbody>\n      <\/table>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:2px solid var(--ink);\">\n        <strong style=\"font-family:'Oswald',sans-serif;letter-spacing:0.04em;\">TOTALE ORE MESE<\/strong>\n        <strong class=\"mono\" style=\"font-size:24px;color:var(--orange);\">${totale.toFixed(1)} h<\/strong>\n      <\/div>`}\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn ghost\" id=\"chiudi-report\">Chiudi<\/button>\n      <\/div>\n      <div style=\"text-align:center;font-size:11px;color:var(--muted);margin-top:10px;\">Suggerimento: fai uno screenshot di questa schermata da inviare/consegnare in ufficio.<\/div>\n    `;\n    document.getElementById('chiudi-report').onclick = closeModal;\n    document.getElementById('report-mese-prev').onclick = () => { mese = new Date(mese.getFullYear(), mese.getMonth()-1, 1); disegna(); };\n    document.getElementById('report-mese-next').onclick = () => { mese = new Date(mese.getFullYear(), mese.getMonth()+1, 1); disegna(); };\n  }\n  disegna();\n  overlay.classList.add('open');\n}\nfunction openPersonaModal(existing){\n  openModal({\n    title: existing ? 'Modifica persona' : 'Nuova persona',\n    values: existing || {},\n    fields: [\n      {name:'nome', label:'Nome', type:'text', required:true},\n      {name:'ruolo', label:'Ruolo / mansione', type:'text'},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.persone.push({id:uid(), log:[], ...data}); }\n      persist(); renderAll();\n    }\n  });\n}\nfunction openOreModal(persona){\n  const lavorazioniAperte = state.lavorazioni.filter(l => !l.dataCompletamento);\n  openModal({\n    title: `Registra ore \u2014 ${persona.nome}`,\n    values: {data: todayISO()},\n    fields: [\n      {name:'data', label:'Data', type:'date', required:true},\n      {name:'ore', label:'Ore lavorate', type:'number', step:'0.5', required:true},\n      {name:'lavorazioneId', label:'Lavorazione (opzionale)', type:'select', options: [\n        {value:'', label:'\u2014 Nessuna / generale \u2014'},\n        {value:'__nuova__', label:'+ Nuova lavorazione\u2026'},\n        ...lavorazioniAperte.map(l => ({value:l.id, label:l.nome})),\n      ]},\n      {name:'motivazione', label:'MOTIVAZIONE / RENDIMENTO (opzionale)', type:'dots'},\n      {name:'note', label:'Note', type:'text'},\n    ],\n    onSubmit: (data) => {\n      persona.log = persona.log || [];\n      persona.log.push({id:uid(), ...data});\n      if(data.lavorazioneId){\n        const lav = state.lavorazioni.find(l => l.id === data.lavorazioneId);\n        if(lav) lav.costoOre = (Number(lav.costoOre)||0) + Number(data.ore||0);\n      }\n      persist(); renderAll();\n    }\n  });\n  const selectLav = document.getElementById('f-lavorazioneId');\n  if(selectLav){\n    selectLav.onchange = () => {\n      if(selectLav.value !== '__nuova__') return;\n      const nome = prompt('Nome della nuova lavorazione:');\n      if(!nome || !nome.trim()){ selectLav.value = ''; return; }\n      const nuova = {id:uid(), nome:nome.trim(), statoAvanzamento:0, previsioneAvanzamento:0};\n      state.lavorazioni.push(nuova);\n      persist();\n      mostraToast('Lavorazione creata \u2713');\n      const opzione = document.createElement('option');\n      opzione.value = nuova.id;\n      opzione.textContent = nuova.nome;\n      selectLav.insertBefore(opzione, selectLav.querySelector('option[value=\"__nuova__\"]'));\n      selectLav.value = nuova.id;\n    };\n  }\n}\n\n/* ============ EVENTI ============ */\nconst TIPI_EVENTO = [\n  {value:'positivo', label:'Positivo'},\n  {value:'negativo', label:'Negativo'},\n  {value:'neutro', label:'Neutro'},\n];\nconst IMPATTI = [\n  {value:'basso', label:'Basso'},\n  {value:'medio', label:'Medio'},\n  {value:'alto', label:'Alto'},\n];\nfunction renderEventi(){\n  const rows = [...state.eventi].sort((a,b)=>b.data.localeCompare(a.data));\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Eventi<\/h2><p class=\"section-sub\">Registro di eventi positivi, negativi e neutri accaduti in cantiere.<\/p><\/div>\n      <button class=\"btn\" id=\"add-evento\">+ Nuovo evento<\/button>\n    <\/div>\n    ${rows.length===0 ? emptyState('Nessun evento registrato', 'Registra un evento per tenere traccia dell\\'andamento del cantiere.') : `\n    <div class=\"table-scroll\"><table><thead><tr><th>Data<\/th><th>Tipo<\/th><th>Titolo<\/th><th>Descrizione<\/th><th>Impatto<\/th><th><\/th><\/tr><\/thead>\n    <tbody>${rows.map(r => renderEventoRow(r)).join('')}<\/tbody><\/table><\/div>`}\n  `;\n  document.getElementById('add-evento').onclick = () => openEventoModal();\n  rows.forEach(r => {\n    const e = document.getElementById('edit-ev-'+r.id), d = document.getElementById('del-ev-'+r.id);\n    if(e) e.onclick = () => openEventoModal(r);\n    if(d) d.onclick = () => { state.eventi = state.eventi.filter(x=>x.id!==r.id); persist(); renderAll(); };\n  });\n}\nfunction renderEventoRow(r){\n  const badgeClass = r.tipo==='positivo'?'badge-green':r.tipo==='negativo'?'badge-red':'badge-gray';\n  const label = TIPI_EVENTO.find(t=>t.value===r.tipo)?.label||r.tipo;\n  return `<tr>\n    <td class=\"mono\">${fmtDate(r.data)}<\/td>\n    <td><span class=\"badge ${badgeClass}\">${label}<\/span><\/td>\n    <td><strong>${esc(r.titolo)}<\/strong><\/td>\n    <td style=\"max-width:260px;font-size:12px;color:var(--muted);\">${esc(r.descrizione||'\u2014')}<\/td>\n    <td>${r.impatto ? `<span class=\"badge badge-blue\">${esc(IMPATTI.find(i=>i.value===r.impatto)?.label||r.impatto)}<\/span>` : '\u2014'}<\/td>\n    <td><div class=\"row-actions\"><button class=\"icon-btn\" id=\"edit-ev-${r.id}\">Modifica<\/button><button class=\"icon-btn\" id=\"del-ev-${r.id}\">Elimina<\/button><\/div><\/td>\n  <\/tr>`;\n}\nfunction openEventoModal(existing){\n  openModal({\n    title: existing ? 'Modifica evento' : 'Nuovo evento',\n    values: existing || {data: todayISO(), tipo:'positivo', impatto:'medio'},\n    fields: [\n      {name:'tipo', label:'Tipo', type:'select', options: TIPI_EVENTO},\n      {name:'titolo', label:'Titolo', type:'text', required:true},\n      {name:'descrizione', label:'Descrizione', type:'textarea'},\n      {name:'data', label:'Data', type:'date', required:true},\n      {name:'impatto', label:'Impatto', type:'select', options: IMPATTI},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.eventi.push({id:uid(), ...data}); }\n      persist(); renderAll();\n    }\n  });\n}\n\n/* ============ DIARIO DI CANTIERE ============ */\nfunction corrispondeRicercaDiario(voce, testoRicerca){\n  if(!testoRicerca) return true;\n  const q = testoRicerca.toLowerCase();\n  const campi = [fmtDate(voce.data), voce.attivita||'', voce.commenti||''].join(' ').toLowerCase();\n  return campi.includes(q);\n}\nfunction renderDiario(){\n  const voci = [...state.diario]\n    .filter(v => corrispondeRicercaDiario(v, state.diarioRicerca))\n    .sort((a,b) => (b.data||'').localeCompare(a.data||''));\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Diario di cantiere<\/h2><p class=\"section-sub\">Cosa \u00e8 stato fatto giorno per giorno, con eventuali commenti. Tutto lo storico resta qui, sempre visibile e ricercabile.<\/p><\/div>\n      <button class=\"btn\" id=\"add-diario\">+ Nuova voce<\/button>\n    <\/div>\n    <div class=\"toolbar\" style=\"gap:8px;\">\n      <input type=\"text\" id=\"cerca-diario\" placeholder=\"Cerca per data, attivit\u00e0 o commento\u2026\" value=\"${esc(state.diarioRicerca)}\" style=\"flex:1;padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n    <\/div>\n    ${voci.length===0 ? emptyState(state.diarioRicerca ? 'Nessun risultato' : 'Nessuna voce nel diario', state.diarioRicerca ? 'Prova a cercare con altre parole.' : 'Aggiungi la prima voce di oggi: cosa si \u00e8 fatto in cantiere.') : voci.map(v => renderVoceDiario(v)).join('')}\n  `;\n  document.getElementById('add-diario').onclick = () => openDiarioModal();\n  const inputRicerca = document.getElementById('cerca-diario');\n  inputRicerca.oninput = () => { state.diarioRicerca = inputRicerca.value; renderDiario(); document.getElementById('cerca-diario').focus(); document.getElementById('cerca-diario').setSelectionRange(state.diarioRicerca.length, state.diarioRicerca.length); };\n  voci.forEach(v => {\n    const editBtn = document.getElementById('edit-diario-'+v.id);\n    const delBtn = document.getElementById('del-diario-'+v.id);\n    if(editBtn) editBtn.onclick = () => openDiarioModal(v);\n    if(delBtn) delBtn.onclick = () => { state.diario = state.diario.filter(x=>x.id!==v.id); persist(); renderDiario(); };\n  });\n}\nfunction renderVoceDiario(v){\n  return `<div class=\"card\" style=\"cursor:default;margin-bottom:12px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;\">\n      <div style=\"font-family:'Oswald',sans-serif;font-size:16px;\">${fmtDate(v.data)}<\/div>\n      <div class=\"row-actions\">\n        <button class=\"icon-btn\" id=\"edit-diario-${v.id}\">Modifica<\/button>\n        <button class=\"icon-btn\" id=\"del-diario-${v.id}\">Elimina<\/button>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top:8px;white-space:pre-wrap;font-size:13px;\">${esc(v.attivita||'')}<\/div>\n    ${v.commenti ? `<div style=\"margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:pre-wrap;\">${esc(v.commenti)}<\/div>` : ''}\n  <\/div>`;\n}\nfunction openDiarioModal(existing){\n  openModal({\n    title: existing ? 'Modifica voce diario' : 'Nuova voce diario',\n    values: existing || {data: todayISO()},\n    fields: [\n      {name:'data', label:'Data', type:'date', required:true},\n      {name:'attivita', label:'Cosa si \u00e8 fatto oggi', type:'textarea', required:true},\n      {name:'commenti', label:'Commenti (opzionale)', type:'textarea'},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.diario.push({id:uid(), ...data}); }\n      persist();\n      renderDiario();\n    }\n  });\n}\n\n/* ============ CALENDARIO ============ */\nfunction getEntriesForDate(iso){\n  const entries = [];\n  state.ordini.forEach(o => {\n    if(o.dataOrdine === iso) entries.push({tipo:'ordine', label:`Ordine emesso: ${o.nome}`, ref:{kind:'ordine', id:o.id}});\n    if(o.dataPrevista === iso && !o.dataEffettiva) entries.push({tipo:'ordine', label:`Consegna prevista: ${o.nome}`, ref:{kind:'ordine', id:o.id}});\n    if(o.dataEffettiva === iso) entries.push({tipo:'ordine', label:`Consegna ricevuta${o.statoParziale==='parziale'?' (parziale)':''}: ${o.nome}`, ref:{kind:'ordine', id:o.id}});\n  });\n  state.lavorazioni.forEach(l => {\n    if(l.dataInizio === iso) entries.push({tipo:'lavorazione', label:`Inizio lavorazione: ${l.nome}`, ref:{kind:'lavorazione', id:l.id}});\n    if(l.scadenzaPrevista === iso) entries.push({tipo:'lavorazione', label:`Scadenza lavorazione: ${l.nome}`, ref:{kind:'lavorazione', id:l.id}});\n  });\n  state.eventi.forEach(e => {\n    if(e.data === iso) entries.push({tipo:e.tipo, label:`Evento (${e.tipo}): ${e.titolo}`, ref:{kind:'evento', id:e.id}});\n  });\n  state.calendario.forEach(c => {\n    if(c.data === iso){\n      entries.push({tipo:c.tipo, label:`${c.orario?c.orario+' \u2014 ':''}${c.titolo}`, id:c.id, editable:true});\n    } else if(c.ricorrenteSettimanale && c.data < iso){\n      const start = new Date(c.data), cur = new Date(iso);\n      if(start.getDay() === cur.getDay()) entries.push({tipo:c.tipo, label:`${c.orario?c.orario+' \u2014 ':''}${c.titolo} (ricorrente)`, id:c.id, editable:true});\n    }\n  });\n  return entries;\n}\nfunction renderCalendario(){\n  const monthNames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];\n  const y = state.calMonth.getFullYear(), m = state.calMonth.getMonth();\n  const firstDay = new Date(y,m,1);\n  const startOffset = (firstDay.getDay()+6)%7; // luned\u00ec=0\n  const daysInMonth = new Date(y,m+1,0).getDate();\n  const gridStart = new Date(y,m,1-startOffset);\n  const todayStr = todayISO();\n\n  let cells = '';\n  for(let i=0;i<42;i++){\n    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);\n    const iso = toLocalISODate(d);\n    const inMonth = d.getMonth() === m;\n    const entries = getEntriesForDate(iso);\n    const shown = entries.slice(0,3);\n    const restCount = entries.length - shown.length;\n    cells += `<div class=\"cal-day ${inMonth?'':'other-month'} ${iso===todayStr?'today':''} ${state.selectedDay===iso?'selected':''}\" data-day=\"${iso}\">\n      <div class=\"cal-daynum\">${d.getDate()}<\/div>\n      <div class=\"cal-entries\">${shown.map(e => `<div class=\"cal-entry-line\" style=\"border-left-color:${tipoColor(e.tipo)}\">${esc(truncate(e.label,26))}<\/div>`).join('')}<\/div>\n      <div class=\"cal-dots-mini\">${shown.map(e => `<div class=\"dot\" style=\"background:${tipoColor(e.tipo)}\"><\/div>`).join('')}<\/div>\n      ${restCount>0 ? `<div class=\"cal-more\">+${restCount} altri<\/div>` : ''}\n    <\/div>`;\n    if(i>=daysInMonth+startOffset-1 && d.getMonth()!==m && i%7===6) break;\n  }\n\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Calendario<\/h2><p class=\"section-sub\">Ordini, scadenze lavorazioni, eventi, note e appuntamenti in un'unica vista.<\/p><\/div>\n      <button class=\"btn\" id=\"add-cal-entry\">+ Nota / Appuntamento<\/button>\n    <\/div>\n    <div class=\"cal-header\">\n      <button class=\"btn ghost small\" id=\"cal-prev\">\u2190 Precedente<\/button>\n      <div class=\"cal-month\">${monthNames[m]} ${y}<\/div>\n      <button class=\"btn ghost small\" id=\"cal-next\">Successivo \u2192<\/button>\n    <\/div>\n    <div class=\"cal-grid-scroll\">\n      <div class=\"cal-grid\">\n        ${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d=>`<div class=\"cal-dow\">${d}<\/div>`).join('')}\n        ${cells}\n      <\/div>\n    <\/div>\n    <div id=\"day-detail\"><\/div>\n  `;\n  document.getElementById('cal-prev').onclick = () => { state.calMonth = new Date(y,m-1,1); renderCalendario(); };\n  document.getElementById('cal-next').onclick = () => { state.calMonth = new Date(y,m+1,1); renderCalendario(); };\n  document.getElementById('add-cal-entry').onclick = () => openCalEntryModal();\n  document.querySelectorAll('.cal-day').forEach(el => {\n    el.onclick = () => { state.selectedDay = el.dataset.day; renderCalendario(); renderDayDetail(); };\n  });\n  if(state.selectedDay) renderDayDetail();\n}\nfunction renderDayDetail(){\n  const iso = state.selectedDay;\n  const entries = getEntriesForDate(iso);\n  const container = document.getElementById('day-detail');\n  if(!container) return;\n  container.innerHTML = `<div class=\"day-detail\">\n    <h4>${fmtDate(iso)}<\/h4>\n    ${entries.length===0 ? `<div style=\"color:var(--muted);font-size:13px;\">Nessun evento in questa data.<\/div>` :\n      entries.map(e => `<div class=\"day-entry\">\n        <span><span class=\"dot\" style=\"background:${tipoColor(e.tipo)};display:inline-block;margin-right:8px;vertical-align:middle;\"><\/span>${esc(e.label)}<\/span>\n        <div class=\"row-actions\">\n          ${e.ref && e.ref.kind==='lavorazione' ? `<button class=\"icon-btn\" data-open-lav=\"${e.ref.id}\">\u2192 Apri lavorazione<\/button>` : ''}\n          ${e.ref && e.ref.kind==='ordine' ? `<button class=\"icon-btn\" data-open-ord=\"${e.ref.id}\">\u2192 Apri ordine<\/button>` : ''}\n          ${e.ref && e.ref.kind==='evento' ? `<button class=\"icon-btn\" data-open-evt=\"${e.ref.id}\">\u2192 Apri evento<\/button>` : ''}\n          ${e.editable?`<button class=\"icon-btn\" data-cal-edit=\"${e.id}\">Modifica<\/button><button class=\"icon-btn\" data-cal-del=\"${e.id}\">Elimina<\/button>`:''}\n        <\/div>\n      <\/div>`).join('')}\n    <div style=\"margin-top:10px;\"><button class=\"btn small\" id=\"quick-add-cal\">+ Aggiungi per questo giorno<\/button><\/div>\n  <\/div>`;\n  const quickAdd = document.getElementById('quick-add-cal');\n  if(quickAdd) quickAdd.onclick = () => openCalEntryModal(null, iso);\n  container.querySelectorAll('[data-cal-del]').forEach(btn => {\n    btn.onclick = () => {\n      state.calendario = state.calendario.filter(c => c.id !== btn.dataset.calDel);\n      persist(); renderCalendario();\n    };\n  });\n  container.querySelectorAll('[data-cal-edit]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.calendario.find(c => c.id === btn.dataset.calEdit);\n      if(item) openCalEntryModal(item);\n    };\n  });\n  container.querySelectorAll('[data-open-lav]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.lavorazioni.find(x => x.id === btn.dataset.openLav);\n      state.section = 'lavorazioni'; renderAll();\n      if(item) openLavorazioneModal(item);\n    };\n  });\n  container.querySelectorAll('[data-open-ord]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.ordini.find(x => x.id === btn.dataset.openOrd);\n      state.section = 'ordini'; renderAll();\n      if(item) openOrdineModal(item);\n    };\n  });\n  container.querySelectorAll('[data-open-evt]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.eventi.find(x => x.id === btn.dataset.openEvt);\n      state.section = 'eventi'; renderAll();\n      if(item) openEventoModal(item);\n    };\n  });\n}\nfunction openCalEntryModal(existing, presetDate){\n  openModal({\n    title: existing ? 'Modifica voce calendario' : 'Nuova nota / appuntamento',\n    values: existing || {data: presetDate || todayISO(), tipo:'nota'},\n    fields: [\n      {name:'tipo', label:'Tipo', type:'select', options:[{value:'nota',label:'Nota'},{value:'appuntamento',label:'Appuntamento'}]},\n      {name:'titolo', label:'Titolo', type:'text', required:true},\n      {name:'descrizione', label:'Descrizione', type:'textarea'},\n      {name:'data', label:'Data', type:'date', required:true},\n      {name:'orario', label:'Orario (opzionale)', type:'time'},\n      {name:'ricorrenteSettimanale', label:'Ripeti ogni settimana', type:'checkbox'},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.calendario.push({id:uid(), ...data}); }\n      persist(); renderCalendario();\n    }\n  });\n}\n\n/* ============ SHARED ============ */\nfunction emptyState(title, sub){\n  return `<div class=\"empty-state\"><div class=\"display\">${esc(title)}<\/div><div>${esc(sub)}<\/div><\/div>`;\n}\n\n/* ============ RENDER DISPATCH ============ */\nfunction renderAll(){\n  renderNav();\n  if(state.section==='dashboard') renderDashboard();\n  else if(state.section==='lavorazioni') renderLavorazioni();\n  else if(state.section==='ordini') renderOrdini();\n  else if(state.section==='persone') renderPersone();\n  else if(state.section==='eventi') renderEventi();\n  else if(state.section==='calendario') renderCalendario();\n  else if(state.section==='diario') renderDiario();\n}\n\n/* ============ CONFIGURAZIONE CONNESSIONE GOOGLE SHEETS ============ */\nfunction apriImpostazioniConnessione(){\n  openModal({\n    title: 'Connessione Google Sheets',\n    values: {url: getUrlAppsScript()},\n    fields: [\n      {name:'url', label:'URL Web App Apps Script (finisce con /exec)', type:'text', required:true},\n    ],\n    submitLabel: 'Salva e verifica',\n    onSubmit: async (data) => {\n      const url = data.url.trim();\n      mostraCaricamento(true);\n      try{\n        await testaConnessioneAppsScript(url);\n        setUrlAppsScript(url);\n        alert('Connessione riuscita. L\\'app user\u00e0 questo Google Sheet.');\n        location.reload();\n      }catch(e){\n        alert('Connessione non riuscita: ' + e.message + '\\n\\nVerifica di aver copiato l\\'URL /exec corretto e che la distribuzione sia impostata su \"Chiunque\".');\n      }\n      mostraCaricamento(false);\n    }\n  });\n}\n\nfunction mostraSchermataConfigurazione(){\n  document.getElementById('nav').style.display = 'none';\n  const localeLista = lsGet(LS_KEY_LISTA, []);\n  document.getElementById('content').innerHTML = `\n    <div style=\"max-width:520px;margin:20px auto;\">\n      <h2 class=\"section-title\">Collega Google Sheets<\/h2>\n      <p class=\"section-sub\">Per sincronizzare i dati tra i tuoi dispositivi, incolla qui l'URL della Web App di Apps Script (vedi le istruzioni ricevute in chat). Va fatto una sola volta per ogni dispositivo.<\/p>\n      <div class=\"field\">\n        <label>URL Web App (finisce con /exec)<\/label>\n        <input type=\"text\" id=\"setup-url\" placeholder=\"https://script.google.com/macros/s/\u2026/exec\">\n      <\/div>\n      ${localeLista.length > 0 ? `<p style=\"font-size:12px;color:var(--muted);\">Ho trovato ${localeLista.length} cantiere/i gi\u00e0 salvati su questo dispositivo: dopo la connessione ti chieder\u00f2 se vuoi caricarli su Google Sheets.<\/p>` : ''}\n      <button class=\"btn\" id=\"setup-salva\" style=\"width:100%;margin-top:10px;\">Verifica e continua<\/button>\n      <div id=\"setup-errore\" style=\"color:var(--red);font-size:13px;margin-top:10px;\"><\/div>\n    <\/div>\n  `;\n  document.getElementById('setup-salva').onclick = async () => {\n    const url = document.getElementById('setup-url').value.trim();\n    const errEl = document.getElementById('setup-errore');\n    errEl.textContent = '';\n    if(!url){ errEl.textContent = 'Inserisci un URL.'; return; }\n    mostraCaricamento(true);\n    try{\n      await testaConnessioneAppsScript(url);\n      setUrlAppsScript(url);\n      if(localeLista.length > 0){\n        const vuoiMigrare = confirm(`Vuoi caricare ora su Google Sheets i ${localeLista.length} cantiere/i gi\u00e0 presenti su questo dispositivo?`);\n        if(vuoiMigrare){\n          await salvaListaCantieri(localeLista);\n          for(const c of localeLista){\n            const d = lsGet(dataKeyCantiere(c.id), datiVuoti());\n            await kvSet(dataKeyCantiere(c.id), d);\n          }\n        }\n      }\n      document.getElementById('nav').style.display = '';\n      await avviaApp();\n    }catch(e){\n      errEl.textContent = 'Connessione non riuscita: ' + e.message;\n    }\n    mostraCaricamento(false);\n  };\n}\n\nasync function avviaApp(){\n  const listaCache = caricaCacheListaLocale();\n  const attivoIdCache = lsGet(LS_KEY_ATTIVO, null);\n  let dipintoDaCache = false;\n\n  if(listaCache && listaCache.length > 0){\n    const idDaUsare = (attivoIdCache && listaCache.find(c => c.id === attivoIdCache)) ? attivoIdCache : listaCache[0].id;\n    const datiCache = caricaCacheDatiLocale(idDaUsare);\n    if(datiCache){\n      state.cantiereAttivoId = idDaUsare;\n      applicaDatiAStato(datiCache);\n      const meta = listaCache.find(c => c.id === idDaUsare);\n      state.nomeCantiereAttivo = meta ? meta.nome : 'Cantiere';\n      document.getElementById('stamp-nome-cantiere').textContent = state.nomeCantiereAttivo;\n      renderAll();\n      impostaStatoSync('salvataggio', 'Aggiornamento in corso\u2026');\n      dipintoDaCache = true;\n    }\n  }\n\n  if(!dipintoDaCache) mostraCaricamento(true);\n\n  try{\n    let lista = await caricaListaCantieri();\n    if(lista.length === 0){\n      const id = await creaCantiere('Cantiere Principale');\n      lista = await caricaListaCantieri();\n      lsSet(LS_KEY_ATTIVO, id);\n    }\n    salvaCacheListaLocale(lista);\n    let attivoId = lsGet(LS_KEY_ATTIVO, null);\n    if(!attivoId || !lista.find(c => c.id === attivoId)){\n      attivoId = lista[0].id;\n      lsSet(LS_KEY_ATTIVO, attivoId);\n    }\n\n    state.cantiereAttivoId = attivoId;\n    const dati = await caricaDatiCantiere(attivoId);\n    applicaDatiAStato(dati);\n    salvaCacheDatiLocale(attivoId, dati);\n\n    await renderStamp();\n    renderAll();\n    impostaStatoSync('ok');\n  }catch(e){\n    if(dipintoDaCache){\n      // Gi\u00e0 mostrati i dati dall'ultima sessione: segnalo solo che l'aggiornamento \u00e8 fallito, senza bloccare l'uso dell'app.\n      impostaStatoSync('errore', 'Impossibile aggiornare da Google Sheets: ' + e.message + '. Stai vedendo gli ultimi dati salvati su questo dispositivo.');\n    } else {\n      document.getElementById('content').innerHTML = `<div class=\"empty-state\">\n        <div class=\"display\">Impossibile contattare Google Sheets<\/div>\n        <div>${esc(e.message)}<\/div>\n        <button class=\"btn ghost\" id=\"riprova-connessione\" style=\"margin-top:14px;\">Riprova<\/button>\n        <button class=\"btn\" id=\"cambia-connessione\" style=\"margin-top:14px;margin-left:8px;\">Cambia URL<\/button>\n      <\/div>`;\n      document.getElementById('riprova-connessione').onclick = avviaApp;\n      document.getElementById('cambia-connessione').onclick = () => { setUrlAppsScript(''); mostraSchermataConfigurazione(); };\n    }\n  }\n  mostraCaricamento(false);\n}\n\n/* ============ INIT ============ */\nfunction init(){\n  document.getElementById('stamp-date').textContent = fmtDate(todayISO());\n  document.getElementById('btn-cambia-cantiere').onclick = apriGestioneCantieri;\n  document.getElementById('btn-rinomina-cantiere').onclick = apriRinominaCantiere;\n\n  const url = getUrlAppsScript();\n  if(!url){\n    mostraSchermataConfigurazione();\n    return;\n  }\n  avviaApp();\n}\ninit();\n<\/script>\n\n\n<\/body><\/html>"
  </script>
