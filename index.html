      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();

    // la decodifica. Prima di mostrare un errore, ritenta un paio di volte con una richiesta
    // fresca (bypassando la cache), cosa che nella pratica risolve da sola la maggior parte
    // dei casi. Il contatore evita un ciclo infinito se il problema non e' di rete.
    try {
      const tentativi = Number(sessionStorage.getItem('gc_tentativi_unpack') || 0);
      if (tentativi < 2) {
        sessionStorage.setItem('gc_tentativi_unpack', String(tentativi + 1));
        setStatus('Download incompleto, ritento automaticamente...');
        const url = new URL(window.location.href);
        url.searchParams.set('_retry', Date.now());
        window.location.replace(url.toString());
        return;
      }
    } catch (e2) { /* sessionStorage non disponibile: si passa al messaggio d'errore sotto */ }

    console.error('Bundle unpack error:', err);
  }

transform:none;letter-spacing:0;}\n\n/* --- Nav as title-block tabs --- */\n.nav{\n  display:flex;\n  border:1.5px solid var(--ink);\n  border-top:none;\n  background:var(--surface);\n  overflow-x:auto;\n}\n.nav-tab{\n  flex:1;\n  min-width:130px;\n  text-align:left;\n  padding:14px 18px;\n  border-right:1px solid var(--line);\n  background:transparent;\n  cursor:pointer;\n  font-family:'Oswald',sans-serif;\n  letter-spacing:0.04em;\n  color:var(--muted);\n  font-size:14px;\n  position:relative;\n  transition:background .15s ease, color .15s ease;\n}\n.nav-tab:last-child{border-right:none;}\n.nav-tab .code{font-family:'IBM Plex Mono',monospace;font-size:10px;display:block;color:var(--muted);margin-bottom:2px;}\n.nav-tab:hover{background:var(--orange-dim);color:var(--ink);}\n.nav-tab.active{color:var(--ink);background:var(--surface);}\n.nav-tab.active::after{content:\"\";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--orange);}\n\n.panel{\n  border:1.5px solid var(--ink);\n  border-top:none;\n  background:var(--surface);\n  padding:18px 18px;\n  min-height:300px;\n}\n.section-title{font-size:22px;margin:0 0 4px;}\n.section-sub{color:var(--muted);font-size:13px;line-height:1.4;margin:0 0 14px;}\n\n/* --- Dashboard cards --- */\n.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px;}\n.card{\n  border:1px solid var(--line);\n  border-left:4px solid var(--line);\n  padding:11px 14px;\n  cursor:pointer;\n  transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;\n  background:var(--surface);\n}\n.card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 4px 14px rgba(22,35,46,0.08);}\n.card.status-ok{border-left-color:var(--green);}\n.card.status-warn{border-left-color:var(--red);}\n.card.status-info{border-left-color:var(--blue);}\n.card-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.09em;margin-bottom:4px;}\n.card-num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;line-height:1;}\n.card-label{font-size:12px;color:var(--muted);margin-top:3px;}\n.card-flag{display:inline-block;margin-top:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;}\n.flag-red{background:var(--red-dim);color:var(--red);}\n.flag-green{background:var(--green-dim);color:var(--green);}\n.flag-orange{background:var(--orange-dim);color:var(--orange);}\n.flag-blue{background:var(--blue-dim);color:var(--blue);}\n\n.subsection-title{font-size:13px;font-family:'Oswald',sans-serif;letter-spacing:0.05em;margin:16px 0 8px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;}\n\n/* --- Buttons --- */\n.btn{\n  font-family:'Oswald',sans-serif;\n  letter-spacing:0.03em;\n  font-size:14px;\n  padding:11px 20px;\n  border:1.5px solid var(--ink);\n  background:var(--ink);\n  color:var(--surface);\n  cursor:pointer;\n  transition:background .15s ease;\n}\n.btn:hover{background:var(--orange);border-color:var(--orange);}\n.btn.ghost{background:transparent;color:var(--ink);}\n.btn.ghost:hover{background:var(--orange-dim);border-color:var(--orange);color:var(--ink);}\n.btn.small{padding:7px 12px;font-size:12px;}\n.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}\n\n/* --- Tables --- */\n.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}\ntable{width:100%;border-collapse:collapse;font-size:14px;min-width:640px;}\n.tabella-compatta{width:auto !important;min-width:0 !important;}\nth{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.05em;color:var(--muted);border-bottom:1.5px solid var(--ink);padding:10px 12px;text-transform:uppercase;white-space:nowrap;}\ntd{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}\ntr:nth-child(even) td{background:rgba(44,110,158,0.025);}\ntr:hover td{background:rgba(232,114,12,0.06);}\n.empty-row td{color:var(--muted);text-align:center;padding:30px;font-style:italic;}\n\n/* --- Progress bar --- */\n.bar-track{background:var(--paper);border:1px solid var(--line);height:10px;width:100%;position:relative;}\n.bar-fill{background:var(--orange);height:100%;}\n.bar-marker{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);}\n\n.badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;font-family:'IBM Plex Mono',monospace;border-radius:var(--radius);white-space:nowrap;}\n.badge-green{background:var(--green-dim);color:var(--green);}\n.badge-red{background:var(--red-dim);color:var(--red);}\n.badge-orange{background:var(--orange-dim);color:var(--orange);}\n.badge-blue{background:var(--blue-dim);color:var(--blue);}\n.badge-gray{background:#E7EAEC;color:var(--muted);}\n.badge-purple{background:var(--purple-dim);color:var(--purple);}\n\n.row-actions{display:flex;gap:6px;}\n.icon-btn{background:none;border:1px solid var(--line);cursor:pointer;padding:9px 12px;font-size:12px;color:var(--muted);min-height:38px;}\n.valore-cliccabile{cursor:pointer;border-bottom:1px dotted var(--muted);display:inline-block;padding:5px 2px;}\n.valore-cliccabile:hover{border-bottom-color:var(--orange);color:var(--orange);}\n.valore-vuoto{cursor:pointer;color:var(--muted);font-style:italic;font-size:11px;border-bottom:1px dotted var(--line);padding:5px 2px;display:inline-block;}\n.valore-vuoto:hover{border-bottom-color:var(--orange);color:var(--orange);}\n.riga-cliccabile{cursor:pointer;}\n.riga-cliccabile:hover td{background:rgba(232,114,12,0.07);}\n.stepper{display:inline-flex;align-items:center;gap:4px;}\n.stepper button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px;line-height:1;padding:0;color:var(--ink);}\n.stepper button:hover{border-color:var(--orange);color:var(--orange);}\n.icon-btn:hover{border-color:var(--orange);color:var(--orange);}\n\n/* --- Calendar --- */\n.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}\n.cal-month{font-family:'Oswald',sans-serif;font-size:20px;}\n.cal-grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}\n.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-width:650px;border-left:1px solid var(--line);border-top:1px solid var(--line);}\n.cal-dow{font-family:'IBM Plex Mono',monospace;font-size:10px;text-align:center;padding:6px;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);}\n.cal-day{min-height:128px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;cursor:pointer;position:relative;transition:background .1s ease;overflow:hidden;}\n.cal-day:hover{background:var(--orange-dim);}\n.cal-day.other-month{opacity:0.35;}\n.cal-day.today{background:#FFF7EC;}\n.cal-day.selected{outline:2px solid var(--orange);outline-offset:-2px;}\n.cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);}\n.cal-entries{display:flex;flex-direction:column;gap:3px;margin-top:6px;min-width:0;}\n.cal-entry-line{font-size:11px;line-height:1.35;padding:2px 5px 2px 7px;border-left:3px solid var(--muted);background:rgba(22,35,46,0.035);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);min-width:0;max-width:100%;}\n.cal-dots-mini{display:none;flex-wrap:wrap;gap:3px;margin-top:6px;}\n.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}\n.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}\n.dot-ordine{background:var(--blue);}\n.dot-lavorazione{background:var(--orange);}\n.dot-positivo{background:var(--green);}\n.dot-negativo{background:var(--red);}\n.dot-neutro{background:var(--muted);}\n.dot-nota{background:#7C8891;}\n.dot-appuntamento{background:var(--purple);}\n.cal-more{font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}\n.day-detail{border:1px solid var(--line);margin-top:16px;padding:16px;background:var(--paper);}\n.day-detail h4{margin:0 0 10px;font-size:14px;}\n.day-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px;font-size:13px;}\n.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted);align-items:center;}\n.legend span{display:flex;align-items:center;gap:5px;}\n\n/* --- Modal --- */\n.overlay{position:fixed;inset:0;background:rgba(22,35,46,0.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto;}\n.overlay.open{display:flex;}\n.modal{background:var(--surface);border:1.5px solid var(--ink);width:100%;max-width:480px;padding:22px;}\n.modal h3{margin:0 0 16px;font-size:18px;}\n.field{margin-bottom:14px;}\n.field label{display:block;font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:0.04em;margin-bottom:6px;text-transform:uppercase;}\n.field input, .field select, .field textarea{\n  width:100%;padding:10px 11px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);\n}\n.field textarea{resize:vertical;min-height:60px;}\n.field-check{display:flex;align-items:center;gap:8px;}\n.field-check input{width:auto;}\n.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}\n.field-row{display:flex;gap:10px;}\n.field-row .field{flex:1;}\n\n.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}\n.empty-state .display{font-size:16px;color:var(--ink);margin-bottom:8px;}\n\n@media (max-width:720px){\n  .stamp{flex-direction:column;}\n  .stamp-cell{border-right:none;border-bottom:1px solid var(--line);}\n  .nav{flex-direction:column;}\n  .nav-tab{border-right:none;border-bottom:1px solid var(--line);}\n  .panel{padding:16px 12px;}\n}\n@media (max-width:600px){\n  .cal-grid-scroll{overflow-x:visible;}\n  .cal-grid{min-width:0;grid-template-columns:repeat(7,minmax(0,1fr));}\n  .cal-day{min-height:52px;padding:4px 3px;}\n  .cal-daynum{font-size:10.5px;}\n  .cal-entries{display:none;}\n  .cal-dots-mini{display:flex;}\n  .cal-dots-mini .dot{width:6px;height:6px;}\n  .cal-more{font-size:8px;}\n  .cal-dow{font-size:9px;padding:4px 2px;}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"stamp\">\n    <div class=\"stamp-cell\" style=\"flex:2;min-width:220px;\">\n      <span class=\"stamp-label\">Cantiere attivo<\/span>\n      <div style=\"display:flex;align-items:center;gap:8px;\">\n        <span class=\"stamp-value\" id=\"stamp-nome-cantiere\">--<\/span>\n        <button class=\"icon-btn\" id=\"btn-rinomina-cantiere\" title=\"Rinomina cantiere\">\u270e<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"stamp-cell\" style=\"min-width:170px;\">\n      <span class=\"stamp-label\">&nbsp;<\/span>\n      <button class=\"btn ghost small\" id=\"btn-cambia-cantiere\" style=\"width:100%;\">\u21c4 Cambia / Nuovo cantiere<\/button>\n    <\/div>\n    <div class=\"stamp-cell\">\n      <span class=\"stamp-label\">Data odierna<\/span>\n      <span class=\"stamp-value small\" id=\"stamp-date\">--<\/span>\n    <\/div>\n    <div class=\"stamp-cell\">\n      <span class=\"stamp-label\">Sincronizzazione<\/span>\n      <span class=\"badge badge-gray\" id=\"stato-sync\">\u25cf In attesa<\/span>\n    <\/div>\n  <\/div>\n\n  <div class=\"nav\" id=\"nav\"><\/div>\n  <div class=\"panel\" id=\"content\"><\/div>\n\n  <div class=\"legend\" style=\"margin-top:14px;\">\n    <span><span class=\"dot dot-ordine\"><\/span> Ordine<\/span>\n    <span><span class=\"dot dot-lavorazione\"><\/span> Scadenza lavorazione<\/span>\n    <span><span class=\"dot dot-positivo\"><\/span> Evento positivo<\/span>\n    <span><span class=\"dot dot-negativo\"><\/span> Evento negativo<\/span>\n    <span><span class=\"dot dot-neutro\"><\/span> Evento neutro<\/span>\n    <span><span class=\"dot dot-nota\"><\/span> Nota<\/span>\n    <span><span class=\"dot dot-appuntamento\"><\/span> Appuntamento<\/span>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"modal\" id=\"modal\"><\/div>\n<\/div>\n<div id=\"overlay-caricamento\" style=\"display:none;position:fixed;inset:0;background:rgba(237,241,242,0.75);z-index:100;align-items:center;justify-content:center;\">\n  <div style=\"background:var(--surface);border:1.5px solid var(--ink);padding:16px 22px;font-family:'Oswald',sans-serif;letter-spacing:0.04em;\">Sincronizzazione con Google Sheets\u2026<\/div>\n<\/div>\n<div id=\"toast-salvataggio\" style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--surface);padding:10px 20px;font-family:'Oswald',sans-serif;letter-spacing:0.05em;font-size:14px;z-index:120;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;border-radius:2px;\">Salvato \u2713<\/div>\n<div id=\"indicatore-foto\" style=\"display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--orange);color:var(--surface);padding:8px 16px;font-family:'Oswald',sans-serif;letter-spacing:0.04em;font-size:13px;z-index:120;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,0.25);\"><\/div>\n\n<script>\n/* ============ CONTROLLO VERSIONE (evita che il browser mostri una copia vecchia in cache) ============ */\nconst APP_VERSION = 'v2026-07-25-11';\n(function(){\n  try{\n    // Passo 1: confronto rapido con l'ultima versione vista su questo dispositivo (istantaneo, nessuna rete)\n    const versionePrecedente = localStorage.getItem('gc_app_version');\n    if(versionePrecedente !== APP_VERSION){\n      localStorage.setItem('gc_app_version', APP_VERSION);\n    }\n  }catch(e){}\n\n  // Passo 2: controllo attivo in sottofondo \u2014 scarica la pagina reale da GitHub Pages\n  // ignorando volutamente la cache del browser, e si auto-ricarica se trova una versione diversa.\n  // Questo funziona anche se la pagina attualmente in esecuzione \u00e8 vecchia, perch\u00e9 il controllo\n  // stesso forza una richiesta di rete fresca invece di fidarsi di quello che \u00e8 gi\u00e0 in memoria.\n  //\n  // Limite di sicurezza: durante la propagazione di un aggiornamento su GitHub Pages, server\n  // diversi possono rispondere temporaneamente con versioni diverse tra loro. Senza un limite,\n  // questo potrebbe causare ricaricamenti ripetuti in sequenza (sembrando un blocco/crash).\n  // Per questo ci si ricarica al massimo una volta ogni 20 secondi.\n  try{\n    const ultimoTentativo = Number(sessionStorage.getItem('gc_ultimo_reload_versione') || 0);\n    const adesso = Date.now();\n    if(adesso - ultimoTentativo > 20000){\n      fetch(window.location.pathname, {cache:'no-store'})\n        .then(risposta => risposta.text())\n        .then(testo => {\n          const m = testo.match(/APP_VERSION\\s*=\\s*'([^']+)'/);\n          if(m && m[1] && m[1] !== APP_VERSION){\n            sessionStorage.setItem('gc_ultimo_reload_versione', String(Date.now()));\n            const url = new URL(window.location.href);\n            url.searchParams.set('_v', Date.now());\n            window.location.replace(url.toString());\n          }\n        })\n        .catch(() => {}); // offline o rete non disponibile: si continua con la versione gi\u00e0 in uso\n    }\n  }catch(e){}\n})();\n\n/* ============ STATE ============ */\n/* Ricorda quali tendine <details> sono aperte tra un ridisegno e l'altro della pagina */\nconst uiDettagliAperti = {};\n\n/* Ricorda la posizione di scorrimento orizzontale delle tabelle tra un ridisegno e l'altro */\nfunction catturaScrollOrizzontale(){\n  return Array.from(document.querySelectorAll('#content .table-scroll')).map(el => el.scrollLeft);\n}\nfunction ripristinaScrollOrizzontale(valori){\n  const elementi = document.querySelectorAll('#content .table-scroll');\n  elementi.forEach((el, i) => { if(valori[i] !== undefined) el.scrollLeft = valori[i]; });\n}\n\n/* Ricorda la posizione di scorrimento VERTICALE della pagina quando fai una modifica rapida\n   (modificare un valore, spuntare una casella, salvare un modulo, ecc.), cos\u00ec dopo il\n   ridisegno della schermata resti dove eri invece di tornare in cima alla pagina.\n   Quando invece cambi sezione dal menu (o dalle card del Quadro generale), la posizione\n   non viene forzata: \u00e8 giusto che una nuova schermata parta dall'alto. */\nlet scrollVerticaleDaRipristinare = null;\n['click','submit','change','keydown'].forEach(evento => {\n  document.addEventListener(evento, (e) => {\n    const cambioSezione = e.target && e.target.closest && (e.target.closest('.nav-tab') || e.target.closest('[data-goto]'));\n    scrollVerticaleDaRipristinare = cambioSezione ? null : window.scrollY;\n  }, true);\n});\nfunction avviaOsservatoreScrollVerticale(){\n  const contenitore = document.getElementById('content');\n  if(!contenitore) return;\n  const osservatore = new MutationObserver(() => {\n    if(scrollVerticaleDaRipristinare !== null){\n      const y = scrollVerticaleDaRipristinare;\n      scrollVerticaleDaRipristinare = null;\n      requestAnimationFrame(() => window.scrollTo(0, y));\n    }\n  });\n  osservatore.observe(contenitore, {childList:true});\n}\navviaOsservatoreScrollVerticale();\n\nconst state = {\n  cantiereAttivoId: null,\n  section: 'dashboard',\n  lavorazioni: [],\n  ordini: [],\n  persone: [],\n  eventi: [],\n  calendario: [],\n  attivitaVarie: [],\n  diario: [],\n  diarioRicerca: '',\n  materialiDaOrdinare: [],\n  materialiFiltroFornitore: '',\n  lavorazioniFiltroCategoria: '',\n  snapshotSettimanale: null,\n  snapshotMensile: null,\n  rischi: [],\n  rischiFiltroStato: '',\n  rischiFiltroCategoria: '',\n  contrattiSal: [],\n  attivitaOre: [],\n  nomeCantiereAttivo: '',\n  calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),\n  selectedDay: null,\n  personeMese: new Date(new Date().getFullYear(), new Date().getMonth(), 1),\n};\n\nconst MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];\n\nconst SECTIONS = [\n  {id:'dashboard', code:'00', label:'Quadro generale'},\n  {id:'calendario', code:'01', label:'Calendario'},\n  {id:'lavorazioni', code:'02', label:'Lavorazioni'},\n  {id:'ordini', code:'03', label:'Ordini'},\n  {id:'persone', code:'04', label:'Persone'},\n  {id:'eventi', code:'05', label:'Eventi'},\n  {id:'diario', code:'06', label:'Diario di cantiere'},\n  {id:'rischi', code:'07', label:'Rischi'},\n  {id:'sal', code:'08', label:'SAL Fornitori'},\n];\n\n/* ============ STORAGE (localStorage \u2014 persistente sul dispositivo, ideale per APK/WebView) ============ */\nconst LS_PREFIX = 'gc_'; // gestione-cantiere\nconst LS_KEY_LISTA = LS_PREFIX + 'lista-cantieri';\nconst LS_KEY_ATTIVO = LS_PREFIX + 'cantiere-attivo';\nconst LS_KEY_URL_SHEETS = LS_PREFIX + 'url-apps-script';\n\nfunction lsGet(key, fallback){\n  try{\n    const raw = localStorage.getItem(key);\n    return raw ? JSON.parse(raw) : fallback;\n  }catch(e){\n    console.error('Errore lettura storage locale', key, e);\n    return fallback;\n  }\n}\nfunction lsSet(key, value){\n  try{\n    localStorage.setItem(key, JSON.stringify(value));\n    return true;\n  }catch(e){\n    console.error('Errore salvataggio storage locale', key, e);\n    return false;\n  }\n}\nfunction datiVuoti(){\n  return {lavorazioni:[], ordini:[], persone:[], eventi:[], calendario:[], attivitaVarie:[], diario:[], materialiDaOrdinare:[], snapshotSettimanale:null, snapshotMensile:null, rischi:[], contrattiSal:[], attivitaOre:[]};\n}\nfunction dataKeyCantiere(id){ return LS_PREFIX + 'dati-' + id; }\n\n/* ---- Collegamento al foglio Google (Apps Script Web App) ---- */\nconst URL_APPS_SCRIPT_PREDEFINITO = 'https://script.google.com/macros/s/AKfycbxDXtrI8NELVMnHIW3MJoS2yhahFm0DLQT4FOI9pcx3-w9is2HwV0WUg2tMKaUuq-rC/exec'; function getUrlAppsScript(){ return localStorage.getItem(LS_KEY_URL_SHEETS) || URL_APPS_SCRIPT_PREDEFINITO; }\nfunction setUrlAppsScript(url){ localStorage.setItem(LS_KEY_URL_SHEETS, url.trim()); }\n\nasync function kvGet(key){\n  const url = getUrlAppsScript();\n  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');\n  const res = await fetch(`${url}?action=get&key=${encodeURIComponent(key)}`);\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Errore nella lettura dei dati dal foglio');\n  return json.found ? JSON.parse(json.value) : null;\n}\nasync function kvSet(key, value){\n  const url = getUrlAppsScript();\n  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');\n  const res = await fetch(url, {\n    method: 'POST',\n    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // evita il preflight CORS, non gestito da Apps Script\n    body: JSON.stringify({action:'set', key, value: JSON.stringify(value)}),\n  });\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Errore nel salvataggio dei dati sul foglio');\n  return true;\n}\nasync function kvDelete(key){\n  const url = getUrlAppsScript();\n  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');\n  const res = await fetch(url, {\n    method: 'POST',\n    headers: {'Content-Type': 'text/plain;charset=utf-8'},\n    body: JSON.stringify({action:'delete', key}),\n  });\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Errore nell\\'eliminazione dei dati sul foglio');\n  return true;\n}\nasync function testaConnessioneAppsScript(url){\n  const res = await fetch(`${url}?action=ping`);\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Risposta non valida dal foglio');\n  return true;\n}\nasync function chiamaAzionePost(azione, payload){\n  const url = getUrlAppsScript();\n  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');\n  const res = await fetch(url, {\n    method: 'POST',\n    headers: {'Content-Type': 'text/plain;charset=utf-8'},\n    body: JSON.stringify({action: azione, ...payload}),\n  });\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Errore nella richiesta al foglio');\n  return json;\n}\nasync function chiamaAzioneGet(azione, parametri){\n  const url = getUrlAppsScript();\n  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');\n  const query = new URLSearchParams({action: azione, ...parametri}).toString();\n  const res = await fetch(`${url}?${query}`);\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Errore nella richiesta al foglio');\n  return json;\n}\nasync function elencoFotoLavorazione(nomeCantiere, nomeLavorazione){\n  try{\n    const risposta = await chiamaAzioneGet('listaFotoLavorazione', {cantiere: nomeCantiere, lavorazione: nomeLavorazione});\n    return risposta.file || [];\n  }catch(e){\n    console.error('Errore nel leggere le foto della lavorazione', nomeLavorazione, e);\n    return [];\n  }\n}\nasync function scaricaFotoBase64(fileId){\n  const risposta = await chiamaAzioneGet('scaricaFoto', {fileId});\n  return risposta;\n}\nfunction estraiPercentualeDaNomeFile(nome){\n  const m = nome.match(/(\\d{1,3})%/);\n  return m ? Number(m[1]) : null;\n}\nfunction trovaPercentualePiuVicina(percentualiDisponibili, target){\n  const successive = percentualiDisponibili.filter(p => p >= target).sort((a,b)=>a-b);\n  if(successive.length) return successive[0];\n  const precedenti = percentualiDisponibili.filter(p => p < target).sort((a,b)=>b-a);\n  if(precedenti.length) return precedenti[0];\n  return null;\n}\nfunction sceglieFotoCicloLavoro(elencoFile){\n  const conPercentuale = elencoFile\n    .map(f => ({...f, percentuale: estraiPercentualeDaNomeFile(f.nome)}))\n    .filter(f => f.percentuale !== null);\n  if(conPercentuale.length === 0) return [];\n  const percentualiDisponibili = [...new Set(conPercentuale.map(f => f.percentuale))];\n  const scelte = [];\n  const usate = new Set();\n  [25, 50, 75, 100].forEach(target => {\n    const percentualeScelta = trovaPercentualePiuVicina(percentualiDisponibili, target);\n    if(percentualeScelta === null) return;\n    const candidati = conPercentuale\n      .filter(f => f.percentuale === percentualeScelta && !usate.has(f.id))\n      .sort((a,b) => new Date(b.creato) - new Date(a.creato));\n    if(candidati.length){\n      scelte.push({...candidati[0], targetPercentuale: target});\n      usate.add(candidati[0].id);\n    }\n  });\n  return scelte;\n}\n\n/* ---- Report settimanale in PDF ---- */\nfunction caricaScriptEsterno(src){\n  return new Promise((resolve, reject) => {\n    if(document.querySelector(`script[src=\"${src}\"]`)){ resolve(); return; }\n    const s = document.createElement('script');\n    s.src = src;\n    s.onload = () => resolve();\n    s.onerror = () => reject(new Error('Impossibile caricare una libreria necessaria per il PDF (serve connessione internet).'));\n    document.head.appendChild(s);\n  });\n}\nasync function assicuraLibreriePdf(){\n  if(!window.jspdf){\n    await caricaScriptEsterno('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');\n  }\n  if(!window.jspdf.jsPDF.API.autoTable){\n    await caricaScriptEsterno('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');\n  }\n}\nconst GIORNI_SETTIMANA_BREVI = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];\nfunction eventiCategorizzatiPerGiorno(iso){\n  const cat = {arrivo:[], inizio:[], ordini:[], note:[]};\n  state.ordini.forEach(o => {\n    if(o.dataOrdine === iso) cat.ordini.push(o.nome + (o.fornitore ? ' ('+o.fornitore+')' : ''));\n    if(o.dataEffettiva === iso) cat.arrivo.push(o.nome + (o.statoParziale==='parziale' ? ' (parziale)' : ''));\n    else if(o.dataPrevista === iso && !o.dataEffettiva) cat.arrivo.push(o.nome + ' (previsto)');\n  });\n  state.lavorazioni.forEach(l => {\n    if(l.dataInizio === iso) cat.inizio.push(l.nome);\n  });\n  state.calendario.forEach(c => {\n    if(c.data === iso){\n      cat.note.push(`${c.tipo==='appuntamento'?'Appuntamento':'Nota'}: ${c.titolo}`);\n    } else if(c.ricorrenteSettimanale && c.data < iso){\n      const start = new Date(c.data), cur = new Date(iso);\n      if(start.getDay() === cur.getDay()) cat.note.push(`${c.tipo==='appuntamento'?'Appuntamento':'Nota'}: ${c.titolo}`);\n    }\n  });\n  return cat;\n}\nasync function aggiungiPannelloFotoLavorazioniCompletate(doc, lavorazioniCompletate, nomeCantiere, margineSx, larghezzaPagina){\n  if(lavorazioniCompletate.length === 0) return;\n  doc.addPage();\n  let y = 18;\n  doc.setFont('helvetica','bold'); doc.setFontSize(14);\n  doc.text('Ciclo lavorativo \u2014 lavorazioni completate', margineSx, y);\n  y += 10;\n\n  for(const lav of lavorazioniCompletate){\n    let elenco = [];\n    try{ elenco = await elencoFotoLavorazione(nomeCantiere, lav.nome); }catch(e){ elenco = []; }\n    const foto = sceglieFotoCicloLavoro(elenco);\n    if(foto.length === 0) continue;\n\n    if(y > 220){ doc.addPage(); y = 18; }\n    doc.setFont('helvetica','bold'); doc.setFontSize(11);\n    doc.text(lav.nome, margineSx, y);\n    y += 6;\n\n    const larghezzaFoto = 42;\n    const altezzaFoto = 32;\n    const spazio = 4;\n    let x = margineSx;\n    for(const f of foto){\n      try{\n        const dati = await scaricaFotoBase64(f.id);\n        const formato = (dati.mimeType||'').indexOf('png') !== -1 ? 'PNG' : 'JPEG';\n        doc.addImage('data:'+dati.mimeType+';base64,'+dati.base64, formato, x, y, larghezzaFoto, altezzaFoto);\n        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90);\n        doc.text(`${f.targetPercentuale}%`, x + larghezzaFoto/2, y + altezzaFoto + 4, {align:'center'});\n        doc.setTextColor(0);\n      }catch(e){\n        console.error('Errore nel caricare una foto per il report', e);\n      }\n      x += larghezzaFoto + spazio;\n    }\n    y += altezzaFoto + 12;\n  }\n}\n\nfunction apriModaleReportSettimanale(){\n  openModal({\n    title: 'Report settimanale',\n    values: {dataRiferimento: todayISO()},\n    fields: [\n      {name:'dataRiferimento', label:'Scegli un giorno qualsiasi della settimana desiderata (lun-dom)', type:'date', required:true},\n    ],\n    submitLabel: 'Genera report',\n    onSubmit: (data) => {\n      const [aa,mm,gg] = data.dataRiferimento.split('-').map(Number);\n      generaReportSettimanale(new Date(aa, mm-1, gg));\n    }\n  });\n}\nfunction apriModaleReportMensile(){\n  const oggi = new Date();\n  const meseDefault = `${oggi.getFullYear()}-${String(oggi.getMonth()+1).padStart(2,'0')}`;\n  openModal({\n    title: 'Report mensile',\n    values: {meseRiferimento: meseDefault},\n    fields: [\n      {name:'meseRiferimento', label:'Mese di riferimento', type:'month', required:true},\n    ],\n    submitLabel: 'Genera report',\n    onSubmit: (data) => {\n      const [aa,mm] = data.meseRiferimento.split('-').map(Number);\n      generaReportMensile(new Date(aa, mm-1, 1));\n    }\n  });\n}\nasync function generaReportSettimanale(dataRiferimento){\n  mostraCaricamento(true);\n  try{\n    await assicuraLibreriePdf();\n    const { jsPDF } = window.jspdf;\n\n    const oggi = dataRiferimento || new Date();\n    const inizio = startOfWeek(oggi);\n    const giorni = [];\n    for(let i=0;i<7;i++){ const d = new Date(inizio); d.setDate(inizio.getDate()+i); giorni.push(d); }\n    const isoGiorni = giorni.map(toLocalISODate);\n    const isoInizio = isoGiorni[0], isoFine = isoGiorni[6];\n\n    const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});\n    const nomeCant = state.nomeCantiereAttivo || 'Cantiere';\n    const larghezzaPagina = doc.internal.pageSize.getWidth();\n    const margineSx = 14;\n    let y = 18;\n\n    function nuovaPaginaSeServe(soglia){\n      if(y > (soglia || 270)){ doc.addPage(); y = 18; }\n    }\n\n    doc.setFont('helvetica','bold');\n    doc.setFontSize(18);\n    doc.text('Report settimanale', margineSx, y);\n    y += 8;\n    doc.setFont('helvetica','normal');\n    doc.setFontSize(11);\n    doc.text(`Cantiere: ${nomeCant}`, margineSx, y);\n    y += 6;\n    doc.text(`Settimana: ${fmtDate(isoInizio)} - ${fmtDate(isoFine)}`, margineSx, y);\n    y += 5;\n    doc.setFontSize(8);\n    doc.setTextColor(120);\n    doc.text(`Generato il ${fmtDate(todayISO())}`, margineSx, y);\n    doc.setTextColor(0);\n    y += 8;\n\n    /* --- Tabella settimana: una riga sola, tutti gli avvenimenti del giorno insieme --- */\n    const eventiGiorni = isoGiorni.map(eventiCategorizzatiPerGiorno);\n    const testateGiorni = giorni.map((d,i) => `${GIORNI_SETTIMANA_BREVI[i]}\\n${fmtDataBreve(isoGiorni[i])}`);\n    const rigaUnica = eventiGiorni.map(e => {\n      const tutti = [\n        ...e.arrivo.map(t => 'Arrivo: ' + t),\n        ...e.inizio.map(t => 'Inizio: ' + t),\n        ...e.ordini.map(t => 'Ordine: ' + t),\n        ...e.note,\n      ];\n      return tutti.join('\\n') || '-';\n    });\n    doc.autoTable({\n      startY: y,\n      head: [testateGiorni],\n      body: [rigaUnica],\n      styles:{fontSize:7, cellPadding:2, valign:'top', halign:'left'},\n      headStyles:{fillColor:[22,35,46], textColor:255, halign:'center', fontSize:8},\n      margin:{left:margineSx, right:margineSx},\n    });\n    y = doc.lastAutoTable.finalY + 10;\n\n    /* --- Persone: totale ore della settimana --- */\n    nuovaPaginaSeServe();\n    doc.setFont('helvetica','bold'); doc.setFontSize(13);\n    doc.text('Persone', margineSx, y); y += 7;\n    doc.setFont('helvetica','normal'); doc.setFontSize(10);\n    const oreSettimanaPersone = state.persone\n      .map(p => ({ nome: p.nome, tot: (p.log||[]).filter(l => l.data >= isoInizio && l.data <= isoFine).reduce((s,l)=>s+Number(l.ore||0),0) }))\n      .filter(x => x.tot > 0);\n    if(oreSettimanaPersone.length === 0){\n      doc.setTextColor(140); doc.text('Nessuna ora registrata questa settimana.', margineSx, y); doc.setTextColor(0); y += 6;\n    } else {\n      oreSettimanaPersone.forEach(x => {\n        doc.text(`${x.nome} - ${x.tot} ore`, margineSx, y);\n        y += 6;\n        nuovaPaginaSeServe();\n      });\n    }\n    y += 5;\n\n    /* --- Lavorazioni: avanzamento inizio -> fine settimana --- */\n    nuovaPaginaSeServe();\n    doc.setFont('helvetica','bold'); doc.setFontSize(13);\n    doc.text('Lavorazioni', margineSx, y); y += 7;\n    doc.setFont('helvetica','normal'); doc.setFontSize(10);\n    const snapshotPrec = state.snapshotSettimanale;\n    const righeAvanzamento = state.lavorazioni\n      .filter(l => !l.dataCompletamento || (l.dataCompletamento >= isoInizio))\n      .map(l => {\n        const percOra = Number(l.statoAvanzamento||0);\n        const percPrima = (snapshotPrec && snapshotPrec.valori && snapshotPrec.valori[l.id] !== undefined) ? snapshotPrec.valori[l.id] : null;\n        return { nome: l.nome, percPrima, percOra };\n      });\n    if(righeAvanzamento.length === 0){\n      doc.setTextColor(140); doc.text('Nessuna lavorazione aperta.', margineSx, y); doc.setTextColor(0); y += 6;\n    } else {\n      righeAvanzamento.forEach(r => {\n        const testo = r.percPrima!==null ? `${r.nome}: ${r.percPrima}% -> ${r.percOra}%` : `${r.nome}: ${r.percOra}% (primo report)`;\n        doc.text(testo, margineSx, y);\n        y += 6;\n        nuovaPaginaSeServe();\n      });\n    }\n    y += 5;\n\n    /* --- Eventi della settimana --- */\n    nuovaPaginaSeServe();\n    doc.setFont('helvetica','bold'); doc.setFontSize(13);\n    doc.text('Eventi', margineSx, y); y += 7;\n    doc.setFont('helvetica','normal'); doc.setFontSize(10);\n    const eventiSettimana = state.eventi.filter(e => e.data >= isoInizio && e.data <= isoFine).sort((a,b)=>a.data.localeCompare(b.data));\n    if(eventiSettimana.length === 0){\n      doc.setTextColor(140); doc.text('Nessun evento registrato questa settimana.', margineSx, y); doc.setTextColor(0); y += 6;\n    } else {\n      eventiSettimana.forEach(e => {\n        const etichetta = e.tipo==='positivo' ? 'Positivo' : e.tipo==='negativo' ? 'Negativo' : 'Neutro';\n        const righe = doc.splitTextToSize(`${fmtDataBreve(e.data)} [${etichetta}] - ${e.titolo}`, larghezzaPagina - margineSx*2);\n        doc.text(righe, margineSx, y);\n        y += 6 * righe.length;\n        nuovaPaginaSeServe();\n      });\n    }\n    y += 5;\n\n    /* --- Note: riassunto del diario di cantiere della settimana --- */\n    nuovaPaginaSeServe();\n    doc.setFont('helvetica','bold'); doc.setFontSize(13);\n    doc.text('Note', margineSx, y); y += 7;\n    doc.setFont('helvetica','normal'); doc.setFontSize(10);\n    const diarioSettimana = state.diario.filter(v => v.data >= isoInizio && v.data <= isoFine).sort((a,b)=>a.data.localeCompare(b.data));\n    if(diarioSettimana.length === 0){\n      doc.setTextColor(140); doc.text('Nessuna voce di diario questa settimana.', margineSx, y); doc.setTextColor(0); y += 6;\n    } else {\n      diarioSettimana.forEach(v => {\n        const riassunto = (v.attivita||'').replace(/\\s+/g,' ').trim();\n        const riassuntoBreve = riassunto.length > 160 ? riassunto.slice(0,160) + '...' : riassunto;\n        const righe = doc.splitTextToSize(`${fmtDataBreve(v.data)} - ${riassuntoBreve}`, larghezzaPagina - margineSx*2);\n        doc.text(righe, margineSx, y);\n        y += 6 * righe.length + 1;\n        nuovaPaginaSeServe();\n      });\n    }\n\n    /* --- Ciclo lavorativo: foto delle lavorazioni completate in questa settimana --- */\n    const lavorazioniCompletateSettimana = state.lavorazioni.filter(l => l.dataCompletamento && l.dataCompletamento >= isoInizio && l.dataCompletamento <= isoFine);\n    await aggiungiPannelloFotoLavorazioniCompletate(doc, lavorazioniCompletateSettimana, nomeCant, margineSx, larghezzaPagina);\n\n    const datiUriPdf = doc.output('datauristring');\n    const pdfBase64 = datiUriPdf.substring(datiUriPdf.indexOf('base64,') + 7);\n    const nomeFile = `Report settimanale - ${fmtDataBreve(isoInizio).replace(/\\//g,'-')} - ${fmtDataBreve(isoFine).replace(/\\//g,'-')}`;\n\n    const risposta = await chiamaAzionePost('uploadReportPdf', {\n      cantiere: nomeCant,\n      tipo: 'settimanale',\n      nomeFile,\n      pdfBase64,\n    });\n\n    const nuovoSnapshot = {data: todayISO(), valori: {}};\n    state.lavorazioni.forEach(l => { nuovoSnapshot.valori[l.id] = Number(l.statoAvanzamento||0); });\n    state.snapshotSettimanale = nuovoSnapshot;\n    persist();\n\n    mostraToast('Report creato \u2713');\n    if(risposta.fileUrl) window.open(risposta.fileUrl, '_blank');\n  }catch(e){\n    alert('Errore nella generazione del report: ' + e.message);\n  }\n  mostraCaricamento(false);\n}\nasync function generaReportMensile(dataRiferimento){\n  mostraCaricamento(true);\n  try{\n    await assicuraLibreriePdf();\n    const { jsPDF } = window.jspdf;\n\n    const oggi = dataRiferimento || new Date();\n    const primoGiorno = new Date(oggi.getFullYear(), oggi.getMonth(), 1);\n    const ultimoGiorno = new Date(oggi.getFullYear(), oggi.getMonth()+1, 0);\n    const isoInizio = toLocalISODate(primoGiorno);\n    const isoFine = toLocalISODate(ultimoGiorno);\n    const nomeMese = `${MESI[oggi.getMonth()]} ${oggi.getFullYear()}`;\n\n    const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});\n    const nomeCant = state.nomeCantiereAttivo || 'Cantiere';\n    const larghezzaPagina = doc.internal.pageSize.getWidth();\n    const margineSx = 10;\n    let y = 15;\n\n    function nuovaPaginaSeServe(soglia){\n      if(y > (soglia || 270)){ doc.addPage(); y = 18; }\n    }\n\n    /* --- Pagina 1: intestazione + calendario del mese in grande --- */\n    doc.setFont('helvetica','bold');\n    doc.setFontSize(18);\n    doc.text('Report mensile', margineSx, y);\n    y += 8;\n    doc.setFont('helvetica','normal');\n    doc.setFontSize(11);\n    doc.text(`Cantiere: ${nomeCant}`, margineSx, y);\n    y += 6;\n    doc.text(`Mese: ${nomeMese}`, margineSx, y);\n    y += 5;\n    doc.setFontSize(8);\n    doc.setTextColor(120);\n    doc.text(`Generato il ${fmtDate(todayISO())}`, margineSx, y);\n    doc.setTextColor(0);\n    y += 8;\n\n    const offsetPrimoGiorno = (primoGiorno.getDay()+6)%7; // lun=0\n    const inizioGriglia = new Date(primoGiorno);\n    inizioGriglia.setDate(primoGiorno.getDate() - offsetPrimoGiorno);\n    const numSettimane = Math.ceil((offsetPrimoGiorno + ultimoGiorno.getDate()) / 7);\n    const corpoCalendario = [];\n    for(let s=0; s<numSettimane; s++){\n      const riga = [];\n      for(let g=0; g<7; g++){\n        const d = new Date(inizioGriglia);\n        d.setDate(inizioGriglia.getDate() + s*7 + g);\n        if(d.getMonth() !== primoGiorno.getMonth()){\n          riga.push('');\n        } else {\n          const iso = toLocalISODate(d);\n          const e = eventiCategorizzatiPerGiorno(iso);\n          const righeTesto = [\n            ...e.arrivo.map(t => 'Arrivo: ' + t),\n            ...e.inizio.map(t => 'Inizio: ' + t),\n            ...e.ordini.map(t => 'Ordine: ' + t),\n            ...e.note,\n          ];\n          riga.push(String(d.getDate()) + (righeTesto.length ? '\\n' + righeTesto.join('\\n') : ''));\n        }\n      }\n      corpoCalendario.push(riga);\n    }\n    doc.autoTable({\n      startY: y,\n      head: [['Lun','Mar','Mer','Gio','Ven','Sab','Dom']],\n      body: corpoCalendario,\n      styles:{fontSize:6.5, cellPadding:1.5, valign:'top', minCellHeight:22, overflow:'linebreak'},\n      headStyles:{fillColor:[22,35,46], textColor:255, halign:'center', fontSize:9},\n      margin:{left:margineSx, right:margineSx},\n      theme:'grid',\n    });\n\n    /* --- Pagina 2 in poi: Persone, Lavorazioni, Eventi, Note --- */\n    doc.addPage();\n    y = 18;\n    const margineTesto = 14;\n\n    doc.setFont('helvetica','bold'); doc.setFontSize(13);\n    doc.text('Persone', margineTesto, y); y += 7;\n    doc.setFont('helvetica','normal'); doc.setFontSize(10);\n    const oreMesePersone = state.persone\n      .map(p => ({ nome: p.nome, tot: oreTotaliPersonaMese(p, primoGiorno) }))\n      .filter(x => x.tot > 0);\n    if(oreMesePersone.length === 0){\n      doc.setTextColor(140); doc.text('Nessuna ora registrata questo mese.', margineTesto, y); doc.setTextColor(0); y += 6;\n    } else {\n      oreMesePersone.forEach(x => {\n        doc.text(`${x.nome} - ${x.tot.toFixed(1)} ore`, margineTesto, y);\n        y += 6;\n        nuovaPaginaSeServe();\n      });\n    }\n    y += 5;\n\n    nuovaPaginaSeServe();\n    doc.setFont('helvetica','bold'); doc.setFontSize(13);\n    doc.text('Lavorazioni', margineTesto, y); y += 7;\n    doc.setFont('helvetica','normal'); doc.setFontSize(10);\n    const snapshotPrec = state.snapshotMensile;\n    const righeAvanzamento = state.lavorazioni\n      .filter(l => !l.dataCompletamento || (l.dataCompletamento >= isoInizio))\n      .map(l => {\n        const percOra = Number(l.statoAvanzamento||0);\n        const percPrima = (snapshotPrec && snapshotPrec.valori && snapshotPrec.valori[l.id] !== undefined) ? snapshotPrec.valori[l.id] : null;\n        return { nome: l.nome, percPrima, percOra };\n      });\n    if(righeAvanzamento.length === 0){\n      doc.setTextColor(140); doc.text('Nessuna lavorazione aperta.', margineTesto, y); doc.setTextColor(0); y += 6;\n    } else {\n      righeAvanzamento.forEach(r => {\n        const testo = r.percPrima!==null ? `${r.nome}: ${r.percPrima}% -> ${r.percOra}%` : `${r.nome}: ${r.percOra}% (primo report)`;\n        doc.text(testo, margineTesto, y);\n        y += 6;\n        nuovaPaginaSeServe();\n      });\n    }\n    y += 5;\n\n    nuovaPaginaSeServe();\n    doc.setFont('helvetica','bold'); doc.setFontSize(13);\n    doc.text('Eventi', margineTesto, y); y += 7;\n    doc.setFont('helvetica','normal'); doc.setFontSize(10);\n    const eventiMese = state.eventi.filter(e => e.data >= isoInizio && e.data <= isoFine).sort((a,b)=>a.data.localeCompare(b.data));\n    if(eventiMese.length === 0){\n      doc.setTextColor(140); doc.text('Nessun evento registrato questo mese.', margineTesto, y); doc.setTextColor(0); y += 6;\n    } else {\n      eventiMese.forEach(e => {\n        const etichetta = e.tipo==='positivo' ? 'Positivo' : e.tipo==='negativo' ? 'Negativo' : 'Neutro';\n        const righe = doc.splitTextToSize(`${fmtDataBreve(e.data)} [${etichetta}] - ${e.titolo}`, larghezzaPagina - margineTesto*2);\n        doc.text(righe, margineTesto, y);\n        y += 6 * righe.length;\n        nuovaPaginaSeServe();\n      });\n    }\n    y += 5;\n\n    nuovaPaginaSeServe();\n    doc.setFont('helvetica','bold'); doc.setFontSize(13);\n    doc.text('Note', margineTesto, y); y += 7;\n    doc.setFont('helvetica','normal'); doc.setFontSize(10);\n    const diarioMese = state.diario.filter(v => v.data >= isoInizio && v.data <= isoFine).sort((a,b)=>a.data.localeCompare(b.data));\n    if(diarioMese.length === 0){\n      doc.setTextColor(140); doc.text('Nessuna voce di diario questo mese.', margineTesto, y); doc.setTextColor(0); y += 6;\n    } else {\n      diarioMese.forEach(v => {\n        const riassunto = (v.attivita||'').replace(/\\s+/g,' ').trim();\n        const riassuntoBreve = riassunto.length > 160 ? riassunto.slice(0,160) + '...' : riassunto;\n        const righe = doc.splitTextToSize(`${fmtDataBreve(v.data)} - ${riassuntoBreve}`, larghezzaPagina - margineTesto*2);\n        doc.text(righe, margineTesto, y);\n        y += 6 * righe.length + 1;\n        nuovaPaginaSeServe();\n      });\n    }\n\n    /* --- Ciclo lavorativo: foto delle lavorazioni completate in questo mese --- */\n    const lavorazioniCompletateMese = state.lavorazioni.filter(l => l.dataCompletamento && l.dataCompletamento >= isoInizio && l.dataCompletamento <= isoFine);\n    await aggiungiPannelloFotoLavorazioniCompletate(doc, lavorazioniCompletateMese, nomeCant, margineTesto, larghezzaPagina);\n\n    const datiUriPdf = doc.output('datauristring');\n    const pdfBase64 = datiUriPdf.substring(datiUriPdf.indexOf('base64,') + 7);\n    const nomeFile = `Report mensile - ${nomeMese}`;\n\n    const risposta = await chiamaAzionePost('uploadReportPdf', {\n      cantiere: nomeCant,\n      tipo: 'mensile',\n      nomeFile,\n      pdfBase64,\n    });\n\n    const nuovoSnapshot = {data: todayISO(), valori: {}};\n    state.lavorazioni.forEach(l => { nuovoSnapshot.valori[l.id] = Number(l.statoAvanzamento||0); });\n    state.snapshotMensile = nuovoSnapshot;\n    persist();\n\n    mostraToast('Report creato \u2713');\n    if(risposta.fileUrl) window.open(risposta.fileUrl, '_blank');\n  }catch(e){\n    alert('Errore nella generazione del report: ' + e.message);\n  }\n  mostraCaricamento(false);\n}\n\n/* ---- Fotocamera e ridimensionamento immagini ---- */\nfunction apriFotocamera(){\n  return new Promise((resolve) => {\n    const input = document.createElement('input');\n    input.type = 'file';\n    input.accept = 'image/*';\n    input.capture = 'environment';\n    input.style.display = 'none';\n    input.onchange = () => {\n      const file = input.files && input.files[0] ? input.files[0] : null;\n      document.body.removeChild(input);\n      resolve(file);\n    };\n    document.body.appendChild(input);\n    input.click();\n  });\n}\nfunction ridimensionaImmagine(file, maxLato, qualita){\n  maxLato = maxLato || 1280;\n  qualita = qualita || 0.72;\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onerror = () => reject(new Error('Impossibile leggere la foto.'));\n    reader.onload = () => {\n      const img = new Image();\n      img.onerror = () => reject(new Error('Impossibile elaborare la foto.'));\n      img.onload = () => {\n        let { width, height } = img;\n        if(width > maxLato || height > maxLato){\n          if(width >= height){ height = Math.round(height * (maxLato / width)); width = maxLato; }\n          else { width = Math.round(width * (maxLato / height)); height = maxLato; }\n        }\n        const canvas = document.createElement('canvas');\n        canvas.width = width;\n        canvas.height = height;\n        canvas.getContext('2d').drawImage(img, 0, 0, width, height);\n        const dataUrl = canvas.toDataURL('image/jpeg', qualita);\n        resolve(dataUrl.split(',')[1]);\n      };\n      img.src = reader.result;\n    };\n    reader.readAsDataURL(file);\n  });\n}\n\n/* ---- Indicatore di sincronizzazione (in alto) ---- */\nlet toastTimer = null;\nfunction mostraToast(testo){\n  const el = document.getElementById('toast-salvataggio');\n  if(!el) return;\n  el.textContent = testo;\n  el.style.opacity = '1';\n  el.style.transform = 'translateX(-50%) translateY(0)';\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => {\n    el.style.opacity = '0';\n    el.style.transform = 'translateX(-50%) translateY(80px)';\n  }, 1400);\n}\nfunction mostraToastSalvato(){ mostraToast('Salvato \u2713'); }\nlet caricamentiFotoInCorso = 0;\nfunction aggiornaIndicatoreCaricamentoFoto(){\n  const el = document.getElementById('indicatore-foto');\n  if(!el) return;\n  if(caricamentiFotoInCorso > 0){\n    el.textContent = `\ud83d\udce4 Caricamento foto: ${caricamentiFotoInCorso} in corso\u2026`;\n    el.style.display = 'block';\n  } else {\n    el.style.display = 'none';\n  }\n}\nfunction copiaTesto(testo){\n  function fallbackPrompt(){ window.prompt('Copia il testo qui sotto:', testo); }\n  function fallbackExec(){\n    try{\n      const ta = document.createElement('textarea');\n      ta.value = testo;\n      ta.style.position = 'fixed';\n      ta.style.opacity = '0';\n      document.body.appendChild(ta);\n      ta.focus();\n      ta.select();\n      const ok = document.execCommand('copy');\n      document.body.removeChild(ta);\n      if(ok) mostraToast('Copiato \u2713'); else fallbackPrompt();\n    }catch(e){\n      fallbackPrompt();\n    }\n  }\n  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){\n    navigator.clipboard.writeText(testo).then(() => mostraToast('Copiato \u2713')).catch(fallbackExec);\n  } else {\n    fallbackExec();\n  }\n}\nfunction impostaStatoSync(stato, dettaglio){\n  const el = document.getElementById('stato-sync');\n  if(!el) return;\n  const mappa = {\n    ok: {testo:'\u25cf Sincronizzato', classe:'badge-green'},\n    salvataggio: {testo:'\u25cf Salvataggio\u2026', classe:'badge-orange'},\n    errore: {testo:'\u25cf Errore di sincronizzazione', classe:'badge-red'},\n  };\n  const m = mappa[stato] || mappa.ok;\n  el.className = 'badge ' + m.classe;\n  el.textContent = m.testo;\n  el.title = dettaglio || '';\n}\n\nfunction caricaListaCantieri(){\n  return kvGet(LS_KEY_LISTA).then(v => v || []);\n}\nfunction salvaListaCantieri(lista){\n  return kvSet(LS_KEY_LISTA, lista);\n}\nfunction caricaDatiCantiere(id){\n  return kvGet(dataKeyCantiere(id)).then(v => v || datiVuoti());\n}\n\n/* ---- Cache locale per avvio istantaneo (letta subito, poi confermata/aggiornata da Google Sheets in background) ---- */\nconst LS_KEY_CACHE_LISTA = LS_PREFIX + 'cache-lista-cantieri';\nfunction cacheKeyDatiCantiere(id){ return LS_PREFIX + 'cache-dati-' + id; }\nfunction caricaCacheListaLocale(){ return lsGet(LS_KEY_CACHE_LISTA, null); }\nfunction salvaCacheListaLocale(lista){ lsSet(LS_KEY_CACHE_LISTA, lista); }\nfunction caricaCacheDatiLocale(id){ return lsGet(cacheKeyDatiCantiere(id), null); }\nfunction salvaCacheDatiLocale(id, dati){ lsSet(cacheKeyDatiCantiere(id), dati); }\nfunction applicaDatiAStato(dati){\n  state.lavorazioni = dati.lavorazioni || [];\n  state.ordini = dati.ordini || [];\n  state.persone = dati.persone || [];\n  state.eventi = dati.eventi || [];\n  state.calendario = dati.calendario || [];\n  state.attivitaVarie = dati.attivitaVarie || [];\n  state.diario = dati.diario || [];\n  state.materialiDaOrdinare = dati.materialiDaOrdinare || [];\n  state.snapshotSettimanale = dati.snapshotSettimanale || null;\n  state.snapshotMensile = dati.snapshotMensile || null;\n  state.rischi = dati.rischi || [];\n  state.contrattiSal = dati.contrattiSal || [];\n  state.attivitaOre = dati.attivitaOre || [];\n}\nfunction raccogliDatiStato(){\n  return {\n    lavorazioni: state.lavorazioni,\n    ordini: state.ordini,\n    persone: state.persone,\n    eventi: state.eventi,\n    calendario: state.calendario,\n    attivitaVarie: state.attivitaVarie,\n    diario: state.diario,\n    materialiDaOrdinare: state.materialiDaOrdinare,\n    snapshotSettimanale: state.snapshotSettimanale,\n    snapshotMensile: state.snapshotMensile,\n    rischi: state.rischi,\n    contrattiSal: state.contrattiSal,\n    attivitaOre: state.attivitaOre,\n  };\n}\n\nlet riprovaPersistTimer = null;\nlet codaPersist = Promise.resolve();\nfunction persist(){\n  codaPersist = codaPersist.then(() => persistImpl()).catch(() => {});\n  return codaPersist;\n}\nasync function persistImpl(){\n  const dati = raccogliDatiStato();\n  impostaStatoSync('salvataggio');\n  try{\n    await kvSet(dataKeyCantiere(state.cantiereAttivoId), dati);\n    salvaCacheDatiLocale(state.cantiereAttivoId, dati);\n    const lista = await caricaListaCantieri();\n    const meta = lista.find(c => c.id === state.cantiereAttivoId);\n    if(meta) meta.ultimaModifica = new Date().toISOString();\n    await salvaListaCantieri(lista);\n    salvaCacheListaLocale(lista);\n    impostaStatoSync('ok');\n    mostraToastSalvato();\n  }catch(e){\n    console.error('Errore di sincronizzazione', e);\n    impostaStatoSync('errore', e.message + ' \u2014 verr\u00e0 ritentato tra poco.');\n    clearTimeout(riprovaPersistTimer);\n    riprovaPersistTimer = setTimeout(persist, 8000);\n  }\n}\n\n/* ============ GESTIONE MULTI-CANTIERE ============ */\nasync function creaCantiere(nome){\n  const lista = await caricaListaCantieri();\n  const id = uid();\n  lista.push({id, nome: nome || 'Nuovo cantiere', creato: new Date().toISOString(), ultimaModifica: new Date().toISOString()});\n  await salvaListaCantieri(lista);\n  await kvSet(dataKeyCantiere(id), datiVuoti());\n  return id;\n}\nasync function eliminaCantiere(id){\n  let lista = await caricaListaCantieri();\n  lista = lista.filter(c => c.id !== id);\n  await salvaListaCantieri(lista);\n  try{ await kvDelete(dataKeyCantiere(id)); }catch(e){}\n  return lista;\n}\nasync function rinominaCantiere(id, nuovoNome){\n  const lista = await caricaListaCantieri();\n  const meta = lista.find(c => c.id === id);\n  if(meta) meta.nome = nuovoNome;\n  await salvaListaCantieri(lista);\n}\nasync function passaACantiere(id){\n  state.cantiereAttivoId = id;\n  lsSet(LS_KEY_ATTIVO, id);\n  state.section = 'dashboard';\n  state.selectedDay = null;\n\n  const datiCache = caricaCacheDatiLocale(id);\n  const listaCache = caricaCacheListaLocale();\n  let dipintoDaCache = false;\n  if(datiCache){\n    applicaDatiAStato(datiCache);\n    if(listaCache){\n      const meta = listaCache.find(c => c.id === id);\n      state.nomeCantiereAttivo = meta ? meta.nome : 'Cantiere';\n      document.getElementById('stamp-nome-cantiere').textContent = state.nomeCantiereAttivo;\n    }\n    renderAll();\n    dipintoDaCache = true;\n  } else {\n    mostraCaricamento(true);\n  }\n\n  try{\n    const dati = await caricaDatiCantiere(id);\n    applicaDatiAStato(dati);\n    salvaCacheDatiLocale(id, dati);\n    await renderStamp();\n    renderAll();\n    impostaStatoSync('ok');\n  }catch(e){\n    if(!dipintoDaCache){\n      alert('Errore nel caricare il cantiere: ' + e.message);\n    }\n    impostaStatoSync('errore', e.message);\n  }\n  mostraCaricamento(false);\n}\nasync function renderStamp(){\n  try{\n    const lista = await caricaListaCantieri();\n    salvaCacheListaLocale(lista);\n    const meta = lista.find(c => c.id === state.cantiereAttivoId);\n    state.nomeCantiereAttivo = meta ? meta.nome : 'Cantiere';\n    document.getElementById('stamp-nome-cantiere').textContent = state.nomeCantiereAttivo;\n  }catch(e){\n    if(!state.nomeCantiereAttivo) document.getElementById('stamp-nome-cantiere').textContent = '\u26a0 errore di connessione';\n  }\n}\nfunction mostraCaricamento(mostra){\n  const el = document.getElementById('overlay-caricamento');\n  if(el) el.style.display = mostra ? 'flex' : 'none';\n}\n\n/* ============ MODALE GESTIONE CANTIERI ============ */\nasync function apriGestioneCantieri(){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '';\n  modal.innerHTML = `<div style=\"text-align:center;padding:30px;color:var(--muted);\">Caricamento cantieri\u2026<\/div>`;\n  overlay.classList.add('open');\n  await disegnaModaleCantieri();\n  async function disegnaModaleCantieri(){\n    let lista;\n    try{\n      lista = (await caricaListaCantieri()).sort((a,b) => (b.ultimaModifica||'').localeCompare(a.ultimaModifica||''));\n    }catch(e){\n      modal.innerHTML = `<div style=\"text-align:center;padding:30px;color:var(--red);\">Impossibile contattare Google Sheets.<br><span style=\"font-size:12px;color:var(--muted);\">${esc(e.message)}<\/span><\/div>\n        <div class=\"modal-actions\"><button type=\"button\" class=\"btn ghost\" id=\"chiudi-errore-cantieri\">Chiudi<\/button><button type=\"button\" class=\"btn\" id=\"apri-impostazioni-da-errore\">Impostazioni connessione<\/button><\/div>`;\n      document.getElementById('chiudi-errore-cantieri').onclick = closeModal;\n      document.getElementById('apri-impostazioni-da-errore').onclick = () => apriImpostazioniConnessione();\n      return;\n    }\n    modal.innerHTML = `\n      <h3>Cantieri<\/h3>\n      <p style=\"font-size:12px;color:var(--muted);margin:-8px 0 14px;\">Ogni cantiere mantiene dati e storico separati, sincronizzati su Google Sheets. Nulla viene mai cancellato automaticamente.<\/p>\n      <div id=\"lista-cantieri-modal\">\n        ${lista.map(c => `\n          <div class=\"day-entry\" style=\"align-items:center;\">\n            <div>\n              <div style=\"font-family:'Oswald',sans-serif;${c.id===state.cantiereAttivoId?'color:var(--orange);':''}\">${esc(c.nome)} ${c.id===state.cantiereAttivoId?'<span class=\"badge badge-orange\">attivo<\/span>':''}<\/div>\n              <div style=\"font-size:11px;color:var(--muted);\">creato il ${fmtDate((c.creato||'').slice(0,10))}<\/div>\n            <\/div>\n            <div class=\"row-actions\">\n              ${c.id!==state.cantiereAttivoId?`<button class=\"icon-btn\" data-apri=\"${c.id}\">Apri<\/button>`:''}\n              <button class=\"icon-btn\" data-elimina=\"${c.id}\">Elimina<\/button>\n            <\/div>\n          <\/div>\n        `).join('') || '<div style=\"color:var(--muted);font-size:13px;\">Nessun cantiere presente.<\/div>'}\n      <\/div>\n\n      <div class=\"subsection-title\" style=\"margin:20px 0 10px;\">Backup di sicurezza<\/div>\n      <p style=\"font-size:12px;color:var(--muted);margin:-4px 0 12px;\">Scarica un file con tutti i cantieri e tutti i dati, oltre a quanto gi\u00e0 sincronizzato su Google Sheets. Salvalo in una cartella Drive per una copia in pi\u00f9.<\/p>\n      <div class=\"modal-actions\" style=\"justify-content:flex-start;gap:10px;flex-wrap:wrap;\">\n        <button type=\"button\" class=\"btn ghost\" id=\"esporta-backup-btn\">\u2b07 Esporta backup<\/button>\n        <button type=\"button\" class=\"btn ghost\" id=\"importa-backup-btn\">\u2b06 Importa backup<\/button>\n        <button type=\"button\" class=\"btn ghost\" id=\"impostazioni-connessione-btn\">\u2699 Connessione Google Sheets<\/button>\n        <input type=\"file\" id=\"importa-backup-file\" accept=\"application/json\" style=\"display:none;\">\n      <\/div>\n\n      <div class=\"modal-actions\" style=\"justify-content:space-between;margin-top:18px;\">\n        <button type=\"button\" class=\"btn ghost\" id=\"chiudi-gestione-cantieri\">Chiudi<\/button>\n        <button type=\"button\" class=\"btn\" id=\"nuovo-cantiere-btn\">+ Nuovo cantiere<\/button>\n      <\/div>\n    `;\n    document.getElementById('esporta-backup-btn').onclick = esportaBackupCompleto;\n    document.getElementById('impostazioni-connessione-btn').onclick = () => apriImpostazioniConnessione();\n    document.getElementById('importa-backup-btn').onclick = () => document.getElementById('importa-backup-file').click();\n    document.getElementById('importa-backup-file').onchange = (e) => {\n      const file = e.target.files[0];\n      if(file) importaBackupDaFile(file, disegnaModaleCantieri);\n      e.target.value = '';\n    };\n    document.getElementById('chiudi-gestione-cantieri').onclick = closeModal;\n    document.getElementById('nuovo-cantiere-btn').onclick = async () => {\n      const nome = prompt('Nome del nuovo cantiere:', 'Cantiere ' + (lista.length+1));\n      if(nome === null) return;\n      mostraCaricamento(true);\n      try{\n        const id = await creaCantiere(nome.trim() || 'Nuovo cantiere');\n        await passaACantiere(id);\n        await disegnaModaleCantieri();\n      }catch(e){ alert('Errore nella creazione del cantiere: ' + e.message); }\n      mostraCaricamento(false);\n    };\n    modal.querySelectorAll('[data-apri]').forEach(b => {\n      b.onclick = async () => { await passaACantiere(b.dataset.apri); closeModal(); };\n    });\n    modal.querySelectorAll('[data-elimina]').forEach(b => {\n      b.onclick = async () => {\n        const id = b.dataset.elimina;\n        const target = lista.find(c => c.id === id);\n        const conferma = confirm(`Eliminare definitivamente \"${target ? target.nome : ''}\" e tutti i suoi dati? L'operazione non \u00e8 reversibile.`);\n        if(!conferma) return;\n        mostraCaricamento(true);\n        try{\n          const nuovaLista = await eliminaCantiere(id);\n          if(id === state.cantiereAttivoId){\n            if(nuovaLista.length > 0){\n              await passaACantiere(nuovaLista[0].id);\n            } else {\n              const nuovoId = await creaCantiere('Cantiere Principale');\n              await passaACantiere(nuovoId);\n            }\n          }\n          await disegnaModaleCantieri();\n        }catch(e){ alert('Errore nell\\'eliminazione: ' + e.message); }\n        mostraCaricamento(false);\n      };\n    });\n  }\n}\nasync function esportaBackupCompleto(){\n  mostraCaricamento(true);\n  try{\n    const lista = await caricaListaCantieri();\n    const dati = {};\n    for(const c of lista){ dati[c.id] = await caricaDatiCantiere(c.id); }\n    const pacchetto = {\n      app: 'gestione-cantiere',\n      versione: 1,\n      esportatoIl: new Date().toISOString(),\n      cantieri: lista,\n      dati: dati,\n    };\n    const blob = new Blob([JSON.stringify(pacchetto, null, 2)], {type:'application/json'});\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    const oggi = todayISO();\n    a.href = url;\n    a.download = `backup-gestione-cantiere-${oggi}.json`;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  }catch(e){\n    alert('Errore durante l\\'esportazione: ' + e.message);\n  }\n  mostraCaricamento(false);\n}\nfunction importaBackupDaFile(file, onDone){\n  const reader = new FileReader();\n  reader.onload = async () => {\n    let pacchetto;\n    try{\n      pacchetto = JSON.parse(reader.result);\n    }catch(e){\n      alert('Il file selezionato non \u00e8 un backup valido (JSON non leggibile).');\n      return;\n    }\n    if(!pacchetto || !Array.isArray(pacchetto.cantieri) || typeof pacchetto.dati !== 'object'){\n      alert('Il file selezionato non ha il formato di backup atteso.');\n      return;\n    }\n    const conferma = confirm(`Questo backup contiene ${pacchetto.cantieri.length} cantiere/i (esportato il ${fmtDate((pacchetto.esportatoIl||'').slice(0,10))}). Verranno sostituiti tutti i cantieri e i dati attualmente presenti su Google Sheets. Continuare?`);\n    if(!conferma) return;\n    mostraCaricamento(true);\n    try{\n      await salvaListaCantieri(pacchetto.cantieri);\n      for(const id of Object.keys(pacchetto.dati)){\n        await kvSet(dataKeyCantiere(id), pacchetto.dati[id]);\n      }\n      const primoId = pacchetto.cantieri[0] ? pacchetto.cantieri[0].id : null;\n      if(primoId){\n        await passaACantiere(primoId);\n      }\n      if(onDone) await onDone();\n      alert('Backup importato correttamente.');\n    }catch(e){\n      alert('Errore durante l\\'importazione: ' + e.message);\n    }\n    mostraCaricamento(false);\n  };\n  reader.onerror = () => alert('Impossibile leggere il file selezionato.');\n  reader.readAsText(file);\n}\nasync function apriRinominaCantiere(){\n  let lista, meta;\n  try{\n    lista = await caricaListaCantieri();\n    meta = lista.find(c => c.id === state.cantiereAttivoId);\n  }catch(e){\n    alert('Impossibile contattare Google Sheets: ' + e.message);\n    return;\n  }\n  openModal({\n    title: 'Rinomina cantiere',\n    values: {nome: meta ? meta.nome : ''},\n    fields: [{name:'nome', label:'Titolo cantiere', type:'text', required:true}],\n    submitLabel: 'Rinomina',\n    onSubmit: async (data) => {\n      mostraCaricamento(true);\n      try{\n        await rinominaCantiere(state.cantiereAttivoId, data.nome.trim() || meta.nome);\n        await renderStamp();\n      }catch(e){ alert('Errore nel salvataggio: ' + e.message); }\n      mostraCaricamento(false);\n    }\n  });\n}\n\n/* ============ HELPERS ============ */\nfunction uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }\nfunction toLocalISODate(d){\n  const y = d.getFullYear();\n  const m = String(d.getMonth()+1).padStart(2,'0');\n  const g = String(d.getDate()).padStart(2,'0');\n  return `${y}-${m}-${g}`;\n}\nfunction todayISO(){ return toLocalISODate(new Date()); }\nfunction fmtDate(iso){\n  if(!iso) return '\u2014';\n  const [y,m,d] = iso.split('-');\n  return `${d}/${m}/${y}`;\n}\nfunction fmtDataBreve(iso){\n  if(!iso) return '\u2014';\n  const [y,m,d] = iso.split('-');\n  return `${d}/${m}/${y.slice(2)}`;\n}\nfunction fmtEuro(n){\n  const v = Number(n)||0;\n  return v.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});\n}\nfunction clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }\nfunction esc(s){ if(s === undefined || s === null) return ''; return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction truncate(s, n){ if(!s) return ''; return s.length>n ? s.slice(0,n-1)+'\u2026' : s; }\nfunction tipoColor(tipo){\n  const map = {\n    ordine: 'var(--blue)',\n    lavorazione: 'var(--orange)',\n    positivo: 'var(--green)',\n    negativo: 'var(--red)',\n    neutro: 'var(--muted)',\n    nota: '#7C8891',\n    appuntamento: 'var(--purple)',\n  };\n  return map[tipo] || 'var(--muted)';\n}\n\n/* ============ MODAL SYSTEM ============ */\nfunction openModal({title, fields, values={}, onSubmit, submitLabel='Salva', pulsanteExtra}){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '';\n  modal.innerHTML = `\n    <h3>${esc(title)}<\/h3>\n    <form id=\"modal-form\">\n      ${fields.map(f => renderField(f, values[f.name])).join('')}\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn ghost\" id=\"modal-cancel\">Annulla<\/button>\n        ${pulsanteExtra ? `<button type=\"button\" class=\"btn ghost\" id=\"modal-extra\">${esc(pulsanteExtra.label)}<\/button>` : ''}\n        <button type=\"submit\" class=\"btn\">${esc(submitLabel)}<\/button>\n      <\/div>\n    <\/form>\n  `;\n  overlay.classList.add('open');\n  document.getElementById('modal-cancel').onclick = closeModal;\n  fields.forEach(f => {\n    if(f.type === 'dots'){\n      const wrapper = document.getElementById('f-'+f.name+'-wrapper');\n      const hidden = document.getElementById('f-'+f.name);\n      if(wrapper){\n        wrapper.querySelectorAll('.dot-picker-btn').forEach(btn => {\n          btn.onclick = () => {\n            const nuovo = (hidden.value === btn.dataset.dotValue) ? '' : btn.dataset.dotValue;\n            hidden.value = nuovo;\n            wrapper.querySelectorAll('.dot-picker-btn').forEach(b => { b.style.opacity = (b.dataset.dotValue === nuovo) ? '1' : '0.3'; b.style.transform = (b.dataset.dotValue === nuovo) ? 'scale(1.15)' : 'scale(1)'; });\n          };\n        });\n      }\n    }\n  });\n  function raccogliDati(){\n    const data = {};\n    fields.forEach(f => {\n      const el = document.getElementById('f-'+f.name);\n      if(f.type === 'checkbox'){ data[f.name] = el.checked; }\n      else if(f.type === 'number' || f.type === 'dots'){ data[f.name] = el.value === '' ? null : Number(el.value); }\n      else { data[f.name] = el.value; }\n    });\n    return data;\n  }\n  document.getElementById('modal-form').onsubmit = (e) => {\n    e.preventDefault();\n    const data = raccogliDati();\n    closeModal();\n    onSubmit(data);\n  };\n  if(pulsanteExtra){\n    document.getElementById('modal-extra').onclick = () => {\n      const form = document.getElementById('modal-form');\n      if(!form.reportValidity()) return;\n      const data = raccogliDati();\n      pulsanteExtra.onClick(data);\n    };\n  }\n}\nconst COLORI_MOTIVAZIONE = {1:'#C4423C', 2:'#E8720C', 3:'#F2B705', 4:'#6FB1D9', 5:'#1C86C7'};\nfunction renderField(f, val){\n  const v = val === undefined || val === null ? (f.default !== undefined ? f.default : '') : val;\n  if(f.type === 'select'){\n    return `<div class=\"field\"><label>${esc(f.label)}<\/label>\n      <select id=\"f-${f.name}\">\n        ${f.options.map(o => `<option value=\"${esc(o.value)}\" ${o.value===v?'selected':''}>${esc(o.label)}<\/option>`).join('')}\n      <\/select><\/div>`;\n  }\n  if(f.type === 'textarea'){\n    return `<div class=\"field\"><label>${esc(f.label)}<\/label><textarea id=\"f-${f.name}\" ${f.required?'required':''}>${esc(v)}<\/textarea><\/div>`;\n  }\n  if(f.type === 'checkbox'){\n    return `<div class=\"field field-check\"><input type=\"checkbox\" id=\"f-${f.name}\" ${v?'checked':''}><label style=\"margin:0;\">${esc(f.label)}<\/label><\/div>`;\n  }\n  if(f.type === 'dots'){\n    return `<div class=\"field\">\n      <label>${esc(f.label)}<\/label>\n      <div id=\"f-${f.name}-wrapper\" style=\"display:flex;gap:10px;align-items:center;margin-top:4px;\">\n        ${[1,2,3,4,5].map(n => `<button type=\"button\" class=\"dot-picker-btn\" data-dot-value=\"${n}\" title=\"${n}\" style=\"width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:${COLORI_MOTIVAZIONE[n]};opacity:${v==n?'1':'0.3'};transform:scale(${v==n?'1.15':'1'});transition:transform .1s ease, opacity .1s ease;\"><\/button>`).join('')}\n      <\/div>\n      <input type=\"hidden\" id=\"f-${f.name}\" value=\"${v||''}\">\n    <\/div>`;\n  }\n  return `<div class=\"field\"><label>${esc(f.label)}<\/label><input type=\"${f.type}\" id=\"f-${f.name}\" value=\"${esc(v)}\" ${f.required?'required':''} ${f.step?`step=\"${f.step}\"`:''}><\/div>`;\n}\nfunction closeModal(){ document.getElementById('overlay').classList.remove('open'); }\ndocument.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });\n\n/* ============ NAV ============ */\nfunction renderNav(){\n  const nav = document.getElementById('nav');\n  nav.innerHTML = SECTIONS.map(s => `\n    <button class=\"nav-tab ${state.section===s.id?'active':''}\" data-section=\"${s.id}\">\n      <span class=\"code\">${s.code}<\/span>${esc(s.label)}\n    <\/button>\n  `).join('');\n  nav.querySelectorAll('.nav-tab').forEach(btn => {\n    btn.onclick = () => { state.section = btn.dataset.section; renderAll(); };\n  });\n}\n\n/* ============ DASHBOARD ============ */\nfunction renderDashboard(){\n  const l = state.lavorazioni, o = state.ordini, p = state.persone, ev = state.eventi;\n  const inCorso = l.filter(x => x.statoAvanzamento > 0 && x.statoAvanzamento < 100).length;\n  const completate = l.filter(x => x.statoAvanzamento >= 100).length;\n  const inRitardo = l.filter(x => x.statoAvanzamento < x.previsioneAvanzamento - 5).length;\n  const budgetTot = l.reduce((s,x) => s + (Number(x.costoPrevisto)||0), 0);\n  const consuntivoTot = l.reduce((s,x) => s + (Number(x.costoEuro)||0), 0);\n\n  const today = todayISO();\n  const ordAttesa = o.filter(x => x.statoParziale !== 'completo').length;\n  const ordRitardo = o.filter(x => x.dataPrevista && x.dataPrevista < today && x.statoParziale !== 'completo').length;\n  const ordParziali = o.filter(x => x.statoParziale === 'parziale').length;\n\n  const oreSettimana = p.reduce((s,pers) => {\n    const start = startOfWeek(new Date());\n    const sum = (pers.log||[]).filter(l2 => new Date(l2.data) >= start).reduce((a,l2)=>a+Number(l2.ore||0),0);\n    return s + sum;\n  }, 0);\n\n  const now = new Date();\n  const last30 = toLocalISODate(new Date(now.getTime() - 30*86400000));\n  const evPos = ev.filter(x => x.tipo==='positivo' && x.data >= last30).length;\n  const evNeg = ev.filter(x => x.tipo==='negativo' && x.data >= last30).length;\n\n  const tra7giorni = toLocalISODate(new Date(now.getTime() + 7*86400000));\n  const avviiInRitardo = l.filter(x => !x.dataCompletamento && x.dataInizio && x.dataInizio < today && (!x.statoAvanzamento || x.statoAvanzamento === 0));\n  const avviiEntro7 = l.filter(x => !x.dataCompletamento && x.dataInizio && x.dataInizio >= today && x.dataInizio <= tra7giorni);\n  const avvisiAvvio = [...avviiInRitardo, ...avviiEntro7].sort((a,b) => (a.dataInizio||'').localeCompare(b.dataInizio||''));\n\n  const rischiAttivi = state.rischi.filter(r => r.stato !== 'accaduto' && r.stato !== 'chiuso');\n  const rischiAlti = rischiAttivi.filter(r => calcolaRischio(r).livello === 'Alto');\n\n  const totaleContrattiSal = state.contrattiSal.reduce((s,c) => s + prezzoPattuitoEffettivo(c), 0);\n  const totaleAutorizzatoSal = state.contrattiSal.reduce((s,c) => s + autorizzatoAttualeContratto(c), 0);\n  const totaleResiduoSal = totaleContrattiSal - totaleAutorizzatoSal;\n\n  const oreNonProduttiveTotali = state.attivitaOre.reduce((s,a) => s + Number(a.costoOre||0), 0);\n  const orePrevisteLavorazioniTotali = l.reduce((s,x) => s + Number(x.orePreviste||0), 0);\n  const percentualeOreNonProduttive = orePrevisteLavorazioniTotali > 0 ? Math.round((oreNonProduttiveTotali / orePrevisteLavorazioniTotali) * 100) : null;\n\n  const costiPerCategoria = (() => {\n    const gruppi = {};\n    l.forEach(x => {\n      const chiave = (x.categoria||'').trim() || 'Senza categoria';\n      if(!gruppi[chiave]) gruppi[chiave] = {nome: chiave, numero: 0, preventivo: 0, reale: 0};\n      gruppi[chiave].numero += 1;\n      gruppi[chiave].preventivo += Number(x.costoPrevisto||0);\n      gruppi[chiave].reale += Number(x.costoEuro||0);\n    });\n    return Object.values(gruppi).sort((a,b) => b.reale - a.reale);\n  })();\n\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Quadro generale<\/h2><p class=\"section-sub\" style=\"margin-bottom:0;\">Riepilogo sintetico dello stato del cantiere \u2014 seleziona una scheda per aprire la sezione dedicata.<\/p><\/div>\n      <button class=\"btn ghost\" id=\"genera-report-btn\">\ud83d\udcc4 Report settimanale<\/button>\n      <button class=\"btn ghost\" id=\"genera-report-mensile-btn\">\ud83d\udcc4 Report mensile<\/button>\n    <\/div>\n\n    <div class=\"grid-cards\">\n      <div class=\"card ${inRitardo>0?'status-warn':'status-ok'}\" data-goto=\"lavorazioni\">\n        <div class=\"card-eyebrow\">02 \u00b7 LAVORAZIONI<\/div>\n        <div class=\"card-num\">${l.length}<\/div>\n        <div class=\"card-label\">${inCorso} in corso \u00b7 ${completate} completate<\/div>\n        ${inRitardo>0 ? `<span class=\"card-flag flag-red\">\u26a0 ${inRitardo} in ritardo<\/span>` : `<span class=\"card-flag flag-green\">\u2713 avanzamento in linea<\/span>`}\n      <\/div>\n      <div class=\"card ${consuntivoTot > budgetTot?'status-warn':'status-ok'}\" data-goto=\"lavorazioni\">\n        <div class=\"card-eyebrow\">02 \u00b7 COSTI LAVORAZIONI<\/div>\n        <div class=\"card-num mono\" style=\"font-size:28px;\">${fmtEuro(consuntivoTot)}<\/div>\n        <div class=\"card-label\">su budget previsto ${fmtEuro(budgetTot)}<\/div>\n        ${consuntivoTot > budgetTot ? `<span class=\"card-flag flag-red\">\u26a0 sopra budget<\/span>` : `<span class=\"card-flag flag-green\">\u2713 entro budget<\/span>`}\n      <\/div>\n      <div class=\"card ${ordRitardo>0?'status-warn':'status-ok'}\" data-goto=\"ordini\">\n        <div class=\"card-eyebrow\">03 \u00b7 ORDINI<\/div>\n        <div class=\"card-num\">${o.length}<\/div>\n        <div class=\"card-label\">${ordAttesa} non completati \u00b7 ${ordParziali} parziali<\/div>\n        ${ordRitardo>0 ? `<span class=\"card-flag flag-red\">\u26a0 ${ordRitardo} in ritardo<\/span>` : `<span class=\"card-flag flag-green\">\u2713 nessun ritardo<\/span>`}\n      <\/div>\n      <div class=\"card status-info\" data-goto=\"persone\">\n        <div class=\"card-eyebrow\">04 \u00b7 PERSONE<\/div>\n        <div class=\"card-num\">${p.length}<\/div>\n        <div class=\"card-label\">${oreSettimana.toFixed(1)} ore registrate questa settimana<\/div>\n        <span class=\"card-flag flag-blue\">manodopera<\/span>\n      <\/div>\n      <div class=\"card ${evNeg > evPos?'status-warn':'status-ok'}\" data-goto=\"eventi\">\n        <div class=\"card-eyebrow\">05 \u00b7 EVENTI (ULTIMI 30 GG)<\/div>\n        <div class=\"card-num\">${ev.length}<\/div>\n        <div class=\"card-label\">${evPos} positivi \u00b7 ${evNeg} negativi<\/div>\n        ${evNeg > evPos ? `<span class=\"card-flag flag-red\">\u26a0 attenzione<\/span>` : `<span class=\"card-flag flag-green\">\u2713 clima positivo<\/span>`}\n      <\/div>\n      <div class=\"card status-info\" data-goto=\"calendario\">\n        <div class=\"card-eyebrow\">01 \u00b7 CALENDARIO<\/div>\n        <div class=\"card-num\">${countUpcoming()}<\/div>\n        <div class=\"card-label\">eventi nei prossimi 7 giorni<\/div>\n        <span class=\"card-flag flag-orange\">\u2192 vai al calendario<\/span>\n      <\/div>\n      <div class=\"card ${rischiAlti.length>0?'status-warn':'status-ok'}\" data-goto=\"rischi\">\n        <div class=\"card-eyebrow\">07 \u00b7 RISCHI<\/div>\n        <div class=\"card-num\">${rischiAttivi.length}<\/div>\n        <div class=\"card-label\">rischi attivi monitorati<\/div>\n        ${rischiAlti.length>0 ? `<span class=\"card-flag flag-red\">\u26a0 ${rischiAlti.length} ad alto rischio<\/span>` : `<span class=\"card-flag flag-green\">\u2713 nessun rischio alto<\/span>`}\n      <\/div>\n      <div class=\"card status-info\" data-goto=\"sal\">\n        <div class=\"card-eyebrow\">08 \u00b7 SAL FORNITORI<\/div>\n        <div class=\"card-num mono\" style=\"font-size:22px;\">${fmtEuro(totaleResiduoSal)}<\/div>\n        <div class=\"card-label\">residuo da autorizzare su ${fmtEuro(totaleContrattiSal)} totali<\/div>\n        <span class=\"card-flag flag-blue\">${state.contrattiSal.length} contratti<\/span>\n      <\/div>\n      <div class=\"card status-info\" data-goto=\"lavorazioni\">\n        <div class=\"card-eyebrow\">ORE NON PRODUTTIVE<\/div>\n        <div class=\"card-num\">${oreNonProduttiveTotali}h<\/div>\n        <div class=\"card-label\">${percentualeOreNonProduttive!==null ? `${percentualeOreNonProduttive}% delle ${orePrevisteLavorazioniTotali}h previste lavorazioni` : 'pulizie, trasporti,
