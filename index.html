<!DOCTYPE html>
<html lang="it"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Cantiere</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16232E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cantiere">

<style>
/* Font locali per funzionamento 100% offline (vedi istruzioni per scaricare i file in fonts/).
   Se i file non sono presenti, il browser usa automaticamente i font di sistema di fallback
   già indicati in ogni font-family qui sotto: nessun errore, nessuna interruzione. */
@font-face{font-family:'Oswald';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/oswald-400.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/oswald-500.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/oswald-600.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/oswald-700.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/inter-400.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/inter-500.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/inter-600.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ibmplexmono-400.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/ibmplexmono-500.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/ibmplexmono-600.woff2') format('woff2');}

:root{
  --paper:#EDF1F2;
  --paper-line: rgba(44,110,158,0.08);
  --ink:#16232E;
  --muted:#5B6B75;
  --line:#B7C4CC;
  --surface:#FFFFFF;
  --orange:#E8720C;
  --orange-dim:#F6DCC3;
  --yellow:#F2B705;
  --green:#2F8F5B;
  --green-dim:#DCEFE4;
  --red:#C4423C;
  --red-dim:#F6DCDA;
  --blue:#2C6E9E;
  --blue-dim:#D9E6EF;
  --purple:#6E5AA8;
  --purple-dim:#E4DEF2;
  --radius:2px;
}
*{box-sizing:border-box;}
html{overscroll-behavior-y: contain;}
body{
  margin:0;
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 32px),
    repeating-linear-gradient(90deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 32px);
  font-family:'Inter', sans-serif;
  color:var(--ink);
  min-height:100vh;
  overscroll-behavior-y: contain;
}
h1,h2,h3,.display{font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.03em;}
.mono{font-family:'IBM Plex Mono', monospace;}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}

/* --- Title block (cartiglio) --- */
.stamp{
  background:var(--surface);
  border:1.5px solid var(--ink);
  display:flex;
  flex-wrap:wrap;
}
.stamp-cell{
  padding:10px 16px;
  border-right:1px solid var(--line);
  flex:1;
  min-width:140px;
}
.stamp-cell:last-child{border-right:none;}
.stamp-label{font-size:10px;letter-spacing:0.12em;color:var(--muted);font-family:'IBM Plex Mono',monospace;display:block;margin-bottom:3px;}
.stamp-value{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;letter-spacing:0.02em;}
.stamp-value.small{font-size:14px;font-family:'IBM Plex Mono',monospace;font-weight:500;text-transform:none;letter-spacing:0;}

/* --- Nav as title-block tabs --- */
.nav{
  display:flex;
  border:1.5px solid var(--ink);
  border-top:none;
  background:var(--surface);
  overflow-x:auto;
}
.nav-tab{
  flex:1;
  min-width:130px;
  text-align:left;
  padding:14px 18px;
  border-right:1px solid var(--line);
  background:transparent;
  cursor:pointer;
  font-family:'Oswald',sans-serif;
  letter-spacing:0.04em;
  color:var(--muted);
  font-size:14px;
  position:relative;
  transition:background .15s ease, color .15s ease;
}
.nav-tab:last-child{border-right:none;}
.nav-tab .code{font-family:'IBM Plex Mono',monospace;font-size:10px;display:block;color:var(--muted);margin-bottom:2px;}
.nav-tab:hover{background:var(--orange-dim);color:var(--ink);}
.nav-tab.active{color:var(--ink);background:var(--surface);}
.nav-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--orange);}

.panel{
  border:1.5px solid var(--ink);
  border-top:none;
  background:var(--surface);
  padding:18px 18px;
  min-height:300px;
}
.section-title{font-size:22px;margin:0 0 4px;}
.section-sub{color:var(--muted);font-size:13px;line-height:1.4;margin:0 0 14px;}

/* --- Dashboard cards --- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px;}
.card{
  border:1px solid var(--line);
  border-left:4px solid var(--line);
  padding:11px 14px;
  cursor:pointer;
  transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  background:var(--surface);
}
.card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 4px 14px rgba(22,35,46,0.08);}
.card.status-ok{border-left-color:var(--green);}
.card.status-warn{border-left-color:var(--red);}
.card.status-info{border-left-color:var(--blue);}
.card-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.09em;margin-bottom:4px;}
.card-num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;line-height:1;}
.card-label{font-size:12px;color:var(--muted);margin-top:3px;}
.card-flag{display:inline-block;margin-top:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;}
.flag-red{background:var(--red-dim);color:var(--red);}
.flag-green{background:var(--green-dim);color:var(--green);}
.flag-orange{background:var(--orange-dim);color:var(--orange);}
.flag-blue{background:var(--blue-dim);color:var(--blue);}

.subsection-title{font-size:13px;font-family:'Oswald',sans-serif;letter-spacing:0.05em;margin:16px 0 8px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;}

/* --- Buttons --- */
.btn{
  font-family:'Oswald',sans-serif;
  letter-spacing:0.03em;
  font-size:14px;
  padding:11px 20px;
  border:1.5px solid var(--ink);
  background:var(--ink);
  color:var(--surface);
  cursor:pointer;
  transition:background .15s ease;
}
.btn:hover{background:var(--orange);border-color:var(--orange);}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.ghost:hover{background:var(--orange-dim);border-color:var(--orange);color:var(--ink);}
.btn.small{padding:7px 12px;font-size:12px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}

/* --- Tables --- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px;}
.tabella-compatta{width:auto !important;min-width:0 !important;}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.05em;color:var(--muted);border-bottom:1.5px solid var(--ink);padding:10px 12px;text-transform:uppercase;white-space:nowrap;}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:nth-child(even) td{background:rgba(44,110,158,0.025);}
tr:hover td{background:rgba(232,114,12,0.06);}
.empty-row td{color:var(--muted);text-align:center;padding:30px;font-style:italic;}

/* --- Progress bar --- */
.bar-track{background:var(--paper);border:1px solid var(--line);height:10px;width:100%;position:relative;}
.bar-fill{background:var(--orange);height:100%;}
.bar-marker{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);}

.badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;font-family:'IBM Plex Mono',monospace;border-radius:var(--radius);white-space:nowrap;}
.badge-green{background:var(--green-dim);color:var(--green);}
.badge-red{background:var(--red-dim);color:var(--red);}
.badge-orange{background:var(--orange-dim);color:var(--orange);}
.badge-blue{background:var(--blue-dim);color:var(--blue);}
.badge-gray{background:#E7EAEC;color:var(--muted);}
.badge-purple{background:var(--purple-dim);color:var(--purple);}

.row-actions{display:flex;gap:6px;}
.icon-btn{background:none;border:1px solid var(--line);cursor:pointer;padding:9px 12px;font-size:12px;color:var(--muted);min-height:38px;}
.valore-cliccabile{cursor:pointer;border-bottom:1px dotted var(--muted);display:inline-block;padding:5px 2px;}
.valore-cliccabile:hover{border-bottom-color:var(--orange);color:var(--orange);}
.valore-vuoto{cursor:pointer;color:var(--muted);font-style:italic;font-size:11px;border-bottom:1px dotted var(--line);padding:5px 2px;display:inline-block;}
.valore-vuoto:hover{border-bottom-color:var(--orange);color:var(--orange);}
.riga-cliccabile{cursor:pointer;}
.riga-cliccabile:hover td{background:rgba(232,114,12,0.07);}
.stepper{display:inline-flex;align-items:center;gap:4px;}
.stepper button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px;line-height:1;padding:0;color:var(--ink);}
.stepper button:hover{border-color:var(--orange);color:var(--orange);}
.icon-btn:hover{border-color:var(--orange);color:var(--orange);}

/* --- Calendar --- */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-month{font-family:'Oswald',sans-serif;font-size:20px;}
.cal-grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-width:650px;border-left:1px solid var(--line);border-top:1px solid var(--line);}
.cal-dow{font-family:'IBM Plex Mono',monospace;font-size:10px;text-align:center;padding:6px;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);}
.cal-day{min-height:128px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;cursor:pointer;position:relative;transition:background .1s ease;overflow:hidden;}
.cal-day:hover{background:var(--orange-dim);}
.cal-day.other-month{opacity:0.35;}
.cal-day.today{background:#FFF7EC;}
.cal-day.selected{outline:2px solid var(--orange);outline-offset:-2px;}
.cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);}
.cal-entries{display:flex;flex-direction:column;gap:3px;margin-top:6px;min-width:0;}
.cal-entry-line{font-size:11px;line-height:1.35;padding:2px 5px 2px 7px;border-left:3px solid var(--muted);background:rgba(22,35,46,0.035);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);min-width:0;max-width:100%;}
.cal-dots-mini{display:none;flex-wrap:wrap;gap:3px;margin-top:6px;}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-ordine{background:var(--blue);}
.dot-lavorazione{background:var(--orange);}
.dot-positivo{background:var(--green);}
.dot-negativo{background:var(--red);}
.dot-neutro{background:var(--muted);}
.dot-nota{background:#7C8891;}
.dot-appuntamento{background:var(--purple);}
.cal-more{font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.day-detail{border:1px solid var(--line);margin-top:16px;padding:16px;background:var(--paper);}
.day-detail h4{margin:0 0 10px;font-size:14px;}
.day-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px;font-size:13px;}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted);align-items:center;}
.legend span{display:flex;align-items:center;gap:5px;}

/* --- Modal --- */
.overlay{position:fixed;inset:0;background:rgba(22,35,46,0.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:1.5px solid var(--ink);width:100%;max-width:480px;padding:22px;}
.modal h3{margin:0 0 16px;font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:0.04em;margin-bottom:6px;text-transform:uppercase;}
.field input, .field select, .field textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.field-check{display:flex;align-items:center;gap:8px;}
.field-check input{width:auto;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .display{font-size:16px;color:var(--ink);margin-bottom:8px;}

@media (max-width:720px){
  .stamp{flex-direction:column;}
  .stamp-cell{border-right:none;border-bottom:1px solid var(--line);}
  .nav{flex-direction:column;}
  .nav-tab{border-right:none;border-bottom:1px solid var(--line);}
  .panel{padding:16px 12px;}
}
@media (max-width:600px){
  .cal-grid-scroll{overflow-x:visible;}
  .cal-grid{min-width:0;grid-template-columns:repeat(7,minmax(0,1fr));}
  .cal-day{min-height:52px;padding:4px 3px;}
  .cal-daynum{font-size:10.5px;}
  .cal-entries{display:none;}
  .cal-dots-mini{display:flex;}
  .cal-dots-mini .dot{width:6px;height:6px;}
  .cal-more{font-size:8px;}
  .cal-dow{font-size:9px;padding:4px 2px;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="stamp">
    <div class="stamp-cell" style="flex:2;min-width:220px;">
      <span class="stamp-label">Cantiere attivo</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="stamp-value" id="stamp-nome-cantiere">--</span>
        <button class="icon-btn" id="btn-rinomina-cantiere" title="Rinomina cantiere">✎</button>
      </div>
    </div>
    <div class="stamp-cell" style="min-width:170px;">
      <span class="stamp-label">&nbsp;</span>
      <button class="btn ghost small" id="btn-cambia-cantiere" style="width:100%;">⇄ Cambia / Nuovo cantiere</button>
    </div>
    <div class="stamp-cell">
      <span class="stamp-label">Data odierna</span>
      <span class="stamp-value small" id="stamp-date">--</span>
    </div>
    <div class="stamp-cell">
      <span class="stamp-label">Sincronizzazione</span>
      <span class="badge badge-gray" id="stato-sync">● In attesa</span>
    </div>
  </div>

  <div class="nav" id="nav"></div>
  <div class="panel" id="content"></div>

  <div class="legend" style="margin-top:14px;">
    <span><span class="dot dot-ordine"></span> Ordine</span>
    <span><span class="dot dot-lavorazione"></span> Scadenza lavorazione</span>
    <span><span class="dot dot-positivo"></span> Evento positivo</span>
    <span><span class="dot dot-negativo"></span> Evento negativo</span>
    <span><span class="dot dot-neutro"></span> Evento neutro</span>
    <span><span class="dot dot-nota"></span> Nota</span>
    <span><span class="dot dot-appuntamento"></span> Appuntamento</span>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div id="overlay-caricamento" style="display:none;position:fixed;inset:0;background:rgba(237,241,242,0.75);z-index:100;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1.5px solid var(--ink);padding:16px 22px;font-family:'Oswald',sans-serif;letter-spacing:0.04em;">Sincronizzazione con Google Sheets…</div>
</div>
<div id="toast-salvataggio" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--surface);padding:10px 20px;font-family:'Oswald',sans-serif;letter-spacing:0.05em;font-size:14px;z-index:120;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;border-radius:2px;">Salvato ✓</div>
<div id="indicatore-foto" style="display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--orange);color:var(--surface);padding:8px 16px;font-family:'Oswald',sans-serif;letter-spacing:0.04em;font-size:13px;z-index:120;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,0.25);"></div>

<script>
/* ============ CONTROLLO VERSIONE (evita che il browser mostri una copia vecchia in cache) ============ */
const APP_VERSION = 'v2026-07-26-7';
(function(){
  try{
    // Passo 1: confronto rapido con l'ultima versione vista su questo dispositivo (istantaneo, nessuna rete)
    const versionePrecedente = localStorage.getItem('gc_app_version');
    if(versionePrecedente !== APP_VERSION){
      localStorage.setItem('gc_app_version', APP_VERSION);
    }
  }catch(e){}

  // Passo 2: controllo attivo in sottofondo — scarica la pagina reale da GitHub Pages
  // ignorando volutamente la cache del browser, e si auto-ricarica se trova una versione diversa.
  // Questo funziona anche se la pagina attualmente in esecuzione è vecchia, perché il controllo
  // stesso forza una richiesta di rete fresca invece di fidarsi di quello che è già in memoria.
  //
  // Limite di sicurezza: durante la propagazione di un aggiornamento su GitHub Pages, server
  // diversi possono rispondere temporaneamente con versioni diverse tra loro. Senza un limite,
  // questo potrebbe causare ricaricamenti ripetuti in sequenza (sembrando un blocco/crash).
  // Per questo ci si ricarica al massimo una volta ogni 20 secondi.
  try{
    const ultimoTentativo = Number(sessionStorage.getItem('gc_ultimo_reload_versione') || 0);
    const adesso = Date.now();
    if(adesso - ultimoTentativo > 20000){
      fetch(window.location.pathname, {cache:'no-store'})
        .then(risposta => risposta.text())
        .then(testo => {
          const m = testo.match(/APP_VERSION\s*=\s*'([^']+)'/);
          if(m && m[1] && m[1] !== APP_VERSION){
            sessionStorage.setItem('gc_ultimo_reload_versione', String(Date.now()));
            const url = new URL(window.location.href);
            url.searchParams.set('_v', Date.now());
            window.location.replace(url.toString());
          }
        })
        .catch(() => {}); // offline o rete non disponibile: si continua con la versione già in uso
    }
  }catch(e){}
})();

/* ============ STATE ============ */
/* Ricorda quali tendine <details> sono aperte tra un ridisegno e l'altro della pagina */
const uiDettagliAperti = {};

/* Ricorda la posizione di scorrimento orizzontale delle tabelle tra un ridisegno e l'altro */
function catturaScrollOrizzontale(){
  return Array.from(document.querySelectorAll('#content .table-scroll')).map(el => el.scrollLeft);
}
function ripristinaScrollOrizzontale(valori){
  const elementi = document.querySelectorAll('#content .table-scroll');
  elementi.forEach((el, i) => { if(valori[i] !== undefined) el.scrollLeft = valori[i]; });
}

/* Ricorda la posizione di scorrimento VERTICALE della pagina quando fai una modifica rapida
   (modificare un valore, spuntare una casella, salvare un modulo, ecc.), così dopo il
   ridisegno della schermata resti dove eri invece di tornare in cima alla pagina.
   Quando invece cambi sezione dal menu (o dalle card del Quadro generale), la posizione
   non viene forzata: è giusto che una nuova schermata parta dall'alto.
   Importante: mentre un modulo/finestra è aperto NON si ricattura più la posizione, perché
   su mobile l'apertura della tastiera può far s
