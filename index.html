<!DOCTYPE html>
<html lang="it"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Cantiere</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16232E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cantiere">

<style>
/* Font locali per funzionamento 100% offline (vedi istruzioni per scaricare i file in fonts/).
   Se i file non sono presenti, il browser usa automaticamente i font di sistema di fallback
   già indicati in ogni font-family qui sotto: nessun errore, nessuna interruzione. */
@font-face{font-family:'Oswald';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/oswald-400.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/oswald-500.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/oswald-600.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/oswald-700.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/inter-400.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/inter-500.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/inter-600.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ibmplexmono-400.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/ibmplexmono-500.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/ibmplexmono-600.woff2') format('woff2');}

:root{
  --paper:#EDF1F2;
  --paper-line: rgba(44,110,158,0.08);
  --ink:#16232E;
  --muted:#5B6B75;
  --line:#B7C4CC;
  --surface:#FFFFFF;
  --orange:#E8720C;
  --orange-dim:#F6DCC3;
  --yellow:#F2B705;
  --green:#2F8F5B;
  --green-dim:#DCEFE4;
  --red:#C4423C;
  --red-dim:#F6DCDA;
  --blue:#2C6E9E;
  --blue-dim:#D9E6EF;
  --purple:#6E5AA8;
  --purple-dim:#E4DEF2;
  --radius:2px;
}
*{box-sizing:border-box;}
html{overscroll-behavior-y: contain;}
body{
  margin:0;
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 32px),
    repeating-linear-gradient(90deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 32px);
  font-family:'Inter', sans-serif;
  color:var(--ink);
  min-height:100vh;
  overscroll-behavior-y: contain;
}
h1,h2,h3,.display{font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.03em;}
.mono{font-family:'IBM Plex Mono', monospace;}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}

/* --- Title block (cartiglio) --- */
.stamp{
  background:var(--surface);
  border:1.5px solid var(--ink);
  display:flex;
  flex-wrap:wrap;
}
.stamp-cell{
  padding:10px 16px;
  border-right:1px solid var(--line);
  flex:1;
  min-width:140px;
}
.stamp-cell:last-child{border-right:none;}
.stamp-label{font-size:10px;letter-spacing:0.12em;color:var(--muted);font-family:'IBM Plex Mono',monospace;display:block;margin-bottom:3px;}
.stamp-value{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;letter-spacing:0.02em;}
.stamp-value.small{font-size:14px;font-family:'IBM Plex Mono',monospace;font-weight:500;text-transform:none;letter-spacing:0;}

/* --- Nav as title-block tabs --- */
.nav{
  display:flex;
  border:1.5px solid var(--ink);
  border-top:none;
  background:var(--surface);
  overflow-x:auto;
}
.nav-tab{
  flex:1;
  min-width:130px;
  text-align:left;
  padding:14px 18px;
  border-right:1px solid var(--line);
  background:transparent;
  cursor:pointer;
  font-family:'Oswald',sans-serif;
  letter-spacing:0.04em;
  color:var(--muted);
  font-size:14px;
  position:relative;
  transition:background .15s ease, color .15s ease;
}
.nav-tab:last-child{border-right:none;}
.nav-tab .code{font-family:'IBM Plex Mono',monospace;font-size:10px;display:block;color:var(--muted);margin-bottom:2px;}
.nav-tab:hover{background:var(--orange-dim);color:var(--ink);}
.nav-tab.active{color:var(--ink);background:var(--surface);}
.nav-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--orange);}

.panel{
  border:1.5px solid var(--ink);
  border-top:none;
  background:var(--surface);
  padding:18px 18px;
  min-height:300px;
}
.section-title{font-size:22px;margin:0 0 4px;}
.section-sub{color:var(--muted);font-size:13px;line-height:1.4;margin:0 0 14px;}

/* --- Dashboard cards --- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px;}
.card{
  border:1px solid var(--line);
  border-left:4px solid var(--line);
  padding:11px 14px;
  cursor:pointer;
  transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  background:var(--surface);
}
.card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 4px 14px rgba(22,35,46,0.08);}
.card.status-ok{border-left-color:var(--green);}
.card.status-warn{border-left-color:var(--red);}
.card.status-info{border-left-color:var(--blue);}
.card-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.09em;margin-bottom:4px;}
.card-num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;line-height:1;}
.card-label{font-size:12px;color:var(--muted);margin-top:3px;}
.card-flag{display:inline-block;margin-top:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;}
.flag-red{background:var(--red-dim);color:var(--red);}
.flag-green{background:var(--green-dim);color:var(--green);}
.flag-orange{background:var(--orange-dim);color:var(--orange);}
.flag-blue{background:var(--blue-dim);color:var(--blue);}

.subsection-title{font-size:13px;font-family:'Oswald',sans-serif;letter-spacing:0.05em;margin:16px 0 8px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;}

/* --- Buttons --- */
.btn{
  font-family:'Oswald',sans-serif;
  letter-spacing:0.03em;
  font-size:14px;
  padding:11px 20px;
  border:1.5px solid var(--ink);
  background:var(--ink);
  color:var(--surface);
  cursor:pointer;
  transition:background .15s ease;
}
.btn:hover{background:var(--orange);border-color:var(--orange);}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.ghost:hover{background:var(--orange-dim);border-color:var(--orange);color:var(--ink);}
.btn.small{padding:7px 12px;font-size:12px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}

/* --- Tables --- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px;}
.tabella-compatta{width:auto !important;min-width:0 !important;}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.05em;color:var(--muted);border-bottom:1.5px solid var(--ink);padding:10px 12px;text-transform:uppercase;white-space:nowrap;}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:nth-child(even) td{background:rgba(44,110,158,0.025);}
tr:hover td{background:rgba(232,114,12,0.06);}
.empty-row td{color:var(--muted);text-align:center;padding:30px;font-style:italic;}

/* --- Progress bar --- */
.bar-track{background:var(--paper);border:1px solid var(--line);height:10px;width:100%;position:relative;}
.bar-fill{background:var(--orange);height:100%;}
.bar-marker{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);}

.badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;font-family:'IBM Plex Mono',monospace;border-radius:var(--radius);white-space:nowrap;}
.badge-green{background:var(--green-dim);color:var(--green);}
.badge-red{background:var(--red-dim);color:var(--red);}
.badge-orange{background:var(--orange-dim);color:var(--orange);}
.badge-blue{background:var(--blue-dim);color:var(--blue);}
.badge-gray{background:#E7EAEC;color:var(--muted);}
.badge-purple{background:var(--purple-dim);color:var(--purple);}

.row-actions{display:flex;gap:6px;}
.icon-btn{background:none;border:1px solid var(--line);cursor:pointer;padding:9px 12px;font-size:12px;color:var(--muted);min-height:38px;}
.valore-cliccabile{cursor:pointer;border-bottom:1px dotted var(--muted);display:inline-block;padding:5px 2px;}
.valore-cliccabile:hover{border-bottom-color:var(--orange);color:var(--orange);}
.valore-vuoto{cursor:pointer;color:var(--muted);font-style:italic;font-size:11px;border-bottom:1px dotted var(--line);padding:5px 2px;display:inline-block;}
.valore-vuoto:hover{border-bottom-color:var(--orange);color:var(--orange);}
.riga-cliccabile{cursor:pointer;}
.riga-cliccabile:hover td{background:rgba(232,114,12,0.07);}
.stepper{display:inline-flex;align-items:center;gap:4px;}
.stepper button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px;line-height:1;padding:0;color:var(--ink);}
.stepper button:hover{border-color:var(--orange);color:var(--orange);}
.icon-btn:hover{border-color:var(--orange);color:var(--orange);}

/* --- Calendar --- */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-month{font-family:'Oswald',sans-serif;font-size:20px;}
.cal-grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-width:650px;border-left:1px solid var(--line);border-top:1px solid var(--line);}
.cal-dow{font-family:'IBM Plex Mono',monospace;font-size:10px;text-align:center;padding:6px;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);}
.cal-day{min-height:128px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;cursor:pointer;position:relative;transition:background .1s ease;overflow:hidden;}
.cal-day:hover{background:var(--orange-dim);}
.cal-day.other-month{opacity:0.35;}
.cal-day.today{background:#FFF7EC;}
.cal-day.selected{outline:2px solid var(--orange);outline-offset:-2px;}
.cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);}
.cal-entries{display:flex;flex-direction:column;gap:3px;margin-top:6px;min-width:0;}
.cal-entry-line{font-size:11px;line-height:1.35;padding:2px 5px 2px 7px;border-left:3px solid var(--muted);background:rgba(22,35,46,0.035);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);min-width:0;max-width:100%;}
.cal-dots-mini{display:none;flex-wrap:wrap;gap:3px;margin-top:6px;}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-ordine{background:var(--blue);}
.dot-lavorazione{background:var(--orange);}
.dot-positivo{background:var(--green);}
.dot-negativo{background:var(--red);}
.dot-neutro{background:var(--muted);}
.dot-nota{background:#7C8891;}
.dot-appuntamento{background:var(--purple);}
.cal-more{font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.day-detail{border:1px solid var(--line);margin-top:16px;padding:16px;background:var(--paper);}
.day-detail h4{margin:0 0 10px;font-size:14px;}
.day-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px;font-size:13px;}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted);align-items:center;}
.legend span{display:flex;align-items:center;gap:5px;}

/* --- Modal --- */
.overlay{position:fixed;inset:0;background:rgba(22,35,46,0.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:1.5px solid var(--ink);width:100%;max-width:480px;padding:22px;}
.modal h3{margin:0 0 16px;font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:0.04em;margin-bottom:6px;text-transform:uppercase;}
.field input, .field select, .field textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.field-check{display:flex;align-items:center;gap:8px;}
.field-check input{width:auto;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .display{font-size:16px;color:var(--ink);margin-bottom:8px;}

@media (max-width:720px){
  .stamp{flex-direction:column;}
  .stamp-cell{border-right:none;border-bottom:1px solid var(--line);}
  .nav{flex-direction:column;}
  .nav-tab{border-right:none;border-bottom:1px solid var(--line);}
  .panel{padding:16px 12px;}
}
@media (max-width:600px){
  .cal-grid-scroll{overflow-x:visible;}
  .cal-grid{min-width:0;grid-template-columns:repeat(7,minmax(0,1fr));}
  .cal-day{min-height:52px;padding:4px 3px;}
  .cal-daynum{font-size:10.5px;}
  .cal-entries{display:none;}
  .cal-dots-mini{display:flex;}
  .cal-dots-mini .dot{width:6px;height:6px;}
  .cal-more{font-size:8px;}
  .cal-dow{font-size:9px;padding:4px 2px;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="stamp">
    <div class="stamp-cell" style="flex:2;min-width:220px;">
      <span class="stamp-label">Cantiere attivo</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="stamp-value" id="stamp-nome-cantiere">--</span>
        <button class="icon-btn" id="btn-rinomina-cantiere" title="Rinomina cantiere">✎</button>
      </div>
    </div>
    <div class="stamp-cell" style="min-width:170px;">
      <span class="stamp-label">&nbsp;</span>
      <button class="btn ghost small" id="btn-cambia-cantiere" style="width:100%;">⇄ Cambia / Nuovo cantiere</button>
    </div>
    <div class="stamp-cell">
      <span class="stamp-label">Data odierna</span>
      <span class="stamp-value small" id="stamp-date">--</span>
    </div>
    <div class="stamp-cell">
      <span class="stamp-label">Sincronizzazione</span>
      <span class="badge badge-gray" id="stato-sync">● In attesa</span>
    </div>
  </div>

  <div class="nav" id="nav"></div>
  <div class="panel" id="content"></div>

  <div class="legend" style="margin-top:14px;">
    <span><span class="dot dot-ordine"></span> Ordine</span>
    <span><span class="dot dot-lavorazione"></span> Scadenza lavorazione</span>
    <span><span class="dot dot-positivo"></span> Evento positivo</span>
    <span><span class="dot dot-negativo"></span> Evento negativo</span>
    <span><span class="dot dot-neutro"></span> Evento neutro</span>
    <span><span class="dot dot-nota"></span> Nota</span>
    <span><span class="dot dot-appuntamento"></span> Appuntamento</span>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div id="overlay-caricamento" style="display:none;position:fixed;inset:0;background:rgba(237,241,242,0.75);z-index:100;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1.5px solid var(--ink);padding:16px 22px;font-family:'Oswald',sans-serif;letter-spacing:0.04em;">Sincronizzazione con Google Sheets…</div>
</div>
<div id="toast-salvataggio" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--surface);padding:10px 20px;font-family:'Oswald',sans-serif;letter-spacing:0.05em;font-size:14px;z-index:120;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;border-radius:2px;">Salvato ✓</div>
<div id="indicatore-foto" style="display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--orange);color:var(--surface);padding:8px 16px;font-family:'Oswald',sans-serif;letter-spacing:0.04em;font-size:13px;z-index:120;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,0.25);"></div>

<script>
/* ============ SEGNALAZIONE ERRORI VISIBILE ============
   Se qualcosa nello script va storto, mostra un avviso a schermo invece di
   fallire in silenzio (utile per capire cosa succede senza dover collegare
   il telefono a un computer per vedere la console). */
window.addEventListener('error', function(e){
  try{
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#fff3f3;color:#a00;padding:10px 14px;font-size:12px;font-family:monospace;border-top:2px solid #a00;z-index:99999;max-height:40vh;overflow:auto;white-space:pre-wrap;';
    el.textContent = 'Errore JavaScript: ' + (e.message || '') + '\n' + (e.filename ? (e.filename + ':' + e.lineno) : '');
    document.body.appendChild(el);
  }catch(e2){}
});
window.addEventListener('unhandledrejection', function(e){
  try{
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#fff3f3;color:#a00;padding:10px 14px;font-size:12px;font-family:monospace;border-top:2px solid #a00;z-index:99999;max-height:40vh;overflow:auto;white-space:pre-wrap;';
    el.textContent = 'Errore (promise): ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
    document.body.appendChild(el);
  }catch(e2){}
});

/* ============ CONTROLLO VERSIONE (evita che il browser mostri una copia vecchia in cache) ============ */
const APP_VERSION = 'v2026-07-26-8';
(function(){
  try{
    // Passo 1: confronto rapido con l'ultima versione vista su questo dispositivo (istantaneo, nessuna rete)
    const versionePrecedente = localStorage.getItem('gc_app_version');
    if(versionePrecedente !== APP_VERSION){
      localStorage.setItem('gc_app_version', APP_VERSION);
    }
  }catch(e){}

  // Passo 2: controllo attivo in sottofondo — scarica la pagina reale da GitHub Pages
  // ignorando volutamente la cache del browser, e si auto-ricarica se trova una versione diversa.
  // Questo funziona anche se la pagina attualmente in esecuzione è vecchia, perché il controllo
  // stesso forza una richiesta di rete fresca invece di fidarsi di quello che è già in memoria.
  //
  // Limite di sicurezza: durante la propagazione di un aggiornamento su GitHub Pages, server
  // diversi possono rispondere temporaneamente con versioni diverse tra loro. Senza un limite,
  // questo potrebbe causare ricaricamenti ripetuti in sequenza (sembrando un blocco/crash).
  // Per questo ci si ricarica al massimo una volta ogni 20 secondi.
  try{
    const ultimoTentativo = Number(sessionStorage.getItem('gc_ultimo_reload_versione') || 0);
    const adesso = Date.now();
    if(adesso - ultimoTentativo > 20000){
      fetch(window.location.pathname, {cache:'no-store'})
        .then(risposta => risposta.text())
        .then(testo => {
          const m = testo.match(/APP_VERSION\s*=\s*'([^']+)'/);
          if(m && m[1] && m[1] !== APP_VERSION){
            sessionStorage.setItem('gc_ultimo_reload_versione', String(Date.now()));
            const url = new URL(window.location.href);
            url.searchParams.set('_v', Date.now());
            window.location.replace(url.toString());
          }
        })
        .catch(() => {}); // offline o rete non disponibile: si continua con la versione già in uso
    }
  }catch(e){}
})();

/* ============ STATE ============ */
/* Ricorda quali tendine <details> sono aperte tra un ridisegno e l'altro della pagina */
const uiDettagliAperti = {};

/* Ricorda la posizione di scorrimento orizzontale delle tabelle tra un ridisegno e l'altro */
function catturaScrollOrizzontale(){
  return Array.from(document.querySelectorAll('#content .table-scroll')).map(el => el.scrollLeft);
}
function ripristinaScrollOrizzontale(valori){
  const elementi = document.querySelectorAll('#content .table-scroll');
  elementi.forEach((el, i) => { if(valori[i] !== undefined) el.scrollLeft = valori[i]; });
}

/* Ricorda la posizione di scorrimento VERTICALE della pagina quando fai una modifica rapida
   (modificare un valore, spuntare una casella, salvare un modulo, ecc.), così dopo il
   ridisegno della schermata resti dove eri invece di tornare in cima alla pagina.
   Quando invece cambi sezione dal menu (o dalle card del Quadro generale), la posizione
   non viene forzata: è giusto che una nuova schermata parta dall'alto.
   Importante: mentre un modulo/finestra è aperto NON si ricattura più la posizione, perché
   su mobile l'apertura della tastiera può far scorrere la pagina da sola — se continuassimo
   a catturare ad ogni tocco/tasto, finiremmo per "fissare" proprio quella posizione sbagliata
   invece di quella originale, prima di aprire il modulo. */
let scrollVerticaleDaRipristinare = null;
['click','submit','change','keydown'].forEach(evento => {
  document.addEventListener(evento, (e) => {
    const overlayEl = document.getElementById('overlay');
    if(overlayEl && overlayEl.classList.contains('open')) return;
    const cambioSezione = e.target && e.target.closest && (e.target.closest('.nav-tab') || e.target.closest('[data-goto]'));
    scrollVerticaleDaRipristinare = cambioSezione ? null : window.scrollY;
  }, true);
});
function avviaOsservatoreScrollVerticale(){
  const contenitore = document.getElementById('content');
  if(!contenitore) return;
  const osservatore = new MutationObserver(() => {
    if(scrollVerticaleDaRipristinare !== null){
      const y = scrollVerticaleDaRipristinare;
      scrollVerticaleDaRipristinare = null;
      requestAnimationFrame(() => window.scrollTo(0, y));
    }
  });
  osservatore.observe(contenitore, {childList:true});
}
avviaOsservatoreScrollVerticale();

const URL_APPS_SCRIPT_PREDEFINITO = 'https://script.google.com/macros/s/AKfycbxDXtrI8NELVMnHIW3MJoS2yhahFm0DLQT4FOI9pcx3-w9is2HwV0WUg2tMKaUuq-rC/exec'; function getUrlAppsScript(){ return localStorage.getItem(LS_KEY_URL_SHEETS) || URL_APPS_SCRIPT_PREDEFINITO; }

async function kvGet(key){
  const url = getUrlAppsScript();
  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');
  const res = await fetch(`${url}?action=get&key=${encodeURIComponent(key)}`);
  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Errore nella lettura dei dati dal foglio');
  return json.found ? JSON.parse(json.value) : null;
}
async function kvSet(key, value){
  const url = getUrlAppsScript();
  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // evita il preflight CORS, non gestito da Apps Script
    body: JSON.stringify({action:'set', key, value: JSON.stringify(value)}),
  });
  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Errore nel salvataggio dei dati sul foglio');

}

function estraiPercentualeDaNomeFile(nome){
  const m = nome.match(/(\d{1,3})%/);
  return m ? Number(m[1]) : null;
}
function trovaPercentualePiuVicina(percentualiDisponibili, target){
  const successive = percentualiDisponibili.filter(p => p >= target).sort((a,b)=>a-b);
  if(successive.length) return successive[0];
  const precedenti = percentualiDisponibili.filter(p => p < target).sort((a,b)=>b-a);
  if(precedenti.length) return precedenti[0];
  return null;
}
function sceglieFotoCicloLavoro(elencoFile){
  const conPercentuale = elencoFile
    .map(f => ({...f, percentuale: estraiPercentualeDaNomeFile(f.nome)}))
    .filter(f => f.percentuale !== null);
  if(conPercentuale.length === 0) return [];
  const percentualiDisponibili = [...new Set(conPercentuale.map(f => f.percentuale))];
  const scelte = [];
  const usate = new Set();
  [25, 50, 75, 100].forEach(target => {
    const percentualeScelta = trovaPercentualePiuVicina(percentualiDisponibili, target);
    if(percentualeScelta === null) return;
    const candidati = conPercentuale
      .filter(f => f.percentuale === percentualeScelta && !usate.has(f.id))
      .sort((a,b) => new Date(b.creato) - new Date(a.creato));
    if(candidati.length){
      scelte.push({...candidati[0], targetPercentuale: target});
      usate.add(candidati[0].id);
    }
  });
  return scelte;
}

/* ---- Report settimanale in PDF ---- */
function caricaScriptEsterno(src){
  return new Promise((resolve, reject) => {
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Impossibile caricare una libreria necessaria per il PDF (serve connessione internet).'));
    document.head.appendChild(s);
  });
}
async function assicuraLibreriePdf(){
  if(!window.jspdf){
    await caricaScriptEsterno('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  }
  if(!window.jspdf.jsPDF.API.autoTable){
    await caricaScriptEsterno('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  }
}
const GIORNI_SETTIMANA_BREVI = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
function eventiCategorizzatiPerGiorno(iso){
  const cat = {arrivo:[], inizio:[], ordini:[], note:[]};
  state.ordini.forEach(o => {
    if(o.dataOrdine === iso) cat.ordini.push(o.nome + (o.fornitore ? ' ('+o.fornitore+')' : ''));
    if(o.dataEffettiva === iso) cat.arrivo.push(o.nome + (o.statoParziale==='parziale' ? ' (parziale)' : ''));
    else if(o.dataPrevista === iso && !o.dataEffettiva) cat.arrivo.push(o.nome + ' (previsto)');
  });
  state.lavorazioni.forEach(l => {
    if(l.dataInizio === iso) cat.inizio.push(l.nome);
  });
  state.calendario.forEach(c => {
    if(c.data === iso){
      cat.note.push(`${c.tipo==='appuntamento'?'Appuntamento':'Nota'}: ${c.titolo}`);
    } else if(c.ricorrenteSettimanale && c.data < iso){
      const start = new Date(c.data), cur = new Date(iso);
      if(start.getDay() === cur.getDay()) cat.note.push(`${c.tipo==='appuntamento'?'Appuntamento':'Nota'}: ${c.titolo}`);
    }
  });
  return cat;
}
async function aggiungiPannelloFotoLavorazioniCompletate(doc, lavorazioniCompletate, nomeCantiere, margineSx, larghezzaPagina){
  if(lavorazioniCompletate.length === 0) return;
  doc.addPage();
  let y = 18;
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Ciclo lavorativo — lavorazioni completate', margineSx, y);
  y += 10;

  for(const lav of lavorazioniCompletate){
    let elenco = [];
    try{ elenco = await elencoFotoLavorazione(nomeCantiere, lav.nome); }catch(e){ elenco = []; }
    const foto = sceglieFotoCicloLavoro(elenco);
    if(foto.length === 0) continue;

    if(y > 220){ doc.addPage(); y = 18; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(lav.nome, margineSx, y);
    y += 6;

    const larghezzaFoto = 42;
    const altezzaFoto = 32;
    const spazio = 4;
    let x = margineSx;
    for(const f of foto){
      try{
        const dati = await scaricaFotoBase64(f.id);
        const formato = (dati.mimeType||'').indexOf('png') !== -1 ? 'PNG' : 'JPEG';
        doc.addImage('data:'+dati.mimeType+';base64,'+dati.base64, formato, x, y, larghezzaFoto, altezzaFoto);
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90);
        doc.text(`${f.targetPercentuale}%`, x + larghezzaFoto/2, y + altezzaFoto + 4, {align:'center'});
        doc.setTextColor(0);
      }catch(e){
        console.error('Errore nel caricare una foto per il report', e);
      }
      x += larghezzaFoto + spazio;
    }
    y += altezzaFoto + 12;
  }
}

async function generaReportSettimanale(dataRiferimento){
  mostraCaricamento(true);
  try{
    await assicuraLibreriePdf();
    const { jsPDF } = window.jspdf;

    const oggi = dataRiferimento || new Date();
    const inizio = startOfWeek(oggi);
    const giorni = [];
    for(let i=0;i<7;i++){ const d = new Date(inizio); d.setDate(inizio.getDate()+i); giorni.push(d); }
    const isoGiorni = giorni.map(toLocalISODate);
    const isoInizio = isoGiorni[0], isoFine = isoGiorni[6];

    const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    const nomeCant = state.nomeCantiereAttivo || 'Cantiere';
    const larghezzaPagina = doc.internal.pageSize.getWidth();
    const margineSx = 14;
    let y = 18;

    function nuovaPaginaSeServe(soglia){
      if(y > (soglia || 270)){ doc.addPage(); y = 18; }
    }

    doc.setFont('helvetica','bold');
    doc.setFontSize(18);
    doc.text('Report settimanale', margineSx, y);
    y += 8;
    doc.setFont('helvetica','normal');
    doc.setFontSize(11);
    doc.text(`Cantiere: ${nomeCant}`, margineSx, y);
    y += 6;
    doc.text(`Settimana: ${fmtDate(isoInizio)} - ${fmtDate(isoFine)}`, margineSx, y);
    y += 5;
    doc.setFontSize(8);
    doc.setTextColor(120);
    doc.text(`Generato il ${fmtDate(todayISO())}`, margineSx, y);
    doc.setTextColor(0);
    y += 8;

    /* --- Tabella settimana: una riga sola, tutti gli avvenimenti del giorno insieme --- */
    const eventiGiorni = isoGiorni.map(eventiCategorizzatiPerGiorno);
    const testateGiorni = giorni.map((d,i) => `${GIORNI_SETTIMANA_BREVI[i]}\n${fmtDataBreve(isoGiorni[i])}`);
    const rigaUnica = eventiGiorni.map(e => {
      const tutti = [
        ...e.arrivo.map(t => 'Arrivo: ' + t),
        ...e.inizio.map(t => 'Inizio: ' + t),
        ...e.ordini.map(t => 'Ordine: ' + t),
        ...e.note,
      ];
      return tutti.join('\n') || '-';
    });
    doc.autoTable({
      startY: y,
      head: [testateGiorni],
      body: [rigaUnica],
      styles:{fontSize:7, cellPadding:2, valign:'top', halign:'left'},
      headStyles:{fillColor:[22,35,46], textColor:255, halign:'center', fontSize:8},
      margin:{left:margineSx, right:margineSx},
    });
    y = doc.lastAutoTable.finalY + 10;

    /* --- Persone: totale ore della settimana --- */
    nuovaPaginaSeServe();
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('Persone', margineSx, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const oreSettimanaPersone = state.persone
      .map(p => ({ nome: p.nome, tot: (p.log||[]).filter(l => l.data >= isoInizio && l.data <= isoFine).reduce((s,l)=>s+Number(l.ore||0),0) }))
      .filter(x => x.tot > 0);
    if(oreSettimanaPersone.length === 0){
      doc.setTextColor(140); doc.text('Nessuna ora registrata questa settimana.', margineSx, y); doc.setTextColor(0); y += 6;
    } else {
      oreSettimanaPersone.forEach(x => {
        doc.text(`${x.nome} - ${x.tot} ore`, margineSx, y);
        y += 6;
        nuovaPaginaSeServe();
      });
    }
    y += 5;

    /* --- Lavorazioni: avanzamento inizio -> fine settimana --- */
    nuovaPaginaSeServe();
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('Lavorazioni', margineSx, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const snapshotPrec = state.snapshotSettimanale;
    const righeAvanzamento = state.lavorazioni
      .filter(l => !l.dataCompletamento || (l.dataCompletamento >= isoInizio))
      .map(l => {
        const percOra = Number(l.statoAvanzamento||0);
        const percPrima = (snapshotPrec && snapshotPrec.valori && snapshotPrec.valori[l.id] !== undefined) ? snapshotPrec.valori[l.id] : null;
        return { nome: l.nome, percPrima, percOra };
      });
    if(righeAvanzamento.length === 0){
      doc.setTextColor(140); doc.text('Nessuna lavorazione aperta.', margineSx, y); doc.setTextColor(0); y += 6;
    } else {
      righeAvanzamento.forEach(r => {
        const testo = r.percPrima!==null ? `${r.nome}: ${r.percPrima}% -> ${r.percOra}%` : `${r.nome}: ${r.percOra}% (primo report)`;
        doc.text(testo, margineSx, y);
        y += 6;
        nuovaPaginaSeServe();
      });
    }
    y += 5;

    /* --- Eventi della settimana --- */
    nuovaPaginaSeServe();
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('Eventi', margineSx, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const eventiSettimana = state.eventi.filter(e => e.data >= isoInizio && e.data <= isoFine).sort((a,b)=>a.data.localeCompare(b.data));
    if(eventiSettimana.length === 0){
      doc.setTextColor(140); doc.text('Nessun evento registrato questa settimana.', margineSx, y); doc.setTextColor(0); y += 6;
    } else {
      eventiSettimana.forEach(e => {
        const etichetta = e.tipo==='positivo' ? 'Positivo' : e.tipo==='negativo' ? 'Negativo' : 'Neutro';
        const righe = doc.splitTextToSize(`${fmtDataBreve(e.data)} [${etichetta}] - ${e.titolo}`, larghezzaPagina - margineSx*2);
        doc.text(righe, margineSx, y);
        y += 6 * righe.length;
        nuovaPaginaSeServe();
      });
    }
    y += 5;

    /* --- Note: riassunto del diario di cantiere della settimana --- */
    nuovaPaginaSeServe();
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('Note', margineSx, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const diarioSettimana = state.diario.filter(v => v.data >= isoInizio && v.data <= isoFine).sort((a,b)=>a.data.localeCompare(b.data));
    if(diarioSettimana.length === 0){
      doc.setTextColor(140); doc.text('Nessuna voce di diario questa settimana.', margineSx, y); doc.setTextColor(0); y += 6;
    } else {
      diarioSettimana.forEach(v => {
        const riassunto = (v.attivita||'').replace(/\s+/g,' ').trim();
        const riassuntoBreve = riassunto.length > 160 ? riassunto.slice(0,160) + '...' : riassunto;
        const righe = doc.splitTextToSize(`${fmtDataBreve(v.data)} - ${riassuntoBreve}`, larghezzaPagina - margineSx*2);
        doc.text(righe, margineSx, y);
        y += 6 * righe.length + 1;
        nuovaPaginaSeServe();
      });
    }

    /* --- Ciclo lavorativo: foto delle lavorazioni completate in questa settimana --- */
    const lavorazioniCompletateSettimana = state.lavorazioni.filter(l => l.dataCompletamento && l.dataCompletamento >= isoInizio && l.dataCompletamento <= isoFine);
    await aggiungiPannelloFotoLavorazioniCompletate(doc, lavorazioniCompletateSettimana, nomeCant, margineSx, larghezzaPagina);

    const datiUriPdf = doc.output('datauristring');
    const pdfBase64 = datiUriPdf.substring(datiUriPdf.indexOf('base64,') + 7);
    const nomeFile = `Report settimanale - ${fmtDataBreve(isoInizio).replace(/\//g,'-')} - ${fmtDataBreve(isoFine).replace(/\//g,'-')}`;

    const risposta = await chiamaAzionePost('uploadReportPdf', {
      cantiere: nomeCant,
      tipo: 'settimanale',
      nomeFile,
      pdfBase64,
    });

    const nuovoSnapshot = {data: todayISO(), valori: {}};
    state.lavorazioni.forEach(l => { nuovoSnapshot.valori[l.id] = Number(l.statoAvanzamento||0); });
    state.snapshotSettimanale = nuovoSnapshot;
    persist();

    mostraToast('Report creato ✓');
    if(risposta.fileUrl) window.open(risposta.fileUrl, '_blank');
  }catch(e){

async function generaReportMensile(dataRiferimento){
  mostraCaricamento(true);
  try{
    await assicuraLibreriePdf();
    const { jsPDF } = window.jspdf;

    const oggi = dataRiferimento || new Date();
    const primoGiorno = new Date(oggi.getFullYear(), oggi.getMonth(), 1);
    const ultimoGiorno = new Date(oggi.getFullYear(), oggi.getMonth()+1, 0);
    const isoInizio = toLocalISODate(primoGiorno);
    const isoFine = toLocalISODate(ultimoGiorno);
    const nomeMese = `${MESI[oggi.getMonth()]} ${oggi.getFullYear()}`;

    const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    const nomeCant = state.nomeCantiereAttivo || 'Cantiere';
    const larghezzaPagina = doc.internal.pageSize.getWidth();
    const margineSx = 10;
    let y = 15;

    function nuovaPaginaSeServe(soglia){
      if(y > (soglia || 270)){ doc.addPage(); y = 18; }
    }

    /* --- Pagina 1: intestazione + calendario del mese in grande --- */
    doc.setFont('helvetica','bold');
    doc.setFontSize(18);
    doc.text('Report mensile', margineSx, y);
    y += 8;
    doc.setFont('helvetica','normal');
    doc.setFontSize(11);
    doc.text(`Cantiere: ${nomeCant}`, margineSx, y);
    y += 6;
    doc.text(`Mese: ${nomeMese}`, margineSx, y);
    y += 5;
    doc.setFontSize(8);
    doc.setTextColor(120);
    doc.text(`Generato il ${fmtDate(todayISO())}`, margineSx, y);
    doc.setTextColor(0);
    y += 8;

    const offsetPrimoGiorno = (primoGiorno.getDay()+6)%7; // lun=0
    const inizioGriglia = new Date(primoGiorno);
    inizioGriglia.setDate(primoGiorno.getDate() - offsetPrimoGiorno);
    const numSettimane = Math.ceil((offsetPrimoGiorno + ultimoGiorno.getDate()) / 7);
    const corpoCalendario = [];
    for(let s=0; s<numSettimane; s++){
      const riga = [];
      for(let g=0; g<7; g++){
        const d = new Date(inizioGriglia);
        d.setDate(inizioGriglia.getDate() + s*7 + g);
        if(d.getMonth() !== primoGiorno.getMonth()){
          riga.push('');
        } else {
          const iso = toLocalISODate(d);
          const e = eventiCategorizzatiPerGiorno(iso);
          const righeTesto = [
            ...e.arrivo.map(t => 'Arrivo: ' + t),
            ...e.inizio.map(t => 'Inizio: ' + t),
            ...e.ordini.map(t => 'Ordine: ' + t),
            ...e.note,
          ];
          riga.push(String(d.getDate()) + (righeTesto.length ? '\n' + righeTesto.join('\n') : ''));
        }
      }
      corpoCalendario.push(riga);
    }
    doc.autoTable({
      startY: y,
      head: [['Lun','Mar','Mer','Gio','Ven','Sab','Dom']],
      body: corpoCalendario,
      styles:{fontSize:6.5, cellPadding:1.5, valign:'top', minCellHeight:22, overflow:'linebreak'},
      headStyles:{fillColor:[22,35,46], textColor:255, halign:'center', fontSize:9},
      margin:{left:margineSx, right:margineSx},
      theme:'grid',
    });

    /* --- Pagina 2 in poi: Persone, Lavorazioni, Eventi, Note --- */
    doc.addPage();
    y = 18;
    const margineTesto = 14;

    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('Persone', margineTesto, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const oreMesePersone = state.persone
      .map(p => ({ nome: p.nome, tot: oreTotaliPersonaMese(p, primoGiorno) }))
      .filter(x => x.tot > 0);
    if(oreMesePersone.length === 0){
      doc.setTextColor(140); doc.text('Nessuna ora registrata questo mese.', margineTesto, y); doc.setTextColor(0); y += 6;
    } else {
      oreMesePersone.forEach(x => {
        doc.text(`${x.nome} - ${x.tot.toFixed(1)} ore`, margineTesto, y);
        y += 6;
        nuovaPaginaSeServe();
      });
    }
    y += 5;

    nuovaPaginaSeServe();
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('Lavorazioni', margineTesto, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const snapshotPrec = state.snapshotMensile;
    const righeAvanzamento = state.lavorazioni
      .filter(l => !l.dataCompletamento || (l.dataCompletamento >= isoInizio))
      .map(l => {
        const percOra = Number(l.statoAvanzamento||0);
        const percPrima = (snapshotPrec && snapshotPrec.valori && snapshotPrec.valori[l.id] !== undefined) ? snapshotPrec.valori[l.id] : null;
        return { nome: l.nome, percPrima, percOra };
      });
    if(righeAvanzamento.length === 0){
      doc.setTextColor(140); doc.text('Nessuna lavorazione aperta.', margineTesto, y); doc.setTextColor(0); y += 6;
    } else {
      righeAvanzamento.forEach(r => {
        const testo = r.percPrima!==null ? `${r.nome}: ${r.percPrima}% -> ${r.percOra}%` : `${r.nome}: ${r.percOra}% (primo report)`;
        doc.text(testo, margineTesto, y);
        y += 6;
        nuovaPaginaSeServe();
      });
    }
    y += 5;

    nuovaPaginaSeServe();
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('Eventi', margineTesto, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const eventiMese = state.eventi.filter(e => e.data >= isoInizio && e.data <= isoFine).sort((a,b)=>a.data.localeCompare(b.data));
    if(eventiMese.length === 0){
      doc.setTextColor(140); doc.text('Nessun evento registrato questo mese.', margineTesto, y); doc.setTextColor(0); y += 6;
    } else {
      eventiMese.forEach(e => {
        const etichetta = e.tipo==='positivo' ? 'Positivo' : e.tipo==='negativo' ? 'Negativo' : 'Neutro';
        const righe = doc.splitTextToSize(`${fmtDataBreve(e.data)} [${etichetta}] - ${e.titolo}`, larghezzaPagina - margineTesto*2);
        doc.text(righe, margineTesto, y);
        y += 6 * righe.length;
        nuovaPaginaSeServe();
      });
    }
    y += 5;

    nuovaPaginaSeServe();
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('Note', margineTesto, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const diarioMese = state.diario.filter(v => v.data >= isoInizio && v.data <= isoFine).sort((a,b)=>a.data.localeCompare(b.data));
    if(diarioMese.length === 0){
      doc.setTextColor(140); doc.text('Nessuna voce di diario questo mese.', margineTesto, y); doc.setTextColor(0); y += 6;
    } else {
      diarioMese.forEach(v => {
        const riassunto = (v.attivita||'').replace(/\s+/g,' ').trim();
        const riassuntoBreve = riassunto.length > 160 ? riassunto.slice(0,160) + '...' : riassunto;
        const righe = doc.splitTextToSize(`${fmtDataBreve(v.data)} - ${riassuntoBreve}`, larghezzaPagina - margineTesto*2);
        doc.text(righe, margineTesto, y);
        y += 6 * righe.length + 1;
        nuovaPaginaSeServe();
      });
    }

    /* --- Ciclo lavorativo: foto delle lavorazioni completate in questo mese --- */
    const lavorazioniCompletateMese = state.lavorazioni.filter(l => l.dataCompletamento && l.dataCompletamento >= isoInizio && l.dataCompletamento <= isoFine);
    await aggiungiPannelloFotoLavorazioniCompletate(doc, lavorazioniCompletateMese, nomeCant, margineTesto, larghezzaPagina);

    const datiUriPdf = doc.output('datauristring');
    const pdfBase64 = datiUriPdf.substring(datiUriPdf.indexOf('base64,') + 7);
    const nomeFile = `Report mensile - ${nomeMese}`;

    const risposta = await chiamaAzionePost('uploadReportPdf', {
      cantiere: nomeCant,
      tipo: 'mensile',
      nomeFile,
      pdfBase64,
    });

    const nuovoSnapshot = {data: todayISO(), valori: {}};
    state.lavorazioni.forEach(l => { nuovoSnapshot.valori[l.id] = Number(l.statoAvanzamento||0); });
    state.snapshotMensile = nuovoSnapshot;
    persist();

    mostraToast('Report creato ✓');
    if(risposta.fileUrl) window.open(risposta.fileUrl, '_blank');
  }catch(e){
    alert('Errore nella generazione del report: ' + e.message);
  }
  mostraCaricamento(false);
}

/* ---- Fotocamera e ridimensionamento immagini ---- */
function apriFotocamera(){
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.style.display = 'none';
    input.onchange = () => {
      const file = input.files && input.files[0] ? input.files[0] : null;
      document.body.removeChild(input);
      resolve(file);
    };
    document.body.appendChild(input);
    input.click();
  });
}
function ridimensionaImmagine(file, maxLato, qualita){
  maxLato = maxLato || 1280;
  qualita = qualita || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Impossibile leggere la foto.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Impossibile elaborare la foto.'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxLato || height > maxLato){
          if(width >= height){ height = Math.round(height * (maxLato / width)); width = maxLato; }
          else { width = Math.round(width * (maxLato / height)); height = maxLato; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', qualita);
        resolve(dataUrl.split(',')[1]);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let toastTimer = null;
function mostraToast(testo){
  const el = document.getElementById('toast-salvataggio');
  if(!el) return;
  el.textContent = testo;
  el.style.opacity = '1';
  el.style.transform = 'translateX(-50%) translateY(0)';

function copiaTesto(testo){
  function fallbackPrompt(){ window.prompt('Copia il testo qui sotto:', testo); }
  function fallbackExec(){
    try{
      const ta = document.createElement('textarea');
      ta.value = testo;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok) mostraToast('Copiato ✓'); else fallbackPrompt();
    }catch(e){
      fallbackPrompt();
    }
  }
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(testo).then(() => mostraToast('Copiato ✓')).catch(fallbackExec);
  } else {
    fallbackExec();
  }
}
function impostaStatoSync(stato, dettaglio){
  const el = document.getElementById('stato-sync');
  if(!el) return;
  const mappa = {

    salvataggio: {testo:'● Salvataggio…', classe:'badge-orange'},
    errore: {testo:'● Errore di sincronizzazione', classe:'badge-red'},
  };
  const m = mappa[stato] || mappa.ok;
  el.className = 'badge ' + m.classe;
  el.textContent = m.testo;
  el.title = dettaglio || '';
}

let riprovaPersistTimer = null;
let codaPersist = Promise.resolve();
function persist(){
  codaPersist = codaPersist.then(() => persistImpl()).catch(() => {});
  return codaPersist;
}
async function persistImpl(){
  const dati = raccogliDatiStato();
  impostaStatoSync('salvataggio');
  try{
    await kvSet(dataKeyCantiere(state.cantiereAttivoId), dati);
    salvaCacheDatiLocale(state.cantiereAttivoId, dati);
    const lista = await caricaListaCantieri();
    const meta = lista.find(c => c.id === state.cantiereAttivoId);
    if(meta) meta.ultimaModifica = new Date().toISOString();
    await salvaListaCantieri(lista);
    salvaCacheListaLocale(lista);
    impostaStatoSync('ok');
    mostraToastSalvato();
  }catch(e){
    console.error('Errore di sincronizzazione', e);
    impostaStatoSync('errore', e.message + ' — verrà ritentato tra poco.');
    clearTimeout(riprovaPersistTimer);
    riprovaPersistTimer = setTimeout(persist, 8000);
  }
}

async function creaCantiere(nome){
  const lista = await caricaListaCantieri();
  const id = uid();
  lista.push({id, nome: nome || 'Nuovo cantiere', creato: new Date().toISOString(), ultimaModifica: new Date().toISOString()});
  await salvaListaCantieri(lista);
  await kvSet(dataKeyCantiere(id), datiVuoti());
  return id;
}
async function eliminaCantiere(id){
  let lista = await caricaListaCantieri();
  lista = lista.filter(c => c.id !== id);
  await salvaListaCantieri(lista);
  try{ await kvDelete(dataKeyCantiere(id)); }catch(e){}
  return lista;
}
async function rinominaCantiere(id, nuovoNome){
  const lista = await caricaListaCantieri();
  const meta = lista.find(c => c.id === id);
  if(meta) meta.nome = nuovoNome;
  await salvaListaCantieri(lista);
}
async function passaACantiere(id){
  state.cantiereAttivoId = id;
  lsSet(LS_KEY_ATTIVO, id);
  state.section = 'dashboard';
  state.selectedDay = null;

  const datiCache = caricaCacheDatiLocale(id);
  const listaCache = caricaCacheListaLocale();
  let dipintoDaCache = false;
  if(datiCache){
    applicaDatiAStato(datiCache);
    if(listaCache){
      const meta = listaCache.find(c => c.id === id);
      state.nomeCantiereAttivo = meta ? meta.nome : 'Cantiere';
      document.getElementById('stamp-nome-cantiere').textContent = state.nomeCantiereAttivo;
    }
    renderAll();
    dipintoDaCache = true;
  } else {
    mostraCaricamento(true);
  }

  try{
    const dati = await caricaDatiCantiere(id);
    applicaDatiAStato(dati);
    salvaCacheDatiLocale(id, dati);
    await renderStamp();
    renderAll();
    impostaStatoSync('ok');
  }catch(e){
    if(!dipintoDaCache){
      alert('Errore nel caricare il cantiere: ' + e.message);
    }
    impostaStatoSync('errore', e.message);
  }
  mostraCaricamento(false);
}
async function renderStamp(){
  try{
    const lista = await caricaListaCantieri();
    salvaCacheListaLocale(lista);
    const meta = lista.find(c => c.id === state.cantiereAttivoId);
    state.nomeCantiereAttivo = meta ? meta.nome : 'Cantiere';
    document.getElementById('stamp-nome-cantiere').textContent = state.nomeCantiereAttivo;
  }catch(e){
    if(!state.nomeCantiereAttivo) document.getElementById('stamp-nome-cantiere').textContent = '⚠ errore di connessione';
  }
}

      }catch(e){ alert('Errore nella creazione del cantiere: ' + e.message); }
      mostraCaricamento(false);
    };
    modal.querySelectorAll('[data-apri]').forEach(b => {
      b.onclick = async () => { await passaACantiere(b.dataset.apri); closeModal(); };
    });
    modal.querySelectorAll('[data-elimina]').forEach(b => {
      b.onclick = async () => {
        const id = b.dataset.elimina;
        const target = lista.find(c => c.id === id);
        const conferma = confirm(`Eliminare definitivamente "${target ? target.nome : ''}" e tutti i suoi dati? L'operazione non è reversibile.`);
        if(!conferma) return;
        mostraCaricamento(true);
        try{
          const nuovaLista = await eliminaCantiere(id);
          if(id === state.cantiereAttivoId){
            if(nuovaLista.length > 0){
              await passaACantiere(nuovaLista[0].id);
            } else {
              const nuovoId = await creaCantiere('Cantiere Principale');
              await passaACantiere(nuovoId);
            }
          }
          await disegnaModaleCantieri();
        }catch(e){ alert('Errore nell\'eliminazione: ' + e.message); }
        mostraCaricamento(false);
      };
    });
  }
}
async function esportaBackupCompleto(){
  mostraCaricamento(true);
  try{
    const lista = await caricaListaCantieri();
    const dati = {};
    for(const c of lista){ dati[c.id] = await caricaDatiCantiere(c.id); }
    const pacchetto = {
      app: 'gestione-cantiere',
      versione: 1,
      esportatoIl: new Date().toISOString(),
      cantieri: lista,
      dati: dati,
    };
    const blob = new Blob([JSON.stringify(pacchetto, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const oggi = todayISO();
    a.href = url;
    a.download = `backup-gestione-cantiere-${oggi}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    alert('Errore durante l\'esportazione: ' + e.message);
  }
  mostraCaricamento(false);
}
function importaBackupDaFile(file, onDone){
  const reader = new FileReader();
  reader.onload = async () => {
    let pacchetto;
    try{
      pacchetto = JSON.parse(reader.result);
    }catch(e){
      alert('Il file selezionato non è un backup valido (JSON non leggibile).');
      return;
    }
    if(!pacchetto || !Array.isArray(pacchetto.cantieri) || typeof pacchetto.dati !== 'object'){
      alert('Il file selezionato non ha il formato di backup atteso.');
      return;
    }
    const conferma = confirm(`Questo backup contiene ${pacchetto.cantieri.length} cantiere/i (esportato il ${fmtDate((pacchetto.esportatoIl||'').slice(0,10))}). Verranno sostituiti tutti i cantieri e i dati attualmente presenti su Google Sheets. Continuare?`);
    if(!conferma) return;
    mostraCaricamento(true);
    try{
      await salvaListaCantieri(pacchetto.cantieri);
      for(const id of Object.keys(pacchetto.dati)){
        await kvSet(dataKeyCantiere(id), pacchetto.dati[id]);
      }
      const primoId = pacchetto.cantieri[0] ? pacchetto.cantieri[0].id : null;
      if(primoId){
        await passaACantiere(primoId);
      }
      if(onDone) await onDone();
      alert('Backup importato correttamente.');
    }catch(e){
      alert('Errore durante l\'importazione: ' + e.message);
    }
    mostraCaricamento(false);
  };
  reader.onerror = () => alert('Impossibile leggere il file selezionato.');
  reader.readAsText(file);
}

/* ============ HELPERS ============ */
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toLocalISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const g = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${g}`;
}
function todayISO(){ return toLocalISODate(new Date()); }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtDataBreve(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y.slice(2)}`;
}
function fmtEuro(n){
  const v = Number(n)||0;
  return v.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function esc(s){ if(s === undefined || s === null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function truncate(s, n){ if(!s) return ''; return s.length>n ? s.slice(0,n-1)+'…' : s; }
function tipoColor(tipo){
  const map = {
    ordine: 'var(--blue)',
    lavorazione: 'var(--orange)',
    positivo: 'var(--green)',
    negativo: 'var(--red)',
    neutro: 'var(--muted)',
    nota: '#7C8891',
    appuntamento: 'var(--purple)',
  };
  return map[tipo] || 'var(--muted)';
}

/* ============ MODAL SYSTEM ============ */
function openModal({title, fields, values={}, onSubmit, submitLabel='Salva', pulsanteExtra}){
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  modal.style.maxWidth = '';
  modal.innerHTML = `
    <h3>${esc(title)}</h3>
    <form id="modal-form">
      ${fields.map(f => renderField(f, values[f.name])).join('')}
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Annulla</button>
        ${pulsanteExtra ? `<button type="button" class="btn ghost" id="modal-extra">${esc(pulsanteExtra.label)}</button>` : ''}
        <button type="submit" class="btn">${esc(submitLabel)}</button>
      </div>
    </form>
  `;
  overlay.classList.add('open');
  document.getElementById('modal-cancel').onclick = closeModal;
  fields.forEach(f => {
    if(f.type === 'dots'){
      const wrapper = document.getElementById('f-'+f.name+'-wrapper');
      const hidden = document.getElementById('f-'+f.name);
      if(wrapper){
        wrapper.querySelectorAll('.dot-picker-btn').forEach(btn => {
          btn.onclick = () => {
            const nuovo = (hidden.value === btn.dataset.dotValue) ? '' : btn.dataset.dotValue;
            hidden.value = nuovo;
            wrapper.querySelectorAll('.dot-picker-btn').forEach(b => { b.style.opacity = (b.dataset.dotValue === nuovo) ? '1' : '0.3'; b.style.transform = (b.dataset.dotValue === nuovo) ? 'scale(1.15)' : 'scale(1)'; });
          };
        });
      }
    }
  });
  function raccogliDati(){
    const data = {};
    fields.forEach(f => {
      const el = document.getElementById('f-'+f.name);
      if(f.type === 'checkbox'){ data[f.name] = el.checked; }
      else if(f.type === 'number' || f.type === 'dots'){ data[f.name] = el.value === '' ? null : Number(el.value); }
      else { data[f.name] = el.value; }
    });
    return data;
  }
  document.getElementById('modal-form').onsubmit = (e) => {
    e.preventDefault();
    const data = raccogliDati();
    closeModal();
    onSubmit(data);
  };
  if(pulsanteExtra){
    document.getElementById('modal-extra').onclick = () => {
      const form = document.getElementById('modal-form');
      if(!form.reportValidity()) return;
      const data = raccogliDati();
      pulsanteExtra.onClick(data);
    };
  }
}
const COLORI_MOTIVAZIONE = {1:'#C4423C', 2:'#E8720C', 3:'#F2B705', 4:'#6FB1D9', 5:'#1C86C7'};
function renderField(f, val){
  const v = val === undefined || val === null ? (f.default !== undefined ? f.default : '') : val;
  if(f.type === 'select'){
    return `<div class="field"><label>${esc(f.label)}</label>
      <select id="f-${f.name}">
        ${f.options.map(o => `<option value="${esc(o.value)}" ${o.value===v?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select></div>`;
  }
  if(f.type === 'textarea'){
    return `<div class="field"><label>${esc(f.label)}</label><textarea id="f-${f.name}" ${f.required?'required':''}>${esc(v)}</textarea></div>`;
  }
  if(f.type === 'checkbox'){
    return `<div class="field field-check"><input type="checkbox" id="f-${f.name}" ${v?'checked':''}><label style="margin:0;">${esc(f.label)}</label></div>`;
  }
  if(f.type === 'dots'){
    return `<div class="field">
      <label>${esc(f.label)}</label>
      <div id="f-${f.name}-wrapper" style="display:flex;gap:10px;align-items:center;margin-top:4px;">
        ${[1,2,3,4,5].map(n => `<button type="button" class="dot-picker-btn" data-dot-value="${n}" title="${n}" style="width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:${COLORI_MOTIVAZIONE[n]};opacity:${v==n?'1':'0.3'};transform:scale(${v==n?'1.15':'1'});transition:transform .1s ease, opacity .1s ease;"></button>`).join('')}
      </div>
      <input type="hidden" id="f-${f.name}" value="${v||''}">
    </div>`;
  }
  return `<div class="field"><label>${esc(f.label)}</label><input type="${f.type}" id="f-${f.name}" value="${esc(v)}" ${f.required?'required':''} ${f.step?`step="${f.step}"`:''}></div>`;
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });

function countUpcoming(){
  const now = new Date();
  const end = new Date(now.getTime() + 7*86400000);
  let count = 0;
  for(let d = new Date(now); d <= end; d.setDate(d.getDate()+1)){
    count += getEntriesForDate(toLocalISODate(d)).length;
  }
  return count;
}
function renderTopDeviationTable(){
  const rows = [...state.lavorazioni]
    .map(x => ({...x, scostamento: (x.statoAvanzamento - x.previsioneAvanzamento)}))
    .sort((a,b) => a.scostamento - b.scostamento)
    .slice(0,5);
  if(rows.length===0) return `<div class="empty-state">Nessuna lavorazione inserita ancora.</div>`;
  return `<div class="table-scroll"><table><thead><tr><th>Lavorazione</th><th>Avanzamento</th><th>Previsto</th><th>Scostamento</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.nome)}</td>
      <td class="mono">${r.statoAvanzamento}%</td>
      <td class="mono">${r.previsioneAvanzamento}%</td>
      <td>${r.scostamento < -5 ? `<span class="badge badge-red">${r.scostamento.toFixed(0)}%</span>` : r.scostamento > 5 ? `<span class="badge badge-green">+${r.scostamento.toFixed(0)}%</span>` : `<span class="badge badge-gray">${r.scostamento.toFixed(0)}%</span>`}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function apriModificaCampo(oggetto, campo, label, tipo, extra, alSalvare){

    fields: [Object.assign({name:'valore', label, type:tipo}, extra)],
    submitLabel: 'Salva',
    onSubmit: (data) => {
      oggetto[campo] = data.valore;
      persist();

async function scattaFotoLavorazione(r){
  const file = await apriFotocamera();
  if(!file) return;
  caricamentiFotoInCorso++;
  aggiornaIndicatoreCaricamentoFoto();
  try{
    const base64 = await ridimensionaImmagine(file);
    const risposta = await chiamaAzionePost('uploadFotoLavorazione', {
      cantiere: state.nomeCantiereAttivo || 'Cantiere',
      lavorazione: r.nome,
      percentuale: r.statoAvanzamento,
      imageBase64: base64,
      mimeType: 'image/jpeg',
    });
    r.numeroFoto = (r.numeroFoto || 0) + 1;
    r.cartellaFotoUrl = risposta.cartellaUrl;
    persist();
    if(state.section === 'lavorazioni') renderLavorazioni();
    mostraToast('📷 Foto caricata ✓');
  }catch(e){
    alert('Errore nel caricamento della foto: ' + e.message);
  }finally{
    caricamentiFotoInCorso--;
    aggiornaIndicatoreCaricamentoFoto();
  }
}
async function scattaFotoSnag(item){
  const file = await apriFotocamera();
  if(!file) return;
  caricamentiFotoInCorso++;
  aggiornaIndicatoreCaricamentoFoto();
  try{
    const base64 = await ridimensionaImmagine(file);
    const risposta = await chiamaAzionePost('uploadFotoSnag', {
      cantiere: state.nomeCantiereAttivo || 'Cantiere',
      voce: item.testo,
      imageBase64: base64,
      mimeType: 'image/jpeg',
      vecchioFileId: item.fotoFileId || null,
    });
    item.fotoUrl = risposta.fileUrl;
    item.fotoFileId = risposta.fileId;
    persist();
    if(state.section === 'lavorazioni') renderLavorazioni();
    mostraToast('📷 Foto caricata ✓');
  }catch(e){
    alert('Errore nel caricamento della foto: ' + e.message);
  }finally{
    caricamentiFotoInCorso--;
    aggiornaIndicatoreCaricamentoFoto();
  }
}
function renderLavorazioneRow(r){
  const completata = !!r.dataCompletamento;
  const scostamento = (r.statoAvanzamento||0) - (r.previsioneAvanzamento||0);
  const badge = scostamento < -5 ? `<span class="badge badge-red">in ritardo</span>` : scostamento > 5 ? `<span class="badge badge-green">in anticipo</span>` : `<span class="badge badge-gray">in linea</span>`;
  const rigaStile = completata ? 'style="opacity:0.6;"' : '';
  const today = todayISO();

  const intestazioneGruppo = (testo) => `<div style="font-size:9px;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-bottom:1px;line-height:1.3;">${testo}</div>`;
  const rigaCampo = (valore, id, label, formatta) => {
    const classe = valore ? 'valore-cliccabile' : 'valore-vuoto';
    const testo = valore ? formatta(valore) : '+ imposta';
    return `<tr>
      <td style="padding:0 8px 1px 0;border:none;color:var(--muted);white-space:nowrap;font-size:12px;line-height:1.3;">${label}</td>
      <td class="${classe}" id="${id}" style="padding:0 0 1px 0;border:none;white-space:nowrap;line-height:1.3;">${testo}</td>
    </tr>`;
  };

  // --- Costi: preventivo / stima (previsione EAC) / reale ---
  const hannoCosti = !!(r.costoPrevisto || r.previsioneCosto || r.costoEuro);
  let costBadge = '';
  if(r.previsioneCosto || r.costoPrevisto){
    costBadge = (r.previsioneCosto||0) > (r.costoPrevisto||0) ? `<span class="badge badge-red">sopra budget</span>` : `<span class="badge badge-green">entro budget</span>`;
  }
  const contenutoCosti = hannoCosti ? `
      ${intestazioneGruppo('Costi')}
      <table class="tabella-compatta" style="border-collapse:collapse;">
        ${rigaCampo(r.costoPrevisto, `campo-costoPrevisto-${r.id}`, 'Preventivo', fmtEuro)}
        ${rigaCampo(r.previsioneCosto, `campo-previsioneCosto-${r.id}`, 'Stima', fmtEuro)}
        ${rigaCampo(r.costoEuro, `campo-costoEuro-${r.id}`, 'Reale', fmtEuro)}
      </table>
      <div style="margin-top:1px;">${costBadge}</div>
  ` : '';

  // --- Ore: preventivo / stima / reali ---
  const orePreviste = Number(r.orePreviste||0);
  const oreEffettive = Number(r.costoOre||0);
  let oreBadge = '';
  if(orePreviste > 0 || oreEffettive > 0){
    oreBadge = oreEffettive > orePreviste ? `<span class="badge badge-red">sopra previste</span>` : `<span class="badge badge-green">entro previste</span>`;
  }
  const contenutoOre = `
      ${intestazioneGruppo('Ore')}
      <table class="tabella-compatta" style="border-collapse:collapse;">
        ${rigaCampo(r.orePreviste, `campo-orePreviste-${r.id}`, 'Preventivo', v => v+'h')}
        ${rigaCampo(r.orePrevisione, `campo-orePrevisione-${r.id}`, 'Stima', v => v+'h')}
        ${rigaCampo(r.costoOre, `campo-costoOre-${r.id}`, 'Reali', v => v+'h')}
      </table>
      <div style="margin-top:1px;">${oreBadge}</div>
  `;

  // --- Date: inizio / termine / fine (tabella 2 colonne x 3 righe) ---
  let tempoBadge = '';
  if(!completata && r.scadenzaPrevista){
    const giorni = Math.round((new Date(r.scadenzaPrevista) - new Date(today)) / 86400000);
    tempoBadge = giorni < 0 ? `<span class="badge badge-red">⚠ scaduta da ${Math.abs(giorni)} gg</span>` : `<span class="badge badge-green">${giorni} gg al termine</span>`;
  }
  const contenutoDate = `
      ${intestazioneGruppo('Date')}
      <table class="tabella-compatta" style="border-collapse:collapse;">
        ${rigaCampo(r.dataInizio, `campo-dataInizio-${r.id}`, 'Inizio', fmtDataBreve)}
        ${rigaCampo(r.scadenzaPrevista, `campo-scadenzaPrevista-${r.id}`, 'Termine', fmtDataBreve)}
        ${completata
          ? `<tr><td style="padding:0 8px 1px 0;border:none;color:var(--muted);white-space:nowrap;font-size:12px;line-height:1.3;">Fine</td><td class="valore-cliccabile" id="campo-dataCompletamento-${r.id}" style="padding:0 0 1px 0;border:none;white-space:nowrap;line-height:1.3;">✓ ${fmtDataBreve(r.dataCompletamento)}</td></tr>`
          : rigaCampo(r.dataCompletamento, `campo-dataCompletamento-${r.id}`, 'Fine', fmtDataBreve)}
      </table>
      <div style="margin-top:1px;">${tempoBadge}</div>
  `;

  return `<tr ${rigaStile} id="row-lav-${r.id}">
    <td style="vertical-align:top;"><strong>${esc(r.nome)}</strong>${r.categoria?`<div style="font-size:11px;color:var(--muted);">${esc(r.categoria)}</div>`:''}${r.contrattoSalId ? (() => { const c = state.contrattiSal.find(x=>x.id===r.contrattoSalId); return c ? `<div style="font-size:11px;color:var(--blue);">SAL: ${esc(c.fornitore)}</div>` : ''; })() : ''}${r.note ? `<div style="color:var(--muted);font-size:11px;">${esc(r.note)}</div>`:''}</td>
    <td style="min-width:180px;vertical-align:top;">
      <div class="bar-track"><div class="bar-fill" style="width:${clamp(r.statoAvanzamento,0,100)}%;"></div><div class="bar-marker" style="left:${clamp(r.previsioneAvanzamento,0,100)}%;"></div></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;">
        <div class="stepper">

          <button id="piu-avanzamento-${r.id}">+</button>
        </div>
        <div class="valore-cliccabile mono" id="campo-previsioneAvanzamento-${r.id}" style="font-size:11px;">previsto: ${r.previsioneAvanzamento||0}%</div>
      </div>
      <div style="margin-top:4px;">${badge}</div>
    </td>
    <td class="mono" style="vertical-align:top;padding-top:6px;padding-bottom:6px;${hannoCosti ? '' : 'padding-left:2px;padding-right:2px;'}">${contenutoCosti}</td>

      </div>

        const materialiOrdine = state.materialiDaOrdinare
          .filter(m => selezionati.includes(m.id))

async function scattaFotoBolla(r){
  const file = await apriFotocamera();
  if(!file) return;
  caricamentiFotoInCorso++;
  aggiornaIndicatoreCaricamentoFoto();
  try{
    const base64 = await ridimensionaImmagine(file);
    const risposta = await chiamaAzionePost('uploadFotoBolla', {
      cantiere: state.nomeCantiereAttivo || 'Cantiere',
      ordine: r.nome,
      imageBase64: base64,
      mimeType: 'image/jpeg',
      vecchioFileId: r.fotoFileId || null,
    });
    r.fotoUrl = risposta.fileUrl;
    r.fotoFileId = risposta.fileId;
    persist();
    if(state.section === 'ordini') renderOrdini();
    mostraToast('📷 Foto caricata ✓');
  }catch(e){
    alert('Errore nel caricamento della foto: ' + e.message);
  }finally{
    caricamentiFotoInCorso--;
    aggiornaIndicatoreCaricamentoFoto();
  }
}

function startOfWeek(d){
  const dt = new Date(d);
  const day = (dt.getDay()+6)%7; // lunedì = 0
  dt.setDate(dt.getDate()-day);
  dt.setHours(0,0,0,0);
  return dt;
}
function meseKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function logDelMese(p, d){
  const key = meseKey(d);
  return (p.log||[]).filter(l => (l.data||'').slice(0,7) === key);
}
function oreTotaliPersonaMese(p, d){
  return logDelMese(p, d).reduce((s,l) => s + Number(l.ore||0), 0);
}
function motivazioneMediaPersonaMese(p, d){
  const voci = logDelMese(p, d).filter(l => l.motivazione);
  if(voci.length === 0) return null;
  const media = voci.reduce((s,l) => s + Number(l.motivazione), 0) / voci.length;
  return media;
}
function pallinoMotivazione(valore, dimensione){
  dimensione = dimensione || 12;
  if(!valore) return '';
  const arrotondato = Math.round(valore);
  const colore = COLORI_MOTIVAZIONE[Math.min(5, Math.max(1, arrotondato))];
  return `<span title="Motivazione media: ${valore.toFixed(1)}/5" style="display:inline-block;width:${dimensione}px;height:${dimensione}px;border-radius:50%;background:${colore};vertical-align:middle;"></span>`;
}

async function generaPdfOrePersona(persona, mese){
  mostraCaricamento(true);
  try{
    await assicuraLibreriePdf();
    const { jsPDF } = window.jspdf;

    const giorni = logDelMese(persona, mese).sort((a,b)=>a.data.localeCompare(b.data));
    const totale = giorni.reduce((s,l)=>s+Number(l.ore||0),0);
    const nomeMese = `${MESI[mese.getMonth()]} ${mese.getFullYear()}`;

    const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    const margineSx = 14;
    const larghezzaPagina = doc.internal.pageSize.getWidth();
    let y = 16;

    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text(`Riepilogo ore — ${persona.nome}${persona.ruolo ? ' (' + persona.ruolo + ')' : ''}`, margineSx, y);
    y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text(`Generato il ${fmtDate(todayISO())}   ·   Cantiere: ${state.nomeCantiereAttivo || 'Cantiere'}   ·   Mese: ${nomeMese}`, margineSx, y);
    doc.setTextColor(0);
    y += 7;

    const gruppiPerGiorno = {};
    giorni.forEach(l => {
      if(!gruppiPerGiorno[l.data]) gruppiPerGiorno[l.data] = {data:l.data, ore:0, voci:[], note:[]};
      const g = gruppiPerGiorno[l.data];
      g.ore += Number(l.ore||0);
      const voce = risolviVoceOre(l);
      if(voce && !g.voci.includes(voce.nome)) g.voci.push(voce.nome);
      if(l.note) g.note.push(l.note);
    });
    const righeGiorni = Object.values(gruppiPerGiorno).sort((a,b)=>a.data.localeCompare(b.data));

    const corpo = righeGiorni.map(g => [
      fmtDate(g.data),
      String(g.ore),
      g.voci.length ? g.voci.join(', ') : '-',
      g.note.join('; '),
    ]);

    doc.autoTable({
      startY: y,
      head: [['Data', 'Ore', 'Lavorazione / Attività', 'Note']],
      body: corpo.length ? corpo : [['Nessuna ora registrata questo mese', '', '', '']],
      styles:{fontSize:9, cellPadding:1.8},
      headStyles:{fillColor:[22,35,46], textColor:255},
      columnStyles:{1:{halign:'center'}},
      margin:{left:margineSx, right:margineSx},
    });

    const yFinale = doc.lastAutoTable.finalY + 8;
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(`Totale ore mese: ${totale.toFixed(1)} h`, margineSx, yFinale);

    doc.setProperties({ title: `Ore ${persona.nome} - ${nomeMese}` });
    const urlAnteprima = doc.output('bloburl');
    window.open(urlAnteprima, '_blank');
    mostraToast('PDF pronto ✓');
  }catch(e){
    alert('Errore nella generazione del PDF: ' + e.message);
  }
  mostraCaricamento(false);
}
function openPersonaModal(existing){
  openModal({
    title: existing ? 'Modifica persona' : 'Nuova persona',
    values: existing || {},
    fields: [
      {name:'nome', label:'Nome', type:'text', required:true},
      {name:'ruolo', label:'Ruolo / mansione', type:'text'},
    ],
    onSubmit: (data) => {
      if(existing){ Object.assign(existing, data); }
      else { state.persone.push({id:uid(), log:[], ...data}); }
      persist(); renderAll();
    }
  });
}
function risolviVoceOre(logEntry){
  // Compatibilità con le vecchie voci che usavano solo "lavorazioneId"
  const chiave = logEntry.vociOreId || (logEntry.lavorazioneId ? ('lav:' + logEntry.lavorazioneId) : '');
  if(!chiave) return null;
  const [tipo, id] = chiave.split(':');
  if(tipo === 'lav'){
    const lav = state.lavorazioni.find(l => l.id === id);
    return lav ? {tipo:'lavorazione', oggetto: lav, nome: lav.nome} : null;
  }
  if(tipo === 'att'){
    const att = state.attivitaOre.find(a => a.id === id);
    return att ? {tipo:'attivita', oggetto: att, nome: att.nome} : null;
  }
  return null;
}
function openOreModal(persona){
  const lavorazioniAperte = state.lavorazioni.filter(l => !l.dataCompletamento);
  openModal({
    title: `Registra ore — ${persona.nome}`,
    values: {data: todayISO()},
    fields: [
      {name:'data', label:'Data', type:'date', required:true},
      {name:'ore', label:'Ore lavorate', type:'number', step:'0.5', required:true},
      {name:'vociOreId', label:'Lavorazione / Attività (opzionale)', type:'select', options: [
        {value:'', label:'— Nessuna / generale —'},
        {value:'__nuova_lav__', label:'+ Nuova lavorazione…'},
        {value:'__nuova_att__', label:'+ Nuova attività non produttiva…'},
        ...lavorazioniAperte.map(l => ({value:'lav:'+l.id, label:'🔧 '+l.nome})),
        ...state.attivitaOre.map(a => ({value:'att:'+a.id, label:'🧹 '+a.nome})),
      ]},
      {name:'motivazione', label:'MOTIVAZIONE / RENDIMENTO (opzionale)', type:'dots'},
      {name:'note', label:'Note', type:'text'},
    ],
    onSubmit: (data) => {
      persona.log = persona.log || [];
      persona.log.push({id:uid(), ...data});
      if(data.vociOreId){
        const [tipo, id] = data.vociOreId.split(':');
        if(tipo === 'lav'){
          const lav = state.lavorazioni.find(l => l.id === id);
          if(lav) lav.costoOre = (Number(lav.costoOre)||0) + Number(data.ore||0);
        } else if(tipo === 'att'){
          const att = state.attivitaOre.find(a => a.id === id);
          if(att) att.costoOre = (Number(att.costoOre)||0) + Number(data.ore||0);
        }
      }
      persist(); renderAll();
    }
  });
  const selectVoce = document.getElementById('f-vociOreId');
  if(selectVoce){
    selectVoce.onchange = () => {
      if(selectVoce.value === '__nuova_lav__'){
        const nome = prompt('Nome della nuova lavorazione:');
        if(!nome || !nome.trim()){ selectVoce.value = ''; return; }
        const nuova = {id:uid(), nome:nome.trim(), statoAvanzamento:0, previsioneAvanzamento:0};
        state.lavorazioni.push(nuova);
        persist();
        mostraToast('Lavorazione creata ✓');
        const opzione = document.createElement('option');
        opzione.value = 'lav:'+nuova.id;
        opzione.textContent = '🔧 '+nuova.nome;
        const ancora = selectVoce.querySelector('option[value="__nuova_att__"]');
        selectVoce.insertBefore(opzione, ancora ? ancora.nextSibling : null);
        selectVoce.value = 'lav:'+nuova.id;
      } else if(selectVoce.value === '__nuova_att__'){
        const nome = prompt('Nome della nuova attività (es. Pulizie, Trasporti, Magazzino, Riunioni):');
        if(!nome || !nome.trim()){ selectVoce.value = ''; return; }
        const nuova = {id:uid(), nome:nome.trim(), costoOre:0};
        state.attivitaOre.push(nuova);
        persist();
        mostraToast('Attività creata ✓');
        const opzione = document.createElement('option');
        opzione.value = 'att:'+nuova.id;
        opzione.textContent = '🧹 '+nuova.nome;
        selectVoce.appendChild(opzione);
        selectVoce.value = 'att:'+nuova.id;
      }
    };
  }
}

  const q = testoRicerca.toLowerCase();
  const campi = [fmtDate(voce.data), voce.attivita||'', voce.commenti||''].join(' ').toLowerCase();
  return campi.includes(q);
}

  {value:'economico', label:'Economico'},
  {value:'temporale', label:'Temporale'},
  {value:'immagine', label:'Immagine/reputazione'},
  {value:'sicurezza', label:'Sicurezza'},

const LIVELLI_PROBABILITA_IMPATTO = [

  {value:'media', label:'Media'},

];
const STATI_RISCHIO = [

  {value:'sotto_controllo', label:'Sotto controllo'},

function valoreLivello(v){ return {bassa:1, media:2, alta:3}[v] || 1; }
function calcolaRischio(r){
  const probabilita = valoreLivello(r.probabilita);
  const impattoPeggiore = Math.max(valoreLivello(r.impattoEconomico), valoreLivello(r.impattoTemporale), valoreLivello(r.impattoImmagine));
  const punteggio = probabilita * impattoPeggiore;
  let livello, colore;
  if(punteggio <= 2){ livello = 'Basso'; colore = 'green'; }
  else if(punteggio <= 4){ livello = 'Medio'; colore = 'orange'; }
  else { livello = 'Alto'; colore = 'red'; }
  return { punteggio, livello, colore };
}
