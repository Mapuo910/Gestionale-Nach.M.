magazzino, riunioni...'}<\/div>\n        <span class=\"card-flag flag-blue\">${state.attivitaOre.length} attivit\u00e0 tracciate<\/span>\n      <\/div>\n    <\/div>\n\n    ${avvisiAvvio.length>0 ? `\n    <div class=\"subsection-title\">Avvisi avvio lavorazioni<\/div>\n    <table><thead><tr><th>Lavorazione<\/th><th>Data inizio<\/th><th>Stato<\/th><\/tr><\/thead>\n      <tbody>${avvisiAvvio.map(x => {\n        const inRitardoAvvio = x.dataInizio < today;\n        return `<tr>\n          <td>${esc(x.nome)}<\/td>\n          <td class=\"mono\">${fmtDate(x.dataInizio)}<\/td>\n          <td>${inRitardoAvvio ? `<span class=\"badge badge-red\">\u26a0 da avviare, in ritardo<\/span>` : `<span class=\"badge badge-orange\">in partenza tra ${Math.round((new Date(x.dataInizio) - new Date(today))/86400000)} giorni<\/span>`}<\/td>\n        <\/tr>`;\n      }).join('')}<\/tbody><\/table>\n    ` : ''}\n\n    ${costiPerCategoria.length>1 || (costiPerCategoria.length===1 && costiPerCategoria[0].nome!=='Senza categoria') ? `\n    <div class=\"subsection-title\">Costi per categoria / squadra<\/div>\n    <table><thead><tr><th>Categoria<\/th><th>Lavorazioni<\/th><th>Preventivo<\/th><th>Reale<\/th><\/tr><\/thead>\n      <tbody>${costiPerCategoria.map(c => `<tr>\n        <td>${esc(c.nome)}<\/td>\n        <td class=\"mono\">${c.numero}<\/td>\n        <td class=\"mono\">${fmtEuro(c.preventivo)}<\/td>\n        <td class=\"mono\">${fmtEuro(c.reale)}${c.reale > c.preventivo && c.preventivo>0 ? ` <span class=\"badge badge-red\">sopra<\/span>` : ''}<\/td>\n      <\/tr>`).join('')}<\/tbody><\/table>\n    ` : ''}\n\n    <div class=\"subsection-title\">Lavorazioni con maggiore scostamento<\/div>\n    ${renderTopDeviationTable()}\n  `;\n  document.querySelectorAll('[data-goto]').forEach(c => {\n    c.onclick = () => { state.section = c.dataset.goto; renderAll(); };\n  });\n  document.getElementById('genera-report-btn').onclick = () => apriModaleReportSettimanale();\n  document.getElementById('genera-report-mensile-btn').onclick = () => apriModaleReportMensile();\n}\nfunction countUpcoming(){\n  const now = new Date();\n  const end = new Date(now.getTime() + 7*86400000);\n  let count = 0;\n  for(let d = new Date(now); d <= end; d.setDate(d.getDate()+1)){\n    count += getEntriesForDate(toLocalISODate(d)).length;\n  }\n  return count;\n}\nfunction renderTopDeviationTable(){\n  const rows = [...state.lavorazioni]\n    .map(x => ({...x, scostamento: (x.statoAvanzamento - x.previsioneAvanzamento)}))\n    .sort((a,b) => a.scostamento - b.scostamento)\n    .slice(0,5);\n  if(rows.length===0) return `<div class=\"empty-state\">Nessuna lavorazione inserita ancora.<\/div>`;\n  return `<div class=\"table-scroll\"><table><thead><tr><th>Lavorazione<\/th><th>Avanzamento<\/th><th>Previsto<\/th><th>Scostamento<\/th><\/tr><\/thead>\n    <tbody>${rows.map(r => `<tr>\n      <td>${esc(r.nome)}<\/td>\n      <td class=\"mono\">${r.statoAvanzamento}%<\/td>\n      <td class=\"mono\">${r.previsioneAvanzamento}%<\/td>\n      <td>${r.scostamento < -5 ? `<span class=\"badge badge-red\">${r.scostamento.toFixed(0)}%<\/span>` : r.scostamento > 5 ? `<span class=\"badge badge-green\">+${r.scostamento.toFixed(0)}%<\/span>` : `<span class=\"badge badge-gray\">${r.scostamento.toFixed(0)}%<\/span>`}<\/td>\n    <\/tr>`).join('')}<\/tbody><\/table><\/div>`;\n}\n\n/* ============ LAVORAZIONI ============ */\nfunction apriModificaCampo(oggetto, campo, label, tipo, extra, alSalvare){\n  extra = extra || {};\n  openModal({\n    title: label,\n    values: {valore: oggetto[campo]},\n    fields: [Object.assign({name:'valore', label, type:tipo}, extra)],\n    submitLabel: 'Salva',\n    onSubmit: (data) => {\n      oggetto[campo] = data.valore;\n      persist();\n      if(alSalvare) alSalvare();\n    }\n  });\n}\nfunction renderLavorazioni(){\n  const scrollPrecedente = catturaScrollOrizzontale();\n  const categorieDisponibili = [...new Set(state.lavorazioni.map(r => (r.categoria||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));\n  const passaFiltro = r => !state.lavorazioniFiltroCategoria || (r.categoria||'').trim() === state.lavorazioniFiltroCategoria;\n  const aperte = state.lavorazioni.filter(r => !r.dataCompletamento).filter(passaFiltro);\n  const completate = state.lavorazioni.filter(r => r.dataCompletamento).filter(passaFiltro)\n    .sort((a,b) => (b.dataCompletamento||'').localeCompare(a.dataCompletamento||''));\n  const attivitaDaFare = (state.attivitaVarie||[]).filter(a => !a.fatto);\n  const attivitaCompletate = (state.attivitaVarie||[]).filter(a => a.fatto);\n\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Lavorazioni<\/h2><p class=\"section-sub\">Avanzamento fisico, costi e ore (previste / effettive) di ogni lavorazione. Le lavorazioni completate si archiviano a scomparsa qui sotto.<\/p><\/div>\n      <button class=\"btn\" id=\"add-lavorazione\">+ Nuova lavorazione<\/button>\n    <\/div>\n    ${categorieDisponibili.length>0 ? `\n    <div class=\"toolbar\" style=\"gap:8px;\">\n      <select id=\"filtro-categoria-lavorazioni\" style=\"padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n        <option value=\"\">Tutte le categorie/squadre<\/option>\n        ${categorieDisponibili.map(c => `<option value=\"${esc(c)}\" ${state.lavorazioniFiltroCategoria===c?'selected':''}>${esc(c)}<\/option>`).join('')}\n      <\/select>\n    <\/div>` : ''}\n    ${aperte.length===0 ? emptyState('Nessuna lavorazione aperta', 'Aggiungi una lavorazione per iniziare a tracciare avanzamento, costi e ore.') : `\n    <div class=\"table-scroll\"><table class=\"tabella-compatta\"><thead><tr>\n      <th>Nome<\/th><th>Avanzamento<\/th><th>Costi<\/th><th>Ore<\/th><th>Date<\/th><th><\/th>\n    <\/tr><\/thead>\n    <tbody>${aperte.map(r => renderLavorazioneRow(r)).join('')}<\/tbody><\/table><\/div>`}\n\n    ${completate.length>0 ? `\n    <details id=\"dettaglio-lavorazioni-completate\" style=\"margin-top:18px;\" ${uiDettagliAperti['lavorazioni-completate']?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:10px 0;color:var(--muted);font-size:13px;\">Lavorazioni completate (${completate.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div class=\"table-scroll\" style=\"margin-top:10px;\"><table class=\"tabella-compatta\"><thead><tr>\n        <th>Nome<\/th><th>Avanzamento<\/th><th>Costi<\/th><th>Ore<\/th><th>Date<\/th><th><\/th>\n      <\/tr><\/thead>\n      <tbody>${completate.map(r => renderLavorazioneRow(r)).join('')}<\/tbody><\/table><\/div>\n    <\/details>` : ''}\n\n    <div class=\"subsection-title\" style=\"margin-top:32px;\">Attivit\u00e0 (non produttive)<\/div>\n    <p class=\"section-sub\" style=\"margin-top:-6px;\">Ore su pulizie, trasporti, gestione magazzino, riunioni e altro non quotato nel computo metrico. Nessun budget o data, solo il totale ore.<\/p>\n    <div class=\"toolbar\" style=\"gap:8px;\">\n      <input type=\"text\" id=\"nuova-attivita-ore-testo\" placeholder=\"Nome nuova attivit\u00e0 (es. Pulizie cantiere)\u2026\" style=\"flex:1;padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n      <button class=\"btn\" id=\"aggiungi-attivita-ore-btn\">+ Aggiungi<\/button>\n    <\/div>\n    ${state.attivitaOre.length===0 ? `<div style=\"color:var(--muted);font-size:13px;padding:14px 0;\">Nessuna attivit\u00e0 non produttiva registrata.<\/div>` : `\n    <div id=\"lista-attivita-ore\">\n      ${[...state.attivitaOre].sort((a,b)=>Number(b.costoOre||0)-Number(a.costoOre||0)).map(a => `\n        <div class=\"day-entry\" style=\"align-items:center;\">\n          <div>${esc(a.nome)} <span class=\"mono\" style=\"color:var(--muted);font-size:12px;\">\u2014 ${Number(a.costoOre||0)} h totali<\/span><\/div>\n          <div class=\"row-actions\">\n            <button class=\"icon-btn\" id=\"rinomina-attivita-ore-${a.id}\">Rinomina<\/button>\n            <button class=\"icon-btn\" id=\"del-attivita-ore-${a.id}\">Elimina<\/button>\n          <\/div>\n        <\/div>\n      `).join('')}\n    <\/div>`}\n\n    <div class=\"subsection-title\" style=\"margin-top:32px;\">Snag list<\/div>\n    <p class=\"section-sub\" style=\"margin-top:-6px;\">Piccoli compiti senza scadenza n\u00e9 budget: da fare quando capita un momento libero.<\/p>\n    <div class=\"toolbar\" style=\"gap:8px;\">\n      <input type=\"text\" id=\"nuova-attivita-testo\" placeholder=\"Scrivi una cosa da fare e premi Invio\u2026\" style=\"flex:1;padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n      <button class=\"btn\" id=\"aggiungi-attivita-btn\">+ Aggiungi<\/button>\n    <\/div>\n    ${attivitaDaFare.length===0 ? `<div style=\"color:var(--muted);font-size:13px;padding:14px 0;\">Nessuna attivit\u00e0 da fare in lista.<\/div>` : `\n    <div id=\"lista-attivita-varie\">\n      ${attivitaDaFare.map(a => `\n        <div class=\"day-entry\" style=\"align-items:center;\">\n          <label style=\"display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;\">\n            <input type=\"checkbox\" data-toggle-attivita=\"${a.id}\" style=\"width:16px;height:16px;\">\n            <span>${esc(a.testo)}<\/span>\n          <\/label>\n          <button class=\"icon-btn\" ${a.fotoUrl ? `data-vedi-foto-attivita=\"${a.id}\"` : `data-foto-attivita=\"${a.id}\"`}>${a.fotoUrl ? '\ud83d\uddbc Vedi foto' : '\ud83d\udcf7 Foto'}<\/button>\n          <button class=\"icon-btn\" data-elimina-attivita=\"${a.id}\">Elimina<\/button>\n        <\/div>\n      `).join('')}\n    <\/div>`}\n\n    ${attivitaCompletate.length>0 ? `\n    <details id=\"dettaglio-attivita-completate\" style=\"margin-top:14px;\" ${uiDettagliAperti['attivita-completate']?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:10px 0;color:var(--muted);font-size:13px;\">Attivit\u00e0 completate (${attivitaCompletate.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div style=\"margin-top:8px;\">\n        ${attivitaCompletate.map(a => `\n          <div class=\"day-entry\" style=\"align-items:center;\">\n            <label style=\"display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;color:var(--muted);text-decoration:line-through;\">\n              <input type=\"checkbox\" data-toggle-attivita=\"${a.id}\" checked style=\"width:16px;height:16px;\">\n              <span>${esc(a.testo)}<\/span>\n            <\/label>\n            <button class=\"icon-btn\" ${a.fotoUrl ? `data-vedi-foto-attivita=\"${a.id}\"` : `data-foto-attivita=\"${a.id}\"`}>${a.fotoUrl ? '\ud83d\uddbc Vedi foto' : '\ud83d\udcf7 Foto'}<\/button>\n            <button class=\"icon-btn\" data-elimina-attivita=\"${a.id}\">Elimina<\/button>\n          <\/div>\n        `).join('')}\n      <\/div>\n    <\/details>` : ''}\n  `;\n  ripristinaScrollOrizzontale(scrollPrecedente);\n  document.getElementById('add-lavorazione').onclick = () => openLavorazioneModal();\n  const filtroCategoriaLav = document.getElementById('filtro-categoria-lavorazioni');\n  if(filtroCategoriaLav) filtroCategoriaLav.onchange = (e) => { state.lavorazioniFiltroCategoria = e.target.value; renderLavorazioni(); };\n  const dettLavCompletate = document.getElementById('dettaglio-lavorazioni-completate');\n  if(dettLavCompletate) dettLavCompletate.addEventListener('toggle', function(){ uiDettagliAperti['lavorazioni-completate'] = this.open; });\n  const dettAttCompletate = document.getElementById('dettaglio-attivita-completate');\n  if(dettAttCompletate) dettAttCompletate.addEventListener('toggle', function(){ uiDettagliAperti['attivita-completate'] = this.open; });\n  const inputAttivitaOre = document.getElementById('nuova-attivita-ore-testo');\n  const aggiungiAttivitaOreBtn = document.getElementById('aggiungi-attivita-ore-btn');\n  function aggiungiAttivitaOreDaInput(){\n    const nome = inputAttivitaOre.value.trim();\n    if(!nome) return;\n    state.attivitaOre.push({id:uid(), nome, costoOre:0});\n    persist();\n    renderLavorazioni();\n  }\n  if(aggiungiAttivitaOreBtn) aggiungiAttivitaOreBtn.onclick = aggiungiAttivitaOreDaInput;\n  if(inputAttivitaOre){\n    inputAttivitaOre.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); aggiungiAttivitaOreDaInput(); } };\n  }\n  state.attivitaOre.forEach(a => {\n    const rinominaBtn = document.getElementById('rinomina-attivita-ore-'+a.id);\n    const delBtn = document.getElementById('del-attivita-ore-'+a.id);\n    if(rinominaBtn) rinominaBtn.onclick = () => apriModificaCampo(a, 'nome', 'Nome attivit\u00e0', 'text', {required:true}, renderLavorazioni);\n    if(delBtn) delBtn.onclick = () => { if(confirm(`Eliminare l'attivit\u00e0 \"${a.nome}\"? Lo storico ore gi\u00e0 registrato rester\u00e0 visibile ma senza collegamento.`)){ state.attivitaOre = state.attivitaOre.filter(x=>x.id!==a.id); persist(); renderLavorazioni(); } };\n  });\n  state.lavorazioni.forEach(r => {\n    const editBtn = document.getElementById('edit-lav-'+r.id);\n    const delBtn = document.getElementById('del-lav-'+r.id);\n    const completaBtn = document.getElementById('completa-lav-'+r.id);\n    const riapriBtn = document.getElementById('riapri-lav-'+r.id);\n    const fotoBtn = document.getElementById('foto-lav-'+r.id);\n    const vediFotoBtn = document.getElementById('vedi-foto-lav-'+r.id);\n    const menoBtn = document.getElementById('meno-avanzamento-'+r.id);\n    const piuBtn = document.getElementById('piu-avanzamento-'+r.id);\n    if(editBtn) editBtn.onclick = () => openLavorazioneModal(r);\n    if(delBtn) delBtn.onclick = () => { state.lavorazioni = state.lavorazioni.filter(x=>x.id!==r.id); persist(); renderAll(); };\n    if(completaBtn) completaBtn.onclick = () => { r.dataCompletamento = todayISO(); r.statoAvanzamento = 100; persist(); renderLavorazioni(); };\n    if(riapriBtn) riapriBtn.onclick = () => { r.dataCompletamento = null; persist(); renderLavorazioni(); };\n    if(fotoBtn) fotoBtn.onclick = () => scattaFotoLavorazione(r);\n    if(vediFotoBtn) vediFotoBtn.onclick = () => window.open(r.cartellaFotoUrl, '_blank');\n    if(menoBtn) menoBtn.onclick = () => { r.statoAvanzamento = clamp((Number(r.statoAvanzamento)||0) - 5, 0, 100); persist(); renderLavorazioni(); };\n    if(piuBtn) piuBtn.onclick = () => { r.statoAvanzamento = clamp((Number(r.statoAvanzamento)||0) + 5, 0, 100); persist(); renderLavorazioni(); };\n    const campiClic = [\n      {id:`campo-costoPrevisto-${r.id}`, campo:'costoPrevisto', label:'Costo preventivo (\u20ac)', tipo:'number', extra:{step:'0.01'}},\n      {id:`campo-previsioneCosto-${r.id}`, campo:'previsioneCosto', label:'Costo target \u2014 previsione a completamento (\u20ac)', tipo:'number', extra:{step:'0.01'}},\n      {id:`campo-costoEuro-${r.id}`, campo:'costoEuro', label:'Costo effettivo (\u20ac)', tipo:'number', extra:{step:'0.01'}},\n      {id:`campo-orePreviste-${r.id}`, campo:'orePreviste', label:'Ore preventivate', tipo:'number', extra:{step:'0.5'}},\n      {id:`campo-orePrevisione-${r.id}`, campo:'orePrevisione', label:'Ore target \u2014 previsione a completamento', tipo:'number', extra:{step:'0.5'}},\n      {id:`campo-costoOre-${r.id}`, campo:'costoOre', label:'Ore effettive impiegate', tipo:'number', extra:{step:'0.5'}},\n      {id:`campo-dataInizio-${r.id}`, campo:'dataInizio', label:'Data inizio', tipo:'date', extra:{}},\n      {id:`campo-scadenzaPrevista-${r.id}`, campo:'scadenzaPrevista', label:'Data stima fine', tipo:'date', extra:{}},\n      {id:`campo-dataCompletamento-${r.id}`, campo:'dataCompletamento', label:'Data fine effettiva', tipo:'date', extra:{}},\n      {id:`campo-previsioneAvanzamento-${r.id}`, campo:'previsioneAvanzamento', label:'Previsione avanzamento a oggi (%)', tipo:'number', extra:{step:'1'}},\n    ];\n    campiClic.forEach(c => {\n      const el = document.getElementById(c.id);\n      if(el) el.onclick = () => apriModificaCampo(r, c.campo, c.label, c.tipo, c.extra, renderLavorazioni);\n    });\n  });\n  const inputAttivita = document.getElementById('nuova-attivita-testo');\n  const aggiungiAttivitaBtn = document.getElementById('aggiungi-attivita-btn');\n  function aggiungiAttivitaDaInput(){\n    const testo = inputAttivita.value.trim();\n    if(!testo) return;\n    state.attivitaVarie.push({id:uid(), testo, fatto:false});\n    persist();\n    renderLavorazioni();\n  }\n  if(aggiungiAttivitaBtn) aggiungiAttivitaBtn.onclick = aggiungiAttivitaDaInput;\n  if(inputAttivita){\n    inputAttivita.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); aggiungiAttivitaDaInput(); } };\n  }\n  document.querySelectorAll('[data-toggle-attivita]').forEach(cb => {\n    cb.onchange = () => {\n      const item = state.attivitaVarie.find(a => a.id === cb.dataset.toggleAttivita);\n      if(item){ item.fatto = cb.checked; persist(); renderLavorazioni(); }\n    };\n  });\n  document.querySelectorAll('[data-elimina-attivita]').forEach(btn => {\n    btn.onclick = () => {\n      state.attivitaVarie = state.attivitaVarie.filter(a => a.id !== btn.dataset.eliminaAttivita);\n      persist();\n      renderLavorazioni();\n    };\n  });\n  document.querySelectorAll('[data-foto-attivita]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.attivitaVarie.find(a => a.id === btn.dataset.fotoAttivita);\n      if(item) scattaFotoSnag(item);\n    };\n  });\n  document.querySelectorAll('[data-vedi-foto-attivita]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.attivitaVarie.find(a => a.id === btn.dataset.vediFotoAttivita);\n      if(item && item.fotoUrl) window.open(item.fotoUrl, '_blank');\n    };\n  });\n}\nasync function scattaFotoLavorazione(r){\n  const file = await apriFotocamera();\n  if(!file) return;\n  caricamentiFotoInCorso++;\n  aggiornaIndicatoreCaricamentoFoto();\n  try{\n    const base64 = await ridimensionaImmagine(file);\n    const risposta = await chiamaAzionePost('uploadFotoLavorazione', {\n      cantiere: state.nomeCantiereAttivo || 'Cantiere',\n      lavorazione: r.nome,\n      percentuale: r.statoAvanzamento,\n      imageBase64: base64,\n      mimeType: 'image/jpeg',\n    });\n    r.numeroFoto = (r.numeroFoto || 0) + 1;\n    r.cartellaFotoUrl = risposta.cartellaUrl;\n    persist();\n    if(state.section === 'lavorazioni') renderLavorazioni();\n    mostraToast('\ud83d\udcf7 Foto caricata \u2713');\n  }catch(e){\n    alert('Errore nel caricamento della foto: ' + e.message);\n  }finally{\n    caricamentiFotoInCorso--;\n    aggiornaIndicatoreCaricamentoFoto();\n  }\n}\nasync function scattaFotoSnag(item){\n  const file = await apriFotocamera();\n  if(!file) return;\n  caricamentiFotoInCorso++;\n  aggiornaIndicatoreCaricamentoFoto();\n  try{\n    const base64 = await ridimensionaImmagine(file);\n    const risposta = await chiamaAzionePost('uploadFotoSnag', {\n      cantiere: state.nomeCantiereAttivo || 'Cantiere',\n      voce: item.testo,\n      imageBase64: base64,\n      mimeType: 'image/jpeg',\n      vecchioFileId: item.fotoFileId || null,\n    });\n    item.fotoUrl = risposta.fileUrl;\n    item.fotoFileId = risposta.fileId;\n    persist();\n    if(state.section === 'lavorazioni') renderLavorazioni();\n    mostraToast('\ud83d\udcf7 Foto caricata \u2713');\n  }catch(e){\n    alert('Errore nel caricamento della foto: ' + e.message);\n  }finally{\n    caricamentiFotoInCorso--;\n    aggiornaIndicatoreCaricamentoFoto();\n  }\n}\nfunction renderLavorazioneRow(r){\n  const completata = !!r.dataCompletamento;\n  const scostamento = (r.statoAvanzamento||0) - (r.previsioneAvanzamento||0);\n  const badge = scostamento < -5 ? `<span class=\"badge badge-red\">in ritardo<\/span>` : scostamento > 5 ? `<span class=\"badge badge-green\">in anticipo<\/span>` : `<span class=\"badge badge-gray\">in linea<\/span>`;\n  const rigaStile = completata ? 'style=\"opacity:0.6;\"' : '';\n  const today = todayISO();\n\n  const intestazioneGruppo = (testo) => `<div style=\"font-size:9px;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-bottom:1px;line-height:1.3;\">${testo}<\/div>`;\n  const rigaCampo = (valore, id, label, formatta) => {\n    const classe = valore ? 'valore-cliccabile' : 'valore-vuoto';\n    const testo = valore ? formatta(valore) : '+ imposta';\n    return `<tr>\n      <td style=\"padding:0 8px 1px 0;border:none;color:var(--muted);white-space:nowrap;font-size:12px;line-height:1.3;\">${label}<\/td>\n      <td class=\"${classe}\" id=\"${id}\" style=\"padding:0 0 1px 0;border:none;white-space:nowrap;line-height:1.3;\">${testo}<\/td>\n    <\/tr>`;\n  };\n\n  // --- Costi: preventivo / stima (previsione EAC) / reale ---\n  const hannoCosti = !!(r.costoPrevisto || r.previsioneCosto || r.costoEuro);\n  let costBadge = '';\n  if(r.previsioneCosto || r.costoPrevisto){\n    costBadge = (r.previsioneCosto||0) > (r.costoPrevisto||0) ? `<span class=\"badge badge-red\">sopra budget<\/span>` : `<span class=\"badge badge-green\">entro budget<\/span>`;\n  }\n  const contenutoCosti = hannoCosti ? `\n      ${intestazioneGruppo('Costi')}\n      <table class=\"tabella-compatta\" style=\"border-collapse:collapse;\">\n        ${rigaCampo(r.costoPrevisto, `campo-costoPrevisto-${r.id}`, 'Preventivo', fmtEuro)}\n        ${rigaCampo(r.previsioneCosto, `campo-previsioneCosto-${r.id}`, 'Stima', fmtEuro)}\n        ${rigaCampo(r.costoEuro, `campo-costoEuro-${r.id}`, 'Reale', fmtEuro)}\n      <\/table>\n      <div style=\"margin-top:1px;\">${costBadge}<\/div>\n  ` : '';\n\n  // --- Ore: preventivo / stima / reali ---\n  const orePreviste = Number(r.orePreviste||0);\n  const oreEffettive = Number(r.costoOre||0);\n  let oreBadge = '';\n  if(orePreviste > 0 || oreEffettive > 0){\n    oreBadge = oreEffettive > orePreviste ? `<span class=\"badge badge-red\">sopra previste<\/span>` : `<span class=\"badge badge-green\">entro previste<\/span>`;\n  }\n  const contenutoOre = `\n      ${intestazioneGruppo('Ore')}\n      <table class=\"tabella-compatta\" style=\"border-collapse:collapse;\">\n        ${rigaCampo(r.orePreviste, `campo-orePreviste-${r.id}`, 'Preventivo', v => v+'h')}\n        ${rigaCampo(r.orePrevisione, `campo-orePrevisione-${r.id}`, 'Stima', v => v+'h')}\n        ${rigaCampo(r.costoOre, `campo-costoOre-${r.id}`, 'Reali', v => v+'h')}\n      <\/table>\n      <div style=\"margin-top:1px;\">${oreBadge}<\/div>\n  `;\n\n  // --- Date: inizio / termine / fine (tabella 2 colonne x 3 righe) ---\n  let tempoBadge = '';\n  if(!completata && r.scadenzaPrevista){\n    const giorni = Math.round((new Date(r.scadenzaPrevista) - new Date(today)) / 86400000);\n    tempoBadge = giorni < 0 ? `<span class=\"badge badge-red\">\u26a0 scaduta da ${Math.abs(giorni)} gg<\/span>` : `<span class=\"badge badge-green\">${giorni} gg al termine<\/span>`;\n  }\n  const contenutoDate = `\n      ${intestazioneGruppo('Date')}\n      <table class=\"tabella-compatta\" style=\"border-collapse:collapse;\">\n        ${rigaCampo(r.dataInizio, `campo-dataInizio-${r.id}`, 'Inizio', fmtDataBreve)}\n        ${rigaCampo(r.scadenzaPrevista, `campo-scadenzaPrevista-${r.id}`, 'Termine', fmtDataBreve)}\n        ${completata\n          ? `<tr><td style=\"padding:0 8px 1px 0;border:none;color:var(--muted);white-space:nowrap;font-size:12px;line-height:1.3;\">Fine<\/td><td class=\"valore-cliccabile\" id=\"campo-dataCompletamento-${r.id}\" style=\"padding:0 0 1px 0;border:none;white-space:nowrap;line-height:1.3;\">\u2713 ${fmtDataBreve(r.dataCompletamento)}<\/td><\/tr>`\n          : rigaCampo(r.dataCompletamento, `campo-dataCompletamento-${r.id}`, 'Fine', fmtDataBreve)}\n      <\/table>\n      <div style=\"margin-top:1px;\">${tempoBadge}<\/div>\n  `;\n\n  return `<tr ${rigaStile} id=\"row-lav-${r.id}\">\n    <td style=\"vertical-align:top;\"><strong>${esc(r.nome)}<\/strong>${r.categoria?`<div style=\"font-size:11px;color:var(--muted);\">${esc(r.categoria)}<\/div>`:''}${r.contrattoSalId ? (() => { const c = state.contrattiSal.find(x=>x.id===r.contrattoSalId); return c ? `<div style=\"font-size:11px;color:var(--blue);\">SAL: ${esc(c.fornitore)}<\/div>` : ''; })() : ''}${r.note ? `<div style=\"color:var(--muted);font-size:11px;\">${esc(r.note)}<\/div>`:''}<\/td>\n    <td style=\"min-width:180px;vertical-align:top;\">\n      <div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:${clamp(r.statoAvanzamento,0,100)}%;\"><\/div><div class=\"bar-marker\" style=\"left:${clamp(r.previsioneAvanzamento,0,100)}%;\"><\/div><\/div>\n      <div style=\"display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;\">\n        <div class=\"stepper\">\n          <button id=\"meno-avanzamento-${r.id}\">\u2212<\/button>\n          <span class=\"mono\" style=\"min-width:32px;text-align:center;display:inline-block;\">${r.statoAvanzamento||0}%<\/span>\n          <button id=\"piu-avanzamento-${r.id}\">+<\/button>\n        <\/div>\n        <div class=\"valore-cliccabile mono\" id=\"campo-previsioneAvanzamento-${r.id}\" style=\"font-size:11px;\">previsto: ${r.previsioneAvanzamento||0}%<\/div>\n      <\/div>\n      <div style=\"margin-top:4px;\">${badge}<\/div>\n    <\/td>\n    <td class=\"mono\" style=\"vertical-align:top;padding-top:6px;padding-bottom:6px;${hannoCosti ? '' : 'padding-left:2px;padding-right:2px;'}\">${contenutoCosti}<\/td>\n    <td class=\"mono\" style=\"vertical-align:top;padding-top:6px;padding-bottom:6px;\">${contenutoOre}<\/td>\n    <td class=\"mono\" style=\"vertical-align:top;padding-top:6px;padding-bottom:6px;\">${contenutoDate}<\/td>\n    <td style=\"vertical-align:top;\"><div class=\"row-actions\">\n      ${completata ? `<button class=\"icon-btn\" id=\"riapri-lav-${r.id}\">Riapri<\/button>` : `<button class=\"icon-btn\" id=\"completa-lav-${r.id}\">\u2713 Completa<\/button>`}\n      <button class=\"icon-btn\" id=\"foto-lav-${r.id}\">\ud83d\udcf7 Foto<\/button>\n      ${r.numeroFoto>0 ? `<button class=\"icon-btn\" id=\"vedi-foto-lav-${r.id}\">\ud83d\uddbc Vedi foto (${r.numeroFoto})<\/button>` : ''}\n      <button class=\"icon-btn\" id=\"edit-lav-${r.id}\">Modifica<\/button><button class=\"icon-btn\" id=\"del-lav-${r.id}\">Elimina<\/button>\n    <\/div><\/td>\n  <\/tr>`;\n}\nfunction openLavorazioneModal(existing){\n  openModal({\n    title: existing ? 'Modifica lavorazione' : 'Nuova lavorazione',\n    values: existing || {statoAvanzamento:0, previsioneAvanzamento:0},\n    fields: [\n      {name:'nome', label:'Nome lavorazione', type:'text', required:true},\n      {name:'categoria', label:'Categoria / squadra / appaltatore (opzionale)', type:'text'},\n      {name:'contrattoSalId', label:'Contratto SAL collegato (opzionale)', type:'select', options: [\n        {value:'', label:'\u2014 Nessuno \u2014'},\n        ...state.contrattiSal.map(c => ({value:c.id, label:c.fornitore})),\n      ]},\n      {name:'prezzoSalPattuito', label:'Prezzo pattuito per questa lavorazione nel SAL (\u20ac, opzionale)', type:'number', step:'0.01'},\n      {name:'costoPrevisto', label:'Costo previsto (\u20ac)', type:'number', step:'0.01'},\n      {name:'statoAvanzamento', label:'Stato avanzamento reale (%)', type:'number', step:'1'},\n      {name:'previsioneAvanzamento', label:'Previsione avanzamento a oggi (%)', type:'number', step:'1'},\n      {name:'previsioneCosto', label:'Previsione costo a completamento (\u20ac)', type:'number', step:'0.01'},\n      {name:'orePreviste', label:'Ore previste (preventivo)', type:'number', step:'0.5'},\n      {name:'orePrevisione', label:'Ore target \u2014 previsione a completamento', type:'number', step:'0.5'},\n      {name:'costoOre', label:'Ore effettive impiegate', type:'number', step:'0.5'},\n      {name:'costoEuro', label:'Costo consuntivo \u2014 \u20ac', type:'number', step:'0.01'},\n      {name:'dataInizio', label:'Data inizio', type:'date'},\n      {name:'scadenzaPrevista', label:'Data fine prevista', type:'date'},\n      {name:'dataCompletamento', label:'Data completamento (lascia vuoto se ancora aperta)', type:'date'},\n      {name:'note', label:'Note', type:'textarea'},\n    ],\n    onSubmit: (data) => {\n      if(existing){\n        Object.assign(existing, data);\n      } else {\n        state.lavorazioni.push({id:uid(), ...data});\n      }\n      persist(); renderAll();\n    }\n  });\n}\n\n/* ============ ORDINI ============ */\nconst STATO_ORDINE = [\n  {value:'in_attesa', label:'In attesa'},\n  {value:'parziale', label:'Parziale'},\n  {value:'completo', label:'Completo'},\n];\nfunction renderOrdini(){\n  const scrollPrecedente = catturaScrollOrizzontale();\n  const aperti = state.ordini.filter(r => r.statoParziale !== 'completo');\n  const completati = state.ordini.filter(r => r.statoParziale === 'completo')\n    .sort((a,b) => (b.dataEffettiva||'').localeCompare(a.dataEffettiva||''));\n  const fornitori = [...new Set(state.materialiDaOrdinare.map(m => (m.fornitore||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));\n  const materialiFiltrati = state.materialiDaOrdinare\n    .filter(m => !state.materialiFiltroFornitore || (m.fornitore||'').trim() === state.materialiFiltroFornitore)\n    .sort((a,b) => {\n      const cd = (a.descrizione||'').localeCompare(b.descrizione||'');\n      if(cd !== 0) return cd;\n      return (a.misura||'').localeCompare(b.misura||'');\n    });\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Ordini<\/h2><p class=\"section-sub\">Date di ordine, consegna prevista ed effettiva, con stato parziale ed eventuali note. Gli ordini completati si archiviano a scomparsa qui sotto.<\/p><\/div>\n      <button class=\"btn\" id=\"add-ordine\">+ Nuovo ordine<\/button>\n    <\/div>\n    ${aperti.length===0 ? emptyState('Nessun ordine aperto', 'Aggiungi un ordine per iniziare a monitorarne le consegne.') : `\n    <div class=\"table-scroll\"><table><thead><tr><th>Ordine<\/th><th>Data ordine<\/th><th>Prevista<\/th><th>Effettiva<\/th><th>Stato<\/th><th>Commenti<\/th><th><\/th><\/tr><\/thead>\n    <tbody>${aperti.map(r => renderOrdineRow(r)).join('')}<\/tbody><\/table><\/div>`}\n\n    ${completati.length>0 ? `\n    <details id=\"dettaglio-ordini-completati\" style=\"margin-top:18px;\" ${uiDettagliAperti['ordini-completati']?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:10px 0;color:var(--muted);font-size:13px;\">Ordini completati (${completati.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div class=\"table-scroll\" style=\"margin-top:10px;\"><table><thead><tr><th>Ordine<\/th><th>Data ordine<\/th><th>Prevista<\/th><th>Effettiva<\/th><th>Stato<\/th><th>Commenti<\/th><th><\/th><\/tr><\/thead>\n      <tbody>${completati.map(r => renderOrdineRow(r)).join('')}<\/tbody><\/table><\/div>\n    <\/details>` : ''}\n\n    <details id=\"dettaglio-materiali\" style=\"margin-top:32px;\" ${uiDettagliAperti['materiali']?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:10px 0;color:var(--muted);font-size:13px;\">Materiali da ordinare (${state.materialiDaOrdinare.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div style=\"margin-top:10px;\">\n        <p class=\"section-sub\" style=\"margin-top:-4px;\">Elenco unico in ordine alfabetico di descrizione.<\/p>\n        <div class=\"toolbar\" style=\"gap:8px;flex-wrap:wrap;\">\n          <select id=\"filtro-fornitore-materiali\" style=\"padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n            <option value=\"\">Tutti i fornitori<\/option>\n            ${fornitori.map(f => `<option value=\"${esc(f)}\" ${state.materialiFiltroFornitore===f?'selected':''}>${esc(f)}<\/option>`).join('')}\n          <\/select>\n          <button class=\"btn ghost\" id=\"manda-ordine-btn\">\ud83d\udce6 Manda ordine<\/button>\n          <button class=\"btn\" id=\"add-materiale\">+ Nuovo materiale<\/button>\n        <\/div>\n        ${materialiFiltrati.length===0 ? emptyState('Nessun materiale in lista', 'Aggiungi un materiale da ordinare, con o senza fornitore.') : `\n        <div id=\"lista-materiali\">\n          ${materialiFiltrati.map(m => {\n            const parti = [m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 ');\n            const conFornitore = m.fornitore ? `${parti} \u2014 ${m.fornitore}` : parti;\n            return `<div class=\"day-entry\" style=\"align-items:center;\">\n              <div>${esc(conFornitore)}<\/div>\n              <div class=\"row-actions\">\n                <button class=\"icon-btn\" id=\"crea-ordine-mat-${m.id}\">\u2192 Crea ordine<\/button>\n                <button class=\"icon-btn\" id=\"edit-mat-${m.id}\">Modifica<\/button>\n                <button class=\"icon-btn\" id=\"del-mat-${m.id}\">Elimina<\/button>\n              <\/div>\n            <\/div>`;\n          }).join('')}\n        <\/div>`}\n      <\/div>\n    <\/details>\n  `;\n  ripristinaScrollOrizzontale(scrollPrecedente);\n  document.getElementById('add-ordine').onclick = () => openOrdineModal();\n  document.getElementById('add-materiale').onclick = () => openMaterialeModal();\n  document.getElementById('manda-ordine-btn').onclick = () => apriMandaOrdine();\n  const dettOrdCompletati = document.getElementById('dettaglio-ordini-completati');\n  if(dettOrdCompletati) dettOrdCompletati.addEventListener('toggle', function(){ uiDettagliAperti['ordini-completati'] = this.open; });\n  const dettMateriali = document.getElementById('dettaglio-materiali');\n  if(dettMateriali) dettMateriali.addEventListener('toggle', function(){ uiDettagliAperti['materiali'] = this.open; });\n  document.getElementById('filtro-fornitore-materiali').onchange = (e) => { state.materialiFiltroFornitore = e.target.value; renderOrdini(); };\n  state.ordini.forEach(r => {\n    const rowEl = document.getElementById('row-ord-'+r.id);\n    const e = document.getElementById('edit-ord-'+r.id), d = document.getElementById('del-ord-'+r.id);\n    const completoBtn = document.getElementById('completo-ord-'+r.id);\n    const riapriBtn = document.getElementById('riapri-ord-'+r.id);\n    const fotoBtn = document.getElementById('foto-ord-'+r.id);\n    const vediFotoBtn = document.getElementById('vedi-foto-ord-'+r.id);\n    const copiaMatBtn = document.getElementById('copia-mat-ord-'+r.id);\n    const matOrdBtn = document.getElementById('mat-ord-'+r.id);\n    if(rowEl) rowEl.onclick = () => openOrdineModal(r);\n    if(e) e.onclick = (ev) => { ev.stopPropagation(); openOrdineModal(r); };\n    if(d) d.onclick = (ev) => { ev.stopPropagation(); state.ordini = state.ordini.filter(x=>x.id!==r.id); persist(); renderAll(); };\n    if(completoBtn) completoBtn.onclick = (ev) => { ev.stopPropagation(); r.dataEffettiva = todayISO(); r.statoParziale = 'completo'; persist(); renderOrdini(); };\n    if(riapriBtn) riapriBtn.onclick = (ev) => { ev.stopPropagation(); r.statoParziale = 'in_attesa'; r.dataEffettiva = null; persist(); renderOrdini(); };\n    if(fotoBtn) fotoBtn.onclick = (ev) => { ev.stopPropagation(); scattaFotoBolla(r); };\n    if(vediFotoBtn) vediFotoBtn.onclick = (ev) => { ev.stopPropagation(); window.open(r.fotoUrl, '_blank'); };\n    if(copiaMatBtn) copiaMatBtn.onclick = (ev) => { ev.stopPropagation(); copiaTesto(testoMaterialiOrdine(r)); };\n    if(matOrdBtn) matOrdBtn.onclick = (ev) => { ev.stopPropagation(); apriGestioneMaterialiOrdine(r); };\n  });\n  state.materialiDaOrdinare.forEach(m => {\n    const editBtn = document.getElementById('edit-mat-'+m.id);\n    const delBtn = document.getElementById('del-mat-'+m.id);\n    const creaOrdineBtn = document.getElementById('crea-ordine-mat-'+m.id);\n    if(editBtn) editBtn.onclick = () => openMaterialeModal(m);\n    if(delBtn) delBtn.onclick = () => { state.materialiDaOrdinare = state.materialiDaOrdinare.filter(x=>x.id!==m.id); persist(); renderOrdini(); };\n    if(creaOrdineBtn) creaOrdineBtn.onclick = () => {\n      const nomeSuggerito = [m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 ');\n      openOrdineModal(null, {dataOrdine: todayISO(), statoParziale:'in_attesa', nome: nomeSuggerito, fornitore: m.fornitore || ''});\n    };\n  });\n}\nfunction openMaterialeModal(existing, prefill){\n  openModal({\n    title: existing ? 'Modifica materiale' : 'Nuovo materiale da ordinare',\n    values: existing || prefill || {},\n    fields: [\n      {name:'fornitore', label:'Fornitore (opzionale)', type:'text'},\n      {name:'numero', label:'Numero / quantit\u00e0 (opzionale)', type:'text'},\n      {name:'descrizione', label:'Descrizione', type:'text', required:true},\n      {name:'misura', label:'Misura (opzionale)', type:'text'},\n    ],\n    pulsanteExtra: existing ? null : {\n      label: '+ Aggiungi altro',\n      onClick: (data) => {\n        state.materialiDaOrdinare.push({id:uid(), ...data});\n        persist();\n        renderOrdini();\n        mostraToastSalvato();\n        openMaterialeModal(null, {fornitore: data.fornitore});\n      }\n    },\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.materialiDaOrdinare.push({id:uid(), ...data}); }\n      persist();\n      renderOrdini();\n    }\n  });\n}\nfunction testoMaterialiOrdine(ordine){\n  return (ordine.materiali||[]).map(m => [m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 ')).join('\\n');\n}\nfunction apriGestioneMaterialiOrdine(ordine){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '520px';\n\n  function disegna(){\n    ordine.materiali = ordine.materiali || [];\n    modal.innerHTML = `\n      <h3>Materiali \u2014 ${esc(ordine.nome)}<\/h3>\n      ${ordine.fornitore ? `<p style=\"font-size:12px;color:var(--muted);margin:-8px 0 14px;\">Fornitore: ${esc(ordine.fornitore)}<\/p>` : ''}\n      ${ordine.materiali.length===0 ? `<div style=\"color:var(--muted);font-size:13px;padding:10px 0;\">Nessun materiale in questo ordine.<\/div>` : `\n      <div style=\"max-height:240px;overflow-y:auto;border:1px solid var(--line);margin-bottom:14px;\">\n        ${ordine.materiali.map((m,i) => `\n          <div class=\"day-entry\" style=\"align-items:center;\">\n            <div>${esc([m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 '))}<\/div>\n            <button class=\"icon-btn\" data-rimuovi-mat-ordine=\"${i}\">Elimina<\/button>\n          <\/div>\n        `).join('')}\n      <\/div>`}\n      <div class=\"subsection-title\" style=\"margin-top:6px;\">Aggiungi materiale dimenticato<\/div>\n      <div class=\"field-row\">\n        <div class=\"field\"><label>Numero<\/label><input type=\"text\" id=\"nuovo-mat-numero\"><\/div>\n        <div class=\"field\" style=\"flex:2;\"><label>Descrizione<\/label><input type=\"text\" id=\"nuovo-mat-descrizione\"><\/div>\n        <div class=\"field\"><label>Misura<\/label><input type=\"text\" id=\"nuovo-mat-misura\"><\/div>\n      <\/div>\n      <button type=\"button\" class=\"btn ghost\" id=\"aggiungi-mat-ordine-btn\" style=\"width:100%;\">+ Aggiungi all'ordine<\/button>\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn\" id=\"chiudi-mat-ordine\">Chiudi<\/button>\n      <\/div>\n    `;\n    document.getElementById('chiudi-mat-ordine').onclick = closeModal;\n    modal.querySelectorAll('[data-rimuovi-mat-ordine]').forEach(btn => {\n      btn.onclick = () => {\n        ordine.materiali.splice(Number(btn.dataset.rimuoviMatOrdine), 1);\n        persist();\n        disegna();\n        renderOrdini();\n      };\n    });\n    document.getElementById('aggiungi-mat-ordine-btn').onclick = () => {\n      const descrizione = document.getElementById('nuovo-mat-descrizione').value.trim();\n      if(!descrizione){ alert('Inserisci almeno una descrizione.'); return; }\n      const numero = document.getElementById('nuovo-mat-numero').value.trim();\n      const misura = document.getElementById('nuovo-mat-misura').value.trim();\n      ordine.materiali.push({numero, descrizione, misura});\n      persist();\n      mostraToast('Aggiunto \u2713');\n      disegna();\n      renderOrdini();\n    };\n  }\n  disegna();\n  overlay.classList.add('open');\n}\nfunction apriMandaOrdine(){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '560px';\n  let fornitoreScelto = state.materialiFiltroFornitore || '';\n\n  function disegna(){\n    const fornitori = [...new Set(state.materialiDaOrdinare.map(m => (m.fornitore||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));\n    const candidati = state.materialiDaOrdinare\n      .filter(m => !fornitoreScelto || (m.fornitore||'').trim() === fornitoreScelto)\n      .sort((a,b) => {\n        const cd = (a.descrizione||'').localeCompare(b.descrizione||'');\n        if(cd !== 0) return cd;\n        return (a.misura||'').localeCompare(b.misura||'');\n      });\n    modal.innerHTML = `\n      <h3>Manda ordine<\/h3>\n      <p style=\"font-size:12px;color:var(--muted);margin:-8px 0 14px;\">Scegli il fornitore, seleziona le voci da includere ed evadile in un unico ordine.<\/p>\n      <div class=\"field\">\n        <label>Fornitore<\/label>\n        <select id=\"manda-ordine-fornitore\">\n          <option value=\"\">Tutti / senza fornitore<\/option>\n          ${fornitori.map(f => `<option value=\"${esc(f)}\" ${fornitoreScelto===f?'selected':''}>${esc(f)}<\/option>`).join('')}\n        <\/select>\n      <\/div>\n      ${candidati.length===0 ? `<div style=\"color:var(--muted);font-size:13px;padding:14px 0;\">Nessun materiale disponibile per questo fornitore.<\/div>` : `\n      <div style=\"max-height:260px;overflow-y:auto;border:1px solid var(--line);margin:10px 0;\">\n        ${candidati.map(m => {\n          const testo = [m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 ');\n          return `<label style=\"display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;\">\n            <input type=\"checkbox\" class=\"manda-ordine-check\" value=\"${m.id}\" checked style=\"width:18px;height:18px;flex-shrink:0;\">\n            <span style=\"font-size:13px;\">${esc(testo)}<\/span>\n          <\/label>`;\n        }).join('')}\n      <\/div>\n      <div class=\"field\">\n        <label>Nome ordine<\/label>\n        <input type=\"text\" id=\"manda-ordine-nome\" value=\"Materiali${fornitoreScelto ? ' \u2014 ' + fornitoreScelto : ''}\">\n      <\/div>\n      `}\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn ghost\" id=\"manda-ordine-annulla\">Annulla<\/button>\n        ${candidati.length>0 ? `<button type=\"button\" class=\"btn\" id=\"manda-ordine-evadi\">Evadi selezionati \u2192 crea ordine<\/button>` : ''}\n      <\/div>\n    `;\n    document.getElementById('manda-ordine-annulla').onclick = closeModal;\n    document.getElementById('manda-ordine-fornitore').onchange = (e) => { fornitoreScelto = e.target.value; disegna(); };\n    const evadiBtn = document.getElementById('manda-ordine-evadi');\n    if(evadiBtn){\n      evadiBtn.onclick = () => {\n        const selezionati = Array.from(modal.querySelectorAll('.manda-ordine-check:checked')).map(cb => cb.value);\n        if(selezionati.length === 0){ alert('Seleziona almeno un materiale.'); return; }\n        const nomeOrdine = document.getElementById('manda-ordine-nome').value.trim() || 'Materiali';\n        const materialiOrdine = state.materialiDaOrdinare\n          .filter(m => selezionati.includes(m.id))\n          .map(m => ({numero:m.numero||'', descrizione:m.descrizione||'', misura:m.misura||''}));\n        state.ordini.push({\n          id: uid(),\n          nome: nomeOrdine,\n          fornitore: fornitoreScelto || '',\n          dataOrdine: todayISO(),\n          statoParziale: 'in_attesa',\n          materiali: materialiOrdine,\n        });\n        state.materialiDaOrdinare = state.materialiDaOrdinare.filter(m => !selezionati.includes(m.id));\n        persist();\n        closeModal();\n        renderOrdini();\n        mostraToast('Ordine creato \u2713');\n      };\n    }\n  }\n  disegna();\n  overlay.classList.add('open');\n}\nfunction renderOrdineRow(r){\n  const today = todayISO();\n  const inRitardo = r.dataPrevista && r.dataPrevista < today && r.statoParziale !== 'completo';\n  const statoLabel = STATO_ORDINE.find(s=>s.value===r.statoParziale)?.label || '\u2014';\n  const statoBadgeClass = r.statoParziale==='completo' ? 'badge-green' : r.statoParziale==='parziale' ? 'badge-orange' : 'badge-gray';\n  const completo = r.statoParziale === 'completo';\n  return `<tr ${completo?'style=\"opacity:0.6;\"':''} class=\"riga-cliccabile\" id=\"row-ord-${r.id}\">\n    <td><strong>${esc(r.nome)}<\/strong>${r.fornitore?`<div style=\"font-size:11px;color:var(--muted);\">${esc(r.fornitore)}<\/div>`:''}${r.materiali && r.materiali.length ? `<div style=\"margin-top:4px;font-size:11px;color:var(--muted);white-space:pre-line;\">${esc(testoMaterialiOrdine(r))}<\/div>` : ''}<\/td>\n    <td class=\"mono\">${fmtDate(r.dataOrdine)}<\/td>\n    <td class=\"mono\">${fmtDate(r.dataPrevista)}<\/td>\n    <td class=\"mono\">${fmtDate(r.dataEffettiva)}<\/td>\n    <td><span class=\"badge ${statoBadgeClass}\">${statoLabel}${r.statoParziale==='parziale' && r.percentualeRicevuta ? ` (${r.percentualeRicevuta}%)` : ''}<\/span>${inRitardo?`<br><span class=\"badge badge-red\" style=\"margin-top:4px;\">in ritardo<\/span>`:''}<\/td>\n    <td style=\"max-width:180px;font-size:12px;color:var(--muted);\">${esc(r.commenti||'\u2014')}<\/td>\n    <td><div class=\"row-actions\">\n      ${completo ? `<button class=\"icon-btn\" id=\"riapri-ord-${r.id}\">Riapri<\/button>` : `<button class=\"icon-btn\" id=\"completo-ord-${r.id}\">\u2713 Completo<\/button>`}\n      <button class=\"icon-btn\" ${r.fotoUrl ? `id=\"vedi-foto-ord-${r.id}\"` : `id=\"foto-ord-${r.id}\"`}>${r.fotoUrl ? '\ud83d\uddbc Vedi foto' : '\ud83d\udcf7 Foto'}<\/button>\n      <button class=\"icon-btn\" id=\"mat-ord-${r.id}\">\ud83d\udce6 Materiali${r.materiali && r.materiali.length ? ' ('+r.materiali.length+')' : ''}<\/button>\n      ${r.materiali && r.materiali.length ? `<button class=\"icon-btn\" id=\"copia-mat-ord-${r.id}\">\ud83d\udccb Copia materiali<\/button>` : ''}\n      <button class=\"icon-btn\" id=\"edit-ord-${r.id}\">Modifica<\/button><button class=\"icon-btn\" id=\"del-ord-${r.id}\">Elimina<\/button>\n    <\/div><\/td>\n  <\/tr>`;\n}\nasync function scattaFotoBolla(r){\n  const file = await apriFotocamera();\n  if(!file) return;\n  caricamentiFotoInCorso++;\n  aggiornaIndicatoreCaricamentoFoto();\n  try{\n    const base64 = await ridimensionaImmagine(file);\n    const risposta = await chiamaAzionePost('uploadFotoBolla', {\n      cantiere: state.nomeCantiereAttivo || 'Cantiere',\n      ordine: r.nome,\n      imageBase64: base64,\n      mimeType: 'image/jpeg',\n      vecchioFileId: r.fotoFileId || null,\n    });\n    r.fotoUrl = risposta.fileUrl;\n    r.fotoFileId = risposta.fileId;\n    persist();\n    if(state.section === 'ordini') renderOrdini();\n    mostraToast('\ud83d\udcf7 Foto caricata \u2713');\n  }catch(e){\n    alert('Errore nel caricamento della foto: ' + e.message);\n  }finally{\n    caricamentiFotoInCorso--;\n    aggiornaIndicatoreCaricamentoFoto();\n  }\n}\nfunction openOrdineModal(existing, prefill){\n  openModal({\n    title: existing ? 'Modifica ordine' : 'Nuovo ordine',\n    values: existing || prefill || {dataOrdine: todayISO(), statoParziale:'in_attesa'},\n    fields: [\n      {name:'nome', label:'Descrizione ordine', type:'text', required:true},\n      {name:'fornitore', label:'Fornitore', type:'text'},\n      {name:'dataOrdine', label:'Data ordine', type:'date', required:true},\n      {name:'dataPrevista', label:'Data prevista consegna', type:'date'},\n      {name:'dataEffettiva', label:'Data effettiva consegna', type:'date'},\n      {name:'statoParziale', label:'Stato consegna', type:'select', options: STATO_ORDINE},\n      {name:'percentualeRicevuta', label:'% ricevuta (se parziale)', type:'number', step:'1'},\n      {name:'commenti', label:'Commenti', type:'textarea'},\n    ],\n    pulsanteExtra: existing ? {\n      label: `\ud83d\udce6 Materiali${existing.materiali && existing.materiali.length ? ' ('+existing.materiali.length+')' : ''}`,\n      onClick: () => { apriGestioneMaterialiOrdine(existing); }\n    } : null,\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.ordini.push({id:uid(), ...data}); }\n      persist(); renderAll();\n    }\n  });\n}\n\n/* ============ PERSONE ============ */\nfunction startOfWeek(d){\n  const dt = new Date(d);\n  const day = (dt.getDay()+6)%7; // luned\u00ec = 0\n  dt.setDate(dt.getDate()-day);\n  dt.setHours(0,0,0,0);\n  return dt;\n}\nfunction meseKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }\nfunction logDelMese(p, d){\n  const key = meseKey(d);\n  return (p.log||[]).filter(l => (l.data||'').slice(0,7) === key);\n}\nfunction oreTotaliPersonaMese(p, d){\n  return logDelMese(p, d).reduce((s,l) => s + Number(l.ore||0), 0);\n}\nfunction motivazioneMediaPersonaMese(p, d){\n  const voci = logDelMese(p, d).filter(l => l.motivazione);\n  if(voci.length === 0) return null;\n  const media = voci.reduce((s,l) => s + Number(l.motivazione), 0) / voci.length;\n  return media;\n}\nfunction pallinoMotivazione(valore, dimensione){\n  dimensione = dimensione || 12;\n  if(!valore) return '';\n  const arrotondato = Math.round(valore);\n  const colore = COLORI_MOTIVAZIONE[Math.min(5, Math.max(1, arrotondato))];\n  return `<span title=\"Motivazione media: ${valore.toFixed(1)}/5\" style=\"display:inline-block;width:${dimensione}px;height:${dimensione}px;border-radius:50%;background:${colore};vertical-align:middle;\"><\/span>`;\n}\nfunction renderPersone(){\n  const rows = state.persone;\n  const meseCorrente = state.personeMese;\n  const totaleTutti = rows.reduce((s,p) => s + oreTotaliPersonaMese(p, meseCorrente), 0);\n\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Persone<\/h2><p class=\"section-sub\">Anagrafica squadra cantiere e registro ore lavorative.<\/p><\/div>\n      <button class=\"btn\" id=\"add-persona\">+ Nuova persona<\/button>\n    <\/div>\n\n    <div class=\"cal-header\" style=\"margin-top:0;\">\n      <button class=\"btn ghost small\" id=\"mese-prev\">\u2190 Mese precedente<\/button>\n      <div class=\"cal-month\">${MESI[meseCorrente.getMonth()]} ${meseCorrente.getFullYear()}<\/div>\n      <button class=\"btn ghost small\" id=\"mese-next\">Mese successivo \u2192<\/button>\n    <\/div>\n\n    <div class=\"subsection-title\">Totali ore del mese<\/div>\n    ${rows.length===0 ? emptyState('Nessuna persona registrata', 'Aggiungi una persona per iniziare a tracciarne le ore.') : `\n    <div class=\"table-scroll\"><table style=\"margin-bottom:22px;\"><thead><tr><th>Persona<\/th><th>Ore nel mese<\/th><th>Motivazione media<\/th><th><\/th><\/tr><\/thead>\n      <tbody>\n        ${rows.map(p => `<tr>\n          <td><strong>${esc(p.nome)}<\/strong>${p.ruolo?`<div style=\"font-size:11px;color:var(--muted);\">${esc(p.ruolo)}<\/div>`:''}<\/td>\n          <td class=\"mono\">${oreTotaliPersonaMese(p, meseCorrente).toFixed(1)} h<\/td>\n          <td>${pallinoMotivazione(motivazioneMediaPersonaMese(p, meseCorrente), 16)}<\/td>\n          <td><button class=\"icon-btn\" id=\"report-mese-${p.id}\">Report mensile<\/button><\/td>\n        <\/tr>`).join('')}\n        <tr><td><strong>Totale squadra<\/strong><\/td><td class=\"mono\"><strong>${totaleTutti.toFixed(1)} h<\/strong><\/td><td><\/td><td><\/td><\/tr>\n      <\/tbody><\/table><\/div>`}\n\n    <div class=\"subsection-title\">Anagrafica e storico completo<\/div>\n    ${rows.map(p => renderPersonaCard(p)).join('')}\n  `;\n  document.getElementById('add-persona').onclick = () => openPersonaModal();\n  document.getElementById('mese-prev').onclick = () => { state.personeMese = new Date(meseCorrente.getFullYear(), meseCorrente.getMonth()-1, 1); renderPersone(); };\n  document.getElementById('mese-next').onclick = () => { state.personeMese = new Date(meseCorrente.getFullYear(), meseCorrente.getMonth()+1, 1); renderPersone(); };\n  rows.forEach(p => {\n    const editBtn = document.getElementById('edit-pers-'+p.id);\n    const delBtn = document.getElementById('del-pers-'+p.id);\n    const addOreBtn = document.getElementById('add-ore-'+p.id);\n    const reportBtn = document.getElementById('report-mese-'+p.id);\n    if(editBtn) editBtn.onclick = () => openPersonaModal(p);\n    if(delBtn) delBtn.onclick = () => { state.persone = state.persone.filter(x=>x.id!==p.id); persist(); renderAll(); };\n    if(addOreBtn) addOreBtn.onclick = () => openOreModal(p);\n    if(reportBtn) reportBtn.onclick = () => apriReportMensile(p);\n    const dettStoricoOre = document.getElementById('dettaglio-storico-ore-'+p.id);\n    if(dettStoricoOre) dettStoricoOre.addEventListener('toggle', function(){ uiDettagliAperti['storico-ore-'+p.id] = this.open; });\n    document.querySelectorAll(`[id^=\"riga-storico-${p.id}-\"]`).forEach(rigaEl => {\n      rigaEl.onclick = () => {\n        const elDettaglio = document.getElementById(rigaEl.dataset.targetDettaglio);\n        if(elDettaglio) elDettaglio.style.display = (elDettaglio.style.display === 'none') ? '' : 'none';\n      };\n    });\n    (p.log||[]).forEach(l => {\n      const dl = document.getElementById(`del-log-${p.id}-${l.id}`);\n      if(dl) dl.onclick = () => {\n        const voce = risolviVoceOre(l);\n        if(voce) voce.oggetto.costoOre = Math.max(0, (Number(voce.oggetto.costoOre)||0) - Number(l.ore||0));\n        p.log = p.log.filter(x=>x.id!==l.id);\n        persist(); renderAll();\n      };\n    });\n  });\n}\nfunction pallinoMotivazioneSingola(valore, dimensione){\n  dimensione = dimensione || 12;\n  if(!valore) return '';\n  const colore = COLORI_MOTIVAZIONE[valore];\n  return `<span title=\"Motivazione: ${valore}/5\" style=\"display:inline-block;width:${dimensione}px;height:${dimensione}px;border-radius:50%;background:${colore};vertical-align:middle;\"><\/span>`;\n}\nfunction renderPersonaCard(p){\n  const totale = (p.log||[]).reduce((s,l)=>s+Number(l.ore||0),0);\n  const logRows = [...(p.log||[])].sort((a,b)=>b.data.localeCompare(a.data));\n\n  const gruppiPerGiorno = [];\n  const mappaGiorni = {};\n  logRows.forEach(l => {\n    if(!mappaGiorni[l.data]){\n      mappaGiorni[l.data] = {data: l.data, voci: [], totale: 0};\n      gruppiPerGiorno.push(mappaGiorni[l.data]);\n    }\n    mappaGiorni[l.data].voci.push(l);\n    mappaGiorni[l.data].totale += Number(l.ore||0);\n  });\n\n  return `<div class=\"card\" style=\"cursor:default;margin-bottom:14px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;\">\n      <div>\n        <div style=\"font-family:'Oswald',sans-serif;font-size:17px;\">${esc(p.nome)}<\/div>\n        <div style=\"font-size:12px;color:var(--muted);\">${esc(p.ruolo||'\u2014')}<\/div>\n      <\/div>\n      <div style=\"text-align:right;\">\n        <div class=\"mono\" style=\"font-size:20px;\">${totale.toFixed(1)} h<\/div>\n        <div style=\"font-size:11px;color:var(--muted);\">totale registrato (tutti i mesi)<\/div>\n      <\/div>\n      <div class=\"row-actions\">\n        <button class=\"icon-btn\" id=\"add-ore-${p.id}\">+ Ore<\/button>\n        <button class=\"icon-btn\" id=\"edit-pers-${p.id}\">Modifica<\/button>\n        <button class=\"icon-btn\" id=\"del-pers-${p.id}\">Elimina<\/button>\n      <\/div>\n    <\/div>\n    ${logRows.length ? `<details id=\"dettaglio-storico-ore-${p.id}\" style=\"margin-top:12px;\" ${uiDettagliAperti['storico-ore-'+p.id]?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:8px 0;color:var(--muted);font-size:12px;\">Storico ore giorno per giorno (${logRows.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div class=\"table-scroll\" style=\"margin-top:8px;\"><table><thead><tr><th>Data<\/th><th>Ore<\/th><th>Lavorazione<\/th><th>Motiv.<\/th><th>Note<\/th><th><\/th><\/tr><\/thead>\n      <tbody>${gruppiPerGiorno.map(g => renderRigaStoricoGiorno(p, g)).join('')}<\/tbody><\/table><\/div>\n    <\/details>` : ''}\n  <\/div>`;\n}\nfunction renderRigaStoricoGiorno(p, g){\n  if(g.voci.length === 1){\n    const l = g.voci[0];\n    const voce = risolviVoceOre(l);\n    return `<tr><td class=\"mono\">${fmtDate(l.data)}<\/td><td class=\"mono\">${l.ore}<\/td><td style=\"font-size:12px;\">${voce ? esc(voce.nome) + (voce.tipo==='attivita'?' <span class=\"badge badge-gray\">attivit\u00e0<\/span>':'') : '\u2014'}<\/td><td>${pallinoMotivazioneSingola(l.motivazione)}<\/td><td style=\"color:var(--muted);font-size:12px;\">${esc(l.note||'\u2014')}<\/td><td><button class=\"icon-btn\" id=\"del-log-${p.id}-${l.id}\">Elimina<\/button><\/td><\/tr>`;\n  }\n  const idDettaglio = `storico-dettaglio-${p.id}-${g.data}`;\n  const nomiVoci = [...new Set(g.voci.map(v => {\n    const voce = risolviVoceOre(v);\n    return voce ? voce.nome : null;\n  }).filter(Boolean))];\n  const etichettaVoci = nomiVoci.length ? nomiVoci.join(', ') : `${g.voci.length} voci`;\n  return `<tr class=\"riga-cliccabile\" id=\"riga-storico-${p.id}-${g.data}\" data-target-dettaglio=\"${idDettaglio}\">\n      <td class=\"mono\">${fmtDate(g.data)}<\/td>\n      <td class=\"mono\">${g.totale}<\/td>\n      <td style=\"font-size:12px;\" colspan=\"4\">${esc(etichettaVoci)} <span style=\"color:var(--muted);font-size:11px;\">\u2014 ${g.voci.length} voci, clicca per il dettaglio<\/span><\/td>\n    <\/tr>\n    <tr id=\"${idDettaglio}\" style=\"display:none;\">\n      <td colspan=\"6\" style=\"padding:0;background:var(--paper);\">\n        <table style=\"width:100%;margin:0;\"><tbody>\n          ${g.voci.map(v => {\n            const voce = risolviVoceOre(v);\n            return `<tr>\n              <td class=\"mono\" style=\"padding-left:24px;width:70px;\">${v.ore} h<\/td>\n              <td style=\"font-size:12px;\">${voce ? esc(voce.nome) + (voce.tipo==='attivita'?' <span class=\"badge badge-gray\">attivit\u00e0<\/span>':'') : 'Generale'}<\/td>\n              <td>${pallinoMotivazioneSingola(v.motivazione)}<\/td>\n              <td style=\"color:var(--muted);font-size:12px;\">${esc(v.note||'\u2014')}<\/td>\n              <td><button class=\"icon-btn\" id=\"del-log-${p.id}-${v.id}\">Elimina<\/button><\/td>\n            <\/tr>`;\n          }).join('')}\n        <\/tbody><\/table>\n      <\/td>\n    <\/tr>`;\n}\nfunction apriReportMensile(persona, meseOverride){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '620px';\n  let mese = meseOverride || state.personeMese;\n\n  function disegna(){\n    const giorni = logDelMese(persona, mese).sort((a,b)=>a.data.localeCompare(b.data));\n    const totale = giorni.reduce((s,l)=>s+Number(l.ore||0),0);\n    modal.innerHTML = `\n      <div class=\"cal-header\" style=\"margin-bottom:6px;\">\n        <button type=\"button\" class=\"btn ghost small\" id=\"report-mese-prev\">\u2190<\/button>\n        <div style=\"text-align:center;\">\n          <div style=\"font-family:'Oswald',sans-serif;font-size:20px;\">${esc(persona.nome)}<\/div>\n          <div style=\"font-size:12px;color:var(--muted);\">${esc(persona.ruolo||'')}<\/div>\n        <\/div>\n        <button type=\"button\" class=\"btn ghost small\" id=\"report-mese-next\">\u2192<\/button>\n      <\/div>\n      <div style=\"text-align:center;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:0.04em;margin-bottom:14px;text-transform:uppercase;\">${MESI[mese.getMonth()]} ${mese.getFullYear()}<\/div>\n      ${giorni.length===0 ? `<div style=\"text-align:center;color:var(--muted);padding:20px 0;\">Nessuna ora registrata in questo mese.<\/div>` : `\n      <table>\n        <thead><tr><th>Giorno<\/th><th>Ore<\/th><th>Note<\/th><\/tr><\/thead>\n        <tbody>${giorni.map(l => `<tr><td class=\"mono\">${fmtDate(l.data)}<\/td><td class=\"mono\">${l.ore}<\/td><td style=\"color:var(--muted);font-size:12px;\">${esc(l.note||'\u2014')}<\/td><\/tr>`).join('')}<\/tbody>\n      <\/table>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:2px solid var(--ink);\">\n        <strong style=\"font-family:'Oswald',sans-serif;letter-spacing:0.04em;\">TOTALE ORE MESE<\/strong>\n        <strong class=\"mono\" style=\"font-size:24px;color:var(--orange);\">${totale.toFixed(1)} h<\/strong>\n      <\/div>`}\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn ghost\" id=\"chiudi-report\">Chiudi<\/button>\n      <\/div>\n      <div style=\"text-align:center;font-size:11px;color:var(--muted);margin-top:10px;\">Suggerimento: fai uno screenshot di questa schermata da inviare/consegnare in ufficio.<\/div>\n    `;\n    document.getElementById('chiudi-report').onclick = closeModal;\n    document.getElementById('report-mese-prev').onclick = () => { mese = new Date(mese.getFullYear(), mese.getMonth()-1, 1); disegna(); };\n    document.getElementById('report-mese-next').onclick = () => { mese = new Date(mese.getFullYear(), mese.getMonth()+1, 1); disegna(); };\n  }\n  disegna();\n  overlay.classList.add('open');\n}\nfunction openPersonaModal(existing){\n  openModal({\n    title: existing ? 'Modifica persona' : 'Nuova persona',\n    values: existing || {},\n    fields: [\n      {name:'nome', label:'Nome', type:'text', required:true},\n      {name:'ruolo', label:'Ruolo / mansione', type:'text'},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.persone.push({id:uid(), log:[], ...data}); }\n      persist(); renderAll();\n    }\n  });\n}\nfunction risolviVoceOre(logEntry){\n  // Compatibilit\u00e0 con le vecchie voci che usavano solo \"lavorazioneId\"\n  const chiave = logEntry.vociOreId || (logEntry.lavorazioneId ? ('lav:' + logEntry.lavorazioneId) : '');\n  if(!chiave) return null;\n  const [tipo, id] = chiave.split(':');\n  if(tipo === 'lav'){\n    const lav = state.lavorazioni.find(l => l.id === id);\n    return lav ? {tipo:'lavorazione', oggetto: lav, nome: lav.nome} : null;\n  }\n  if(tipo === 'att'){\n    const att = state.attivitaOre.find(a => a.id === id);\n    return att ? {tipo:'attivita', oggetto: att, nome: att.nome} : null;\n  }\n  return null;\n}\nfunction openOreModal(persona){\n  const lavorazioniAperte = state.lavorazioni.filter(l => !l.dataCompletamento);\n  openModal({\n    title: `Registra ore \u2014 ${persona.nome}`,\n    values: {data: todayISO()},\n    fields: [\n      {name:'data', label:'Data', type:'date', required:true},\n      {name:'ore', label:'Ore lavorate', type:'number', step:'0.5', required:true},\n      {name:'vociOreId', label:'Lavorazione / Attivit\u00e0 (opzionale)', type:'select', options: [\n        {value:'', label:'\u2014 Nessuna / generale \u2014'},\n        {value:'__nuova_lav__', label:'+ Nuova lavorazione\u2026'},\n        {value:'__nuova_att__', label:'+ Nuova attivit\u00e0 non produttiva\u2026'},\n        ...lavorazioniAperte.map(l => ({value:'lav:'+l.id, label:'\ud83d\udd27 '+l.nome})),\n        ...state.attivitaOre.map(a => ({value:'att:'+a.id, label:'\ud83e\uddf9 '+a.nome})),\n      ]},\n      {name:'motivazione', label:'MOTIVAZIONE / RENDIMENTO (opzionale)', type:'dots'},\n      {name:'note', label:'Note', type:'text'},\n    ],\n    onSubmit: (data) => {\n      persona.log = persona.log || [];\n      persona.log.push({id:uid(), ...data});\n      if(data.vociOreId){\n        const [tipo, id] = data.vociOreId.split(':');\n        if(tipo === 'lav'){\n          const lav = state.lavorazioni.find(l => l.id === id);\n          if(lav) lav.costoOre = (Number(lav.costoOre)||0) + Number(data.ore||0);\n        } else if(tipo === 'att'){\n          const att = state.attivitaOre.find(a => a.id === id);\n          if(att) att.costoOre = (Number(att.costoOre)||0) + Number(data.ore||0);\n        }\n      }\n      persist(); renderAll();\n    }\n  });\n  const selectVoce = document.getElementById('f-vociOreId');\n  if(selectVoce){\n    selectVoce.onchange = () => {\n      if(selectVoce.value === '__nuova_lav__'){\n        const nome = prompt('Nome della nuova lavorazione:');\n        if(!nome || !nome.trim()){ selectVoce.value = ''; return; }\n        const nuova = {id:uid(), nome:nome.trim(), statoAvanzamento:0, previsioneAvanzamento:0};\n        state.lavorazioni.push(nuova);\n        persist();\n        mostraToast('Lavorazione creata \u2713');\n        const opzione = document.createElement('option');\n        opzione.value = 'lav:'+nuova.id;\n        opzione.textContent = '\ud83d\udd27 '+nuova.nome;\n        const ancora = selectVoce.querySelector('option[value=\"__nuova_att__\"]');\n        selectVoce.insertBefore(opzione, ancora ? ancora.nextSibling : null);\n        selectVoce.value = 'lav:'+nuova.id;\n      } else if(selectVoce.value === '__nuova_att__'){\n        const nome = prompt('Nome della nuova attivit\u00e0 (es. Pulizie, Trasporti, Magazzino, Riunioni):');\n        if(!nome || !nome.trim()){ selectVoce.value = ''; return; }\n        const nuova = {id:uid(), nome:nome.trim(), costoOre:0};\n        state.attivitaOre.push(nuova);\n        persist();\n        mostraToast('Attivit\u00e0 creata \u2713');\n        const opzione = document.createElement('option');\n        opzione.value = 'att:'+nuova.id;\n        opzione.textContent = '\ud83e\uddf9 '+nuova.nome;\n        selectVoce.appendChild(opzione);\n        selectVoce.value = 'att:'+nuova.id;\n      }\n    };\n  }\n}\n\n/* ============ EVENTI ============ */\nconst TIPI_EVENTO = [\n  {value:'positivo', label:'Positivo'},\n  {value:'negativo', label:'Negativo'},\n  {value:'neutro', label:'Neutro'},\n];\nconst IMPATTI = [\n  {value:'basso', label:'Basso'},\n  {value:'medio', label:'Medio'},\n  {value:'alto', label:'Alto'},\n];\nfunction renderEventi(){\n  const rows = [...state.eventi].sort((a,b)=>b.data.localeCompare(a.data));\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Eventi<\/h2><p class=\"section-sub\">Registro di eventi positivi, negativi e neutri accaduti in cantiere.<\/p><\/div>\n      <button class=\"btn\" id=\"add-evento\">+ Nuovo evento<\/button>\n    <\/div>\n    ${rows.length===0 ? emptyState('Nessun evento registrato', 'Registra un evento per tenere traccia dell\\'andamento del cantiere.') : `\n    <div class=\"table-scroll\"><table><thead><tr><th>Data<\/th><th>Tipo<\/th><th>Titolo<\/th><th>Descrizione<\/th><th>Impatto<\/th><th><\/th><\/tr><\/thead>\n    <tbody>${rows.map(r => renderEventoRow(r)).join('')}<\/tbody><\/table><\/div>`}\n  `;\n  document.getElementById('add-evento').onclick = () => openEventoModal();\n  rows.forEach(r => {\n    const e = document.getElementById('edit-ev-'+r.id), d = document.getElementById('del-ev-'+r.id);\n    if(e) e.onclick = () => openEventoModal(r);\n    if(d) d.onclick = () => { state.eventi = state.eventi.filter(x=>x.id!==r.id); persist(); renderAll(); };\n  });\n}\nfunction renderEventoRow(r){\n  const badgeClass = r.tipo==='positivo'?'badge-green':r.tipo==='negativo'?'badge-red':'badge-gray';\n  const label = TIPI_EVENTO.find(t=>t.value===r.tipo)?.label||r.tipo;\n  return `<tr>\n    <td class=\"mono\">${fmtDate(r.data)}<\/td>\n    <td><span class=\"badge ${badgeClass}\">${label}<\/span><\/td>\n    <td><strong>${esc(r.titolo)}<\/strong><\/td>\n    <td style=\"max-width:260px;font-size:12px;color:var(--muted);\">${esc(r.descrizione||'\u2014')}<\/td>\n    <td>${r.impatto ? `<span class=\"badge badge-blue\">${esc(IMPATTI.find(i=>i.value===r.impatto)?.label||r.impatto)}<\/span>` : '\u2014'}<\/td>\n    <td><div class=\"row-actions\"><button class=\"icon-btn\" id=\"edit-ev-${r.id}\">Modifica<\/button><button class=\"icon-btn\" id=\"del-ev-${r.id}\">Elimina<\/button><\/div><\/td>\n  <\/tr>`;\n}\nfunction openEventoModal(existing){\n  openModal({\n    title: existing ? 'Modifica evento' : 'Nuovo evento',\n    values: existing || {data: todayISO(), tipo:'positivo', impatto:'medio'},\n    fields: [\n      {name:'tipo', label:'Tipo', type:'select', options: TIPI_EVENTO},\n      {name:'titolo', label:'Titolo', type:'text', required:true},\n      {name:'descrizione', label:'Descrizione', type:'textarea'},\n      {name:'data', label:'Data', type:'date', required:true},\n      {name:'impatto', label:'Impatto', type:'select', options: IMPATTI},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.eventi.push({id:uid(), ...data}); }\n      persist(); renderAll();\n    }\n  });\n}\n\n/* ============ DIARIO DI CANTIERE ============ */\nfunction corrispondeRicercaDiario(voce, testoRicerca){\n  if(!testoRicerca) return true;\n  const q = testoRicerca.toLowerCase();\n  const campi = [fmtDate(voce.data), voce.attivita||'', voce.commenti||''].join(' ').toLowerCase();\n  return campi.includes(q);\n}\nfunction renderDiario(){\n  const voci = [...state.diario]\n    .filter(v => corrispondeRicercaDiario(v, state.diarioRicerca))\n    .sort((a,b) => (b.data||'').localeCompare(a.data||''));\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Diario di cantiere<\/h2><p class=\"section-sub\">Cosa \u00e8 stato fatto giorno per giorno, con eventuali commenti. Tutto lo storico resta qui, sempre visibile e ricercabile.<\/p><\/div>\n      <button class=\"btn\" id=\"add-diario\">+ Nuova voce<\/button>\n    <\/div>\n    <div class=\"toolbar\" style=\"gap:8px;\">\n      <input type=\"text\" id=\"cerca-diario\" placeholder=\"Cerca per data, attivit\u00e0 o commento\u2026\" value=\"${esc(state.diarioRicerca)}\" style=\"flex:1;padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n    <\/div>\n    ${voci.length===0 ? emptyState(state.diarioRicerca ? 'Nessun risultato' : 'Nessuna voce nel diario', state.diarioRicerca ? 'Prova a cercare con altre parole.' : 'Aggiungi la prima voce di oggi: cosa si \u00e8 fatto in cantiere.') : voci.map(v => renderVoceDiario(v)).join('')}\n  `;\n  document.getElementById('add-diario').onclick = () => openDiarioModal();\n  const inputRicerca = document.getElementById('cerca-diario');\n  inputRicerca.oninput = () => { state.diarioRicerca = inputRicerca.value; renderDiario(); document.getElementById('cerca-diario').focus(); document.getElementById('cerca-diario').setSelectionRange(state.diarioRicerca.length, state.diarioRicerca.length); };\n  voci.forEach(v => {\n    const editBtn = document.getElementById('edit-diario-'+v.id);\n    const delBtn = document.getElementById('del-diario-'+v.id);\n    if(editBtn) editBtn.onclick = () => openDiarioModal(v);\n    if(delBtn) delBtn.onclick = () => { state.diario = state.diario.filter(x=>x.id!==v.id); persist(); renderDiario(); };\n  });\n}\nfunction renderVoceDiario(v){\n  return `<div class=\"card\" style=\"cursor:default;margin-bottom:12px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;\">\n      <div style=\"font-family:'Oswald',sans-serif;font-size:16px;\">${fmtDate(v.data)}<\/div>\n      <div class=\"row-actions\">\n        <button class=\"icon-btn\" id=\"edit-diario-${v.id}\">Modifica<\/button>\n        <button class=\"icon-btn\" id=\"del-diario-${v.id}\">Elimina<\/button>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top:8px;white-space:pre-wrap;font-size:13px;\">${esc(v.attivita||'')}<\/div>\n    ${v.commenti ? `<div style=\"margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:pre-wrap;\">${esc(v.commenti)}<\/div>` : ''}\n  <\/div>`;\n}\nfunction openDiarioModal(existing){\n  openModal({\n    title: existing ? 'Modifica voce diario' : 'Nuova voce diario',\n    values: existing || {data: todayISO()},\n    fields: [\n      {name:'data', label:'Data', type:'date', required:true},\n      {name:'attivita', label:'Cosa si \u00e8 fatto oggi', type:'textarea', required:true},\n      {name:'commenti', label:'Commenti (opzionale)', type:'textarea'},\n    ],\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.diario.push({id:uid(), ...data}); }\n      persist();\n      renderDiario();\n    }\n  });\n}\n\n/* ============ RISCHI ============ */\nconst CATEGORIE_RISCHIO = [\n  {value:'economico', label:'Economico'},\n  {value:'temporale', label:'Temporale'},\n  {value:'immagine', label:'Immagine/reputazione'},\n  {value:'sicurezza', label:'Sicurezza'},\n  {value:'qualita', label:'Qualit\u00e0'},\n  {value:'fornitori', label:'Fornitori/materiali'},\n  {value:'altro', label:'Altro'},\n];\nconst LIVELLI_PROBABILITA_IMPATTO = [\n  {value:'bassa', label:'Bassa'},\n  {value:'media', label:'Media'},\n  {value:'alta', label:'Alta'},\n];\nconst STATI_RISCHIO = [\n  {value:'previsto', label:'Previsto'},\n  {value:'sotto_controllo', label:'Sotto controllo'},\n  {value:'accaduto', label:'Accaduto'},\n  {value:'chiuso', label:'Chiuso'},\n];\nfunction valoreLivello(v){ return {bassa:1, media:2, alta:3}[v] || 1; }\nfunction calcolaRischio(r){\n  const probabilita = valoreLivello(r.probabilita);\n  const impattoPeggiore = Math.max(valoreLivello(r.impattoEconomico), valoreLivello(r.impattoTemporale), valoreLivello(r.impattoImmagine));\n  const punteggio = probabilita * impattoPeggiore;\n  let livello, colore;\n  if(punteggio <= 2){ livello = 'Basso'; colore = 'green'; }\n  else if(punteggio <= 4){ livello = 'Medio'; colore = 'orange'; }\n  else { livello = 'Alto'; colore = 'red'; }\n  return { punteggio, livello, colore };\n}\nfunction renderRischi(){\n  const categorie = CATEGORIE_RISCHIO;\n  const aperti = state.rischi.filter(r => r.stato !== 'accaduto' && r.stato !== 'chiuso');\n  const chiusi = state.rischi.filter(r => r.stato === 'accaduto' || r.stato === 'chiuso');\n  const filtrati = aperti\n    .filter(r => !state.rischiFiltroStato || r.stato === state.rischiFiltroStato)\n    .filter(r => !state.rischiFiltroCategoria || r.categoria === state.rischiFiltroCategoria)\n    .sort((a,b) => calcolaRischio(b).punteggio - calcolaRischio(a).punteggio);\n  const chiusiFiltrati = chiusi\n    .filter(r => !state.rischiFiltroCategoria || r.categoria === state.rischiFiltroCategoria)\n    .sort((a,b) => (b.dataAccaduto||b.dataPrevista||'').localeCompare(a.dataAccaduto||a.dataPrevista||''));\n\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Rischi<\/h2><p class=\"section-sub\">Previsione, impatto, prevenzione e risposta \u2014 sia per rischi futuri che per quelli gi\u00e0 accaduti.<\/p><\/div>\n      <button class=\"btn\" id=\"add-rischio\">+ Nuovo rischio<\/button>\n    <\/div>\n    <div class=\"toolbar\" style=\"gap:8px;flex-wrap:wrap;\">\n      <select id=\"filtro-stato-rischi\" style=\"padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n        <option value=\"\">Tutti gli stati aperti<\/option>\n        ${STATI_RISCHIO.filter(s=>s.value==='previsto'||s.value==='sotto_controllo').map(s => `<option value=\"${s.value}\" ${state.rischiFiltroStato===s.value?'selected':''}>${s.label}<\/option>`).join('')}\n      <\/select>\n      <select id=\"filtro-categoria-rischi\" style=\"padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n        <option value=\"\">Tutte le categorie<\/option>\n        ${categorie.map(c => `<option value=\"${c.value}\" ${state.rischiFiltroCategoria===c.value?'selected':''}>${c.label}<\/option>`).join('')}\n      <\/select>\n    <\/div>\n    ${filtrati.length===0 ? emptyState('Nessun rischio attivo', 'Aggiungi un rischio previsto o da tenere sotto controllo.') : filtrati.map(r => renderRischioCard(r)).join('')}\n\n    ${chiusiFiltrati.length>0 ? `\n    <details id=\"dettaglio-rischi-chiusi\" style=\"margin-top:20px;\" ${uiDettagliAperti['rischi-chiusi']?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:10px 0;color:var(--muted);font-size:13px;\">Rischi accaduti / chiusi (${chiusiFiltrati.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div style=\"margin-top:8px;\">${chiusiFiltrati.map(r => renderRischioCard(r)).join('')}<\/div>\n    <\/details>` : ''}\n  `;\n  document.getElementById('add-rischio').onclick = () => openRischioModal();\n  document.getElementById('filtro-stato-rischi').onchange = (e) => { state.rischiFiltroStato = e.target.value; renderRischi(); };\n  document.getElementById('filtro-categoria-rischi').onchange = (e) => { state.rischiFiltroCategoria = e.target.value; renderRischi(); };\n  const dettChiusi = document.getElementById('dettaglio-rischi-chiusi');\n  if(dettChiusi) dettChiusi.addEventListener('toggle', function(){ uiDettagliAperti['rischi-chiusi'] = this.open; });\n\n  state.rischi.forEach(r => {\n    const editBtn = document.getElementById('edit-rischio-'+r.id);\n    const delBtn = document.getElementById('del-rischio-'+r.id);\n    const fotoBtn = document.getElementById('foto-rischio-'+r.id);\n    const vediFotoBtn = document.getElementById('vedi-foto-rischio-'+r.id);\n    if(editBtn) editBtn.onclick = () => openRischioModal(r);\n    if(delBtn) delBtn.onclick = () => { state.rischi = state.rischi.filter(x=>x.id!==r.id); persist(); renderRischi(); };\n    if(fotoBtn) fotoBtn.onclick = () => scattaFotoRischio(r);\n    if(vediFotoBtn) vediFotoBtn.onclick = () => window.open(r.cartellaFotoUrl, '_blank');\n  });\n}\nfunction renderRischioCard(r){\n  const { livello, colore } = calcolaRischio(r);\n  const categoria = CATEGORIE_RISCHIO.find(c => c.value === r.categoria);\n  const stato = STATI_RISCHIO.find(s => s.value === r.stato);\n  const chiuso = r.stato === 'accaduto' || r.stato === 'chiuso';\n  return `<div class=\"card\" style=\"cursor:default;margin-bottom:12px;${chiuso?'opacity:0.7;':''}\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;\">\n      <div style=\"display:flex;align-items:center;gap:10px;\">\n        <span style=\"display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--${colore});flex-shrink:0;\" title=\"Rischio ${livello}\"><\/span>\n        <div>\n          <div style=\"font-family:'Oswald',sans-serif;font-size:16px;\">${esc(r.titolo)}<\/div>\n          <div style=\"font-size:11px;color:var(--muted);margin-top:2px;\">\n            ${categoria?esc(categoria.label):''} \u00b7 Rischio <strong style=\"color:var(--${colore});\">${livello}<\/strong>\n            \u00b7 Prob. ${LIVELLI_PROBABILITA_IMPATTO.find(l=>l.value===r.probabilita)?.label||'\u2014'}\n          <\/div>\n        <\/div>\n      <\/div>\n      <span class=\"badge badge-${chiuso?'gray':'blue'}\">${stato?esc(stato.label):''}<\/span>\n    <\/div>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted);\">\n      <span>Impatto economico: <strong style=\"color:var(--ink);\">${LIVELLI_PROBABILITA_IMPATTO.find(l=>l.value===r.impattoEconomico)?.label||'\u2014'}<\/strong><\/span>\n      <span>Impatto temporale: <strong style=\"color:va
