r:hover td{background:rgba(232,114,12,0.06);}\n.empty-row td{color:var(--muted);text-align:center;padding:30px;font-style:italic;}\n\n/* --- Progress bar --- */\n.bar-track{background:var(--paper);border:1px solid var(--line);height:10px;width:100%;position:relative;}\n.bar-fill{background:var(--orange);height:100%;}\n.bar-marker{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);}\n\n.badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;font-family:'IBM Plex Mono',monospace;border-radius:var(--radius);white-space:nowrap;}\n.badge-green{background:var(--green-dim);color:var(--green);}\n.badge-red{background:var(--red-dim);color:var(--red);}\n.badge-orange{background:var(--orange-dim);color:var(--orange);}\n.badge-blue{background:var(--blue-dim);color:var(--blue);}\n.badge-gray{background:#E7EAEC;color:var(--muted);}\n.badge-purple{background:var(--purple-dim);color:var(--purple);}\n\n.row-actions{display:flex;gap:6px;}\n.icon-btn{background:none;border:1px solid var(--line);cursor:pointer;padding:9px 12px;font-size:12px;color:var(--muted);min-height:38px;}\n.valore-cliccabile{cursor:pointer;border-bottom:1px dotted var(--muted);display:inline-block;padding:5px 2px;}\n.valore-cliccabile:hover{border-bottom-color:var(--orange);color:var(--orange);}\n.valore-vuoto{cursor:pointer;color:var(--muted);font-style:italic;font-size:11px;border-bottom:1px dotted var(--line);padding:5px 2px;display:inline-block;}\n.valore-vuoto:hover{border-bottom-color:var(--orange);color:var(--orange);}\n.riga-cliccabile{cursor:pointer;}\n.riga-cliccabile:hover td{background:rgba(232,114,12,0.07);}\n.stepper{display:inline-flex;align-items:center;gap:4px;}\n.stepper button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px;line-height:1;padding:0;color:var(--ink);}\n.stepper button:hover{border-color:var(--orange);color:var(--orange);}\n.icon-btn:hover{border-color:var(--orange);color:var(--orange);}\n\n/* --- Calendar --- */\n.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}\n.cal-month{font-family:'Oswald',sans-serif;font-size:20px;}\n.cal-grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}\n.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-width:650px;border-left:1px solid var(--line);border-top:1px solid var(--line);}\n.cal-dow{font-family:'IBM Plex Mono',monospace;font-size:10px;text-align:center;padding:6px;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);}\n.cal-day{min-height:128px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;cursor:pointer;position:relative;transition:background .1s ease;overflow:hidden;}\n.cal-day:hover{background:var(--orange-dim);}\n.cal-day.other-month{opacity:0.35;}\n.cal-day.today{background:#FFF7EC;}\n.cal-day.selected{outline:2px solid var(--orange);outline-offset:-2px;}\n.cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);}\n.cal-entries{display:flex;flex-direction:column;gap:3px;margin-top:6px;min-width:0;}\n.cal-entry-line{font-size:11px;line-height:1.35;padding:2px 5px 2px 7px;border-left:3px solid var(--muted);background:rgba(22,35,46,0.035);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);min-width:0;max-width:100%;}\n.cal-dots-mini{display:none;flex-wrap:wrap;gap:3px;margin-top:6px;}\n.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}\n.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}\n.dot-ordine{background:var(--blue);}\n.dot-lavorazione{background:var(--orange);}\n.dot-positivo{background:var(--green);}\n.dot-negativo{background:var(--red);}\n.dot-neutro{background:var(--muted);}\n.dot-nota{background:#7C8891;}\n.dot-appuntamento{background:var(--purple);}\n.cal-more{font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}\n.day-detail{border:1px solid var(--line);margin-top:16px;padding:16px;background:var(--paper);}\n.day-detail h4{margin:0 0 10px;font-size:14px;}\n.day-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px;font-size:13px;}\n.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted);align-items:center;}\n.legend span{display:flex;align-items:center;gap:5px;}\n\n/* --- Modal --- */\n.overlay{position:fixed;inset:0;background:rgba(22,35,46,0.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto;}\n.overlay.open{display:flex;}\n.modal{background:var(--surface);border:1.5px solid var(--ink);width:100%;max-width:480px;padding:22px;}\n.modal h3{margin:0 0 16px;font-size:18px;}\n.field{margin-bottom:14px;}\n.field label{display:block;font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:0.04em;margin-bottom:6px;text-transform:uppercase;}\n.field input, .field select, .field textarea{\n  width:100%;padding:10px 11px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);\n}\n.field textarea{resize:vertical;min-height:60px;}\n.field-check{display:flex;align-items:center;gap:8px;}\n.field-check input{width:auto;}\n.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}\n.field-row{display:flex;gap:10px;}\n.field-row .field{flex:1;}\n\n.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}\n.empty-state .display{font-size:16px;color:var(--ink);margin-bottom:8px;}\n\n@media (max-width:720px){\n  .stamp{flex-direction:column;}\n  .stamp-cell{border-right:none;border-bottom:1px solid var(--line);}\n  .nav{flex-direction:column;}\n  .nav-tab{border-right:none;border-bottom:1px solid var(--line);}\n  .panel{padding:16px 12px;}\n}\n@media (max-width:600px){\n  .cal-grid-scroll{overflow-x:visible;}\n  .cal-grid{min-width:0;grid-template-columns:repeat(7,minmax(0,1fr));}\n  .cal-day{min-height:52px;padding:4px 3px;}\n  .cal-daynum{font-size:10.5px;}\n  .cal-entries{display:none;}\n  .cal-dots-mini{display:flex;}\n  .cal-dots-mini .dot{width:6px;height:6px;}\n  .cal-more{font-size:8px;}\n  .cal-dow{font-size:9px;padding:4px 2px;}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"stamp\">\n    <div class=\"stamp-cell\" style=\"flex:2;min-width:220px;\">\n      <span class=\"stamp-label\">Cantiere attivo<\/span>\n      <div style=\"display:flex;align-items:center;gap:8px;\">\n        <span class=\"stamp-value\" id=\"stamp-nome-cantiere\">--<\/span>\n        <button class=\"icon-btn\" id=\"btn-rinomina-cantiere\" title=\"Rinomina cantiere\">\u270e<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"stamp-cell\" style=\"min-width:170px;\">\n      <span class=\"stamp-label\">&nbsp;<\/span>\n      <button class=\"btn ghost small\" id=\"btn-cambia-cantiere\" style=\"width:100%;\">\u21c4 Cambia / Nuovo cantiere<\/button>\n    <\/div>\n    <div class=\"stamp-cell\">\n      <span class=\"stamp-label\">Data odierna<\/span>\n      <span class=\"stamp-value small\" id=\"stamp-date\">--<\/span>\n    <\/div>\n    <div class=\"stamp-cell\">\n      <span class=\"stamp-label\">Sincronizzazione<\/span>\n      <span class=\"badge badge-gray\" id=\"stato-sync\">\u25cf In attesa<\/span>\n    <\/div>\n  <\/div>\n\n  <div class=\"nav\" id=\"nav\"><\/div>\n  <div class=\"panel\" id=\"content\"><\/div>\n\n  <div class=\"legend\" style=\"margin-top:14px;\">\n    <span><span class=\"dot dot-ordine\"><\/span> Ordine<\/span>\n    <span><span class=\"dot dot-lavorazione\"><\/span> Scadenza lavorazione<\/span>\n    <span><span class=\"dot dot-positivo\"><\/span> Evento positivo<\/span>\n    <span><span class=\"dot dot-negativo\"><\/span> Evento negativo<\/span>\n    <span><span class=\"dot dot-neutro\"><\/span> Evento neutro<\/span>\n    <span><span class=\"dot dot-nota\"><\/span> Nota<\/span>\n    <span><span class=\"dot dot-appuntamento\"><\/span> Appuntamento<\/span>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"modal\" id=\"modal\"><\/div>\n<\/div>\n<div id=\"overlay-caricamento\" style=\"display:none;position:fixed;inset:0;background:rgba(237,241,242,0.75);z-index:100;align-items:center;justify-content:center;\">\n  <div style=\"background:var(--surface);border:1.5px solid var(--ink);padding:16px 22px;font-family:'Oswald',sans-serif;letter-spacing:0.04em;\">Sincronizzazione con Google Sheets\u2026<\/div>\n<\/div>\n<div id=\"toast-salvataggio\" style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--surface);padding:10px 20px;font-family:'Oswald',sans-serif;letter-spacing:0.05em;font-size:14px;z-index:120;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;border-radius:2px;\">Salvato \u2713<\/div>\n<div id=\"indicatore-foto\" style=\"display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--orange);color:var(--surface);padding:8px 16px;font-family:'Oswald',sans-serif;letter-spacing:0.04em;font-size:13px;z-index:120;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,0.25);\"><\/div>\n\n<script>\n/* ============ CONTROLLO VERSIONE (evita che il browser mostri una copia vecchia in cache) ============ */\nconst APP_VERSION = 'v2026-07-24-1';\n(function(){\n  try{\n    const versionePrecedente = localStorage.getItem('gc_app_version');\n    if(versionePrecedente !== APP_VERSION){\n      localStorage.setItem('gc_app_version', APP_VERSION);\n      if(versionePrecedente){\n        const url = new URL(window.location.href);\n        url.searchParams.set('_v', Date.now());\n        window.location.replace(url.toString());\n      }\n    }\n  }catch(e){}\n})();\n\n/* ============ STATE ============ */\n/* Ricorda quali tendine <details> sono aperte tra un ridisegno e l'altro della pagina */\nconst uiDettagliAperti = {};\n\nconst state = {\n  cantiereAttivoId: null,\n  section: 'dashboard',\n  lavorazioni: [],\n  ordini: [],\n  persone: [],\n  eventi: [],\n  calendario: [],\n  attivitaVarie: [],\n  diario: [],\n  diarioRicerca: '',\n  materialiDaOrdinare: [],\n  materialiFiltroFornitore: '',\n  nomeCantiereAttivo: '',\n  calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),\n  selectedDay: null,\n  personeMese: new Date(new Date().getFullYear(), new Date().getMonth(), 1),\n};\n\nconst MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];\n\nconst SECTIONS = [\n  {id:'dashboard', code:'00', label:'Quadro generale'},\n  {id:'calendario', code:'01', label:'Calendario'},\n  {id:'lavorazioni', code:'02', label:'Lavorazioni'},\n  {id:'ordini', code:'03', label:'Ordini'},\n  {id:'persone', code:'04', label:'Persone'},\n  {id:'eventi', code:'05', label:'Eventi'},\n  {id:'diario', code:'06', label:'Diario di cantiere'},\n];\n\n/* ============ STORAGE (localStorage \u2014 persistente sul dispositivo, ideale per APK/WebView) ============ */\nconst LS_PREFIX = 'gc_'; // gestione-cantiere\nconst LS_KEY_LISTA = LS_PREFIX + 'lista-cantieri';\nconst LS_KEY_ATTIVO = LS_PREFIX + 'cantiere-attivo';\nconst LS_KEY_URL_SHEETS = LS_PREFIX + 'url-apps-script';\n\nfunction lsGet(key, fallback){\n  try{\n    const raw = localStorage.getItem(key);\n    return raw ? JSON.parse(raw) : fallback;\n  }catch(e){\n    console.error('Errore lettura storage locale', key, e);\n    return fallback;\n  }\n}\nfunction lsSet(key, value){\n  try{\n    localStorage.setItem(key, JSON.stringify(value));\n    return true;\n  }catch(e){\n    console.error('Errore salvataggio storage locale', key, e);\n    return false;\n  }\n}\nfunction datiVuoti(){\n  return {lavorazioni:[], ordini:[], persone:[], eventi:[], calendario:[], attivitaVarie:[], diario:[], materialiDaOrdinare:[]};\n}\nfunction dataKeyCantiere(id){ return LS_PREFIX + 'dati-' + id; }\n\n/* ---- Collegamento al foglio Google (Apps Script Web App) ---- */\nconst URL_APPS_SCRIPT_PREDEFINITO = 'https://script.google.com/macros/s/AKfycbxDXtrI8NELVMnHIW3MJoS2yhahFm0DLQT4FOI9pcx3-w9is2HwV0WUg2tMKaUuq-rC/exec'; function getUrlAppsScript(){ return localStorage.getItem(LS_KEY_URL_SHEETS) || URL_APPS_SCRIPT_PREDEFINITO; }\nfunction setUrlAppsScript(url){ localStorage.setItem(LS_KEY_URL_SHEETS, url.trim()); }\n\nasync function kvGet(key){\n  const url = getUrlAppsScript();\n  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');\n  const res = await fetch(`${url}?action=get&key=${encodeURIComponent(key)}`);\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Errore nella lettura dei dati dal foglio');\n  return json.found ? JSON.parse(json.value) : null;\n}\nasync function kvSet(key, value){\n  const url = getUrlAppsScript();\n  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');\n  const res = await fetch(url, {\n    method: 'POST',\n    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // evita il preflight CORS, non gestito da Apps Script\n    body: JSON.stringify({action:'set', key, value: JSON.stringify(value)}),\n  });\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Errore nel salvataggio dei dati sul foglio');\n  return true;\n}\nasync function kvDelete(key){\n  const url = getUrlAppsScript();\n  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');\n  const res = await fetch(url, {\n    method: 'POST',\n    headers: {'Content-Type': 'text/plain;charset=utf-8'},\n    body: JSON.stringify({action:'delete', key}),\n  });\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Errore nell\\'eliminazione dei dati sul foglio');\n  return true;\n}\nasync function testaConnessioneAppsScript(url){\n  const res = await fetch(`${url}?action=ping`);\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Risposta non valida dal foglio');\n  return true;\n}\nasync function chiamaAzionePost(azione, payload){\n  const url = getUrlAppsScript();\n  if(!url) throw new Error('Nessun Google Sheet configurato su questo dispositivo.');\n  const res = await fetch(url, {\n    method: 'POST',\n    headers: {'Content-Type': 'text/plain;charset=utf-8'},\n    body: JSON.stringify({action: azione, ...payload}),\n  });\n  if(!res.ok) throw new Error('Errore di rete (HTTP ' + res.status + ')');\n  const json = await res.json();\n  if(!json.ok) throw new Error(json.error || 'Errore nella richiesta al foglio');\n  return json;\n}\n\n/* ---- Fotocamera e ridimensionamento immagini ---- */\nfunction apriFotocamera(){\n  return new Promise((resolve) => {\n    const input = document.createElement('input');\n    input.type = 'file';\n    input.accept = 'image/*';\n    input.capture = 'environment';\n    input.style.display = 'none';\n    input.onchange = () => {\n      const file = input.files && input.files[0] ? input.files[0] : null;\n      document.body.removeChild(input);\n      resolve(file);\n    };\n    document.body.appendChild(input);\n    input.click();\n  });\n}\nfunction ridimensionaImmagine(file, maxLato, qualita){\n  maxLato = maxLato || 1280;\n  qualita = qualita || 0.72;\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onerror = () => reject(new Error('Impossibile leggere la foto.'));\n    reader.onload = () => {\n      const img = new Image();\n      img.onerror = () => reject(new Error('Impossibile elaborare la foto.'));\n      img.onload = () => {\n        let { width, height } = img;\n        if(width > maxLato || height > maxLato){\n          if(width >= height){ height = Math.round(height * (maxLato / width)); width = maxLato; }\n          else { width = Math.round(width * (maxLato / height)); height = maxLato; }\n        }\n        const canvas = document.createElement('canvas');\n        canvas.width = width;\n        canvas.height = height;\n        canvas.getContext('2d').drawImage(img, 0, 0, width, height);\n        const dataUrl = canvas.toDataURL('image/jpeg', qualita);\n        resolve(dataUrl.split(',')[1]);\n      };\n      img.src = reader.result;\n    };\n    reader.readAsDataURL(file);\n  });\n}\n\n/* ---- Indicatore di sincronizzazione (in alto) ---- */\nlet toastTimer = null;\nfunction mostraToast(testo){\n  const el = document.getElementById('toast-salvataggio');\n  if(!el) return;\n  el.textContent = testo;\n  el.style.opacity = '1';\n  el.style.transform = 'translateX(-50%) translateY(0)';\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => {\n    el.style.opacity = '0';\n    el.style.transform = 'translateX(-50%) translateY(80px)';\n  }, 1400);\n}\nfunction mostraToastSalvato(){ mostraToast('Salvato \u2713'); }\nlet caricamentiFotoInCorso = 0;\nfunction aggiornaIndicatoreCaricamentoFoto(){\n  const el = document.getElementById('indicatore-foto');\n  if(!el) return;\n  if(caricamentiFotoInCorso > 0){\n    el.textContent = `\ud83d\udce4 Caricamento foto: ${caricamentiFotoInCorso} in corso\u2026`;\n    el.style.display = 'block';\n  } else {\n    el.style.display = 'none';\n  }\n}\nfunction copiaTesto(testo){\n  function fallbackPrompt(){ window.prompt('Copia il testo qui sotto:', testo); }\n  function fallbackExec(){\n    try{\n      const ta = document.createElement('textarea');\n      ta.value = testo;\n      ta.style.position = 'fixed';\n      ta.style.opacity = '0';\n      document.body.appendChild(ta);\n      ta.focus();\n      ta.select();\n      const ok = document.execCommand('copy');\n      document.body.removeChild(ta);\n      if(ok) mostraToast('Copiato \u2713'); else fallbackPrompt();\n    }catch(e){\n      fallbackPrompt();\n    }\n  }\n  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){\n    navigator.clipboard.writeText(testo).then(() => mostraToast('Copiato \u2713')).catch(fallbackExec);\n  } else {\n    fallbackExec();\n  }\n}\nfunction impostaStatoSync(stato, dettaglio){\n  const el = document.getElementById('stato-sync');\n  if(!el) return;\n  const mappa = {\n    ok: {testo:'\u25cf Sincronizzato', classe:'badge-green'},\n    salvataggio: {testo:'\u25cf Salvataggio\u2026', classe:'badge-orange'},\n    errore: {testo:'\u25cf Errore di sincronizzazione', classe:'badge-red'},\n  };\n  const m = mappa[stato] || mappa.ok;\n  el.className = 'badge ' + m.classe;\n  el.textContent = m.testo;\n  el.title = dettaglio || '';\n}\n\nfunction caricaListaCantieri(){\n  return kvGet(LS_KEY_LISTA).then(v => v || []);\n}\nfunction salvaListaCantieri(lista){\n  return kvSet(LS_KEY_LISTA, lista);\n}\nfunction caricaDatiCantiere(id){\n  return kvGet(dataKeyCantiere(id)).then(v => v || datiVuoti());\n}\n\n/* ---- Cache locale per avvio istantaneo (letta subito, poi confermata/aggiornata da Google Sheets in background) ---- */\nconst LS_KEY_CACHE_LISTA = LS_PREFIX + 'cache-lista-cantieri';\nfunction cacheKeyDatiCantiere(id){ return LS_PREFIX + 'cache-dati-' + id; }\nfunction caricaCacheListaLocale(){ return lsGet(LS_KEY_CACHE_LISTA, null); }\nfunction salvaCacheListaLocale(lista){ lsSet(LS_KEY_CACHE_LISTA, lista); }\nfunction caricaCacheDatiLocale(id){ return lsGet(cacheKeyDatiCantiere(id), null); }\nfunction salvaCacheDatiLocale(id, dati){ lsSet(cacheKeyDatiCantiere(id), dati); }\nfunction applicaDatiAStato(dati){\n  state.lavorazioni = dati.lavorazioni || [];\n  state.ordini = dati.ordini || [];\n  state.persone = dati.persone || [];\n  state.eventi = dati.eventi || [];\n  state.calendario = dati.calendario || [];\n  state.attivitaVarie = dati.attivitaVarie || [];\n  state.diario = dati.diario || [];\n  state.materialiDaOrdinare = dati.materialiDaOrdinare || [];\n}\nfunction raccogliDatiStato(){\n  return {\n    lavorazioni: state.lavorazioni,\n    ordini: state.ordini,\n    persone: state.persone,\n    eventi: state.eventi,\n    calendario: state.calendario,\n    attivitaVarie: state.attivitaVarie,\n    diario: state.diario,\n    materialiDaOrdinare: state.materialiDaOrdinare,\n  };\n}\n\nlet riprovaPersistTimer = null;\nlet codaPersist = Promise.resolve();\nfunction persist(){\n  codaPersist = codaPersist.then(() => persistImpl()).catch(() => {});\n  return codaPersist;\n}\nasync function persistImpl(){\n  const dati = raccogliDatiStato();\n  impostaStatoSync('salvataggio');\n  try{\n    await kvSet(dataKeyCantiere(state.cantiereAttivoId), dati);\n    salvaCacheDatiLocale(state.cantiereAttivoId, dati);\n    const lista = await caricaListaCantieri();\n    const meta = lista.find(c => c.id === state.cantiereAttivoId);\n    if(meta) meta.ultimaModifica = new Date().toISOString();\n    await salvaListaCantieri(lista);\n    salvaCacheListaLocale(lista);\n    impostaStatoSync('ok');\n    mostraToastSalvato();\n  }catch(e){\n    console.error('Errore di sincronizzazione', e);\n    impostaStatoSync('errore', e.message + ' \u2014 verr\u00e0 ritentato tra poco.');\n    clearTimeout(riprovaPersistTimer);\n    riprovaPersistTimer = setTimeout(persist, 8000);\n  }\n}\n\n/* ============ GESTIONE MULTI-CANTIERE ============ */\nasync function creaCantiere(nome){\n  const lista = await caricaListaCantieri();\n  const id = uid();\n  lista.push({id, nome: nome || 'Nuovo cantiere', creato: new Date().toISOString(), ultimaModifica: new Date().toISOString()});\n  await salvaListaCantieri(lista);\n  await kvSet(dataKeyCantiere(id), datiVuoti());\n  return id;\n}\nasync function eliminaCantiere(id){\n  let lista = await caricaListaCantieri();\n  lista = lista.filter(c => c.id !== id);\n  await salvaListaCantieri(lista);\n  try{ await kvDelete(dataKeyCantiere(id)); }catch(e){}\n  return lista;\n}\nasync function rinominaCantiere(id, nuovoNome){\n  const lista = await caricaListaCantieri();\n  const meta = lista.find(c => c.id === id);\n  if(meta) meta.nome = nuovoNome;\n  await salvaListaCantieri(lista);\n}\nasync function passaACantiere(id){\n  state.cantiereAttivoId = id;\n  lsSet(LS_KEY_ATTIVO, id);\n  state.section = 'dashboard';\n  state.selectedDay = null;\n\n  const datiCache = caricaCacheDatiLocale(id);\n  const listaCache = caricaCacheListaLocale();\n  let dipintoDaCache = false;\n  if(datiCache){\n    applicaDatiAStato(datiCache);\n    if(listaCache){\n      const meta = listaCache.find(c => c.id === id);\n      state.nomeCantiereAttivo = meta ? meta.nome : 'Cantiere';\n      document.getElementById('stamp-nome-cantiere').textContent = state.nomeCantiereAttivo;\n    }\n    renderAll();\n    dipintoDaCache = true;\n  } else {\n    mostraCaricamento(true);\n  }\n\n  try{\n    const dati = await caricaDatiCantiere(id);\n    applicaDatiAStato(dati);\n    salvaCacheDatiLocale(id, dati);\n    await renderStamp();\n    renderAll();\n    impostaStatoSync('ok');\n  }catch(e){\n    if(!dipintoDaCache){\n      alert('Errore nel caricare il cantiere: ' + e.message);\n    }\n    impostaStatoSync('errore', e.message);\n  }\n  mostraCaricamento(false);\n}\nasync function renderStamp(){\n  try{\n    const lista = await caricaListaCantieri();\n    salvaCacheListaLocale(lista);\n    const meta = lista.find(c => c.id === state.cantiereAttivoId);\n    state.nomeCantiereAttivo = meta ? meta.nome : 'Cantiere';\n    document.getElementById('stamp-nome-cantiere').textContent = state.nomeCantiereAttivo;\n  }catch(e){\n    if(!state.nomeCantiereAttivo) document.getElementById('stamp-nome-cantiere').textContent = '\u26a0 errore di connessione';\n  }\n}\nfunction mostraCaricamento(mostra){\n  const el = document.getElementById('overlay-caricamento');\n  if(el) el.style.display = mostra ? 'flex' : 'none';\n}\n\n/* ============ MODALE GESTIONE CANTIERI ============ */\nasync function apriGestioneCantieri(){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '';\n  modal.innerHTML = `<div style=\"text-align:center;padding:30px;color:var(--muted);\">Caricamento cantieri\u2026<\/div>`;\n  overlay.classList.add('open');\n  await disegnaModaleCantieri();\n  async function disegnaModaleCantieri(){\n    let lista;\n    try{\n      lista = (await caricaListaCantieri()).sort((a,b) => (b.ultimaModifica||'').localeCompare(a.ultimaModifica||''));\n    }catch(e){\n      modal.innerHTML = `<div style=\"text-align:center;padding:30px;color:var(--red);\">Impossibile contattare Google Sheets.<br><span style=\"font-size:12px;color:var(--muted);\">${esc(e.message)}<\/span><\/div>\n        <div class=\"modal-actions\"><button type=\"button\" class=\"btn ghost\" id=\"chiudi-errore-cantieri\">Chiudi<\/button><button type=\"button\" class=\"btn\" id=\"apri-impostazioni-da-errore\">Impostazioni connessione<\/button><\/div>`;\n      document.getElementById('chiudi-errore-cantieri').onclick = closeModal;\n      document.getElementById('apri-impostazioni-da-errore').onclick = () => apriImpostazioniConnessione();\n      return;\n    }\n    modal.innerHTML = `\n      <h3>Cantieri<\/h3>\n      <p style=\"font-size:12px;color:var(--muted);margin:-8px 0 14px;\">Ogni cantiere mantiene dati e storico separati, sincronizzati su Google Sheets. Nulla viene mai cancellato automaticamente.<\/p>\n      <div id=\"lista-cantieri-modal\">\n        ${lista.map(c => `\n          <div class=\"day-entry\" style=\"align-items:center;\">\n            <div>\n              <div style=\"font-family:'Oswald',sans-serif;${c.id===state.cantiereAttivoId?'color:var(--orange);':''}\">${esc(c.nome)} ${c.id===state.cantiereAttivoId?'<span class=\"badge badge-orange\">attivo<\/span>':''}<\/div>\n              <div style=\"font-size:11px;color:var(--muted);\">creato il ${fmtDate((c.creato||'').slice(0,10))}<\/div>\n            <\/div>\n            <div class=\"row-actions\">\n              ${c.id!==state.cantiereAttivoId?`<button class=\"icon-btn\" data-apri=\"${c.id}\">Apri<\/button>`:''}\n              <button class=\"icon-btn\" data-elimina=\"${c.id}\">Elimina<\/button>\n            <\/div>\n          <\/div>\n        `).join('') || '<div style=\"color:var(--muted);font-size:13px;\">Nessun cantiere presente.<\/div>'}\n      <\/div>\n\n      <div class=\"subsection-title\" style=\"margin:20px 0 10px;\">Backup di sicurezza<\/div>\n      <p style=\"font-size:12px;color:var(--muted);margin:-4px 0 12px;\">Scarica un file con tutti i cantieri e tutti i dati, oltre a quanto gi\u00e0 sincronizzato su Google Sheets. Salvalo in una cartella Drive per una copia in pi\u00f9.<\/p>\n      <div class=\"modal-actions\" style=\"justify-content:flex-start;gap:10px;flex-wrap:wrap;\">\n        <button type=\"button\" class=\"btn ghost\" id=\"esporta-backup-btn\">\u2b07 Esporta backup<\/button>\n        <button type=\"button\" class=\"btn ghost\" id=\"importa-backup-btn\">\u2b06 Importa backup<\/button>\n        <button type=\"button\" class=\"btn ghost\" id=\"impostazioni-connessione-btn\">\u2699 Connessione Google Sheets<\/button>\n        <input type=\"file\" id=\"importa-backup-file\" accept=\"application/json\" style=\"display:none;\">\n      <\/div>\n\n      <div class=\"modal-actions\" style=\"justify-content:space-between;margin-top:18px;\">\n        <button type=\"button\" class=\"btn ghost\" id=\"chiudi-gestione-cantieri\">Chiudi<\/button>\n        <button type=\"button\" class=\"btn\" id=\"nuovo-cantiere-btn\">+ Nuovo cantiere<\/button>\n      <\/div>\n    `;\n    document.getElementById('esporta-backup-btn').onclick = esportaBackupCompleto;\n    document.getElementById('impostazioni-connessione-btn').onclick = () => apriImpostazioniConnessione();\n    document.getElementById('importa-backup-btn').onclick = () => document.getElementById('importa-backup-file').click();\n    document.getElementById('importa-backup-file').onchange = (e) => {\n      const file = e.target.files[0];\n      if(file) importaBackupDaFile(file, disegnaModaleCantieri);\n      e.target.value = '';\n    };\n    document.getElementById('chiudi-gestione-cantieri').onclick = closeModal;\n    document.getElementById('nuovo-cantiere-btn').onclick = async () => {\n      const nome = prompt('Nome del nuovo cantiere:', 'Cantiere ' + (lista.length+1));\n      if(nome === null) return;\n      mostraCaricamento(true);\n      try{\n        const id = await creaCantiere(nome.trim() || 'Nuovo cantiere');\n        await passaACantiere(id);\n        await disegnaModaleCantieri();\n      }catch(e){ alert('Errore nella creazione del cantiere: ' + e.message); }\n      mostraCaricamento(false);\n    };\n    modal.querySelectorAll('[data-apri]').forEach(b => {\n      b.onclick = async () => { await passaACantiere(b.dataset.apri); closeModal(); };\n    });\n    modal.querySelectorAll('[data-elimina]').forEach(b => {\n      b.onclick = async () => {\n        const id = b.dataset.elimina;\n        const target = lista.find(c => c.id === id);\n        const conferma = confirm(`Eliminare definitivamente \"${target ? target.nome : ''}\" e tutti i suoi dati? L'operazione non \u00e8 reversibile.`);\n        if(!conferma) return;\n        mostraCaricamento(true);\n        try{\n          const nuovaLista = await eliminaCantiere(id);\n          if(id === state.cantiereAttivoId){\n            if(nuovaLista.length > 0){\n              await passaACantiere(nuovaLista[0].id);\n            } else {\n              const nuovoId = await creaCantiere('Cantiere Principale');\n              await passaACantiere(nuovoId);\n            }\n          }\n          await disegnaModaleCantieri();\n        }catch(e){ alert('Errore nell\\'eliminazione: ' + e.message); }\n        mostraCaricamento(false);\n      };\n    });\n  }\n}\nasync function esportaBackupCompleto(){\n  mostraCaricamento(true);\n  try{\n    const lista = await caricaListaCantieri();\n    const dati = {};\n    for(const c of lista){ dati[c.id] = await caricaDatiCantiere(c.id); }\n    const pacchetto = {\n      app: 'gestione-cantiere',\n      versione: 1,\n      esportatoIl: new Date().toISOString(),\n      cantieri: lista,\n      dati: dati,\n    };\n    const blob = new Blob([JSON.stringify(pacchetto, null, 2)], {type:'application/json'});\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    const oggi = todayISO();\n    a.href = url;\n    a.download = `backup-gestione-cantiere-${oggi}.json`;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  }catch(e){\n    alert('Errore durante l\\'esportazione: ' + e.message);\n  }\n  mostraCaricamento(false);\n}\nfunction importaBackupDaFile(file, onDone){\n  const reader = new FileReader();\n  reader.onload = async () => {\n    let pacchetto;\n    try{\n      pacchetto = JSON.parse(reader.result);\n    }catch(e){\n      alert('Il file selezionato non \u00e8 un backup valido (JSON non leggibile).');\n      return;\n    }\n    if(!pacchetto || !Array.isArray(pacchetto.cantieri) || typeof pacchetto.dati !== 'object'){\n      alert('Il file selezionato non ha il formato di backup atteso.');\n      return;\n    }\n    const conferma = confirm(`Questo backup contiene ${pacchetto.cantieri.length} cantiere/i (esportato il ${fmtDate((pacchetto.esportatoIl||'').slice(0,10))}). Verranno sostituiti tutti i cantieri e i dati attualmente presenti su Google Sheets. Continuare?`);\n    if(!conferma) return;\n    mostraCaricamento(true);\n    try{\n      await salvaListaCantieri(pacchetto.cantieri);\n      for(const id of Object.keys(pacchetto.dati)){\n        await kvSet(dataKeyCantiere(id), pacchetto.dati[id]);\n      }\n      const primoId = pacchetto.cantieri[0] ? pacchetto.cantieri[0].id : null;\n      if(primoId){\n        await passaACantiere(primoId);\n      }\n      if(onDone) await onDone();\n      alert('Backup importato correttamente.');\n    }catch(e){\n      alert('Errore durante l\\'importazione: ' + e.message);\n    }\n    mostraCaricamento(false);\n  };\n  reader.onerror = () => alert('Impossibile leggere il file selezionato.');\n  reader.readAsText(file);\n}\nasync function apriRinominaCantiere(){\n  let lista, meta;\n  try{\n    lista = await caricaListaCantieri();\n    meta = lista.find(c => c.id === state.cantiereAttivoId);\n  }catch(e){\n    alert('Impossibile contattare Google Sheets: ' + e.message);\n    return;\n  }\n  openModal({\n    title: 'Rinomina cantiere',\n    values: {nome: meta ? meta.nome : ''},\n    fields: [{name:'nome', label:'Titolo cantiere', type:'text', required:true}],\n    submitLabel: 'Rinomina',\n    onSubmit: async (data) => {\n      mostraCaricamento(true);\n      try{\n        await rinominaCantiere(state.cantiereAttivoId, data.nome.trim() || meta.nome);\n        await renderStamp();\n      }catch(e){ alert('Errore nel salvataggio: ' + e.message); }\n      mostraCaricamento(false);\n    }\n  });\n}\n\n/* ============ HELPERS ============ */\nfunction uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }\nfunction toLocalISODate(d){\n  const y = d.getFullYear();\n  const m = String(d.getMonth()+1).padStart(2,'0');\n  const g = String(d.getDate()).padStart(2,'0');\n  return `${y}-${m}-${g}`;\n}\nfunction todayISO(){ return toLocalISODate(new Date()); }\nfunction fmtDate(iso){\n  if(!iso) return '\u2014';\n  const [y,m,d] = iso.split('-');\n  return `${d}/${m}/${y}`;\n}\nfunction fmtDataBreve(iso){\n  if(!iso) return '\u2014';\n  const [y,m,d] = iso.split('-');\n  return `${d}/${m}/${y.slice(2)}`;\n}\nfunction fmtEuro(n){\n  const v = Number(n)||0;\n  return v.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});\n}\nfunction clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }\nfunction esc(s){ if(s === undefined || s === null) return ''; return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction truncate(s, n){ if(!s) return ''; return s.length>n ? s.slice(0,n-1)+'\u2026' : s; }\nfunction tipoColor(tipo){\n  const map = {\n    ordine: 'var(--blue)',\n    lavorazione: 'var(--orange)',\n    positivo: 'var(--green)',\n    negativo: 'var(--red)',\n    neutro: 'var(--muted)',\n    nota: '#7C8891',\n    appuntamento: 'var(--purple)',\n  };\n  return map[tipo] || 'var(--muted)';\n}\n\n/* ============ MODAL SYSTEM ============ */\nfunction openModal({title, fields, values={}, onSubmit, submitLabel='Salva', pulsanteExtra}){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '';\n  modal.innerHTML = `\n    <h3>${esc(title)}<\/h3>\n    <form id=\"modal-form\">\n      ${fields.map(f => renderField(f, values[f.name])).join('')}\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn ghost\" id=\"modal-cancel\">Annulla<\/button>\n        ${pulsanteExtra ? `<button type=\"button\" class=\"btn ghost\" id=\"modal-extra\">${esc(pulsanteExtra.label)}<\/button>` : ''}\n        <button type=\"submit\" class=\"btn\">${esc(submitLabel)}<\/button>\n      <\/div>\n    <\/form>\n  `;\n  overlay.classList.add('open');\n  document.getElementById('modal-cancel').onclick = closeModal;\n  fields.forEach(f => {\n    if(f.type === 'dots'){\n      const wrapper = document.getElementById('f-'+f.name+'-wrapper');\n      const hidden = document.getElementById('f-'+f.name);\n      if(wrapper){\n        wrapper.querySelectorAll('.dot-picker-btn').forEach(btn => {\n          btn.onclick = () => {\n            const nuovo = (hidden.value === btn.dataset.dotValue) ? '' : btn.dataset.dotValue;\n            hidden.value = nuovo;\n            wrapper.querySelectorAll('.dot-picker-btn').forEach(b => { b.style.opacity = (b.dataset.dotValue === nuovo) ? '1' : '0.3'; b.style.transform = (b.dataset.dotValue === nuovo) ? 'scale(1.15)' : 'scale(1)'; });\n          };\n        });\n      }\n    }\n  });\n  function raccogliDati(){\n    const data = {};\n    fields.forEach(f => {\n      const el = document.getElementById('f-'+f.name);\n      if(f.type === 'checkbox'){ data[f.name] = el.checked; }\n      else if(f.type === 'number' || f.type === 'dots'){ data[f.name] = el.value === '' ? null : Number(el.value); }\n      else { data[f.name] = el.value; }\n    });\n    return data;\n  }\n  document.getElementById('modal-form').onsubmit = (e) => {\n    e.preventDefault();\n    const data = raccogliDati();\n    closeModal();\n    onSubmit(data);\n  };\n  if(pulsanteExtra){\n    document.getElementById('modal-extra').onclick = () => {\n      const form = document.getElementById('modal-form');\n      if(!form.reportValidity()) return;\n      const data = raccogliDati();\n      pulsanteExtra.onClick(data);\n    };\n  }\n}\nconst COLORI_MOTIVAZIONE = {1:'#C4423C', 2:'#E8720C', 3:'#F2B705', 4:'#6FB1D9', 5:'#1C86C7'};\nfunction renderField(f, val){\n  const v = val === undefined || val === null ? (f.default !== undefined ? f.default : '') : val;\n  if(f.type === 'select'){\n    return `<div class=\"field\"><label>${esc(f.label)}<\/label>\n      <select id=\"f-${f.name}\">\n        ${f.options.map(o => `<option value=\"${esc(o.value)}\" ${o.value===v?'selected':''}>${esc(o.label)}<\/option>`).join('')}\n      <\/select><\/div>`;\n  }\n  if(f.type === 'textarea'){\n    return `<div class=\"field\"><label>${esc(f.label)}<\/label><textarea id=\"f-${f.name}\" ${f.required?'required':''}>${esc(v)}<\/textarea><\/div>`;\n  }\n  if(f.type === 'checkbox'){\n    return `<div class=\"field field-check\"><input type=\"checkbox\" id=\"f-${f.name}\" ${v?'checked':''}><label style=\"margin:0;\">${esc(f.label)}<\/label><\/div>`;\n  }\n  if(f.type === 'dots'){\n    return `<div class=\"field\">\n      <label>${esc(f.label)}<\/label>\n      <div id=\"f-${f.name}-wrapper\" style=\"display:flex;gap:10px;align-items:center;margin-top:4px;\">\n        ${[1,2,3,4,5].map(n => `<button type=\"button\" class=\"dot-picker-btn\" data-dot-value=\"${n}\" title=\"${n}\" style=\"width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:${COLORI_MOTIVAZIONE[n]};opacity:${v==n?'1':'0.3'};transform:scale(${v==n?'1.15':'1'});transition:transform .1s ease, opacity .1s ease;\"><\/button>`).join('')}\n      <\/div>\n      <input type=\"hidden\" id=\"f-${f.name}\" value=\"${v||''}\">\n    <\/div>`;\n  }\n  return `<div class=\"field\"><label>${esc(f.label)}<\/label><input type=\"${f.type}\" id=\"f-${f.name}\" value=\"${esc(v)}\" ${f.required?'required':''} ${f.step?`step=\"${f.step}\"`:''}><\/div>`;\n}\nfunction closeModal(){ document.getElementById('overlay').classList.remove('open'); }\ndocument.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });\n\n/* ============ NAV ============ */\nfunction renderNav(){\n  const nav = document.getElementById('nav');\n  nav.innerHTML = SECTIONS.map(s => `\n    <button class=\"nav-tab ${state.section===s.id?'active':''}\" data-section=\"${s.id}\">\n      <span class=\"code\">${s.code}<\/span>${esc(s.label)}\n    <\/button>\n  `).join('');\n  nav.querySelectorAll('.nav-tab').forEach(btn => {\n    btn.onclick = () => { state.section = btn.dataset.section; renderAll(); };\n  });\n}\n\n/* ============ DASHBOARD ============ */\nfunction renderDashboard(){\n  const l = state.lavorazioni, o = state.ordini, p = state.persone, ev = state.eventi;\n  const inCorso = l.filter(x => x.statoAvanzamento > 0 && x.statoAvanzamento < 100).length;\n  const completate = l.filter(x => x.statoAvanzamento >= 100).length;\n  const inRitardo = l.filter(x => x.statoAvanzamento < x.previsioneAvanzamento - 5).length;\n  const budgetTot = l.reduce((s,x) => s + (Number(x.costoPrevisto)||0), 0);\n  const consuntivoTot = l.reduce((s,x) => s + (Number(x.costoEuro)||0), 0);\n\n  const today = todayISO();\n  const ordAttesa = o.filter(x => x.statoParziale !== 'completo').length;\n  const ordRitardo = o.filter(x => x.dataPrevista && x.dataPrevista < today && x.statoParziale !== 'completo').length;\n  const ordParziali = o.filter(x => x.statoParziale === 'parziale').length;\n\n  const oreSettimana = p.reduce((s,pers) => {\n    const start = startOfWeek(new Date());\n    const sum = (pers.log||[]).filter(l2 => new Date(l2.data) >= start).reduce((a,l2)=>a+Number(l2.ore||0),0);\n    return s + sum;\n  }, 0);\n\n  const now = new Date();\n  const last30 = toLocalISODate(new Date(now.getTime() - 30*86400000));\n  const evPos = ev.filter(x => x.tipo==='positivo' && x.data >= last30).length;\n  const evNeg = ev.filter(x => x.tipo==='negativo' && x.data >= last30).length;\n\n  const tra7giorni = toLocalISODate(new Date(now.getTime() + 7*86400000));\n  const avviiInRitardo = l.filter(x => !x.dataCompletamento && x.dataInizio && x.dataInizio < today && (!x.statoAvanzamento || x.statoAvanzamento === 0));\n  const avviiEntro7 = l.filter(x => !x.dataCompletamento && x.dataInizio && x.dataInizio >= today && x.dataInizio <= tra7giorni);\n  const avvisiAvvio = [...avviiInRitardo, ...avviiEntro7].sort((a,b) => (a.dataInizio||'').localeCompare(b.dataInizio||''));\n\n  document.getElementById('content').innerHTML = `\n    <h2 class=\"section-title\">Quadro generale<\/h2>\n    <p class=\"section-sub\">Riepilogo sintetico dello stato del cantiere \u2014 seleziona una scheda per aprire la sezione dedicata.<\/p>\n\n    <div class=\"grid-cards\">\n      <div class=\"card ${inRitardo>0?'status-warn':'status-ok'}\" data-goto=\"lavorazioni\">\n        <div class=\"card-eyebrow\">02 \u00b7 LAVORAZIONI<\/div>\n        <div class=\"card-num\">${l.length}<\/div>\n        <div class=\"card-label\">${inCorso} in corso \u00b7 ${completate} completate<\/div>\n        ${inRitardo>0 ? `<span class=\"card-flag flag-red\">\u26a0 ${inRitardo} in ritardo<\/span>` : `<span class=\"card-flag flag-green\">\u2713 avanzamento in linea<\/span>`}\n      <\/div>\n      <div class=\"card ${consuntivoTot > budgetTot?'status-warn':'status-ok'}\" data-goto=\"lavorazioni\">\n        <div class=\"card-eyebrow\">02 \u00b7 COSTI LAVORAZIONI<\/div>\n        <div class=\"card-num mono\" style=\"font-size:28px;\">${fmtEuro(consuntivoTot)}<\/div>\n        <div class=\"card-label\">su budget previsto ${fmtEuro(budgetTot)}<\/div>\n        ${consuntivoTot > budgetTot ? `<span class=\"card-flag flag-red\">\u26a0 sopra budget<\/span>` : `<span class=\"card-flag flag-green\">\u2713 entro budget<\/span>`}\n      <\/div>\n      <div class=\"card ${ordRitardo>0?'status-warn':'status-ok'}\" data-goto=\"ordini\">\n        <div class=\"card-eyebrow\">03 \u00b7 ORDINI<\/div>\n        <div class=\"card-num\">${o.length}<\/div>\n        <div class=\"card-label\">${ordAttesa} non completati \u00b7 ${ordParziali} parziali<\/div>\n        ${ordRitardo>0 ? `<span class=\"card-flag flag-red\">\u26a0 ${ordRitardo} in ritardo<\/span>` : `<span class=\"card-flag flag-green\">\u2713 nessun ritardo<\/span>`}\n      <\/div>\n      <div class=\"card status-info\" data-goto=\"persone\">\n        <div class=\"card-eyebrow\">04 \u00b7 PERSONE<\/div>\n        <div class=\"card-num\">${p.length}<\/div>\n        <div class=\"card-label\">${oreSettimana.toFixed(1)} ore registrate questa settimana<\/div>\n        <span class=\"card-flag flag-blue\">manodopera<\/span>\n      <\/div>\n      <div class=\"card ${evNeg > evPos?'status-warn':'status-ok'}\" data-goto=\"eventi\">\n        <div class=\"card-eyebrow\">05 \u00b7 EVENTI (ULTIMI 30 GG)<\/div>\n        <div class=\"card-num\">${ev.length}<\/div>\n        <div class=\"card-label\">${evPos} positivi \u00b7 ${evNeg} negativi<\/div>\n        ${evNeg > evPos ? `<span class=\"card-flag flag-red\">\u26a0 attenzione<\/span>` : `<span class=\"card-flag flag-green\">\u2713 clima positivo<\/span>`}\n      <\/div>\n      <div class=\"card status-info\" data-goto=\"calendario\">\n        <div class=\"card-eyebrow\">01 \u00b7 CALENDARIO<\/div>\n        <div class=\"card-num\">${countUpcoming()}<\/div>\n        <div class=\"card-label\">eventi nei prossimi 7 giorni<\/div>\n        <span class=\"card-flag flag-orange\">\u2192 vai al calendario<\/span>\n      <\/div>\n    <\/div>\n\n    ${avvisiAvvio.length>0 ? `\n    <div class=\"subsection-title\">Avvisi avvio lavorazioni<\/div>\n    <table><thead><tr><th>Lavorazione<\/th><th>Data inizio<\/th><th>Stato<\/th><\/tr><\/thead>\n      <tbody>${avvisiAvvio.map(x => {\n        const inRitardoAvvio = x.dataInizio < today;\n        return `<tr>\n          <td>${esc(x.nome)}<\/td>\n          <td class=\"mono\">${fmtDate(x.dataInizio)}<\/td>\n          <td>${inRitardoAvvio ? `<span class=\"badge badge-red\">\u26a0 da avviare, in ritardo<\/span>` : `<span class=\"badge badge-orange\">in partenza tra ${Math.round((new Date(x.dataInizio) - new Date(today))/86400000)} giorni<\/span>`}<\/td>\n        <\/tr>`;\n      }).join('')}<\/tbody><\/table>\n    ` : ''}\n\n    <div class=\"subsection-title\">Lavorazioni con maggiore scostamento<\/div>\n    ${renderTopDeviationTable()}\n  `;\n  document.querySelectorAll('[data-goto]').forEach(c => {\n    c.onclick = () => { state.section = c.dataset.goto; renderAll(); };\n  });\n}\nfunction countUpcoming(){\n  const now = new Date();\n  const end = new Date(now.getTime() + 7*86400000);\n  let count = 0;\n  for(let d = new Date(now); d <= end; d.setDate(d.getDate()+1)){\n    count += getEntriesForDate(toLocalISODate(d)).length;\n  }\n  return count;\n}\nfunction renderTopDeviationTable(){\n  const rows = [...state.lavorazioni]\n    .map(x => ({...x, scostamento: (x.statoAvanzamento - x.previsioneAvanzamento)}))\n    .sort((a,b) => a.scostamento - b.scostamento)\n    .slice(0,5);\n  if(rows.length===0) return `<div class=\"empty-state\">Nessuna lavorazione inserita ancora.<\/div>`;\n  return `<div class=\"table-scroll\"><table><thead><tr><th>Lavorazione<\/th><th>Avanzamento<\/th><th>Previsto<\/th><th>Scostamento<\/th><\/tr><\/thead>\n    <tbody>${rows.map(r => `<tr>\n      <td>${esc(r.nome)}<\/td>\n      <td class=\"mono\">${r.statoAvanzamento}%<\/td>\n      <td class=\"mono\">${r.previsioneAvanzamento}%<\/td>\n      <td>${r.scostamento < -5 ? `<span class=\"badge badge-red\">${r.scostamento.toFixed(0)}%<\/span>` : r.scostamento > 5 ? `<span class=\"badge badge-green\">+${r.scostamento.toFixed(0)}%<\/span>` : `<span class=\"badge badge-gray\">${r.scostamento.toFixed(0)}%<\/span>`}<\/td>\n    <\/tr>`).join('')}<\/tbody><\/table><\/div>`;\n}\n\n/* ============ LAVORAZIONI ============ */\nfunction apriModificaCampo(oggetto, campo, label, tipo, extra, alSalvare){\n  extra = extra || {};\n  openModal({\n    title: label,\n    values: {valore: oggetto[campo]},\n    fields: [Object.assign({name:'valore', label, type:tipo}, extra)],\n    submitLabel: 'Salva',\n    onSubmit: (data) => {\n      oggetto[campo] = data.valore;\n      persist();\n      if(alSalvare) alSalvare();\n    }\n  });\n}\nfunction renderLavorazioni(){\n  const aperte = state.lavorazioni.filter(r => !r.dataCompletamento);\n  const completate = state.lavorazioni.filter(r => r.dataCompletamento)\n    .sort((a,b) => (b.dataCompletamento||'').localeCompare(a.dataCompletamento||''));\n  const attivitaDaFare = (state.attivitaVarie||[]).filter(a => !a.fatto);\n  const attivitaCompletate = (state.attivitaVarie||[]).filter(a => a.fatto);\n\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Lavorazioni<\/h2><p class=\"section-sub\">Avanzamento fisico, costi e ore (previste / effettive) di ogni lavorazione. Le lavorazioni completate si archiviano a scomparsa qui sotto.<\/p><\/div>\n      <button class=\"btn\" id=\"add-lavorazione\">+ Nuova lavorazione<\/button>\n    <\/div>\n    ${aperte.length===0 ? emptyState('Nessuna lavorazione aperta', 'Aggiungi una lavorazione per iniziare a tracciare avanzamento, costi e ore.') : `\n    <div class=\"table-scroll\"><table class=\"tabella-compatta\"><thead><tr>\n      <th>Nome<\/th><th>Avanzamento<\/th><th>Costi<\/th><th>Ore<\/th><th>Date<\/th><th><\/th>\n    <\/tr><\/thead>\n    <tbody>${aperte.map(r => renderLavorazioneRow(r)).join('')}<\/tbody><\/table><\/div>`}\n\n    ${completate.length>0 ? `\n    <details id=\"dettaglio-lavorazioni-completate\" style=\"margin-top:18px;\" ${uiDettagliAperti['lavorazioni-completate']?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:10px 0;color:var(--muted);font-size:13px;\">Lavorazioni completate (${completate.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div class=\"table-scroll\" style=\"margin-top:10px;\"><table class=\"tabella-compatta\"><thead><tr>\n        <th>Nome<\/th><th>Avanzamento<\/th><th>Costi<\/th><th>Ore<\/th><th>Date<\/th><th><\/th>\n      <\/tr><\/thead>\n      <tbody>${completate.map(r => renderLavorazioneRow(r)).join('')}<\/tbody><\/table><\/div>\n    <\/details>` : ''}\n\n    <div class=\"subsection-title\" style=\"margin-top:32px;\">Snag list<\/div>\n    <p class=\"section-sub\" style=\"margin-top:-6px;\">Piccoli compiti senza scadenza n\u00e9 budget: da fare quando capita un momento libero.<\/p>\n    <div class=\"toolbar\" style=\"gap:8px;\">\n      <input type=\"text\" id=\"nuova-attivita-testo\" placeholder=\"Scrivi una cosa da fare e premi Invio\u2026\" style=\"flex:1;padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n      <button class=\"btn\" id=\"aggiungi-attivita-btn\">+ Aggiungi<\/button>\n    <\/div>\n    ${attivitaDaFare.length===0 ? `<div style=\"color:var(--muted);font-size:13px;padding:14px 0;\">Nessuna attivit\u00e0 da fare in lista.<\/div>` : `\n    <div id=\"lista-attivita-varie\">\n      ${attivitaDaFare.map(a => `\n        <div class=\"day-entry\" style=\"align-items:center;\">\n          <label style=\"display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;\">\n            <input type=\"checkbox\" data-toggle-attivita=\"${a.id}\" style=\"width:16px;height:16px;\">\n            <span>${esc(a.testo)}<\/span>\n          <\/label>\n          <button class=\"icon-btn\" ${a.fotoUrl ? `data-vedi-foto-attivita=\"${a.id}\"` : `data-foto-attivita=\"${a.id}\"`}>${a.fotoUrl ? '\ud83d\uddbc Vedi foto' : '\ud83d\udcf7 Foto'}<\/button>\n          <button class=\"icon-btn\" data-elimina-attivita=\"${a.id}\">Elimina<\/button>\n        <\/div>\n      `).join('')}\n    <\/div>`}\n\n    ${attivitaCompletate.length>0 ? `\n    <details id=\"dettaglio-attivita-completate\" style=\"margin-top:14px;\" ${uiDettagliAperti['attivita-completate']?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:10px 0;color:var(--muted);font-size:13px;\">Attivit\u00e0 completate (${attivitaCompletate.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div style=\"margin-top:8px;\">\n        ${attivitaCompletate.map(a => `\n          <div class=\"day-entry\" style=\"align-items:center;\">\n            <label style=\"display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;color:var(--muted);text-decoration:line-through;\">\n              <input type=\"checkbox\" data-toggle-attivita=\"${a.id}\" checked style=\"width:16px;height:16px;\">\n              <span>${esc(a.testo)}<\/span>\n            <\/label>\n            <button class=\"icon-btn\" ${a.fotoUrl ? `data-vedi-foto-attivita=\"${a.id}\"` : `data-foto-attivita=\"${a.id}\"`}>${a.fotoUrl ? '\ud83d\uddbc Vedi foto' : '\ud83d\udcf7 Foto'}<\/button>\n            <button class=\"icon-btn\" data-elimina-attivita=\"${a.id}\">Elimina<\/button>\n          <\/div>\n        `).join('')}\n      <\/div>\n    <\/details>` : ''}\n  `;\n  document.getElementById('add-lavorazione').onclick = () => openLavorazioneModal();\n  const dettLavCompletate = document.getElementById('dettaglio-lavorazioni-completate');\n  if(dettLavCompletate) dettLavCompletate.addEventListener('toggle', function(){ uiDettagliAperti['lavorazioni-completate'] = this.open; });\n  const dettAttCompletate = document.getElementById('dettaglio-attivita-completate');\n  if(dettAttCompletate) dettAttCompletate.addEventListener('toggle', function(){ uiDettagliAperti['attivita-completate'] = this.open; });\n  state.lavorazioni.forEach(r => {\n    const editBtn = document.getElementById('edit-lav-'+r.id);\n    const delBtn = document.getElementById('del-lav-'+r.id);\n    const completaBtn = document.getElementById('completa-lav-'+r.id);\n    const riapriBtn = document.getElementById('riapri-lav-'+r.id);\n    const fotoBtn = document.getElementById('foto-lav-'+r.id);\n    const vediFotoBtn = document.getElementById('vedi-foto-lav-'+r.id);\n    const menoBtn = document.getElementById('meno-avanzamento-'+r.id);\n    const piuBtn = document.getElementById('piu-avanzamento-'+r.id);\n    if(editBtn) editBtn.onclick = () => openLavorazioneModal(r);\n    if(delBtn) delBtn.onclick = () => { state.lavorazioni = state.lavorazioni.filter(x=>x.id!==r.id); persist(); renderAll(); };\n    if(completaBtn) completaBtn.onclick = () => { r.dataCompletamento = todayISO(); r.statoAvanzamento = 100; persist(); renderLavorazioni(); };\n    if(riapriBtn) riapriBtn.onclick = () => { r.dataCompletamento = null; persist(); renderLavorazioni(); };\n    if(fotoBtn) fotoBtn.onclick = () => scattaFotoLavorazione(r);\n    if(vediFotoBtn) vediFotoBtn.onclick = () => window.open(r.cartellaFotoUrl, '_blank');\n    if(menoBtn) menoBtn.onclick = () => { r.statoAvanzamento = clamp((Number(r.statoAvanzamento)||0) - 5, 0, 100); persist(); renderLavorazioni(); };\n    if(piuBtn) piuBtn.onclick = () => { r.statoAvanzamento = clamp((Number(r.statoAvanzamento)||0) + 5, 0, 100); persist(); renderLavorazioni(); };\n    const campiClic = [\n      {id:`campo-costoPrevisto-${r.id}`, campo:'costoPrevisto', label:'Costo preventivo (\u20ac)', tipo:'number', extra:{step:'0.01'}},\n      {id:`campo-previsioneCosto-${r.id}`, campo:'previsioneCosto', label:'Costo target \u2014 previsione a completamento (\u20ac)', tipo:'number', extra:{step:'0.01'}},\n      {id:`campo-costoEuro-${r.id}`, campo:'costoEuro', label:'Costo effettivo (\u20ac)', tipo:'number', extra:{step:'0.01'}},\n      {id:`campo-orePreviste-${r.id}`, campo:'orePreviste', label:'Ore preventivate', tipo:'number', extra:{step:'0.5'}},\n      {id:`campo-orePrevisione-${r.id}`, campo:'orePrevisione', label:'Ore target \u2014 previsione a completamento', tipo:'number', extra:{step:'0.5'}},\n      {id:`campo-costoOre-${r.id}`, campo:'costoOre', label:'Ore effettive impiegate', tipo:'number', extra:{step:'0.5'}},\n      {id:`campo-dataInizio-${r.id}`, campo:'dataInizio', label:'Data inizio', tipo:'date', extra:{}},\n      {id:`campo-scadenzaPrevista-${r.id}`, campo:'scadenzaPrevista', label:'Data stima fine', tipo:'date', extra:{}},\n      {id:`campo-dataCompletamento-${r.id}`, campo:'dataCompletamento', label:'Data fine effettiva', tipo:'date', extra:{}},\n      {id:`campo-previsioneAvanzamento-${r.id}`, campo:'previsioneAvanzamento', label:'Previsione avanzamento a oggi (%)', tipo:'number', extra:{step:'1'}},\n    ];\n    campiClic.forEach(c => {\n      const el = document.getElementById(c.id);\n      if(el) el.onclick = () => apriModificaCampo(r, c.campo, c.label, c.tipo, c.extra, renderLavorazioni);\n    });\n  });\n  const inputAttivita = document.getElementById('nuova-attivita-testo');\n  const aggiungiAttivitaBtn = document.getElementById('aggiungi-attivita-btn');\n  function aggiungiAttivitaDaInput(){\n    const testo = inputAttivita.value.trim();\n    if(!testo) return;\n    state.attivitaVarie.push({id:uid(), testo, fatto:false});\n    persist();\n    renderLavorazioni();\n  }\n  if(aggiungiAttivitaBtn) aggiungiAttivitaBtn.onclick = aggiungiAttivitaDaInput;\n  if(inputAttivita){\n    inputAttivita.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); aggiungiAttivitaDaInput(); } };\n  }\n  document.querySelectorAll('[data-toggle-attivita]').forEach(cb => {\n    cb.onchange = () => {\n      const item = state.attivitaVarie.find(a => a.id === cb.dataset.toggleAttivita);\n      if(item){ item.fatto = cb.checked; persist(); renderLavorazioni(); }\n    };\n  });\n  document.querySelectorAll('[data-elimina-attivita]').forEach(btn => {\n    btn.onclick = () => {\n      state.attivitaVarie = state.attivitaVarie.filter(a => a.id !== btn.dataset.eliminaAttivita);\n      persist();\n      renderLavorazioni();\n    };\n  });\n  document.querySelectorAll('[data-foto-attivita]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.attivitaVarie.find(a => a.id === btn.dataset.fotoAttivita);\n      if(item) scattaFotoSnag(item);\n    };\n  });\n  document.querySelectorAll('[data-vedi-foto-attivita]').forEach(btn => {\n    btn.onclick = () => {\n      const item = state.attivitaVarie.find(a => a.id === btn.dataset.vediFotoAttivita);\n      if(item && item.fotoUrl) window.open(item.fotoUrl, '_blank');\n    };\n  });\n}\nasync function scattaFotoLavorazione(r){\n  const file = await apriFotocamera();\n  if(!file) return;\n  caricamentiFotoInCorso++;\n  aggiornaIndicatoreCaricamentoFoto();\n  try{\n    const base64 = await ridimensionaImmagine(file);\n    const risposta = await chiamaAzionePost('uploadFotoLavorazione', {\n      cantiere: state.nomeCantiereAttivo || 'Cantiere',\n      lavorazione: r.nome,\n      percentuale: r.statoAvanzamento,\n      imageBase64: base64,\n      mimeType: 'image/jpeg',\n    });\n    r.numeroFoto = (r.numeroFoto || 0) + 1;\n    r.cartellaFotoUrl = risposta.cartellaUrl;\n    persist();\n    if(state.section === 'lavorazioni') renderLavorazioni();\n    mostraToast('\ud83d\udcf7 Foto caricata \u2713');\n  }catch(e){\n    alert('Errore nel caricamento della foto: ' + e.message);\n  }finally{\n    caricamentiFotoInCorso--;\n    aggiornaIndicatoreCaricamentoFoto();\n  }\n}\nasync function scattaFotoSnag(item){\n  const file = await apriFotocamera();\n  if(!file) return;\n  caricamentiFotoInCorso++;\n  aggiornaIndicatoreCaricamentoFoto();\n  try{\n    const base64 = await ridimensionaImmagine(file);\n    const risposta = await chiamaAzionePost('uploadFotoSnag', {\n      cantiere: state.nomeCantiereAttivo || 'Cantiere',\n      voce: item.testo,\n      imageBase64: base64,\n      mimeType: 'image/jpeg',\n      vecchioFileId: item.fotoFileId || null,\n    });\n    item.fotoUrl = risposta.fileUrl;\n    item.fotoFileId = risposta.fileId;\n    persist();\n    if(state.section === 'lavorazioni') renderLavorazioni();\n    mostraToast('\ud83d\udcf7 Foto caricata \u2713');\n  }catch(e){\n    alert('Errore nel caricamento della foto: ' + e.message);\n  }finally{\n    caricamentiFotoInCorso--;\n    aggiornaIndicatoreCaricamentoFoto();\n  }\n}\nfunction renderLavorazioneRow(r){\n  const completata = !!r.dataCompletamento;\n  const scostamento = (r.statoAvanzamento||0) - (r.previsioneAvanzamento||0);\n  const badge = scostamento < -5 ? `<span class=\"badge badge-red\">in ritardo<\/span>` : scostamento > 5 ? `<span class=\"badge badge-green\">in anticipo<\/span>` : `<span class=\"badge badge-gray\">in linea<\/span>`;\n  const rigaStile = completata ? 'style=\"opacity:0.6;\"' : '';\n  const today = todayISO();\n\n  const intestazioneGruppo = (testo) => `<div style=\"font-size:9px;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-bottom:1px;line-height:1.3;\">${testo}<\/div>`;\n  const rigaCampo = (valore, id, label, formatta) => {\n    const classe = valore ? 'valore-cliccabile' : 'valore-vuoto';\n    const testo = valore ? formatta(valore) : '+ imposta';\n    return `<tr>\n      <td style=\"padding:0 8px 1px 0;border:none;color:var(--muted);white-space:nowrap;font-size:12px;line-height:1.3;\">${label}<\/td>\n      <td class=\"${classe}\" id=\"${id}\" style=\"padding:0 0 1px 0;border:none;white-space:nowrap;line-height:1.3;\">${testo}<\/td>\n    <\/tr>`;\n  };\n\n  // --- Costi: preventivo / stima (previsione EAC) / reale ---\n  const hannoCosti = !!(r.costoPrevisto || r.previsioneCosto || r.costoEuro);\n  let costBadge = '';\n  if(r.previsioneCosto || r.costoPrevisto){\n    costBadge = (r.previsioneCosto||0) > (r.costoPrevisto||0) ? `<span class=\"badge badge-red\">sopra budget<\/span>` : `<span class=\"badge badge-green\">entro budget<\/span>`;\n  }\n  const contenutoCosti = hannoCosti ? `\n      ${intestazioneGruppo('Costi')}\n      <table class=\"tabella-compatta\" style=\"border-collapse:collapse;\">\n        ${rigaCampo(r.costoPrevisto, `campo-costoPrevisto-${r.id}`, 'Preventivo', fmtEuro)}\n        ${rigaCampo(r.previsioneCosto, `campo-previsioneCosto-${r.id}`, 'Stima', fmtEuro)}\n        ${rigaCampo(r.costoEuro, `campo-costoEuro-${r.id}`, 'Reale', fmtEuro)}\n      <\/table>\n      <div style=\"margin-top:1px;\">${costBadge}<\/div>\n  ` : '';\n\n  // --- Ore: preventivo / stima / reali ---\n  const orePreviste = Number(r.orePreviste||0);\n  const oreEffettive = Number(r.costoOre||0);\n  let oreBadge = '';\n  if(orePreviste > 0 || oreEffettive > 0){\n    oreBadge = oreEffettive > orePreviste ? `<span class=\"badge badge-red\">sopra previste<\/span>` : `<span class=\"badge badge-green\">entro previste<\/span>`;\n  }\n  const contenutoOre = `\n      ${intestazioneGruppo('Ore')}\n      <table class=\"tabella-compatta\" style=\"border-collapse:collapse;\">\n        ${rigaCampo(r.orePreviste, `campo-orePreviste-${r.id}`, 'Preventivo', v => v+'h')}\n        ${rigaCampo(r.orePrevisione, `campo-orePrevisione-${r.id}`, 'Stima', v => v+'h')}\n        ${rigaCampo(r.costoOre, `campo-costoOre-${r.id}`, 'Reali', v => v+'h')}\n      <\/table>\n      <div style=\"margin-top:1px;\">${oreBadge}<\/div>\n  `;\n\n  // --- Date: inizio / termine / fine (tabella 2 colonne x 3 righe) ---\n  let tempoBadge = '';\n  if(!completata && r.scadenzaPrevista){\n    const giorni = Math.round((new Date(r.scadenzaPrevista) - new Date(today)) / 86400000);\n    tempoBadge = giorni < 0 ? `<span class=\"badge badge-red\">\u26a0 scaduta da ${Math.abs(giorni)} gg<\/span>` : `<span class=\"badge badge-green\">${giorni} gg al termine<\/span>`;\n  }\n  const contenutoDate = `\n      ${intestazioneGruppo('Date')}\n      <table class=\"tabella-compatta\" style=\"border-collapse:collapse;\">\n        ${rigaCampo(r.dataInizio, `campo-dataInizio-${r.id}`, 'Inizio', fmtDataBreve)}\n        ${rigaCampo(r.scadenzaPrevista, `campo-scadenzaPrevista-${r.id}`, 'Termine', fmtDataBreve)}\n        ${completata\n          ? `<tr><td style=\"padding:0 8px 1px 0;border:none;color:var(--muted);white-space:nowrap;font-size:12px;line-height:1.3;\">Fine<\/td><td class=\"valore-cliccabile\" id=\"campo-dataCompletamento-${r.id}\" style=\"padding:0 0 1px 0;border:none;white-space:nowrap;line-height:1.3;\">\u2713 ${fmtDataBreve(r.dataCompletamento)}<\/td><\/tr>`\n          : rigaCampo(r.dataCompletamento, `campo-dataCompletamento-${r.id}`, 'Fine', fmtDataBreve)}\n      <\/table>\n      <div style=\"margin-top:1px;\">${tempoBadge}<\/div>\n  `;\n\n  return `<tr ${rigaStile} id=\"row-lav-${r.id}\">\n    <td style=\"vertical-align:top;\"><strong>${esc(r.nome)}<\/strong>${r.note ? `<div style=\"color:var(--muted);font-size:11px;\">${esc(r.note)}<\/div>`:''}<\/td>\n    <td style=\"min-width:180px;vertical-align:top;\">\n      <div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:${clamp(r.statoAvanzamento,0,100)}%;\"><\/div><div class=\"bar-marker\" style=\"left:${clamp(r.previsioneAvanzamento,0,100)}%;\"><\/div><\/div>\n      <div style=\"display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;\">\n        <div class=\"stepper\">\n          <button id=\"meno-avanzamento-${r.id}\">\u2212<\/button>\n          <span class=\"mono\" style=\"min-width:32px;text-align:center;display:inline-block;\">${r.statoAvanzamento||0}%<\/span>\n          <button id=\"piu-avanzamento-${r.id}\">+<\/button>\n        <\/div>\n        <div class=\"valore-cliccabile mono\" id=\"campo-previsioneAvanzamento-${r.id}\" style=\"font-size:11px;\">previsto: ${r.previsioneAvanzamento||0}%<\/div>\n      <\/div>\n      <div style=\"margin-top:4px;\">${badge}<\/div>\n    <\/td>\n    <td class=\"mono\" style=\"vertical-align:top;padding-top:6px;padding-bottom:6px;${hannoCosti ? '' : 'padding-left:2px;padding-right:2px;'}\">${contenutoCosti}<\/td>\n    <td class=\"mono\" style=\"vertical-align:top;padding-top:6px;padding-bottom:6px;\">${contenutoOre}<\/td>\n    <td class=\"mono\" style=\"vertical-align:top;padding-top:6px;padding-bottom:6px;\">${contenutoDate}<\/td>\n    <td style=\"vertical-align:top;\"><div class=\"row-actions\">\n      ${completata ? `<button class=\"icon-btn\" id=\"riapri-lav-${r.id}\">Riapri<\/button>` : `<button class=\"icon-btn\" id=\"completa-lav-${r.id}\">\u2713 Completa<\/button>`}\n      <button class=\"icon-btn\" id=\"foto-lav-${r.id}\">\ud83d\udcf7 Foto<\/button>\n      ${r.numeroFoto>0 ? `<button class=\"icon-btn\" id=\"vedi-foto-lav-${r.id}\">\ud83d\uddbc Vedi foto (${r.numeroFoto})<\/button>` : ''}\n      <button class=\"icon-btn\" id=\"edit-lav-${r.id}\">Modifica<\/button><button class=\"icon-btn\" id=\"del-lav-${r.id}\">Elimina<\/button>\n    <\/div><\/td>\n  <\/tr>`;\n}\nfunction openLavorazioneModal(existing){\n  openModal({\n    title: existing ? 'Modifica lavorazione' : 'Nuova lavorazione',\n    values: existing || {statoAvanzamento:0, previsioneAvanzamento:0},\n    fields: [\n      {name:'nome', label:'Nome lavorazione', type:'text', required:true},\n      {name:'costoPrevisto', label:'Costo previsto (\u20ac)', type:'number', step:'0.01'},\n      {name:'statoAvanzamento', label:'Stato avanzamento reale (%)', type:'number', step:'1'},\n      {name:'previsioneAvanzamento', label:'Previsione avanzamento a oggi (%)', type:'number', step:'1'},\n      {name:'previsioneCosto', label:'Previsione costo a completamento (\u20ac)', type:'number', step:'0.01'},\n      {name:'orePreviste', label:'Ore previste (preventivo)', type:'number', step:'0.5'},\n      {name:'orePrevisione', label:'Ore target \u2014 previsione a completamento', type:'number', step:'0.5'},\n      {name:'costoOre', label:'Ore effettive impiegate', type:'number', step:'0.5'},\n      {name:'costoEuro', label:'Costo consuntivo \u2014 \u20ac', type:'number', step:'0.01'},\n      {name:'dataInizio', label:'Data inizio', type:'date'},\n      {name:'scadenzaPrevista', label:'Data fine prevista', type:'date'},\n      {name:'dataCompletamento', label:'Data completamento (lascia vuoto se ancora aperta)', type:'date'},\n      {name:'note', label:'Note', type:'textarea'},\n    ],\n    onSubmit: (data) => {\n      if(existing){\n        Object.assign(existing, data);\n      } else {\n        state.lavorazioni.push({id:uid(), ...data});\n      }\n      persist(); renderAll();\n    }\n  });\n}\n\n/* ============ ORDINI ============ */\nconst STATO_ORDINE = [\n  {value:'in_attesa', label:'In attesa'},\n  {value:'parziale', label:'Parziale'},\n  {value:'completo', label:'Completo'},\n];\nfunction renderOrdini(){\n  const aperti = state.ordini.filter(r => r.statoParziale !== 'completo');\n  const completati = state.ordini.filter(r => r.statoParziale === 'completo')\n    .sort((a,b) => (b.dataEffettiva||'').localeCompare(a.dataEffettiva||''));\n  const fornitori = [...new Set(state.materialiDaOrdinare.map(m => (m.fornitore||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));\n  const materialiFiltrati = state.materialiDaOrdinare\n    .filter(m => !state.materialiFiltroFornitore || (m.fornitore||'').trim() === state.materialiFiltroFornitore)\n    .sort((a,b) => {\n      const cd = (a.descrizione||'').localeCompare(b.descrizione||'');\n      if(cd !== 0) return cd;\n      return (a.misura||'').localeCompare(b.misura||'');\n    });\n  document.getElementById('content').innerHTML = `\n    <div class=\"toolbar\">\n      <div><h2 class=\"section-title\">Ordini<\/h2><p class=\"section-sub\">Date di ordine, consegna prevista ed effettiva, con stato parziale ed eventuali note. Gli ordini completati si archiviano a scomparsa qui sotto.<\/p><\/div>\n      <button class=\"btn\" id=\"add-ordine\">+ Nuovo ordine<\/button>\n    <\/div>\n    ${aperti.length===0 ? emptyState('Nessun ordine aperto', 'Aggiungi un ordine per iniziare a monitorarne le consegne.') : `\n    <div class=\"table-scroll\"><table><thead><tr><th>Ordine<\/th><th>Data ordine<\/th><th>Prevista<\/th><th>Effettiva<\/th><th>Stato<\/th><th>Commenti<\/th><th><\/th><\/tr><\/thead>\n    <tbody>${aperti.map(r => renderOrdineRow(r)).join('')}<\/tbody><\/table><\/div>`}\n\n    ${completati.length>0 ? `\n    <details id=\"dettaglio-ordini-completati\" style=\"margin-top:18px;\" ${uiDettagliAperti['ordini-completati']?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:10px 0;color:var(--muted);font-size:13px;\">Ordini completati (${completati.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div class=\"table-scroll\" style=\"margin-top:10px;\"><table><thead><tr><th>Ordine<\/th><th>Data ordine<\/th><th>Prevista<\/th><th>Effettiva<\/th><th>Stato<\/th><th>Commenti<\/th><th><\/th><\/tr><\/thead>\n      <tbody>${completati.map(r => renderOrdineRow(r)).join('')}<\/tbody><\/table><\/div>\n    <\/details>` : ''}\n\n    <details id=\"dettaglio-materiali\" style=\"margin-top:32px;\" ${uiDettagliAperti['materiali']?'open':''}>\n      <summary style=\"cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.04em;padding:10px 0;color:var(--muted);font-size:13px;\">Materiali da ordinare (${state.materialiDaOrdinare.length}) \u2014 clicca per mostrare/nascondere<\/summary>\n      <div style=\"margin-top:10px;\">\n        <p class=\"section-sub\" style=\"margin-top:-4px;\">Elenco unico in ordine alfabetico di descrizione.<\/p>\n        <div class=\"toolbar\" style=\"gap:8px;flex-wrap:wrap;\">\n          <select id=\"filtro-fornitore-materiali\" style=\"padding:9px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);\">\n            <option value=\"\">Tutti i fornitori<\/option>\n            ${fornitori.map(f => `<option value=\"${esc(f)}\" ${state.materialiFiltroFornitore===f?'selected':''}>${esc(f)}<\/option>`).join('')}\n          <\/select>\n          <button class=\"btn ghost\" id=\"manda-ordine-btn\">\ud83d\udce6 Manda ordine<\/button>\n          <button class=\"btn\" id=\"add-materiale\">+ Nuovo materiale<\/button>\n        <\/div>\n        ${materialiFiltrati.length===0 ? emptyState('Nessun materiale in lista', 'Aggiungi un materiale da ordinare, con o senza fornitore.') : `\n        <div id=\"lista-materiali\">\n          ${materialiFiltrati.map(m => {\n            const parti = [m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 ');\n            const conFornitore = m.fornitore ? `${parti} \u2014 ${m.fornitore}` : parti;\n            return `<div class=\"day-entry\" style=\"align-items:center;\">\n              <div>${esc(conFornitore)}<\/div>\n              <div class=\"row-actions\">\n                <button class=\"icon-btn\" id=\"crea-ordine-mat-${m.id}\">\u2192 Crea ordine<\/button>\n                <button class=\"icon-btn\" id=\"edit-mat-${m.id}\">Modifica<\/button>\n                <button class=\"icon-btn\" id=\"del-mat-${m.id}\">Elimina<\/button>\n              <\/div>\n            <\/div>`;\n          }).join('')}\n        <\/div>`}\n      <\/div>\n    <\/details>\n  `;\n  document.getElementById('add-ordine').onclick = () => openOrdineModal();\n  document.getElementById('add-materiale').onclick = () => openMaterialeModal();\n  document.getElementById('manda-ordine-btn').onclick = () => apriMandaOrdine();\n  const dettOrdCompletati = document.getElementById('dettaglio-ordini-completati');\n  if(dettOrdCompletati) dettOrdCompletati.addEventListener('toggle', function(){ uiDettagliAperti['ordini-completati'] = this.open; });\n  const dettMateriali = document.getElementById('dettaglio-materiali');\n  if(dettMateriali) dettMateriali.addEventListener('toggle', function(){ uiDettagliAperti['materiali'] = this.open; });\n  document.getElementById('filtro-fornitore-materiali').onchange = (e) => { state.materialiFiltroFornitore = e.target.value; renderOrdini(); };\n  state.ordini.forEach(r => {\n    const rowEl = document.getElementById('row-ord-'+r.id);\n    const e = document.getElementById('edit-ord-'+r.id), d = document.getElementById('del-ord-'+r.id);\n    const completoBtn = document.getElementById('completo-ord-'+r.id);\n    const riapriBtn = document.getElementById('riapri-ord-'+r.id);\n    const fotoBtn = document.getElementById('foto-ord-'+r.id);\n    const vediFotoBtn = document.getElementById('vedi-foto-ord-'+r.id);\n    const copiaMatBtn = document.getElementById('copia-mat-ord-'+r.id);\n    const matOrdBtn = document.getElementById('mat-ord-'+r.id);\n    if(rowEl) rowEl.onclick = () => openOrdineModal(r);\n    if(e) e.onclick = (ev) => { ev.stopPropagation(); openOrdineModal(r); };\n    if(d) d.onclick = (ev) => { ev.stopPropagation(); state.ordini = state.ordini.filter(x=>x.id!==r.id); persist(); renderAll(); };\n    if(completoBtn) completoBtn.onclick = (ev) => { ev.stopPropagation(); r.dataEffettiva = todayISO(); r.statoParziale = 'completo'; persist(); renderOrdini(); };\n    if(riapriBtn) riapriBtn.onclick = (ev) => { ev.stopPropagation(); r.statoParziale = 'in_attesa'; r.dataEffettiva = null; persist(); renderOrdini(); };\n    if(fotoBtn) fotoBtn.onclick = (ev) => { ev.stopPropagation(); scattaFotoBolla(r); };\n    if(vediFotoBtn) vediFotoBtn.onclick = (ev) => { ev.stopPropagation(); window.open(r.fotoUrl, '_blank'); };\n    if(copiaMatBtn) copiaMatBtn.onclick = (ev) => { ev.stopPropagation(); copiaTesto(testoMaterialiOrdine(r)); };\n    if(matOrdBtn) matOrdBtn.onclick = (ev) => { ev.stopPropagation(); apriGestioneMaterialiOrdine(r); };\n  });\n  state.materialiDaOrdinare.forEach(m => {\n    const editBtn = document.getElementById('edit-mat-'+m.id);\n    const delBtn = document.getElementById('del-mat-'+m.id);\n    const creaOrdineBtn = document.getElementById('crea-ordine-mat-'+m.id);\n    if(editBtn) editBtn.onclick = () => openMaterialeModal(m);\n    if(delBtn) delBtn.onclick = () => { state.materialiDaOrdinare = state.materialiDaOrdinare.filter(x=>x.id!==m.id); persist(); renderOrdini(); };\n    if(creaOrdineBtn) creaOrdineBtn.onclick = () => {\n      const nomeSuggerito = [m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 ');\n      openOrdineModal(null, {dataOrdine: todayISO(), statoParziale:'in_attesa', nome: nomeSuggerito, fornitore: m.fornitore || ''});\n    };\n  });\n}\nfunction openMaterialeModal(existing, prefill){\n  openModal({\n    title: existing ? 'Modifica materiale' : 'Nuovo materiale da ordinare',\n    values: existing || prefill || {},\n    fields: [\n      {name:'fornitore', label:'Fornitore (opzionale)', type:'text'},\n      {name:'numero', label:'Numero / quantit\u00e0 (opzionale)', type:'text'},\n      {name:'descrizione', label:'Descrizione', type:'text', required:true},\n      {name:'misura', label:'Misura (opzionale)', type:'text'},\n    ],\n    pulsanteExtra: existing ? null : {\n      label: '+ Aggiungi altro',\n      onClick: (data) => {\n        state.materialiDaOrdinare.push({id:uid(), ...data});\n        persist();\n        renderOrdini();\n        mostraToastSalvato();\n        openMaterialeModal(null, {fornitore: data.fornitore});\n      }\n    },\n    onSubmit: (data) => {\n      if(existing){ Object.assign(existing, data); }\n      else { state.materialiDaOrdinare.push({id:uid(), ...data}); }\n      persist();\n      renderOrdini();\n    }\n  });\n}\nfunction testoMaterialiOrdine(ordine){\n  return (ordine.materiali||[]).map(m => [m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 ')).join('\\n');\n}\nfunction apriGestioneMaterialiOrdine(ordine){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '520px';\n\n  function disegna(){\n    ordine.materiali = ordine.materiali || [];\n    modal.innerHTML = `\n      <h3>Materiali \u2014 ${esc(ordine.nome)}<\/h3>\n      ${ordine.fornitore ? `<p style=\"font-size:12px;color:var(--muted);margin:-8px 0 14px;\">Fornitore: ${esc(ordine.fornitore)}<\/p>` : ''}\n      ${ordine.materiali.length===0 ? `<div style=\"color:var(--muted);font-size:13px;padding:10px 0;\">Nessun materiale in questo ordine.<\/div>` : `\n      <div style=\"max-height:240px;overflow-y:auto;border:1px solid var(--line);margin-bottom:14px;\">\n        ${ordine.materiali.map((m,i) => `\n          <div class=\"day-entry\" style=\"align-items:center;\">\n            <div>${esc([m.numero, m.descrizione, m.misura].filter(Boolean).join(' \u2014 '))}<\/div>\n            <button class=\"icon-btn\" data-rimuovi-mat-ordine=\"${i}\">Elimina<\/button>\n          <\/div>\n        `).join('')}\n      <\/div>`}\n      <div class=\"subsection-title\" style=\"margin-top:6px;\">Aggiungi materiale dimenticato<\/div>\n      <div class=\"field-row\">\n        <div class=\"field\"><label>Numero<\/label><input type=\"text\" id=\"nuovo-mat-numero\"><\/div>\n        <div class=\"field\" style=\"flex:2;\"><label>Descrizione<\/label><input type=\"text\" id=\"nuovo-mat-descrizione\"><\/div>\n        <div class=\"field\"><label>Misura<\/label><input type=\"text\" id=\"nuovo-mat-misura\"><\/div>\n      <\/div>\n      <button type=\"button\" class=\"btn ghost\" id=\"aggiungi-mat-ordine-btn\" style=\"width:100%;\">+ Aggiungi all'ordine<\/button>\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn\" id=\"chiudi-mat-ordine\">Chiudi<\/button>\n      <\/div>\n    `;\n    document.getElementById('chiudi-mat-ordine').onclick = closeModal;\n    modal.querySelectorAll('[data-rimuovi-mat-ordine]').forEach(btn => {\n      btn.onclick = () => {\n        ordine.materiali.splice(Number(btn.dataset.rimuoviMatOrdine), 1);\n        persist();\n        disegna();\n        renderOrdini();\n      };\n    });\n    document.getElementById('aggiungi-mat-ordine-btn').onclick = () => {\n      const descrizione = document.getElementById('nuovo-mat-descrizione').value.trim();\n      if(!descrizione){ alert('Inserisci almeno una descrizione.'); return; }\n      const numero = document.getElementById('nuovo-mat-numero').value.trim();\n      const misura = document.getElementById('nuovo-mat-misura').value.trim();\n      ordine.materiali.push({numero, descrizione, misura});\n      persist();\n      mostraToast('Aggiunto \u2713');\n      disegna();\n      renderOrdini();\n    };\n  }\n  disegna();\n  overlay.classList.add('open');\n}\nfunction apriMandaOrdine(){\n  const overlay = document.getElementById('overlay');\n  const modal = document.getElementById('modal');\n  modal.style.maxWidth = '560px';\n  let fornitoreScelto = state.materialiFiltroFornitore || '';\n\n  function disegna(){\n    const fornitori = [...new Set(state.materialiDaOrdinare.map(m => (m.fornitore||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));\n    const candidati = state.materialiDaOrdinare\n      .filter(m => !fornitoreScelto || (m.fornitore||'').trim() === fornitoreScelto)\n      .sort((a,b) => {\n        const cd = (a.descrizione||'').localeCompare(b.descrizione||'');\n        if(cd !== 0) return cd;\n        return (a.misura||'').localeCompare(b.misura||'');\n      });\n    modal.innerHTML = `\n      <h3>Manda ordine<\/h3>\n      <p style=\"font-size:12px;color:var(--muted);margin:-8px 0 14px;\">Scegli il fornitore, seleziona le voci da includere
