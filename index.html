async function scattaFotoRischio(r){
  const file = await apriFotocamera();
  if(!file) return;
  caricamentiFotoInCorso++;
  aggiornaIndicatoreCaricamentoFoto();
  try{
    const base64 = await ridimensionaImmagine(file);
    const risposta = await chiamaAzionePost('uploadFotoRischio', {
      cantiere: state.nomeCantiereAttivo || 'Cantiere',
      rischio: r.titolo,
      imageBase64: base64,
      mimeType: 'image/jpeg',
    });
    r.numeroFoto = (r.numeroFoto || 0) + 1;
    r.cartellaFotoUrl = risposta.cartellaUrl;
    persist();
    if(state.section === 'rischi') renderRischi();
    mostraToast('📷 Foto caricata ✓');
  }catch(e){
    alert('Errore nel caricamento della foto: ' + e.message);
  }finally{
    caricamentiFotoInCorso--;
    aggiornaIndicatoreCaricamentoFoto();
  }
}

/* ============ SAL FORNITORI ============ */
function importoSalVoce(s){
  // Compatibilita': le vecchie voci salvavano un importo cumulativo in "importoAutorizzato".
  // Le nuove voci salvano l'importo del singolo mese in "importoSal".
  return s.importoSal !== undefined ? Number(s.importoSal||0) : Number(s.importoAutorizzato||0);
}
function salOrdinatiCronologici(contratto){
  return [...(contratto.sal||[])].sort((a,b) => (a.data||'').localeCompare(b.data||''));
}
function totaleSalRegistrati(contratto){
  return (contratto.sal||[]).reduce((s,x) => s + importoSalVoce(x), 0);
}
function lavorazioniDiContratto(contrattoId){
  return state.lavorazioni.filter(l => l.contrattoSalId === contrattoId);
}
function sommaPrezziPattuitiLavorazioni(contratto){
  return lavorazioniDiContratto(contratto.id).reduce((s,l) => s + Number(l.prezzoSalPattuito||0), 0);
}
function importoAutorizzatoCalcolato(contratto){
  return lavorazioniDiContratto(contratto.id).reduce((s,l) => s + (Number(l.prezzoSalPattuito||0) * Number(l.statoAvanzamento||0) / 100), 0);
}
function prezzoPattuitoEffettivo(contratto){
  const totaleDaLavorazioni = sommaPrezziPattuitiLavorazioni(contratto);
  return totaleDaLavorazioni > 0 ? totaleDaLavorazioni : Number(contratto.importoTotale||0);
}
function calcolaAvanzamentoContratto(contratto){
  const totalePattuito = sommaPrezziPattuitiLavorazioni(contratto);
  if(totalePattuito <= 0) return null;
  return Math.round(importoAutorizzatoCalcolato(contratto) / totalePattuito * 100);
}
function oreRealiContratto(contratto){
  return lavorazioniDiContratto(contratto.id).reduce((s,l) => s + Number(l.costoOre||0), 0);
}
function costoRealeContratto(contratto){
  return lavorazioniDiContratto(contratto.id).reduce((s,l) => s + Number(l.costoEuro||0), 0);
}
function autorizzatoAttualeContratto(contratto){
  return totaleSalRegistrati(contratto);
}
function suggerimentoProssimoSal(contratto){
  const avanzamentoCalcolato = calcolaAvanzamentoContratto(contratto);
  if(avanzamentoCalcolato === null) return null;
  return importoAutorizzatoCalcolato(contratto) - totaleSalRegistrati(contratto);
}
function renderSal(){
  const contratti = [...state.contrattiSal].sort((a,b) => (a.fornitore||'').localeCompare(b.fornitore||''));
  const totaleContratti = contratti.reduce((s,c) => s + prezzoPattuitoEffettivo(c), 0);
  const totaleAutorizzato = contratti.reduce((s,c) => s + autorizzatoAttualeContratto(c), 0);
  const totaleResiduo = totaleContratti - totaleAutorizzato;

  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <div><h2 class="section-title">SAL Fornitori</h2><p class="section-sub">Autorizza i pagamenti ai subappaltatori quando vuoi tu — anche più volte al mese, o in anticipo su parte del lavoro.</p></div>
      <button class="btn" id="add-contratto-sal">+ Nuovo fornitore/contratto</button>
    </div>
    ${contratti.length===0 ? emptyState('Nessun contratto registrato', 'Aggiungi un fornitore/subappaltatore per iniziare a registrare i SAL mensili.') : `
    <table style="margin-bottom:20px;"><thead><tr><th>Totale contratti</th><th>Totale autorizzato</th><th>Residuo</th></tr></thead>
      <tbody><tr>
        <td class="mono">${fmtEuro(totaleContratti)}</td>
        <td class="mono">${fmtEuro(totaleAutorizzato)}</td>
        <td class="mono">${fmtEuro(totaleResiduo)}</td>
      </tr></tbody>
    </table>
    ${contratti.map(c => renderContrattoSalCard(c)).join('')}`}
  `;
  document.getElementById('add-contratto-sal').onclick = () => openContrattoSalModal();
  contratti.forEach(c => {
    const editBtn = document.getElementById('edit-contratto-'+c.id);
    const delBtn = document.getElementById('del-contratto-'+c.id);
    const addSalBtn = document.getElementById('add-sal-'+c.id);
    if(editBtn) editBtn.onclick = () => openContrattoSalModal(c);
    if(delBtn) delBtn.onclick = () => { if(confirm(`Eliminare il contratto con "${c.fornitore}" e tutto lo storico SAL? L'operazione non è reversibile.`)){ state.contrattiSal = state.contrattiSal.filter(x=>x.id!==c.id); persist(); renderSal(); } };
    if(addSalBtn) addSalBtn.onclick = () => openSalModal(c);
    const dett = document.getElementById('dettaglio-sal-'+c.id);
    if(dett) dett.addEventListener('toggle', function(){ uiDettagliAperti['sal-'+c.id] = this.open; });
    (c.sal||[]).forEach(s => {
      const delSalBtn = document.getElementById('del-sal-'+c.id+'-'+s.id);
      if(delSalBtn) delSalBtn.onclick = () => { c.sal = c.sal.filter(x=>x.id!==s.id); persist(); renderSal(); };
      const importoBtn = document.getElementById('importo-sal-'+c.id+'-'+s.id);
      if(importoBtn) importoBtn.onclick = () => apriModificaCampo(s, 'importoSal', `Importo SAL — ${fmtDataBreve(s.data)}`, 'number', {step:'0.01'}, renderSal);
    });
    lavorazioniDiContratto(c.id).forEach(l => {
      const prezzoBtn = document.getElementById('prezzo-sal-lav-'+l.id);
      if(prezzoBtn) prezzoBtn.onclick = () => apriModificaCampo(l, 'prezzoSalPattuito', `Prezzo pattuito — ${l.nome}`, 'number', {step:'0.01'}, renderSal);
    });
  });
}
function renderContrattoSalCard(c){
  const collegate = lavorazioniDiContratto(c.id);
  const prezzoPattuitoTot = prezzoPattuitoEffettivo(c);
  const avanzamentoCalcolato = calcolaAvanzamentoContratto(c);
  const percentualeMostrata = avanzamentoCalcolato !== null ? avanzamentoCalcolato : 0;
  const autorizzatoMostrato = autorizzatoAttualeContratto(c);
  const residuo = prezzoPattuitoTot - autorizzatoMostrato;
  const suggerimento = suggerimentoProssimoSal(c);
  const salCronologici = salOrdinatiCronologici(c);
  return `<div class="card" style="cursor:default;margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
      <div>
        <div style="font-family:'Oswald',sans-serif;font-size:17px;">${esc(c.fornitore)}</div>
        ${c.oggetto ? `<div style="font-size:12px;color:var(--muted);">${esc(c.oggetto)}</div>` : ''}
      </div>
      <div class="mono" style="font-size:18px;">${fmtEuro(prezzoPattuitoTot)}</div>
    </div>
    <div class="bar-track" style="margin-top:12px;"><div class="bar-fill" style="width:${clamp(percentualeMostrata,0,100)}%;"></div></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;">
      <span>Avanzamento: <strong>${percentualeMostrata}%</strong></span>
      <span>Autorizzato: <strong>${fmtEuro(autorizzatoMostrato)}</strong></span>
      <span>Residuo: <strong style="color:${residuo>0?'var(--red)':'var(--green)'};">${fmtEuro(residuo)}</strong></span>
    </div>
    ${suggerimento !== null ? `
    <div style="margin-top:8px;padding:8px 10px;background:var(--orange-dim);border:1px solid var(--orange);font-size:13px;">
      Fatturabile da autorizzare ora: <strong style="color:var(--orange);font-size:15px;">${fmtEuro(suggerimento)}</strong>
    </div>` : ''}
    ${collegate.length>0 ? `
    <div class="table-scroll" style="margin-top:10px;"><table><thead><tr><th>Lavorazione</th><th>Prezzo pattuito</th><th>Avanzamento</th><th>Autorizza</th></tr></thead>
      <tbody>${collegate.map(l => `<tr>
        <td>${esc(l.nome)}</td>
        <td class="mono valore-cliccabile" id="prezzo-sal-lav-${l.id}">${l.prezzoSalPattuito ? fmtEuro(l.prezzoSalPattuito) : '+ imposta prezzo'}</td>
        <td class="mono">${l.statoAvanzamento||0}%</td>
        <td class="mono">${fmtEuro(Number(l.prezzoSalPattuito||0) * Number(l.statoAvanzamento||0) / 100)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div style="font-size:11px;color:var(--muted);margin-top:4px;">ore reali: <strong style="color:var(--ink);">${oreRealiContratto(c)} h</strong> · costo reale: <strong style="color:var(--ink);">${fmtEuro(costoRealeContratto(c))}</strong></div>
    ` : `<div style="margin-top:8px;font-size:11px;color:var(--muted);">Nessuna lavorazione collegata (collegale dalla scheda "Modifica" di ogni lavorazione).</div>`}
    <div class="row-actions" style="margin-top:10px;">
      <button class="icon-btn" id="add-sal-${c.id}">✓ Autorizza SAL</button>
      <button class="icon-btn" id="edit-contratto-${c.id}">Modifica contratto</button>
      <button class="icon-btn" id="del-contratto-${c.id}">Elimina</button>
    </div>
    ${salCronologici.length>0 ? `
    <table style="margin-top:12px;"><thead><tr><th>Data</th><th>Autorizzato</th><th>Rimanente</th><th></th></tr></thead>
      <tbody>${salCronologici.map((s,i) => {
        const sommaFinoQui = salCronologici.slice(0,i+1).reduce((tot,x) => tot + importoSalVoce(x), 0);
        const rimanente = prezzoPattuitoTot - sommaFinoQui;
        return `<tr>
        <td class="mono">${fmtDataBreve(s.data)}</td>
        <td class="mono valore-cliccabile" id="importo-sal-${c.id}-${s.id}">${fmtEuro(importoSalVoce(s))}</td>
        <td class="mono">${fmtEuro(rimanente)}</td>
        <td><button class="icon-btn" id="del-sal-${c.id}-${s.id}">Elimina</button></td>
      </tr>`;
      }).join('')}</tbody></table>
    ` : ''}
  </div>`;
}

/* ============ CALENDARIO ============ */
function getEntriesForDate(iso){
  const entries = [];
  state.ordini.forEach(o => {
    if(o.dataOrdine === iso) entries.push({tipo:'ordine', label:`Ordine emesso: ${o.nome}`, ref:{kind:'ordine', id:o.id}});
    if(o.dataPrevista === iso && !o.dataEffettiva) entries.push({tipo:'ordine', label:`Consegna prevista: ${o.nome}`, ref:{kind:'ordine', id:o.id}});
    if(o.dataEffettiva === iso) entries.push({tipo:'ordine', label:`Consegna ricevuta${o.statoParziale==='parziale'?' (parziale)':''}: ${o.nome}`, ref:{kind:'ordine', id:o.id}});
  });
  state.lavorazioni.forEach(l => {
    if(l.dataInizio === iso) entries.push({tipo:'lavorazione', label:`Inizio lavorazione: ${l.nome}`, ref:{kind:'lavorazione', id:l.id}});
    if(l.scadenzaPrevista === iso) entries.push({tipo:'lavorazione', label:`Scadenza lavorazione: ${l.nome}`, ref:{kind:'lavorazione', id:l.id}});
  });
  state.eventi.forEach(e => {
    if(e.data === iso) entries.push({tipo:e.tipo, label:`Evento (${e.tipo}): ${e.titolo}`, ref:{kind:'evento', id:e.id}});
  });
  state.calendario.forEach(c => {
    if(c.data === iso){
      entries.push({tipo:c.tipo, label:`${c.orario?c.orario+' — ':''}${c.titolo}`, id:c.id, editable:true});
    } else if(c.ricorrenteSettimanale && c.data < iso){
      const start = new Date(c.data), cur = new Date(iso);
      if(start.getDay() === cur.getDay()) entries.push({tipo:c.tipo, label:`${c.orario?c.orario+' — ':''}${c.titolo} (ricorrente)`, id:c.id, editable:true});
    }
  });
  return entries;
}
function renderCalendario(){
  const monthNames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const y = state.calMonth.getFullYear(), m = state.calMonth.getMonth();
  const firstDay = new Date(y,m,1);
  const startOffset = (firstDay.getDay()+6)%7; // lunedì=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const gridStart = new Date(y,m,1-startOffset);
  const todayStr = todayISO();

  let cells = '';
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const iso = toLocalISODate(d);
    const inMonth = d.getMonth() === m;
    const entries = getEntriesForDate(iso);
    const shown = entries.slice(0,3);
    const restCount = entries.length - shown.length;
    cells += `<div class="cal-day ${inMonth?'':'other-month'} ${iso===todayStr?'today':''} ${state.selectedDay===iso?'selected':''}" data-day="${iso}">
      <div class="cal-daynum">${d.getDate()}</div>
      <div class="cal-entries">${shown.map(e => `<div class="cal-entry-line" style="border-left-color:${tipoColor(e.tipo)}">${esc(truncate(e.label,26))}</div>`).join('')}</div>
      <div class="cal-dots-mini">${shown.map(e => `<div class="dot" style="background:${tipoColor(e.tipo)}"></div>`).join('')}</div>
      ${restCount>0 ? `<div class="cal-more">+${restCount} altri</div>` : ''}
    </div>`;
    if(i>=daysInMonth+startOffset-1 && d.getMonth()!==m && i%7===6) break;
  }

  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <div><h2 class="section-title">Calendario</h2><p class="section-sub">Ordini, scadenze lavorazioni, eventi, note e appuntamenti in un'unica vista.</p></div>
      <button class="btn" id="add-cal-entry">+ Nota / Appuntamento</button>
    </div>
    <div class="cal-header">
      <button class="btn ghost small" id="cal-prev">← Precedente</button>
      <div class="cal-month">${monthNames[m]} ${y}</div>
      <button class="btn ghost small" id="cal-next">Successivo →</button>
    </div>
    <div class="cal-grid-scroll">
      <div class="cal-grid">
        ${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div id="day-detail"></div>
  `;
  document.getElementById('cal-prev').onclick = () => { state.calMonth = new Date(y,m-1,1); renderCalendario(); };
  document.getElementById('cal-next').onclick = () => { state.calMonth = new Date(y,m+1,1); renderCalendario(); };
  document.getElementById('add-cal-entry').onclick = () => openCalEntryModal();
  document.querySelectorAll('.cal-day').forEach(el => {
    el.onclick = () => { state.selectedDay = el.dataset.day; renderCalendario(); renderDayDetail(); };
  });
  if(state.selectedDay) renderDayDetail();
}
function renderDayDetail(){
  const iso = state.selectedDay;
  const entries = getEntriesForDate(iso);
  const container = document.getElementById('day-detail');
  if(!container) return;
  container.innerHTML = `<div class="day-detail">
    <h4>${fmtDate(iso)}</h4>
    ${entries.length===0 ? `<div style="color:var(--muted);font-size:13px;">Nessun evento in questa data.</div>` :
      entries.map(e => `<div class="day-entry">
        <span><span class="dot" style="background:${tipoColor(e.tipo)};display:inline-block;margin-right:8px;vertical-align:middle;"></span>${esc(e.label)}</span>
        <div class="row-actions">
          ${e.ref && e.ref.kind==='lavorazione' ? `<button class="icon-btn" data-open-lav="${e.ref.id}">→ Apri lavorazione</button>` : ''}
          ${e.ref && e.ref.kind==='ordine' ? `<button class="icon-btn" data-open-ord="${e.ref.id}">→ Apri ordine</button>` : ''}
          ${e.ref && e.ref.kind==='evento' ? `<button class="icon-btn" data-open-evt="${e.ref.id}">→ Apri evento</button>` : ''}
          ${e.editable?`<button class="icon-btn" data-cal-edit="${e.id}">Modifica</button><button class="icon-btn" data-cal-del="${e.id}">Elimina</button>`:''}
        </div>
      </div>`).join('')}
    <div style="margin-top:10px;"><button class="btn small" id="quick-add-cal">+ Aggiungi per questo giorno</button></div>
  </div>`;
  const quickAdd = document.getElementById('quick-add-cal');
  if(quickAdd) quickAdd.onclick = () => openCalEntryModal(null, iso);
  container.querySelectorAll('[data-cal-del]').forEach(btn => {
    btn.onclick = () => {
      state.calendario = state.calendario.filter(c => c.id !== btn.dataset.calDel);
      persist(); renderCalendario();
    };
  });
  container.querySelectorAll('[data-cal-edit]').forEach(btn => {
    btn.onclick = () => {
      const item = state.calendario.find(c => c.id === btn.dataset.calEdit);
      if(item) openCalEntryModal(item);
    };
  });
  container.querySelectorAll('[data-open-lav]').forEach(btn => {
    btn.onclick = () => {
      const item = state.lavorazioni.find(x => x.id === btn.dataset.openLav);
      state.section = 'lavorazioni'; renderAll();
      if(item) openLavorazioneModal(item);
    };
  });
  container.querySelectorAll('[data-open-ord]').forEach(btn => {
    btn.onclick = () => {
      const item = state.ordini.find(x => x.id === btn.dataset.openOrd);
      state.section = 'ordini'; renderAll();
      if(item) openOrdineModal(item);
    };
  });
  container.querySelectorAll('[data-open-evt]').forEach(btn => {
    btn.onclick = () => {
      const item = state.eventi.find(x => x.id === btn.dataset.openEvt);
      state.section = 'eventi'; renderAll();
      if(item) openEventoModal(item);
    };
  });
}
function openCalEntryModal(existing, presetDate){
  openModal({
    title: existing ? 'Modifica voce calendario' : 'Nuova nota / appuntamento',
    values: existing || {data: presetDate || todayISO(), tipo:'nota'},
    fields: [
      {name:'tipo', label:'Tipo', type:'select', options:[{value:'nota',label:'Nota'},{value:'appuntamento',label:'Appuntamento'}]},
      {name:'titolo', label:'Titolo', type:'text', required:true},
      {name:'descrizione', label:'Descrizione', type:'textarea'},
      {name:'data', label:'Data', type:'date', required:true},
      {name:'orario', label:'Orario (opzionale)', type:'time'},
      {name:'ricorrenteSettimanale', label:'Ripeti ogni settimana', type:'checkbox'},
    ],
    onSubmit: (data) => {
      if(existing){ Object.assign(existing, data); }
      else { state.calendario.push({id:uid(), ...data}); }
      persist(); renderCalendario();
    }
  });
}

/* ============ SHARED ============ */
function emptyState(title, sub){
  return `<div class="empty-state"><div class="display">${esc(title)}</div><div>${esc(sub)}</div></div>`;
}

/* ============ RENDER DISPATCH ============ */
function renderAll(){
  renderNav();
  if(state.section==='dashboard') renderDashboard();
  else if(state.section==='lavorazioni') renderLavorazioni();
  else if(state.section==='ordini') renderOrdini();
  else if(state.section==='persone') renderPersone();
  else if(state.section==='eventi') renderEventi();
  else if(state.section==='calendario') renderCalendario();
  else if(state.section==='diario') renderDiario();
  else if(state.section==='rischi') renderRischi();
  else if(state.section==='sal') renderSal();
}

/* ============ CONFIGURAZIONE CONNESSIONE GOOGLE SHEETS ============ */
function apriImpostazioniConnessione(){
  openModal({
    title: 'Connessione Google Sheets',
    values: {url: getUrlAppsScript()},
    fields: [
      {name:'url', label:'URL Web App Apps Script (finisce con /exec)', type:'text', required:true},
    ],
    submitLabel: 'Salva e verifica',

      const url = data.url.trim();

      try{

        setUrlAppsScript(url);

        location.reload();
      }catch(e){
        alert('Connessione non riuscita: ' + e.message + '\n\nVerifica di aver copiato l\'URL /exec corretto e che la distribuzione sia impostata su "Chiunque".');
      }
      mostraCaricamento(false);
    }
  });
}

function mostraSchermataConfigurazione(){
  document.getElementById('nav').style.display = 'none';
  const localeLista = lsGet(LS_KEY_LISTA, []);
  document.getElementById('content').innerHTML = `
    <div style="max-width:520px;margin:20px auto;">
      <h2 class="section-title">Collega Google Sheets</h2>
      <p class="section-sub">Per sincronizzare i dati tra i tuoi dispositivi, incolla qui l'URL della Web App di Apps Script (vedi le istruzioni ricevute in chat). Va fatto una sola volta per ogni dispositivo.</p>
      <div class="field">
        <label>URL Web App (finisce con /exec)</label>
        <input type="text" id="setup-url" placeholder="https://script.google.com/macros/s/…/exec">
      </div>
      ${localeLista.length > 0 ? `<p style="font-size:12px;color:var(--muted);">Ho trovato ${localeLista.length} cantiere/i già salvati su questo dispositivo: dopo la connessione ti chiederò se vuoi caricarli su Google Sheets.</p>` : ''}
      <button class="btn" id="setup-salva" style="width:100%;margin-top:10px;">Verifica e continua</button>
      <div id="setup-errore" style="color:var(--red);font-size:13px;margin-top:10px;"></div>
    </div>
  `;
  document.getElementById('setup-salva').onclick = async () => {
    const url = document.getElementById('setup-url').value.trim();
    const errEl = document.getElementById('setup-errore');
    errEl.textContent = '';
    if(!url){ errEl.textContent = 'Inserisci un URL.'; return; }
    mostraCaricamento(true);
    try{
      await testaConnessioneAppsScript(url);
      setUrlAppsScript(url);
      if(localeLista.length > 0){
        const vuoiMigrare = confirm(`Vuoi caricare ora su Google Sheets i ${localeLista.length} cantiere/i già presenti su questo dispositivo?`);
        if(vuoiMigrare){
          await salvaListaCantieri(localeLista);
          for(const c of localeLista){
            const d = lsGet(dataKeyCantiere(c.id), datiVuoti());
            await kvSet(dataKeyCantiere(c.id), d);
          }
        }
      }
      document.getElementById('nav').style.display = '';
      await avviaApp();
    }catch(e){
      errEl.textContent = 'Connessione non riuscita: ' + e.message;
    }
    mostraCaricamento(false);
  };
}

async function avviaApp(){
  const listaCache = caricaCacheListaLocale();
  const attivoIdCache = lsGet(LS_KEY_ATTIVO, null);
  let dipintoDaCache = false;

  if(listaCache && listaCache.length > 0){
    const idDaUsare = (attivoIdCache && listaCache.find(c => c.id === attivoIdCache)) ? attivoIdCache : listaCache[0].id;
    const datiCache = caricaCacheDatiLocale(idDaUsare);
    if(datiCache){
      state.cantiereAttivoId = idDaUsare;
      applicaDatiAStato(datiCache);
      const meta = listaCache.find(c => c.id === idDaUsare);
      state.nomeCantiereAttivo = meta ? meta.nome : 'Cantiere';
      document.getElementById('stamp-nome-cantiere').textContent = state.nomeCantiereAttivo;
      renderAll();
      impostaStatoSync('salvataggio', 'Aggiornamento in corso…');
      dipintoDaCache = true;
    }
  }

  if(!dipintoDaCache) mostraCaricamento(true);

  try{
    let lista = await caricaListaCantieri();
    if(lista.length === 0){
      const id = await creaCantiere('Cantiere Principale');
      lista = await caricaListaCantieri();
      lsSet(LS_KEY_ATTIVO, id);
    }
    salvaCacheListaLocale(lista);
    let attivoId = lsGet(LS_KEY_ATTIVO, null);
    if(!attivoId || !lista.find(c => c.id === attivoId)){
      attivoId = lista[0].id;
      lsSet(LS_KEY_ATTIVO, attivoId);
    }

    state.cantiereAttivoId = attivoId;
    const dati = await caricaDatiCantiere(attivoId);
    applicaDatiAStato(dati);
    salvaCacheDatiLocale(attivoId, dati);

    await renderStamp();
    renderAll();
    impostaStatoSync('ok');
  }catch(e){
    if(dipintoDaCache){
      // Già mostrati i dati dall'ultima sessione: segnalo solo che l'aggiornamento è fallito, senza bloccare l'uso dell'app.
      impostaStatoSync('errore', 'Impossibile aggiornare da Google Sheets: ' + e.message + '. Stai vedendo gli ultimi dati salvati su questo dispositivo.');
    } else {
      document.getElementById('content').innerHTML = `<div class="empty-state">
        <div class="display">Impossibile contattare Google Sheets</div>
        <div>${esc(e.message)}</div>
        <button class="btn ghost" id="riprova-connessione" style="margin-top:14px;">Riprova</button>
        <button class="btn" id="cambia-connessione" style="margin-top:14px;margin-left:8px;">Cambia URL</button>
      </div>`;
      document.getElementById('riprova-connessione').onclick = avviaApp;
      document.getElementById('cambia-connessione').onclick = () => { setUrlAppsScript(''); mostraSchermataConfigurazione(); };
    }
  }
  mostraCaricamento(false);
}

/* ============ INIT ============ */
function init(){
  document.getElementById('stamp-date').textContent = fmtDate(todayISO());
  document.getElementById('btn-cambia-cantiere').onclick = apriGestioneCantieri;
  document.getElementById('btn-rinomina-cantiere').onclick = apriRinominaCantiere;

  const url = getUrlAppsScript();
  if(!url){
    mostraSchermataConfigurazione();
    return;
  }
  avviaApp();
}
init();
